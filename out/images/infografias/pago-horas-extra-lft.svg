<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 764" width="800" height="764"><rect width="800" height="764" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="764" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="764" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C2410C" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo se pagan las horas extra en México</text><g transform="translate(0,3)"><text x="44" y="188" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="start">Salario diario $400 · jornada de 8 h · hora = $50</text><rect x="46" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="73.66666666666667" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">1</text><rect x="105.33333333333334" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="133" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">2</text><rect x="164.66666666666669" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="192.33333333333334" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">3</text><rect x="224" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="251.66666666666666" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">4</text><rect x="283.33333333333337" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="311.00000000000006" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">5</text><rect x="342.6666666666667" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="370.33333333333337" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">6</text><rect x="402" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="429.6666666666667" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">7</text><rect x="461.33333333333337" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="489.00000000000006" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">8</text><rect x="520.6666666666667" y="214" width="55.333333333333336" height="64" rx="8" fill="#FED7AA"/><text x="548.3333333333334" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">9</text><rect x="580" y="214" width="55.333333333333336" height="64" rx="8" fill="#C2410C"/><text x="607.6666666666666" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">10</text><rect x="639.3333333333334" y="214" width="55.333333333333336" height="64" rx="8" fill="#C2410C"/><text x="667" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">11</text><rect x="698.6666666666667" y="214" width="55.333333333333336" height="64" rx="8" fill="#C2410C"/><text x="726.3333333333334" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">12</text><text x="44" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#C2410C" text-anchor="start">9 primeras horas extra de la semana: dobles</text><text x="756" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#C2410C" text-anchor="end">a partir de la 10.ª: triples</text><rect x="44" y="336" width="712" height="50" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="60" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">9 horas dobles</text><text x="344" y="369" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">9 × $50 × 2</text><text x="740" y="370" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="end">$900</text><rect x="44" y="396" width="712" height="50" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="60" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">3 horas triples</text><text x="344" y="429" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">3 × $50 × 3</text><text x="740" y="430" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="end">$450</text><rect x="44" y="456" width="712" height="50" rx="10" fill="#FFEDD5" stroke="#93C5FD" stroke-width="2"/><text x="60" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Total horas extra</text><text x="344" y="489" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start"></text><text x="740" y="490" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#C2410C" text-anchor="end">$1,350</text><rect x="44" y="536" width="712" height="80" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="start">Exento de ISR: $450</text><text x="62" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">La mitad de las horas dobles, con un tope de 5 UMA por semana ($586.55).</text><text x="44" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Art. 66 a 68 de la LFT: máximo 3 horas al día y 3 veces por semana.</text><text x="44" y="680.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Quien gana el salario mínimo tiene exentas todas sus horas dobles.</text></g><text x="44" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-horas-extras</text></svg>