<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 991" width="800" height="991"><rect width="800" height="991" fill="#FBF6EC"/><rect x="44" y="933" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Equivalencias de tazas, cucharadas y</text><text x="44" y="132.8" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">cucharaditas</text><g transform="translate(0,44)"><path d="M54,180 h150 l-14,150 h-122 Z" fill="#F3E3C7" stroke="#B45309" stroke-width="3"/><path d="M204,206 q34,8 0,60" fill="none" stroke="#B45309" stroke-width="3"/><text x="129" y="370" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">1 taza</text><text x="129" y="396" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">240 ml</text><ellipse cx="369" cy="300" rx="45" ry="22.5" fill="#F3E3C7" stroke="#B45309" stroke-width="3"/><rect x="414" y="296" width="81" height="8" rx="4" fill="#B45309"/><text x="369" y="370" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">1 cucharada</text><text x="369" y="396" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">15 ml</text><ellipse cx="594" cy="310" rx="30" ry="15" fill="#F3E3C7" stroke="#B45309" stroke-width="3"/><rect x="624" y="306" width="54" height="8" rx="4" fill="#B45309"/><text x="594" y="370" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">1 cucharadita</text><text x="594" y="396" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">5 ml</text><line x1="44" y1="430" x2="756" y2="430" stroke="#E7D8BE" stroke-width="2"/><text x="44" y="480" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">1 taza</text><text x="274" y="480" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">= 16 cucharadas</text><text x="756" y="480" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#B45309" text-anchor="end">= 48 cucharaditas</text><text x="44" y="530" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">½ taza</text><text x="274" y="530" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">= 8 cucharadas</text><text x="756" y="530" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#B45309" text-anchor="end">= 120 ml</text><text x="44" y="580" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">¼ taza</text><text x="274" y="580" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">= 4 cucharadas</text><text x="756" y="580" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#B45309" text-anchor="end">= 60 ml</text><text x="44" y="630" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">1 cucharada</text><text x="274" y="630" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">= 3 cucharaditas</text><text x="756" y="630" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#B45309" text-anchor="end">= 15 ml</text><rect x="44" y="690" width="712" height="108" rx="16" fill="#F3E3C7"/><text x="66" y="726" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">Una taza en gramos (aproximado)</text><text x="66" y="766" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Harina ≈ 125 g   ·   Azúcar ≈ 200 g   ·   Agua = 240 g</text><text x="44" y="838" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Medidas de EE. UU., las más usadas en recetas en español. La taza</text><text x="44" y="862.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">británica y la australiana tienen 250 ml.</text></g><text x="44" y="965" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/medidas-de-cocina</text></svg>