<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 746" width="800" height="746"><rect width="800" height="746" fill="#FBF6EC"/><rect x="44" y="688" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cuánto ISR paga tu aguinaldo en 2026</text><g transform="translate(0,3)"><text x="44" y="188" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">Sueldo de $20,000 al mes · aguinaldo de 15 días: $9,868.42</text><rect x="44" y="210" width="253.91517588428545" height="60" rx="10" fill="#16A34A"/><rect x="297.9151758842854" y="210" width="458.0848241157146" height="60" rx="0" fill="#DC2626"/><text x="58" y="248" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="start">Exento $3,519.30</text><text x="311.9151758842854" y="248" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="start">Gravado $6,349.12</text><text x="44" y="296" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">Exento: 30 UMA ($117.31 × 30)</text><rect x="44" y="324" width="348" height="160" rx="16" fill="#FFFDF8" stroke="#E7D8BE" stroke-width="2"/><text x="64" y="360" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="start">Artículo 96 LISR</text><text x="64" y="390" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="start">Suma el aguinaldo gravado al sueldo</text><text x="64" y="410.25" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="start">del mes y calcula la diferencia de</text><text x="64" y="430.5" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="start">ISR.</text><text x="64" y="468" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">ISR: $1,356.17</text><rect x="408" y="324" width="348" height="160" rx="16" fill="#FFFDF8" stroke="#E7D8BE" stroke-width="2"/><text x="428" y="360" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="start">Artículo 174 RLISR</text><text x="428" y="390" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="start">Aplica una tasa efectiva calculada con</text><text x="428" y="410.25" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="start">la parte mensual del aguinaldo.</text><text x="428" y="468" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">ISR: $1,356.17</text><rect x="44" y="510" width="712" height="80" rx="14" fill="#FFEDD5"/><text x="64" y="544" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">Aquí los dos métodos dan lo mismo</text><text x="64" y="572" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">porque el aguinaldo no te cambia de renglón en la tarifa (21.36 %).</text><text x="44" y="630" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Cuando el aguinaldo sí te sube de renglón, el método del reglamento</text><text x="44" y="654.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">suele retener menos. Tu patrón elige cuál aplicar.</text></g><text x="44" y="720" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/calcular-isr-aguinaldo</text></svg>