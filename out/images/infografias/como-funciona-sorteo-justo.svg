33" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="middle">Luis</text><rect x="44" y="440" width="22" height="22" rx="5" fill="#FACC15"/><text x="78" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Ganadores</text><rect x="224" y="440" width="22" height="22" rx="5" fill="#A78BFA"/><text x="258" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Suplente</text><text x="44" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FACC15" text-anchor="start">Quita duplicados</text><text x="234" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Cada persona, una sola vez, salvo que las reglas digan otra cosa.</text><text x="44" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FACC15" text-anchor="start">Graba la pantalla</text><text x="234" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Es la forma más sencilla de demostrar que el sorteo fue limpio.</text><text x="44" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FACC15" text-anchor="start">Elige suplentes</text><text x="234" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Por si un ganador no responde en el plazo que fijaste.</text></g><text x="44" y="717" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/sorteo-online</text></svg>