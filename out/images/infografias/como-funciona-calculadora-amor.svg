<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 909" width="800" height="909"><rect width="800" height="909" fill="#111827"/><rect x="44" y="851" width="712" height="1.5" fill="#374151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F472B6" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Qué hace la calculadora del amor con</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">vuestros nombres</text><g transform="translate(0,44)"><circle cx="70" cy="214" r="26" fill="#F472B6"/><text x="70" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="118" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">Escribes dos nombres</text><text x="118" y="240" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#F472B6" text-anchor="start">Ana  ·  Luis</text><line x1="70" y1="244" x2="70" y2="280" stroke="#374151" stroke-width="3"/><circle cx="70" cy="318" r="26" fill="#F472B6"/><text x="70" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">2</text><text x="118" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">Se pasan a minúsculas y sin tildes</text><text x="118" y="344" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#F472B6" text-anchor="start">ana  ·  luis</text><line x1="70" y1="348" x2="70" y2="384" stroke="#374151" stroke-width="3"/><circle cx="70" cy="422" r="26" fill="#F472B6"/><text x="70" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">3</text><text x="118" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">Se ordenan alfabéticamente</text><text x="118" y="448" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#F472B6" text-anchor="start">ana + luis</text><line x1="70" y1="452" x2="70" y2="488" stroke="#374151" stroke-width="3"/><circle cx="70" cy="526" r="26" fill="#F472B6"/><text x="70" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">4</text><text x="118" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">Cada letra alimenta una fórmula</text><text x="118" y="552" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#F472B6" text-anchor="start">el resultado siempre va de 0 a 100</text><rect x="44" y="606" width="348" height="110" rx="18" fill="#1F2937"/><text x="64" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Mismo par, mismo resultado</text><text x="64" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="start">Puedes repetirlo: no cambia.</text><rect x="408" y="606" width="348" height="110" rx="18" fill="#1F2937"/><text x="428" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">El orden no importa</text><text x="428" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="start">«Ana y Luis» = «Luis y Ana».</text><text x="44" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Es un juego: el porcentaje sale de las letras de los nombres, no de</text><text x="44" y="780.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">ningún dato real sobre la pareja.</text></g><text x="44" y="883" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/calculadora-del-amor</text></svg>