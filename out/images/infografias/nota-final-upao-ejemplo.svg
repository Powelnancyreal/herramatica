<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 751" width="800" height="751"><rect width="800" height="751" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#1E3A8A"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Qué nota necesitas en el final de la</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">UPAO</text><g transform="translate(0,68)"><text x="44" y="188" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Escala de 0 a 20 · se aprueba con 11 (10,5 redondea a 11)</text><rect x="44" y="210" width="138.4" height="120" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="113.2" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">EP1 · 20 %</text><text x="113.2" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827" text-anchor="middle">12</text><text x="113.2" y="320" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Evaluación de proceso 1</text><rect x="186.4" y="210" width="209.6" height="120" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="291.2" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">EVP · 30 %</text><text x="291.2" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827" text-anchor="middle">9</text><text x="291.2" y="320" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Evaluación parcial</text><rect x="400" y="210" width="138.4" height="120" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="469.2" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">EP2 · 20 %</text><text x="469.2" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827" text-anchor="middle">11</text><text x="469.2" y="320" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Evaluación de proceso 2</text><rect x="542.4" y="210" width="209.6" height="120" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="647.1999999999999" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">EVF · 30 %</text><text x="647.1999999999999" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="36" font-weight="700" fill="#B45309" text-anchor="middle">¿?</text><text x="647.1999999999999" y="320" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Evaluación final</text><rect x="44" y="370" width="712" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><text x="60" y="402" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Lo que ya llevas</text><text x="740" y="402" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#111827" text-anchor="end">12 × 0,2 + 9 × 0,3 + 11 × 0,2 = 7,3</text><rect x="44" y="432" width="712" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><text x="60" y="464" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Lo que falta para 10,5</text><text x="740" y="464" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#111827" text-anchor="end">10,5 − 7,3 = 3,2</text><rect x="44" y="494" width="712" height="52" rx="10" fill="#DBEAFE" stroke="#E5E7EB" stroke-width="1.5"/><text x="60" y="526" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Nota necesaria en el final</text><text x="740" y="526" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="end">3,2 ÷ 0,3 = 10,67 → al menos 11</text><text x="44" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Pesos de la plantilla habitual de la UPAO; confirma los de tu curso</text><text x="44" y="594.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">en el sílabo.</text></g><text x="44" y="725" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-upao</text></svg>