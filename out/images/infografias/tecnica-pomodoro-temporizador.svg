<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 703" width="800" height="703"><rect width="800" height="703" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#DC2626"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">La técnica Pomodoro con un temporizador</text><g transform="translate(0,27)"><text x="44" y="184" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Un ciclo Pomodoro completo: unas 2 horas y cuarto</text><rect x="45" y="206" width="129.85185185185185" height="70" rx="8" fill="#DC2626"/><text x="109.92592592592592" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">25</text><rect x="176.85185185185185" y="206" width="24.37037037037037" height="70" rx="8" fill="#86EFAC"/><text x="189.03703703703704" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">5</text><rect x="203.22222222222223" y="206" width="129.85185185185185" height="70" rx="8" fill="#DC2626"/><text x="268.14814814814815" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">25</text><rect x="335.0740740740741" y="206" width="24.37037037037037" height="70" rx="8" fill="#86EFAC"/><text x="347.25925925925924" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">5</text><rect x="361.44444444444446" y="206" width="129.85185185185185" height="70" rx="8" fill="#DC2626"/><text x="426.3703703703704" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">25</text><rect x="493.2962962962963" y="206" width="24.37037037037037" height="70" rx="8" fill="#86EFAC"/><text x="505.48148148148147" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">5</text><rect x="519.6666666666666" y="206" width="129.85185185185185" height="70" rx="8" fill="#DC2626"/><text x="584.5925925925926" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">25</text><rect x="651.5185185185185" y="206" width="103.48148148148148" height="70" rx="8" fill="#16A34A"/><text x="703.2592592592592" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text><text x="44" y="300" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">minutos</text><circle cx="62" cy="368" r="16" fill="#DC2626"/><text x="62" y="375" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">1</text><text x="92" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Elige una sola tarea</text><text x="92" y="396" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Y apaga las notificaciones durante el bloque.</text><circle cx="62" cy="432" r="16" fill="#DC2626"/><text x="62" y="439" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">2</text><text x="92" y="436" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Trabaja 25 minutos</text><text x="92" y="460" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Si surge otra idea, anótala y sigue.</text><circle cx="62" cy="496" r="16" fill="#DC2626"/><text x="62" y="503" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">3</text><text x="92" y="500" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Descansa 5 minutos</text><text x="92" y="524" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Levántate, bebe agua, no mires el móvil.</text><circle cx="62" cy="560" r="16" fill="#DC2626"/><text x="62" y="567" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">4</text><text x="92" y="564" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Cada 4 bloques, una pausa larga</text><text x="92" y="588" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">De 15 a 30 minutos.</text></g><text x="44" y="677" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/temporizador-online</text></svg>