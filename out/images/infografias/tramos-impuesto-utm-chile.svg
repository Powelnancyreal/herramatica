<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 713" width="800" height="713"><rect width="800" height="713" fill="#FAF7FF"/><rect x="44" y="655" width="712" height="1.5" fill="#DDD6FE"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#2E1065" text-anchor="start">Para qué se usa la UTM en Chile</text><g transform="translate(0,3)"><text x="44" y="186" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E1065" text-anchor="start">Impuesto único de segunda categoría, en UTM mensuales</text><rect x="44" y="206" width="169" height="90" rx="14" fill="#C4B5FD"/><text x="128.5" y="242" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">0 – 13,5</text><text x="128.5" y="276" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">Exento</text><rect x="225" y="206" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="309.5" y="242" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">13,5 – 30</text><text x="309.5" y="276" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">4 %</text><rect x="406" y="206" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="490.5" y="242" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">30 – 50</text><text x="490.5" y="276" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">8 %</text><rect x="587" y="206" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="671.5" y="242" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">50 – 70</text><text x="671.5" y="276" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">13,5 %</text><rect x="44" y="308" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="128.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">70 – 90</text><text x="128.5" y="378" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">23 %</text><rect x="225" y="308" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="309.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">90 – 120</text><text x="309.5" y="378" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">30,4 %</text><rect x="406" y="308" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="490.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">120 – 310</text><text x="490.5" y="378" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">35 %</text><rect x="587" y="308" width="169" height="90" rx="14" fill="#EDE9FE"/><text x="671.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="middle">más de 310</text><text x="671.5" y="378" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">40 %</text><text x="44" y="440" font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#2E1065" text-anchor="start">UTM y UTA</text><rect x="44" y="458" width="712" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/><text x="58" y="484" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="start">UTM</text><text x="244" y="484" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#2E1065" text-anchor="start">unidad mensual que fija el SII y se reajusta con el IPC</text><rect x="44" y="506" width="712" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/><text x="58" y="532" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="start">UTA</text><text x="244" y="532" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#2E1065" text-anchor="start">unidad tributaria anual = 12 UTM de diciembre</text><rect x="44" y="554" width="712" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/><text x="58" y="580" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="start">Multas</text><text x="244" y="580" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#2E1065" text-anchor="start">muchas infracciones de tránsito se fijan entre 0,2 y 3 UTM</text><rect x="44" y="602" width="712" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/><text x="58" y="628" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="start">Patentes y derechos</text><text x="244" y="628" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#2E1065" text-anchor="start">municipales y de aduanas</text></g><text x="44" y="687" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/utm-a-pesos</text></svg>