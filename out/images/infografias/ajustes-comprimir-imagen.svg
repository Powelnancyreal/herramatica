<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 751" width="800" height="751"><rect width="800" height="751" fill="#0B1020"/><rect x="44" y="693" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Qué hace cada ajuste al comprimir una</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">imagen</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#34D399" text-anchor="start">$ comprimir foto.jpg --formato webp --calidad 75 --ancho 1920</text><rect x="44" y="214" width="712" height="80" rx="10" fill="#111A33"/><text x="60" y="244" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="start">--formato webp</text><text x="60" y="268" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># Recomendado: pesa menos que JPG con la misma calidad visual y</text><text x="60" y="286" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">  admite transparencia.</text><rect x="44" y="306" width="712" height="80" rx="10" fill="#111A33"/><text x="60" y="336" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="start">--formato jpg</text><text x="60" y="360" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># Compatible con todo, incluso programas antiguos. Sin</text><text x="60" y="378" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">  transparencia: el fondo queda blanco.</text><rect x="44" y="398" width="712" height="80" rx="10" fill="#111A33"/><text x="60" y="428" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="start">--calidad 75</text><text x="60" y="452" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># Entre 70 y 80 la diferencia apenas se ve; por debajo de 60</text><text x="60" y="470" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">  aparecen manchas.</text><rect x="44" y="490" width="712" height="80" rx="10" fill="#111A33"/><text x="60" y="520" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="start">--ancho 1920</text><text x="60" y="544" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># Las fotos de móvil miden 4000 px o más: reducirlas es lo que más</text><text x="60" y="562" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">  peso ahorra.</text><text x="44" y="598" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// al recomprimir se pierden los metadatos EXIF, incluida la</text><text x="44" y="622.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">ubicación GPS. Todo ocurre en tu navegador: las fotos no se suben.</text></g><text x="44" y="725" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/comprimir-imagen</text></svg>