<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 848" width="800" height="848"><rect width="800" height="848" fill="#FBF6EC"/><rect x="44" y="790" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cuántos kilos tiene una arroba</text><g transform="translate(0,3)"><line x1="400" y1="190" x2="400" y2="330" stroke="#3B2F2A" stroke-width="6"/><path d="M340,340 h120 l-20,-14 h-80 Z" fill="#3B2F2A"/><line x1="170" y1="200" x2="630" y2="200" stroke="#3B2F2A" stroke-width="6" stroke-linecap="round"/><circle cx="400" cy="200" r="10" fill="#92400E"/><line x1="110" y1="280" x2="170" y2="200" stroke="#7C6A58" stroke-width="2"/><line x1="230" y1="280" x2="170" y2="200" stroke="#7C6A58" stroke-width="2"/><path d="M90,280 q80,36 160,0 Z" fill="#F3E3C7" stroke="#92400E" stroke-width="3"/><text x="170" y="274" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="middle">1 arroba</text><text x="170" y="330" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#7C6A58" text-anchor="middle">castellana</text><line x1="570" y1="280" x2="630" y2="200" stroke="#7C6A58" stroke-width="2"/><line x1="690" y1="280" x2="630" y2="200" stroke="#7C6A58" stroke-width="2"/><path d="M550,280 q80,36 160,0 Z" fill="#F3E3C7" stroke="#92400E" stroke-width="3"/><text x="630" y="274" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="middle">11,502 kg</text><text x="630" y="330" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#7C6A58" text-anchor="middle">= 25 libras antiguas</text><text x="44" y="400" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#3B2F2A" text-anchor="start">Una palabra, tres pesos</text><rect x="44" y="424" width="712" height="74" rx="14" fill="#F3E3C7" stroke="#E7D8BE" stroke-width="2"/><text x="64" y="470" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#92400E" text-anchor="start">11,502 kg</text><text x="244" y="456" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">Arroba castellana</text><text x="244" y="480" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="start">España y uso tradicional en varios países</text><rect x="44" y="510" width="712" height="74" rx="14" fill="#FFFDF8" stroke="#E7D8BE" stroke-width="2"/><text x="64" y="556" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#92400E" text-anchor="start">12,5 kg</text><text x="244" y="542" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">Arroba de 25 libras</text><text x="244" y="566" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="start">Común en el comercio agrícola y ganadero, como en Colombia</text><rect x="44" y="596" width="712" height="74" rx="14" fill="#FFFDF8" stroke="#E7D8BE" stroke-width="2"/><text x="64" y="642" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#92400E" text-anchor="start">15 kg</text><text x="244" y="628" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">Arroba ganadera</text><text x="244" y="652" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="start">La usada en Brasil para el peso del ganado</text><text x="44" y="702" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">10 arrobas son 115 kg, 125 kg o 150 kg según cuál uses.</text><text x="44" y="732" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Antes de comprar o vender por arrobas, pregunta siempre a qué arroba</text><text x="44" y="756.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">se refiere el precio.</text></g><text x="44" y="822" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/arroba-a-kilos</text></svg>