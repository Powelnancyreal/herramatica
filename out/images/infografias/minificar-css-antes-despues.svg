t x="44" y="468" width="712" height="56" rx="10" fill="#13231B" stroke="#4ADE80" stroke-width="2"/><text x="60" y="503" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#4ADE80" text-anchor="start">.boton{color:#ffffff;background-color:#2563eb;padding:12px 24px;border-radius:8px}</text><rect x="44" y="564" width="348" height="60" rx="10" fill="#13231B"/><text x="58" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">− Comentarios</text><text x="58" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">/* … */ y &lt;!-- … --&gt;</text><rect x="408" y="564" width="348" height="60" rx="10" fill="#13231B"/><text x="422" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">− Espacios y saltos de línea</text><text x="422" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">los que no cambian el resultado</text><rect x="44" y="634" width="348" height="60" rx="10" fill="#13231B"/><text x="58" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">− Último punto y coma</text><text x="58" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">antes de la llave de cierre</text><rect x="408" y="634" width="348" height="60" rx="10" fill="#13231B"/><text x="422" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">− Nombres largos (solo JS)</text><text x="422" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">calcularTotal → a</text><text x="44" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Guarda siempre el original: el código minificado funciona igual,</text><text x="44" y="748.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">pero es casi imposible de editar a mano.</text></g><text x="44" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/minificador-codigo</text></svg>