<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 841" width="800" height="841">
<rect width="800" height="841" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Grados o radianes: por qué sen(30) no</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">siempre da 0,5</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">El mismo número, dos unidades de ángulo distintas</text>
<g transform="translate(0,67)"><circle cx="200" cy="360" r="140" fill="none" stroke="#CBD5E1" stroke-width="3"/><line x1="40" y1="360" x2="360" y2="360" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="200" x2="200" y2="520" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><circle cx="340" cy="360" r="7" fill="#334155"/><line x1="200" y1="360" x2="321.24355652982143" y2="290" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/><circle cx="321.24355652982143" cy="290" r="7" fill="#7C3AED"/><text x="359.34867429633675" y="282" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">30° = π/6</text><circle cx="298.99494936611666" cy="261.00505063388334" r="7" fill="#334155"/><text x="330.1076477383248" y="246.79184719828692" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">45° = π/4</text><circle cx="270" cy="238.7564434701786" r="7" fill="#334155"/><text x="292" y="219.77568135664544" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">60° = π/3</text><circle cx="200" cy="220" r="7" fill="#334155"/><text x="200" y="197" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">90° = π/2</text><circle cx="60" cy="360" r="7" fill="#334155"/><text x="364" y="388" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">0°</text><text x="64" y="394" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">180° = π</text><path d="M248,360 A48,48 0 0 0 241.56921938165306,336" fill="none" stroke="#7C3AED" stroke-width="3"/><rect x="470" y="200" width="290" height="120" rx="16" fill="#D1FAE5"/><text x="490" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="start">Modo DEG (grados)</text><text x="490" y="276" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#334155" text-anchor="start">sen(30) = 0,5</text><text x="490" y="304" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">30 grados</text><rect x="470" y="340" width="290" height="120" rx="16" fill="#FEE2E2"/><text x="490" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="start">Modo RAD (radianes)</text><text x="490" y="416" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#334155" text-anchor="start">sen(30) = −0,988</text><text x="490" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">30 radianes ≈ 1718,9°</text><rect x="40" y="560" width="720" height="64" rx="14" fill="#EDE9FE"/><text x="400" y="601" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#5B21B6" text-anchor="middle">radianes = grados × π ÷ 180</text><text x="40" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Si un seno o un coseno da un resultado raro, revisa el modo antes que</text><text x="40" y="689.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">la fórmula: es el error más común.</text></g>
<line x1="40" y1="789" x2="760" y2="789" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="819" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-cientifica</text>
</svg>