<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750"><rect width="800" height="750" fill="#1F3A2E"/><rect x="44" y="692" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Excusas creíbles y excusas absurdas</text><g transform="translate(0,3)"><text x="44" y="192" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#FDE68A" text-anchor="start">Cinco situaciones, dos tonos</text><text x="44" y="240" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">💼 Llegar tarde al trabajo</text><rect x="44" y="256" width="348" height="120" rx="12" fill="#2A4A3B" stroke="#86EFAC" stroke-width="2"/><text x="60" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#86EFAC" text-anchor="start">Creíble</text><text x="60" y="312" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Se me descargó el celular y no</text><text x="60" y="334" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">sonó la alarma.</text><rect x="408" y="256" width="348" height="120" rx="12" fill="#2A4A3B" stroke="#FCA5A5" stroke-width="2"/><text x="424" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FCA5A5" text-anchor="start">Absurda</text><text x="424" y="312" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Un pato cruzó la calle con sus</text><text x="424" y="334" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">diez patitos y nadie se atrevió a</text><text x="424" y="356" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">interrumpirlos.</text><text x="44" y="426" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">📚 No hice la tarea</text><rect x="44" y="442" width="348" height="120" rx="12" fill="#2A4A3B" stroke="#86EFAC" stroke-width="2"/><text x="60" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#86EFAC" text-anchor="start">Creíble</text><text x="60" y="498" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Guardé el archivo en la</text><text x="60" y="520" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">computadora de mi casa y olvidé</text><text x="60" y="542" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">mandármelo.</text><rect x="408" y="442" width="348" height="120" rx="12" fill="#2A4A3B" stroke="#FCA5A5" stroke-width="2"/><text x="424" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FCA5A5" text-anchor="start">Absurda</text><text x="424" y="498" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Mi perro se comió la tarea… y</text><text x="424" y="520" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">luego pidió más.</text><text x="44" y="608" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#F1F5EE" text-anchor="start">Además: cancelar una cita, no ir a una fiesta y no ir al gimnasio.</text><text x="44" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Para usarlas con humor. En el trabajo y en la escuela, una</text><text x="44" y="662.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">explicación honesta suele funcionar mejor que la excusa perfecta.</text></g><text x="44" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/generador-excusas</text></svg>