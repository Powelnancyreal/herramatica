<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 821" width="800" height="821"><rect width="800" height="821" fill="#FBF6EC"/><rect x="44" y="763" width="712" height="1.5" fill="#D7E3EC"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0369A1" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Las tres partes del CUIL</text><text x="44" y="140.8" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#7C6A58" text-anchor="start">Ejemplo: hombre con DNI 30.123.456</text><g transform="translate(0,30)"><rect x="74" y="190" width="108" height="90" rx="14" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/><text x="128" y="250" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#0369A1" text-anchor="middle">20</text><text x="128" y="310" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">Prefijo</text><text x="200" y="250" font-family="Georgia, serif" font-size="46" font-weight="400" fill="#7C6A58" text-anchor="middle">-</text><rect x="218" y="190" width="312" height="90" rx="14" fill="#FFFFFF" stroke="#3B2F2A" stroke-width="3"/><text x="374" y="250" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#3B2F2A" text-anchor="middle">30123456</text><text x="374" y="310" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">DNI (8 cifras)</text><text x="548" y="250" font-family="Georgia, serif" font-size="46" font-weight="400" fill="#7C6A58" text-anchor="middle">-</text><rect x="566" y="190" width="74" height="90" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/><text x="603" y="250" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#B45309" text-anchor="middle">3</text><text x="603" y="310" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="middle">Verificador</text><text x="44" y="370" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#3B2F2A" text-anchor="start">Qué prefijo te corresponde</text><rect x="44" y="394" width="130" height="46" rx="10" fill="#E0F2FE"/><text x="109" y="425" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">20</text><text x="194" y="425" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Hombres</text><rect x="44" y="454" width="130" height="46" rx="10" fill="#E0F2FE"/><text x="109" y="485" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">27</text><text x="194" y="485" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Mujeres</text><rect x="44" y="514" width="130" height="46" rx="10" fill="#FEF3C7"/><text x="109" y="545" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">23</text><text x="194" y="545" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Cuando con 20 o 27 el verificador daría 10</text><rect x="44" y="574" width="130" height="46" rx="10" fill="#E0F2FE"/><text x="109" y="605" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">30, 33, 34</text><text x="194" y="605" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Empresas (CUIT)</text><text x="44" y="654" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">El verificador sale de multiplicar las 10 primeras cifras por 5, 4,</text><text x="44" y="678.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">3, 2, 7, 6, 5, 4, 3, 2, sumar y restar de 11 el resto de dividir</text><text x="44" y="702.6" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">entre 11.</text></g><text x="44" y="795" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/calcular-cuil</text></svg>