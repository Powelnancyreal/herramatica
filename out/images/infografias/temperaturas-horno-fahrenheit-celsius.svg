<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 827" width="800" height="827"><rect width="800" height="827" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#C2410C"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Temperaturas del horno de Fahrenheit a</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Celsius</text><g transform="translate(0,68)"><rect x="44" y="180" width="712" height="64" rx="14" fill="#FFF7ED"/><text x="400" y="222" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="700" fill="#C2410C" text-anchor="middle">°C = (°F − 32) ÷ 1,8</text><rect x="44" y="266" width="712" height="44" rx="10" fill="#FFF7ED"/><rect x="44" y="266" width="10" height="44" rx="4" fill="rgb(251,191,36)"/><text x="70" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">300 °F</text><text x="194" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">149 °C</text><text x="740" y="296" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Muy bajo: merengues</text><rect x="44" y="318" width="712" height="44" rx="10" fill="#FFFFFF"/><rect x="44" y="318" width="10" height="44" rx="4" fill="rgb(251,166,31)"/><text x="70" y="348" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">325 °F</text><text x="194" y="348" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">163 °C</text><text x="740" y="348" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Bajo: pasteles densos</text><rect x="44" y="370" width="712" height="44" rx="10" fill="#FFF7ED"/><rect x="44" y="370" width="10" height="44" rx="4" fill="rgb(251,141,26)"/><text x="70" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">350 °F</text><text x="194" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">177 °C</text><text x="740" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Moderado: la mayoría de pasteles</text><rect x="44" y="422" width="712" height="44" rx="10" fill="#FFFFFF"/><rect x="44" y="422" width="10" height="44" rx="4" fill="rgb(251,116,21)"/><text x="70" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">375 °F</text><text x="194" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">191 °C</text><text x="740" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Medio-alto: galletas</text><rect x="44" y="474" width="712" height="44" rx="10" fill="#FFF7ED"/><rect x="44" y="474" width="10" height="44" rx="4" fill="rgb(251,91,16)"/><text x="70" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">400 °F</text><text x="194" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">204 °C</text><text x="740" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Alto: pan y verduras asadas</text><rect x="44" y="526" width="712" height="44" rx="10" fill="#FFFFFF"/><rect x="44" y="526" width="10" height="44" rx="4" fill="rgb(251,66,11)"/><text x="70" y="556" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">425 °F</text><text x="194" y="556" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">218 °C</text><text x="740" y="556" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Muy alto: pizza casera</text><rect x="44" y="578" width="712" height="44" rx="10" fill="#FFF7ED"/><rect x="44" y="578" width="10" height="44" rx="4" fill="rgb(251,41,6)"/><text x="70" y="608" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">450 °F</text><text x="194" y="608" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">232 °C</text><text x="740" y="608" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="end">Máximo: gratinar</text><text x="44" y="646" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Truco de cabeza: resta 30 y divide entre 2. Para 350 °F: (350 − 30)</text><text x="44" y="670.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">÷ 2 = 160 °C, aproximado; el valor exacto es 177 °C.</text></g><text x="44" y="801" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/fahrenheit-a-celsius</text></svg>