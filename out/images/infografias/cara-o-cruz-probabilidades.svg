<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 839" width="800" height="839"><rect width="800" height="839" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#B45309"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cara o cruz: probabilidades y nombres</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">por país</text><g transform="translate(0,68)"><circle cx="160" cy="290" r="96" fill="#FCD34D" stroke="#B45309" stroke-width="6"/><circle cx="160" cy="290" r="78" fill="none" stroke="#D97706" stroke-width="2"/><text x="160" y="302" font-family="Trebuchet MS, Arial, sans-serif" font-size="38" font-weight="700" fill="#78350F" text-anchor="middle">50 %</text><text x="320" y="196" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Cómo se dice en cada país</text><rect x="320" y="214" width="436" height="38" rx="10" fill="#FFFBEB"/><text x="332" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">México</text><text x="744" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#B45309" text-anchor="end">águila o sol (volado)</text><rect x="320" y="258" width="436" height="38" rx="10" fill="#FFFFFF"/><text x="332" y="284" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">España</text><text x="744" y="284" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#B45309" text-anchor="end">cara o cruz</text><rect x="320" y="302" width="436" height="38" rx="10" fill="#FFFBEB"/><text x="332" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Argentina y Uruguay</text><text x="744" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#B45309" text-anchor="end">cara o ceca</text><rect x="320" y="346" width="436" height="38" rx="10" fill="#FFFFFF"/><text x="332" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Chile, Colombia y Perú</text><text x="744" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#B45309" text-anchor="end">cara o sello</text><text x="44" y="420" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Probabilidad de que salga lo mismo varias veces seguidas</text><text x="44" y="468" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">2 veces</text><rect x="154" y="450" width="452" height="28" rx="8" fill="#B45309"/><text x="618" y="470" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">25 %</text><text x="44" y="518" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">3 veces</text><rect x="154" y="500" width="226" height="28" rx="8" fill="#B45309"/><text x="392" y="520" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">12,5 %</text><text x="44" y="568" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">5 veces</text><rect x="154" y="550" width="56.5" height="28" rx="8" fill="#B45309"/><text x="222.5" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">3,1 %</text><text x="44" y="618" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">10 veces</text><rect x="154" y="600" width="6" height="28" rx="8" fill="#B45309"/><text x="172" y="620" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">0,098 %</text><text x="44" y="658" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Falacia del jugador: tras cinco caras, la siguiente tirada sigue</text><text x="44" y="682.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">siendo 50 % y 50 %. La moneda no recuerda lo que salió antes.</text></g><text x="44" y="813" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/cara-o-cruz</text></svg>