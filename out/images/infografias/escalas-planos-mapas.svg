<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 758" width="800" height="758"><rect width="800" height="758" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="758" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="758" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo leer las escalas de planos y mapas</text><g transform="translate(0,3)"><rect x="54" y="190" width="300" height="200" rx="4" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/><line x1="54" y1="290" x2="214" y2="290" stroke="#1E3A8A" stroke-width="3"/><line x1="214" y1="290" x2="214" y2="390" stroke="#1E3A8A" stroke-width="3"/><path d="M254,390 a40,40 0 0 1 40,-40" fill="none" stroke="#1E3A8A" stroke-width="2"/><line x1="54" y1="410" x2="354" y2="410" stroke="#B45309" stroke-width="2.5"/><line x1="54" y1="402" x2="54" y2="418" stroke="#B45309" stroke-width="2.5"/><line x1="354" y1="402" x2="354" y2="418" stroke="#B45309" stroke-width="2.5"/><text x="204" y="440" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#B45309" text-anchor="middle">12 cm en el plano</text><text x="204" y="470" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#1E3A8A" text-anchor="middle">1:50 → 6 m reales</text><rect x="400" y="190" width="356" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="414" y="224" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#B45309" text-anchor="start">1:20</text><text x="540" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">1 cm = 20 cm</text><text x="540" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Muebles y detalles</text><rect x="400" y="254" width="356" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="414" y="288" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#B45309" text-anchor="start">1:50</text><text x="540" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">1 cm = 50 cm</text><text x="540" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Planos de vivienda</text><rect x="400" y="318" width="356" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="414" y="352" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#B45309" text-anchor="start">1:100</text><text x="540" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">1 cm = 1 m</text><text x="540" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Planos de edificio</text><rect x="400" y="382" width="356" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="414" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#B45309" text-anchor="start">1:1.000</text><text x="540" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">1 cm = 10 m</text><text x="540" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Urbanismo</text><rect x="400" y="446" width="356" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="414" y="480" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#B45309" text-anchor="start">1:50.000</text><text x="540" y="471" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">1 cm = 500 m</text><text x="540" y="491" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Mapas de senderismo</text><rect x="44" y="540" width="712" height="70" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="400" y="584" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">real = plano × N      ·      plano = real ÷ N</text><text x="44" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Usa la misma unidad en las dos medidas. Si mides el plano en cm, el</text><text x="44" y="674.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">resultado real también sale en cm.</text></g><text x="44" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calculadora-de-escalas</text></svg>