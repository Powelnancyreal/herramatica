<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 933" width="800" height="933"><rect width="800" height="933" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="933" fill="url(#g)"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Los cuatro tipos de cambio del dólar en</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">México</text><g transform="translate(0,44)"><rect x="44" y="180" width="712" height="98" rx="12" fill="#123A63" stroke="#4ADE80" stroke-width="2"/><text x="64" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#4ADE80" text-anchor="start">Tipo de cambio FIX</text><text x="64" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">Lo publica el Banco de México cada día hábil. Sirve para pagar deudas</text><text x="64" y="261.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">en dólares dentro de México.</text><rect x="44" y="290" width="712" height="98" rx="12" fill="#123A63" stroke="#93C5FD" stroke-width="2"/><text x="64" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#93C5FD" text-anchor="start">Tipo de cambio de referencia</text><text x="64" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">El del mercado interbancario, el que muestra esta calculadora.</text><rect x="44" y="400" width="712" height="98" rx="12" fill="#123A63" stroke="#FCD34D" stroke-width="2"/><text x="64" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FCD34D" text-anchor="start">Ventanilla: compra</text><text x="64" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">Lo que te da el banco o la casa de cambio por tus dólares. Siempre</text><text x="64" y="481.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">menor.</text><rect x="44" y="510" width="712" height="98" rx="12" fill="#123A63" stroke="#F472B6" stroke-width="2"/><text x="64" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F472B6" text-anchor="start">Ventanilla: venta</text><text x="64" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#E0F2FE" text-anchor="start">Lo que pagas por comprar dólares. Siempre mayor.</text><rect x="44" y="640" width="712" height="100" rx="14" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="64" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Si cambias 500 dólares y el banco paga $0.60 menos</text><text x="64" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start">que el tipo de referencia, recibes $300 pesos menos.</text><text x="44" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">Compara siempre cuánto recibes al final, no la comisión: el margen</text><text x="44" y="804.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">suele estar escondido en el tipo de cambio.</text></g><text x="44" y="907" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/dolar-a-peso-mexicano</text></svg>