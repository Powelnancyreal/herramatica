unio</text><text x="578" y="304" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#A16207" text-anchor="middle">2.ª prima: a más tardar el 20 de diciembre</text><rect x="44" y="346" width="712" height="90" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/><text x="400" y="386" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#422006" text-anchor="middle">Prima = salario base × días trabajados ÷ 360</text><text x="400" y="416" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="400" fill="#7E6A8A" text-anchor="middle">el salario base incluye el auxilio de transporte si lo recibes</text><rect x="44" y="466" width="348" height="110" rx="14" fill="#FEF9C3"/><text x="62" y="498" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#422006" text-anchor="start">Semestre completo</text><text x="62" y="524" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="400" fill="#7E6A8A" text-anchor="start">$2.000.000 × 180 días ÷ 360</text><text x="62" y="560" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#A16207" text-anchor="start">$1.000.000</text><rect x="408" y="466" width="348" height="110" rx="14" fill="#FEF9C3"/><text x="426" y="498" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#422006" text-anchor="start">Entraste el 1 de abril</text><text x="426" y="524" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="400" fill="#7E6A8A" text-anchor="start">$2.000.000 × 90 días ÷ 360</text><text x="426" y="560" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#A16207" text-anchor="start">$500.000</text><text x="44" y="606" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Con el salario mínimo de 2026 ($1.750.905) más el auxilio de</text><text x="44" y="630.3" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">transporte ($249.095), la base es de $2.000.000.</text></g><text x="44" y="733" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/prima-de-servicios</text></svg>