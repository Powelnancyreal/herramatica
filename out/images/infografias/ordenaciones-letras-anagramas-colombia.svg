<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820"><rect width="800" height="820" fill="#1F3A2E"/><rect x="44" y="762" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Ordenaciones posibles y anagramas reales</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="start">¿De cuántas formas se ordenan las letras de COLOMBIA?</text><rect x="44" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="70" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">C</text><rect x="104" y="214" width="52" height="58" rx="9" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5"/><text x="130" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">O</text><rect x="164" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="190" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">L</text><rect x="224" y="214" width="52" height="58" rx="9" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5"/><text x="250" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">O</text><rect x="284" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="310" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">M</text><rect x="344" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="370" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">B</text><rect x="404" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="430" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">I</text><rect x="464" y="214" width="52" height="58" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/><text x="490" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">A</text><text x="538" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">La O se repite 2 veces</text><rect x="44" y="300" width="712" height="112" rx="14" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="66" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="start">8 letras → 8! = 40.320 ordenaciones</text><text x="66" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#FDE68A" text-anchor="start">Las dos O son iguales: 40.320 ÷ 2! = 20.160 distintas</text><text x="66" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="start">Fórmula: n! ÷ (a! × b! × …), con a, b… las veces que se repite cada letra</text><text x="44" y="452" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="start">Pocas ordenaciones son palabras de verdad</text><rect x="44" y="474" width="712" height="62" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="1.5"/><text x="62" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F1F5EE" text-anchor="start">AMOR</text><text x="62" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="start">24 ordenaciones</text><text x="738" y="513" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#FDE68A" text-anchor="end">roma · mora · ramo · armo · maro</text><rect x="44" y="548" width="712" height="62" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="1.5"/><text x="62" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F1F5EE" text-anchor="start">ALEGRÍA</text><text x="62" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="start">2.520 ordenaciones</text><text x="738" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#FDE68A" text-anchor="end">alergia · galería · regalía · aligera…</text><rect x="44" y="622" width="712" height="62" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="1.5"/><text x="62" y="649" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F1F5EE" text-anchor="start">ABRIGAR</text><text x="62" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="start">1.260 ordenaciones</text><text x="738" y="661" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#FDE68A" text-anchor="end">barriga</text><text x="44" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Las tildes no cuentan al formar un anagrama: alegría y galería usan</text><text x="44" y="732.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">las mismas letras.</text></g><text x="44" y="794" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-de-anagramas</text></svg>