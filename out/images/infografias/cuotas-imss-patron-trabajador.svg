uchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">cesantía y vejez sube cada año hasta 2030; el tope de cotización es</text><text x="44" y="674.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">25 UMA diarias.</text></g><text x="44" y="805" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-cuota-imss</text></svg>