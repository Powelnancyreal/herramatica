<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 789" width="800" height="789"><rect width="800" height="789" fill="#F5FFFD"/><rect x="44" y="731" width="712" height="1.5" fill="#99F6E4"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#134E4A" text-anchor="start">Por qué tu SMS se corta antes de</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#134E4A" text-anchor="start">160 caracteres</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#134E4A" text-anchor="start">Un SMS cambia de límite según los caracteres que uses</text><rect x="44" y="206" width="572" height="70" rx="22" fill="#14B8A6"/><text x="66" y="250" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Nos vemos mañana a las 7</text><text x="756" y="250" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#134E4A" text-anchor="end">160 máx.</text><text x="44" y="298" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="start">Solo caracteres del alfabeto GSM (incluye ñ y é)</text><rect x="44" y="320" width="572" height="70" rx="22" fill="#F97316"/><text x="66" y="364" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Llegó el pedido: ¿cuándo pasás?</text><text x="756" y="364" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#134E4A" text-anchor="end">70 máx.</text><text x="44" y="412" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="start">Con á, í, ó, ú o un emoji, todo el SMS pasa a Unicode</text><text x="44" y="460" font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#134E4A" text-anchor="start">Otros límites que conviene revisar</text><rect x="44" y="480" width="169" height="88" rx="14" fill="#CCFBF1"/><text x="128.5" y="518" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">≈ 60</text><text x="128.5" y="548" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#134E4A" text-anchor="middle">Título para Google</text><rect x="225" y="480" width="169" height="88" rx="14" fill="#CCFBF1"/><text x="309.5" y="518" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">≈ 155</text><text x="309.5" y="548" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#134E4A" text-anchor="middle">Meta descripción</text><rect x="406" y="480" width="169" height="88" rx="14" fill="#CCFBF1"/><text x="490.5" y="518" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">280</text><text x="490.5" y="548" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#134E4A" text-anchor="middle">Publicación en X</text><rect x="587" y="480" width="169" height="88" rx="14" fill="#CCFBF1"/><text x="671.5" y="518" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">150</text><text x="671.5" y="548" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#134E4A" text-anchor="middle">Bio de Instagram</text><text x="44" y="608" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Los mensajes largos se dividen en partes de 153 caracteres (GSM) o</text><text x="44" y="632.3" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">67 (Unicode). Un emoji cuenta como 2 caracteres en muchos</text><text x="44" y="656.6" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">contadores.</text></g><text x="44" y="763" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/contador-caracteres</text></svg>