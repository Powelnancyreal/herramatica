<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 785" width="800" height="785"><rect width="800" height="785" fill="#0A1020"/><rect x="44" y="727" width="712" height="1.5" fill="#22314F"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Qué hay dentro de una imagen en Base64</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Anatomía de una imagen en Base64</text><text x="44" y="232" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start">data:</text><text x="99.5" y="232" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#F472B6" text-anchor="start">image/png</text><text x="199.39999999999998" y="232" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#FBBF24" text-anchor="start">;base64,</text><text x="288.2" y="232" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#38BDF8" text-anchor="start">iVBORw0KGgoAAAANSUhEUg…</text><rect x="44" y="258" width="14" height="14" rx="3" fill="#94A3B8"/><text x="68" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">esquema</text><rect x="44" y="292" width="14" height="14" rx="3" fill="#F472B6"/><text x="68" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">tipo de archivo</text><rect x="44" y="326" width="14" height="14" rx="3" fill="#FBBF24"/><text x="68" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">codificación</text><rect x="44" y="360" width="14" height="14" rx="3" fill="#38BDF8"/><text x="68" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">los bytes de la imagen como texto</text><text x="44" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Por qué pesa un 33 % más</text><rect x="44" y="440" width="140" height="46" rx="8" fill="#A78BFA"/><text x="114" y="470" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">byte 1</text><rect x="192" y="440" width="140" height="46" rx="8" fill="#A78BFA"/><text x="262" y="470" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">byte 2</text><rect x="340" y="440" width="140" height="46" rx="8" fill="#A78BFA"/><text x="410" y="470" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">byte 3</text><text x="498" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">3 bytes</text><rect x="44" y="504" width="101" height="46" rx="8" fill="#38BDF8"/><text x="94.5" y="534" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">i</text><rect x="153" y="504" width="101" height="46" rx="8" fill="#38BDF8"/><text x="203.5" y="534" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">V</text><rect x="262" y="504" width="101" height="46" rx="8" fill="#38BDF8"/><text x="312.5" y="534" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">B</text><rect x="371" y="504" width="101" height="46" rx="8" fill="#38BDF8"/><text x="421.5" y="534" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0A1020" text-anchor="middle">O</text><text x="490" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">→ 4 caracteres</text><rect x="44" y="590" width="712" height="56" rx="10" fill="#121C33"/><text x="60" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Ícono de 2 KB</text><text x="274" y="625" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="start">≈ 2,7 KB</text><text x="740" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#86EFAC" text-anchor="end">buena idea: ahorra una petición</text><rect x="44" y="656" width="712" height="56" rx="10" fill="#121C33"/><text x="60" y="691" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Foto de 300 KB</text><text x="274" y="691" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="start">≈ 400 KB</text><text x="740" y="691" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FCA5A5" text-anchor="end">mala idea: no se guarda en caché aparte</text></g><text x="44" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/imagen-a-base64</text></svg>