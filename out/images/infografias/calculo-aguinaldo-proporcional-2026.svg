<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 901" width="800" height="901">
<rect width="800" height="901" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo se calcula el aguinaldo</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">proporcional en 2026</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ejemplo: ingreso el 1 de abril con un salario diario de $400</text>
<g transform="translate(0,67)"><rect x="40" y="170" width="720" height="64" rx="14" fill="#EDE9FE"/><text x="400" y="211" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#5B21B6" text-anchor="middle">salario diario × 15 × días trabajados ÷ 365</text><text x="40" y="284" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">Año 2026</text><rect x="40" y="300" width="720" height="40" rx="20" fill="#E2E8F0"/><rect x="217.53424657534245" y="300" width="542.4657534246576" height="40" rx="20" fill="#059669"/><text x="488.7671232876712" y="327" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">275 días trabajados</text><text x="50" y="327" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">ene–mar</text><text x="217.53424657534245" y="366" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Ingreso: 1 de abril</text><text x="760" y="366" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="end">31 de dic.</text><rect x="40" y="420" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="58" y="453" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Salario diario</text><text x="742" y="453" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">$400.00</text><rect x="40" y="480" width="720" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="58" y="513" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">$400 × 15 días × 275 ÷ 365</text><text x="742" y="513" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#059669" text-anchor="end">$4,520.55</text><rect x="40" y="540" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="58" y="573" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Exento de ISR (30 UMA × $117.31)</text><text x="742" y="573" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">− $3,519.30</text><rect x="40" y="606" width="720" height="72" rx="14" fill="#334155"/><text x="62" y="650" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1" text-anchor="start">Parte que paga ISR</text><text x="738" y="652" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="end">$1,001.25</text><text x="40" y="724" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Mínimo por ley: 15 días de salario (art. 87 LFT), pagado antes del 20</text><text x="40" y="749.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">de diciembre. Tu contrato puede dar más días.</text></g>
<line x1="40" y1="849" x2="760" y2="849" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="879" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calcular-aguinaldo</text>
