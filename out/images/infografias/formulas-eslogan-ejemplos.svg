<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 766" width="800" height="766"><rect width="800" height="766" fill="#17120A"/><rect x="44" y="708" width="712" height="1.5" fill="#3D2F17"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Tipos de eslogan con ejemplos</text><g transform="translate(0,3)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Cinco fórmulas para una cafetería ficticia</text><rect x="44" y="208" width="712" height="74" rx="12" fill="#261D10" stroke="#3D2F17" stroke-width="1.5"/><rect x="44" y="208" width="8" height="74" rx="4" fill="#FBBF24"/><text x="68" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">Beneficio</text><text x="738" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="end">Dice qué ganas.</text><text x="68" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="start">«Despierta con sabor de verdad.»</text><rect x="44" y="294" width="712" height="74" rx="12" fill="#261D10" stroke="#3D2F17" stroke-width="1.5"/><rect x="44" y="294" width="8" height="74" rx="4" fill="#FBBF24"/><text x="68" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">Promesa</text><text x="738" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="end">Compromiso medible.</text><text x="68" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="start">«Tu café, en 10 minutos o es gratis.»</text><rect x="44" y="380" width="712" height="74" rx="12" fill="#261D10" stroke="#3D2F17" stroke-width="1.5"/><rect x="44" y="380" width="8" height="74" rx="4" fill="#FBBF24"/><text x="68" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">Origen</text><text x="738" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="end">Lo que te hace distinto.</text><text x="68" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="start">«Café de Veracruz, tostado esta semana.»</text><rect x="44" y="466" width="712" height="74" rx="12" fill="#261D10" stroke="#3D2F17" stroke-width="1.5"/><rect x="44" y="466" width="8" height="74" rx="4" fill="#FBBF24"/><text x="68" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">Rima</text><text x="738" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="end">Fácil de recordar.</text><text x="68" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="start">«Si es de Café Lumbre, es costumbre.»</text><rect x="44" y="552" width="712" height="74" rx="12" fill="#261D10" stroke="#3D2F17" stroke-width="1.5"/><rect x="44" y="552" width="8" height="74" rx="4" fill="#FBBF24"/><text x="68" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">Invitación</text><text x="738" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="end">Un verbo en imperativo.</text><text x="68" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="start">«Haz una pausa. Tómate un Lumbre.»</text><text x="44" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Lee tus favoritos en voz alta: si se traban o pasan de ocho</text><text x="44" y="678.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">palabras, recórtalos.</text></g><text x="44" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/generador-esloganes</text></svg>