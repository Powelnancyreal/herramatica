<g transform="translate(0,38)"><rect x="32" y="176" width="736" height="66" rx="12" fill="#F8FAFC"/><text x="46" y="218" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">21.000</text><text x="250" y="208" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">veintiún mil</text><text x="250" y="232" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">no «veintiuno mil»</text><text x="46" y="292" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">100</text><text x="250" y="282" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">cien</text><text x="250" y="306" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">pero 101 es «ciento uno»</text><rect x="32" y="324" width="736" height="66" rx="12" fill="#F8FAFC"/><text x="46" y="366" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">500</text><text x="250" y="356" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">quinientos</text><text x="250" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">no «cincocientos»</text><text x="46" y="440" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">700</text><text x="250" y="430" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">setecientos</text><text x="250" y="454" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">no «sietecientos»</text><rect x="32" y="472" width="736" height="66" rx="12" fill="#F8FAFC"/><text x="46" y="514" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">900</text><text x="250" y="504" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">novecientos</text><text x="250" y="528" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">no «nuevecientos»</text><text x="46" y="588" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="start">1.000.000</text><text x="250" y="578" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">un millón</text><text x="250" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">y 2.000.000, «dos millones»</text><text x="40" y="650" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Formato de cheque</text><rect x="40" y="668" width="720" height="136" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="64" y="712" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#059669" text-anchor="start">$1,235.50</text><text x="64" y="752" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">MIL DOSCIENTOS TREINTA Y CINCO PESOS</text><text x="64" y="782" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">50/100 M.N.</text><text x="40" y="846" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Del 16 al 29 se escribe en una sola palabra: dieciséis, veintidós,</text><text x="40" y="871.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">veintinueve. Desde el 31, con «y»: treinta y uno.</text></g>
