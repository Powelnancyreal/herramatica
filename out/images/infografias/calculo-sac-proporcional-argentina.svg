<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 924" width="800" height="924"><rect width="800" height="924" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="924" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="924" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0284C7" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo se calcula el aguinaldo</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">proporcional en Argentina</text><text x="44" y="181.6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Ejemplo: mejor sueldo de $1.200.000, segundo semestre</text><g transform="translate(0,71)"><text x="44" y="186" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="400" fill="#1E3A8A" text-anchor="start">SAC = mejor sueldo del semestre ÷ 2</text><rect x="47" y="220" width="112.66666666666667" height="64" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="103.33333333333334" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">jul</text><rect x="165.66666666666669" y="220" width="112.66666666666667" height="64" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="222.00000000000003" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">ago</text><rect x="284.33333333333337" y="220" width="112.66666666666667" height="64" rx="10" fill="#BAE6FD" stroke="#93C5FD" stroke-width="2"/><text x="340.6666666666667" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">sep</text><rect x="403" y="220" width="112.66666666666667" height="64" rx="10" fill="#BAE6FD" stroke="#93C5FD" stroke-width="2"/><text x="459.3333333333333" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">oct</text><rect x="521.6666666666667" y="220" width="112.66666666666667" height="64" rx="10" fill="#BAE6FD" stroke="#93C5FD" stroke-width="2"/><text x="578.0000000000001" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">nov</text><rect x="640.3333333333334" y="220" width="112.66666666666667" height="64" rx="10" fill="#BAE6FD" stroke="#93C5FD" stroke-width="2"/><text x="696.6666666666667" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">dic</text><text x="285.33333333333337" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0284C7" text-anchor="start">↑ ingreso el 1 de septiembre: 122 de 184 días</text><rect x="44" y="350" width="712" height="66" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SAC completo</text><text x="62" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="start">$1.200.000 ÷ 2</text><text x="738" y="394" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="end">$600.000</text><rect x="44" y="428" width="712" height="66" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Proporción trabajada</text><text x="62" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="start">122 ÷ 184</text><text x="738" y="472" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="end">0,663</text><rect x="44" y="506" width="712" height="66" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SAC proporcional</text><text x="62" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="start">$600.000 × 0,663</text><text x="738" y="550" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#0284C7" text-anchor="end">$397.826</text><rect x="44" y="604" width="348" height="76" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/><text x="218" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">1.ª cuota</text><text x="218" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">hasta el 30 de junio</text><rect x="408" y="604" width="348" height="76" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/><text x="582" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">2.ª cuota</text><text x="582" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">hasta el 18 de diciembre</text><text x="44" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">La ley permite pagarla hasta 4 días hábiles después de esas fechas.</text><text x="44" y="744.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Se calcula sobre el sueldo bruto y tiene los mismos descuentos que</text><text x="44" y="768.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">el sueldo.</text></g><text x="44" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-sac-argentina</text></svg>