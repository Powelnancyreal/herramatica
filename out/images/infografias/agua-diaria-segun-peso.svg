<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 851" width="800" height="851"><rect width="800" height="851" fill="#F5FBFF"/><rect x="44" y="793" width="712" height="1.5" fill="#BAE6FD"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#0369A1" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#0C4A6E" text-anchor="start">Cuánta agua beber al día según tu</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#0C4A6E" text-anchor="start">peso</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#0C4A6E" text-anchor="start">Persona de 70 kg</text><text x="44" y="234" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#0C4A6E" text-anchor="start">Base: 70 kg × 35 ml</text><text x="756" y="234" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#0369A1" text-anchor="end">2.450 ml</text><path d="M44,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M92,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M140,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M188,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M236,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M284,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M332,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M380,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M428,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><path d="M476,248 h36 l-5,52 h-26 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2.5"/><text x="44" y="346" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#0C4A6E" text-anchor="start">+ 45 minutos de ejercicio</text><text x="756" y="346" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#0369A1" text-anchor="end">+ 450 ml</text><path d="M44,360 h36 l-5,52 h-26 Z" fill="#38BDF8" stroke="#0369A1" stroke-width="2.5"/><path d="M92,360 h36 l-5,52 h-26 Z" fill="#38BDF8" stroke="#0369A1" stroke-width="2.5"/><text x="44" y="458" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#0C4A6E" text-anchor="start">+ día caluroso</text><text x="756" y="458" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#0369A1" text-anchor="end">+ 500 ml</text><path d="M44,472 h36 l-5,52 h-26 Z" fill="#0EA5E9" stroke="#0369A1" stroke-width="2.5"/><path d="M92,472 h36 l-5,52 h-26 Z" fill="#0EA5E9" stroke="#0369A1" stroke-width="2.5"/><rect x="44" y="550" width="712" height="80" rx="16" fill="#0369A1"/><text x="64" y="600" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Total: 3.400 ml ≈ 13–14 vasos de 250 ml</text><text x="44" y="670" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Incluye el agua de la comida, que aporta en torno al 20 %. Embarazo:</text><text x="44" y="694.3" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">+300 ml; lactancia: +700 ml. Si tienes una enfermedad renal o</text><text x="44" y="718.6" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">cardíaca, sigue la indicación de tu médico.</text></g><text x="44" y="825" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/calculadora-agua-diaria</text></sv