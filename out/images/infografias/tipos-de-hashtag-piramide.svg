<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 830" width="800" height="830"><rect width="800" height="830" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#DB2777"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Los cuatro tipos de hashtag que conviene</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">mezclar</text><g transform="translate(0,68)"><rect x="220" y="190" width="360" height="84" rx="12" fill="#FBCFE8"/><text x="400" y="220" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#500724" text-anchor="middle">Masivos: #comida</text><text x="400" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#831843" text-anchor="middle">millones de publicaciones: tu foto se pierde en minutos</text><rect x="140" y="286" width="520" height="84" rx="12" fill="#F9A8D4"/><text x="400" y="316" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#500724" text-anchor="middle">Temáticos: #tacos  #comidamexicana</text><text x="400" y="344" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#831843" text-anchor="middle">compites con menos y llegas a interesados</text><rect x="80" y="382" width="640" height="84" rx="12" fill="#F472B6"/><text x="400" y="412" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">De nicho: #tacosalpastor  #taqueria</text><text x="400" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">público pequeño pero muy afín</text><rect x="44" y="478" width="712" height="84" rx="12" fill="#DB2777"/><text x="400" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Locales: #comidacdmx  #tacosguadalajara</text><text x="400" y="536" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">gente que puede visitarte</text><rect x="44" y="594" width="712" height="96" rx="12" fill="#FDF2F8"/><text x="62" y="626" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#DB2777" text-anchor="start">Una mezcla que funciona</text><text x="62" y="654" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">1 o 2 masivos + 2 o 3 temáticos + 2 de nicho + 1 local + el de tu marca</text><text x="62" y="676" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Sin acentos ni espacios: #comidamexicana, no #comida mexicana.</text></g><text x="44" y="804" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/generador-hashtags</text></svg>