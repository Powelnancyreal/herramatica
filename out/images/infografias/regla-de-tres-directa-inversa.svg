<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 759" width="800" height="759"><rect width="800" height="759" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="759" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="759" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C2410C" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Regla de tres directa e inversa con</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">ejemplos</text><g transform="translate(0,44)"><text x="44" y="186" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#C2410C" text-anchor="start">Directa: si uno sube, el otro sube</text><text x="84" y="236" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 kg</text><text x="284" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">→</text><text x="334" y="236" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">S/ 45</text><text x="84" y="280" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">7 kg</text><text x="284" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">→</text><text x="334" y="280" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#C2410C" text-anchor="start">x</text><line x1="514" y1="226" x2="514" y2="272" stroke="#1E3A8A" stroke-width="3"/><path d="M506,262 l8,12 l8,-12" fill="none" stroke="#1E3A8A" stroke-width="3"/><line x1="544" y1="226" x2="544" y2="272" stroke="#1E3A8A" stroke-width="3"/><path d="M536,262 l8,12 l8,-12" fill="none" stroke="#1E3A8A" stroke-width="3"/><text x="584" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">mismo sentido</text><rect x="44" y="302" width="712" height="56" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="62" y="338" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="start">x = 7 × 45 ÷ 3</text><text x="738" y="339" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#C2410C" text-anchor="end">S/ 105</text><text x="44" y="400" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#C2410C" text-anchor="start">Inversa: si uno sube, el otro baja</text><text x="84" y="450" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">4 obreros</text><text x="284" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">→</text><text x="334" y="450" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">12 días</text><text x="84" y="494" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">6 obreros</text><text x="284" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">→</text><text x="334" y="494" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#C2410C" text-anchor="start">x</text><line x1="514" y1="440" x2="514" y2="486" stroke="#1E3A8A" stroke-width="3"/><path d="M506,450 l8,-12 l8,12" fill="none" stroke="#1E3A8A" stroke-width="3"/><line x1="544" y1="440" x2="544" y2="486" stroke="#1E3A8A" stroke-width="3"/><path d="M536,476 l8,12 l8,-12" fill="none" stroke="#1E3A8A" stroke-width="3"/><text x="584" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">sentido contrario</text><rect x="44" y="516" width="712" height="56" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="62" y="552" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="start">x = 4 × 12 ÷ 6</text><text x="738" y="553" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#C2410C" text-anchor="end">8 días</text><text x="44" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Pregúntate: si duplico el primer dato, ¿el segundo se duplica</text><text x="44" y="634.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">(directa) o se reduce a la mitad (inversa)?</text></g><text x="44" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calculadora-regla-de-tres</text></svg>