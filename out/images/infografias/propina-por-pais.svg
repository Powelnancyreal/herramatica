<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 841" width="800" height="841">
<rect width="800" height="841" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cuánta propina se deja en cada país</text>
<g transform="translate(0,-5)"><rect x="40" y="176" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="58" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">México</text><text x="374" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">10–15 %</text><text x="58" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">En restaurantes con servicio a la mesa.</text><rect x="408" y="176" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="426" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Argentina</text><text x="742" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">10 %</text><text x="426" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Habitual en restaurantes y bares.</text><rect x="40" y="280" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="58" y="316" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Colombia</text><text x="374" y="318" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">10 %</text><text x="58" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Sugerida en la cuenta; es voluntaria.</text><rect x="408" y="280" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="426" y="316" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Chile</text><text x="742" y="318" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">10 %</text><text x="426" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Sugerida en la cuenta; es voluntaria.</text><rect x="40" y="384" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="58" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Perú</text><text x="374" y="422" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">10 %</text><text x="58" y="454" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Costumbre, a veces incluida como servicio.</text><rect x="408" y="384" width="352" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="426" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">España</text><text x="742" y="422" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0D9488" text-anchor="end">5–10 %</text><text x="426" y="454" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Opcional; a menudo se redondea.</text><text x="40" y="518" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Ejemplo: cuenta de $1,250 entre 4 personas con 15 %</text><rect x="40" y="538" width="720" height="46" rx="10" fill="#F8FAFC"/><text x="58" y="569" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Propina: 1,250 × 15 %</text><text x="742" y="569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">$187.50</text><rect x="40" y="594" width="720" height="46" rx="10" fill="#F8FAFC"/><text x="58" y="625" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Total: 1,250 + 187.50</text><text x="742" y="625" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">$1,437.50</text><rect x="40" y="650" width="720" height="46" rx="10" fill="#CCFBF1"/><text x="58" y="681" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Cada persona: 1,437.50 ÷ 4</text><text x="742" y="681" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0D9488" text-anchor="end">$359.38</text><text x="40" y="736" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Son costumbres orientativas. Revisa siempre si la cuenta ya incluye un</text><text x="40" y="761.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">cargo por servicio antes de añadir propina.</text></g>
<line x1="40" y1="789" x2="760" y2="789" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="819" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-propinas</text>
</svg>