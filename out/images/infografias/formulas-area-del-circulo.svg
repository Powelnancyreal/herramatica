<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 747" width="800" height="747"><rect width="800" height="747" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="747" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="747" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Tres formas de calcular el área de un</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">círculo</text><g transform="translate(0,44)"><circle cx="220" cy="330" r="130" fill="#EDE9FE" stroke="#1E3A8A" stroke-width="3"/><line x1="220" y1="330" x2="350" y2="330" stroke="#7C3AED" stroke-width="4"/><circle cx="220" cy="330" r="6" fill="#1E3A8A"/><text x="285" y="318" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#7C3AED" text-anchor="middle">r = 5 cm</text><line x1="90" y1="490" x2="350" y2="490" stroke="#475569" stroke-width="2"/><line x1="90" y1="482" x2="90" y2="498" stroke="#475569" stroke-width="2"/><line x1="350" y1="482" x2="350" y2="498" stroke="#475569" stroke-width="2"/><text x="220" y="522" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">d = 10 cm</text><rect x="420" y="190" width="336" height="100" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="436" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Si tienes el radio</text><text x="436" y="250" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">A = π × r²</text><text x="436" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">π × 5² = 78,54 cm²</text><rect x="420" y="302" width="336" height="100" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="436" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Si tienes el diámetro</text><text x="436" y="362" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">A = π × (d ÷ 2)²</text><text x="436" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">π × 5² = 78,54 cm²</text><rect x="420" y="414" width="336" height="100" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="436" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Si tienes la circunferencia</text><text x="436" y="474" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">A = C² ÷ (4π)</text><text x="436" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">31,42² ÷ 12,57 = 78,54 cm²</text><text x="44" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">El área se mide en unidades al cuadrado (cm², m²). La</text><text x="44" y="594.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">circunferencia, en cambio, es una longitud: C = 2 × π × r = 31,42</text><text x="44" y="618.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">cm.</text></g><text x="44" y="721" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-area-circulo</text></svg>