<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 875" width="800" height="875"><rect width="800" height="875" fill="#0B1020"/><rect x="44" y="817" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Cuánto se cobra si te despiden sin</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">preaviso</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#34D399" text-anchor="start">$ despido sin preaviso</text><text x="44" y="220" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">sueldo            </text><text x="274" y="220" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">$1.200.000</text><text x="44" y="248" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">antigüedad        </text><text x="274" y="248" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">3 años y 4 meses</text><text x="44" y="276" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">fecha de despido  </text><text x="274" y="276" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">10 de octubre de 2026</text><rect x="44" y="330" width="712" height="62" rx="10" fill="#111A33"/><text x="60" y="357" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="start">Indemnización sustitutiva</text><text x="60" y="379" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># 1 mes (hasta 5 años de antigüedad)</text><text x="740" y="368" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">$1.200.000</text><rect x="44" y="402" width="712" height="62" rx="10" fill="#111A33"/><text x="60" y="429" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="start">Integración del mes</text><text x="60" y="451" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># 21 días restantes de octubre</text><text x="740" y="440" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">$812.903</text><rect x="44" y="474" width="712" height="62" rx="10" fill="#111A33"/><text x="60" y="501" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="start">SAC sobre ambos conceptos</text><text x="60" y="523" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start"># 1/12 de lo anterior</text><text x="740" y="512" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">$167.742</text><text x="44" y="580" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#34D399" text-anchor="start">total</text><text x="740" y="580" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#34D399" text-anchor="end">$2.180.645</text><rect x="44" y="626" width="229.33333333333334" height="64" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="1.5"/><text x="158.66666666666669" y="652" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">período de prueba</text><text x="158.66666666666669" y="676" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="700" fill="#E5E7EB" text-anchor="middle">15 días</text><rect x="285.33333333333337" y="626" width="229.33333333333334" height="64" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="1.5"/><text x="400.00000000000006" y="652" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">hasta 5 años</text><text x="400.00000000000006" y="676" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="700" fill="#E5E7EB" text-anchor="middle">1 mes</text><rect x="526.6666666666667" y="626" width="229.33333333333334" height="64" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="1.5"/><text x="641.3333333333334" y="652" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">más de 5 años</text><text x="641.3333333333334" y="676" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="700" fill="#E5E7EB" text-anchor="middle">2 meses</text><text x="44" y="722" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// art. 231 a 233 de la LCT. Además corresponde la indemnización por</text><text x="44" y="746.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">antigüedad, que se calcula aparte.</text></g><text x="44" y="849" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/preaviso-laboral</text></svg>