dle">se cobra antes del 30 de junio</text><text x="578" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F472B6" text-anchor="middle">se cobra antes del 24 de diciembre</text><rect x="44" y="340" width="712" height="84" rx="14" fill="#162036" stroke="#24324F" stroke-width="1.5"/><text x="400" y="378" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#F9FAFB" text-anchor="middle">Aguinaldo = total nominal del semestre ÷ 12</text><text x="400" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="middle">incluye horas extra, comisiones y otros pagos nominales</text><rect x="44" y="454" width="348" height="110" rx="14" fill="#162036"/><text x="62" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">Sueldo fijo de $ 50.000</text><text x="62" y="512" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">6 × 50.000 ÷ 12</text><text x="62" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="start">$ 25.000</text><rect x="408" y="454" width="348" height="110" rx="14" fill="#162036"/><text x="426" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F9FAFB" text-anchor="start">Entraste en abril (3 meses)</text><text x="426" y="512" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">3 × 50.000 ÷ 12</text><text x="426" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="start">$ 12.500</text></g><text x="44" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/aguinaldo-uruguay</text></svg>