 height="54" rx="0" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="273" y="396" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="middle">L</text><rect x="246" y="412" width="54" height="54" rx="0" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="273" y="450" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="middle">A</text><text x="408" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Horizontal</text><text x="408" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">1. Lo lees antes de dormir</text><text x="408" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Vertical</text><text x="408" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">1. Escribe y se borra</text><text x="408" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">2. Sirve para trazar rectas</text><rect x="408" y="380" width="348" height="88" rx="12" fill="#CCFBF1" stroke="#5EEAD4" stroke-width="2"/><text x="422" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F766E" text-anchor="start">Casillas de cruce</text><text x="422" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E3A8A" text-anchor="start">Una letra que comparten</text><text x="422" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E3A8A" text-anchor="start">dos palabras.</text><text x="44" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">El generador busca letras en común entre tus palabras para</text><text x="44" y="520.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">cruzarlas. Cuantas más vocales repetidas tengan, más fácil es</text><text x="44" y="544.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">conectarlas.</text></g><text x="44" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/generador-de-crucigramas</text></svg>