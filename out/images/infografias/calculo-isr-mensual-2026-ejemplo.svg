<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1037" width="800" height="1037">
<rect width="800" height="1037" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo se calcula el ISR mensual de un</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">sueldo en 2026</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ejemplo: sueldo mensual gravable de $15,000</text>
<g transform="translate(0,67)"><rect x="40" y="190" width="720" height="82" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="74" cy="231" r="18" fill="#7C3AED"/><text x="74" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="106" y="224" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Busca tu renglón en la tarifa mensual</text><text x="106" y="254" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">De $14,644.65 a $17,533.64: cuota fija $1,339.14 y 17.92 %</text><path d="M400,274 v18 M392,284 L400,292 L408,284" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="296" width="720" height="82" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="74" cy="337" r="18" fill="#7C3AED"/><text x="74" y="344" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="106" y="330" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Resta el límite inferior</text><text x="106" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">$15,000.00 − $14,644.65 = $355.35</text><path d="M400,380 v18 M392,390 L400,398 L408,390" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="402" width="720" height="82" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="74" cy="443" r="18" fill="#7C3AED"/><text x="74" y="450" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="106" y="436" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Aplica el porcentaje al excedente</text><text x="106" y="466" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">$355.35 × 17.92 % = $63.68</text><path d="M400,486 v18 M392,496 L400,504 L408,496" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="508" width="720" height="82" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="74" cy="549" r="18" fill="#7C3AED"/><text x="74" y="556" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="106" y="542" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Suma la cuota fija</text><text x="106" y="572" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">$63.68 + $1,339.14 = $1,402.82</text><path d="M400,592 v18 M392,602 L400,610 L408,602" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="614" width="720" height="82" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="74" cy="655" r="18" fill="#7C3AED"/><text x="74" y="662" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="106" y="648" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Resta el subsidio al empleo</text><text x="106" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">No aplica: el sueldo supera $11,492.66</text><rect x="40" y="720" width="720" height="96" rx="16" fill="#334155"/><text x="64" y="762" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1" text-anchor="start">ISR retenido en el mes</text><text x="64" y="798" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">$1,402.82</text><text x="736" y="762" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1" text-anchor="end">Tasa efectiva</text><text x="736" y="798" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="end">9.35 %</text><text x="40" y="860" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Tarifa del artículo 96 de la LISR publicada en el Anexo 8 de la</text><text x="40" y="885.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Resolución Miscelánea Fiscal 2026.</text></g>
<line x1="40" y1="985" x2="760" y2="985" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-isr</text>
</svg>