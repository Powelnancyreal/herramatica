ans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">cambia de horario</text><text x="404" y="501" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#FCD34D" text-anchor="middle">19:00</text><text x="524" y="501" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="middle">20:00</text><text x="44" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">Misma reunión a las 12:00 de Ciudad de México en enero y en julio.</text><text x="44" y="574.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">México no cambia de horario desde 2022 (salvo algunas zonas</text><text x="44" y="598.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">fronterizas); Chile y España sí, en fechas distintas.</text></g><text x="44" y="701" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/conversor-zona-horaria</text></svg>