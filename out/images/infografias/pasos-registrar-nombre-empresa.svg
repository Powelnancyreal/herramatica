<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 826" width="800" height="826"><rect width="800" height="826" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#0F766E"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Del nombre generado al nombre registrado</text><g transform="translate(0,27)"><line x1="70" y1="236" x2="70" y2="266" stroke="#0F766E" stroke-width="3"/><circle cx="70" cy="210" r="26" fill="#0F766E"/><text x="70" y="218" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="114" y="184" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="211" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Lista corta</text><text x="132" y="235" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">5 a 10 candidatos de 1 a 3 palabras, fáciles de decir y escribir.</text><line x1="70" y1="318" x2="70" y2="348" stroke="#0F766E" stroke-width="3"/><circle cx="70" cy="292" r="26" fill="#0F766E"/><text x="70" y="300" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="114" y="266" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="293" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Busca en internet</text><text x="132" y="317" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Que no exista un negocio igual en tu ciudad o sector.</text><line x1="70" y1="400" x2="70" y2="430" stroke="#0F766E" stroke-width="3"/><circle cx="70" cy="374" r="26" fill="#0F766E"/><text x="70" y="382" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="114" y="348" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="375" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Dominio y redes</text><text x="132" y="399" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Comprueba si están libres el .com, el .com.mx y el @usuario.</text><line x1="70" y1="482" x2="70" y2="512" stroke="#0F766E" stroke-width="3"/><circle cx="70" cy="456" r="26" fill="#0F766E"/><text x="70" y="464" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="114" y="430" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="457" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Marcas registradas</text><text x="132" y="481" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Busca en Marcia, la base de datos del IMPI.</text><line x1="70" y1="564" x2="70" y2="594" stroke="#0F766E" stroke-width="3"/><circle cx="70" cy="538" r="26" fill="#0F766E"/><text x="70" y="546" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="114" y="512" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="539" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Denominación social</text><text x="132" y="563" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Si vas a constituir sociedad, pide la autorización a la Secretaría de Economía.</text><circle cx="70" cy="620" r="26" fill="#0F766E"/><text x="70" y="628" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="114" y="594" width="642" height="64" rx="12" fill="#F0FDFA"/><text x="132" y="621" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">Registra la marca</text><text x="132" y="645" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Solicitud ante el IMPI en la clase de tus productos o servicios.</text><text x="44" y="686" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Un nombre libre en el generador no está automáticamente libre para</text><text x="44" y="710.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">usarlo: los pasos 3 a 5 son los que lo confirman.</text></g><text x="44" y="800" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/generador-nombres-empresa</text></svg>