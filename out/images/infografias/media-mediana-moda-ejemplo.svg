<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 735" width="800" height="735"><rect width="800" height="735" fill="#1F3A2E"/><rect x="44" y="677" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Media, mediana y moda con las mismas</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">notas</text><g transform="translate(0,44)"><text x="44" y="192" font-family="Segoe Print, Comic Sans MS, cursive" font-size="30" font-weight="400" fill="#F1F5EE" text-anchor="start">Notas: 8 · 6 · 9 · 6 · 10 · 7</text><rect x="44" y="226" width="712" height="100" rx="14" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="264" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="start">Media</text><text x="64" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F1F5EE" text-anchor="start">(8+6+9+6+10+7) ÷ 6</text><text x="736" y="280" font-family="Segoe Print, Comic Sans MS, cursive" font-size="40" font-weight="700" fill="#F1F5EE" text-anchor="end">7,67</text><text x="736" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="end">el promedio de siempre</text><rect x="44" y="338" width="712" height="100" rx="14" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="376" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="start">Mediana</text><text x="64" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F1F5EE" text-anchor="start">ordenadas: 6 6 7 8 9 10 → (7+8) ÷ 2</text><text x="736" y="392" font-family="Segoe Print, Comic Sans MS, cursive" font-size="40" font-weight="700" fill="#F1F5EE" text-anchor="end">7,5</text><text x="736" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="end">el valor del centro</text><rect x="44" y="450" width="712" height="100" rx="14" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="488" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="start">Moda</text><text x="64" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F1F5EE" text-anchor="start">el que más se repite</text><text x="736" y="504" font-family="Segoe Print, Comic Sans MS, cursive" font-size="40" font-weight="700" fill="#F1F5EE" text-anchor="end">6</text><text x="736" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#B7C7B9" text-anchor="end">aparece dos veces</text><text x="44" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Cuando hay un valor extremo, como un 0 por un examen no presentado,</text><text x="44" y="606.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">la mediana representa mejor el grupo que la media.</text></g><text x="44" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-promedio</text></svg>