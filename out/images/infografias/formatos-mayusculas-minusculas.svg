<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Los 5 formatos de mayúsculas y cuándo</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">usar cada uno</text>
<g transform="translate(0,38)"><rect x="40" y="176" width="720" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">MAYÚSCULAS</text><text x="60" y="238" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">EL ARTE DE ESCRIBIR BIEN EN INTERNET</text><text x="60" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Avisos y siglas. En mensajes se lee como gritar.</text><rect x="40" y="284" width="720" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">minúsculas</text><text x="60" y="346" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">el arte de escribir bien en internet</text><text x="60" y="370" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Etiquetas, usuarios y direcciones web.</text><rect x="40" y="392" width="720" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="422" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">Tipo título</text><text x="60" y="454" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">El Arte de Escribir Bien en Internet</text><text x="60" y="478" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Títulos al estilo inglés, sin artículos ni preposiciones.</text><rect x="40" y="500" width="720" height="96" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="60" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="start">Tipo oración</text><text x="60" y="562" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">El arte de escribir bien en internet</text><text x="60" y="586" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Lo correcto en español para títulos y textos.</text><rect x="40" y="608" width="720" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">aLtErNaDo</text><text x="60" y="670" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">eL ArTe dE EsCrIbIr bIeN En iNtErNeT</text><text x="60" y="694" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Memes y tono burlón.</text><text x="40" y="732" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">La RAE recomienda en títulos de libros y artículos solo la mayúscula</text><text x="40" y="757.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">inicial y la de los nombres propios: «Cien años de soledad».</text></g>
