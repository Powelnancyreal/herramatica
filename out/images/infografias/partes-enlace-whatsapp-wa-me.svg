<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" width="800" height="810"><rect width="800" height="810" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#128C7E"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Las partes de un enlace de WhatsApp</text><g transform="translate(0,27)"><rect x="44" y="186" width="712" height="72" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="62" y="232" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#6B7280" text-anchor="start">https://wa.me/</text><text x="210.4" y="232" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#128C7E" text-anchor="start">573001234567</text><text x="337.6" y="232" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#B45309" text-anchor="start">?text=Hola%2C%20quiero%20info</text><rect x="44" y="290" width="14" height="52" rx="4" fill="#6B7280"/><text x="72" y="312" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#6B7280" text-anchor="start">https://wa.me/</text><text x="72" y="336" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Dirección corta oficial de WhatsApp</text><rect x="44" y="360" width="14" height="52" rx="4" fill="#128C7E"/><text x="72" y="382" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#128C7E" text-anchor="start">573001234567</text><text x="72" y="406" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Número con código de país, sin +, espacios ni guiones</text><rect x="44" y="430" width="14" height="52" rx="4" fill="#B45309"/><text x="72" y="452" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">text=Hola%2C%20quiero%20info</text><text x="72" y="476" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Mensaje que aparece ya escrito (opcional)</text><text x="44" y="520" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Códigos de país más usados</text><rect x="44" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="100" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">52</text><text x="100" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">México</text><rect x="164" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="220" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">57</text><text x="220" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Colombia</text><rect x="284" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="340" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">54 9</text><text x="340" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Argentina</text><rect x="404" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="460" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">56</text><text x="460" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Chile</text><rect x="524" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="580" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">51</text><text x="580" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Perú</text><rect x="644" y="538" width="112" height="74" rx="12" fill="#ECFDF5"/><text x="700" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#128C7E" text-anchor="middle">34</text><text x="700" y="598" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">España</text><text x="44" y="650" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">En Argentina los móviles llevan un 9 entre el 54 y el código de</text><text x="44" y="674.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">área. Los espacios del mensaje se escriben como %20, pero el</text><text x="44" y="698.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">generador lo hace por ti.</text></g><text x="44" y="784" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/generador-de-link-de-whatsapp</text></svg>