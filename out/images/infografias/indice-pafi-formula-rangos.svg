<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 844" width="800" height="844"><rect width="800" height="844" fill="#0B1220"/><rect x="44" y="786" width="712" height="1.5" fill="#22325A"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Índice PaFi: fórmula e interpretación</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#38BDF8" text-anchor="start">PaFi = PaO₂ ÷ FiO₂</text><text x="44" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#F9FAFB" text-anchor="start">PaO₂ de 80 mmHg con FiO₂ del 40 %:   80 ÷ 0,40 = 200</text><rect x="44" y="270" width="712" height="50" rx="10" fill="#14213D"/><rect x="44" y="270" width="12" height="50" rx="4" fill="#22C55E"/><text x="74" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#22C55E" text-anchor="start">&gt; 400</text><text x="738" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="end">Oxigenación normal</text><rect x="44" y="328" width="712" height="50" rx="10" fill="#14213D"/><rect x="44" y="328" width="12" height="50" rx="4" fill="#A3E635"/><text x="74" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#A3E635" text-anchor="start">301 – 400</text><text x="738" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="end">Alteración leve</text><rect x="44" y="386" width="712" height="50" rx="10" fill="#14213D"/><rect x="44" y="386" width="12" height="50" rx="4" fill="#FACC15"/><text x="74" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#FACC15" text-anchor="start">201 – 300</text><text x="738" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="end">Alteración moderada</text><rect x="44" y="444" width="712" height="50" rx="10" fill="#14213D"/><rect x="44" y="444" width="12" height="50" rx="4" fill="#F97316"/><text x="74" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F97316" text-anchor="start">101 – 200</text><text x="738" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="end">Alteración severa</text><rect x="44" y="502" width="712" height="50" rx="10" fill="#14213D"/><rect x="44" y="502" width="12" height="50" rx="4" fill="#EF4444"/><text x="74" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#EF4444" text-anchor="start">≤ 100</text><text x="738" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="end">Alteración muy severa</text><text x="738" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#38BDF8" text-anchor="end">← 200</text><rect x="44" y="584" width="348" height="84" rx="14" fill="#14213D"/><text x="62" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Aire ambiente</text><text x="62" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">FiO₂ = 0,21</text><rect x="408" y="584" width="348" height="84" rx="14" fill="#14213D"/><text x="426" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Escribe la FiO₂</text><text x="426" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">en decimal o en %</text><text x="44" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Herramienta de apoyo para profesionales sanitarios. El diagnóstico</text><text x="44" y="732.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">de SDRA requiere además la clínica, la imagen y el contexto del</text><text x="44" y="756.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">paciente.</text></g><text x="44" y="818" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/calculadora-pafi</text></svg>