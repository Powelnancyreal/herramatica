<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 824" width="800" height="824"><rect width="800" height="824" fill="#0B1020"/><rect x="44" y="766" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#F472B6" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">De libras fuerza a newtons</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#34D399" text-anchor="start">$ 1 lbf → N</text><text x="44" y="224" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="start">1 lbf = 0,45359237 kg × 9,80665 m/s² = 4,448 N</text><rect x="44" y="254" width="712" height="42" rx="8" fill="#111A33"/><text x="60" y="282" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F472B6" text-anchor="start">1 lbf</text><text x="740" y="282" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">4,448 N</text><rect x="44" y="304" width="712" height="42" rx="8" fill="#111A33"/><text x="60" y="332" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F472B6" text-anchor="start">10 lbf</text><text x="740" y="332" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">44,48 N</text><rect x="44" y="354" width="712" height="42" rx="8" fill="#111A33"/><text x="60" y="382" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F472B6" text-anchor="start">100 lbf</text><text x="740" y="382" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">444,8 N</text><rect x="44" y="404" width="712" height="42" rx="8" fill="#111A33"/><text x="60" y="432" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F472B6" text-anchor="start">224,8 lbf</text><text x="740" y="432" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">1 kN</text><rect x="44" y="454" width="712" height="42" rx="8" fill="#111A33"/><text x="60" y="482" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F472B6" text-anchor="start">1 N</text><text x="740" y="482" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">0,2248 lbf</text><text x="44" y="534" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#34D399" text-anchor="start"># lb (masa) no es lo mismo que lbf (fuerza)</text><rect x="44" y="552" width="348" height="130" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="1.5"/><text x="60" y="588" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#F472B6" text-anchor="start">lb</text><text x="60" y="618" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E5E7EB" text-anchor="start">cuánta materia hay</text><text x="60" y="640" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">se mide en una báscula</text><text x="60" y="666" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start">1 lb = 0,4536 kg</text><rect x="408" y="552" width="348" height="130" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="1.5"/><text x="424" y="588" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#F472B6" text-anchor="start">lbf</text><text x="424" y="618" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E5E7EB" text-anchor="start">con cuánta fuerza empuja o tira</text><text x="424" y="640" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">peso de 1 lb en la gravedad estándar</text><text x="424" y="666" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start">1 lbf = 4,448 N</text><text x="44" y="712" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// en las especificaciones de un torque o una cuerda, «lb» suele</text><text x="44" y="736.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">significar lbf: conviértelo a newtons con 4,448.</text></g><text x="44" y="798" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/convertidor-libras-a-newtons</text></svg>