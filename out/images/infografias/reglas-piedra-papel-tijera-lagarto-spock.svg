"/><line x1="365.67960777017606" y1="367.4671109562589" x2="138.32039222982388" y2="367.467110956259" stroke="#93C5FD" stroke-width="3" marker-end="url(#fl177)"/><line x1="125.53517397107146" y1="394.5052325617127" x2="309.472643170973" y2="528.1436264291174" stroke="#93C5FD" stroke-width="3" marker-end="url(#fl177)"/><line x1="335.70871114847284" y1="513.7842892941641" x2="265.45084971874735" y2="297.5528258147577" stroke="#93C5FD" stroke-width="3" marker-end="url(#fl177)"/><circle cx="250" cy="250" r="44" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="250" y="257" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">Tijera</text><circle cx="411.67960777017606" cy="367.4671109562589" r="44" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="411.67960777017606" y="374.4671109562589" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">Papel</text><circle cx="349.9234928897204" cy="557.5328890437411" r="44" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="349.9234928897204" y="564.5328890437411" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">Piedra</text><circle cx="150.07650711027958" cy="557.5328890437411" r="44" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="150.07650711027958" y="564.5328890437411" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">Lagarto</text><circle cx="88.32039222982388" cy="367.467110956259" r="44" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="88.32039222982388" y="374.467110956259" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">Spock</text><text x="470" y="196" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#FDE68A" text-anchor="start">Quién gana a quién</text><text x="470" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Tijera corta papel</text><text x="470" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Papel envuelve piedra</text><text x="470" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Piedra aplasta lagarto</text><text x="470" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Lagarto envenena a Spock</text><text x="470" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Spock rompe tijera</text><text x="470" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Tijera decapita lagarto</text><text x="470" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Lagarto se come el papel</text><text x="470" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Papel desautoriza a Spock</text><text x="470" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Spock vaporiza piedra</text><text x="470" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="start">Piedra aplasta tijera</text><text x="44" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Con cinco opciones, cada una gana a dos y pierde contra dos: los</text><text x="44" y="684.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">empates bajan de 1 de cada 3 rondas a 1 de cada 5.</text></g><text x="44" y="787" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/piedra-papel-tijera</text></svg>