<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 804" width="800" height="804"><rect width="800" height="804" fill="#FFF7FB"/><rect x="44" y="746" width="712" height="1.5" fill="#FBCFE8"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#DB2777" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#500724" text-anchor="start">Cómo sumar, multiplicar y dividir</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#500724" text-anchor="start">fracciones</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#500724" text-anchor="start">2/3 + 5/6: primero, el mismo denominador</text><text x="44" y="240" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#500724" text-anchor="start">2/3</text><rect x="204" y="206" width="180" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="388" y="206" width="180" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="572" y="206" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="2"/><text x="44" y="304" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#500724" text-anchor="start">= 4/6</text><rect x="204" y="270" width="88" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="296" y="270" width="88" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="388" y="270" width="88" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="480" y="270" width="88" height="52" rx="6" fill="#F472B6" stroke="#FBCFE8" stroke-width="2"/><rect x="572" y="270" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="2"/><rect x="664" y="270" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="2"/><text x="44" y="368" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#500724" text-anchor="start">+ 5/6</text><rect x="204" y="334" width="88" height="52" rx="6" fill="#A855F7" stroke="#FBCFE8" stroke-width="2"/><rect x="296" y="334" width="88" height="52" rx="6" fill="#A855F7" stroke="#FBCFE8" stroke-width="2"/><rect x="388" y="334" width="88" height="52" rx="6" fill="#A855F7" stroke="#FBCFE8" stroke-width="2"/><rect x="480" y="334" width="88" height="52" rx="6" fill="#A855F7" stroke="#FBCFE8" stroke-width="2"/><rect x="572" y="334" width="88" height="52" rx="6" fill="#A855F7" stroke="#FBCFE8" stroke-width="2"/><rect x="664" y="334" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="2"/><text x="44" y="430" font-family="Verdana, Arial, sans-serif" font-size="30" font-weight="700" fill="#DB2777" text-anchor="start">4/6 + 5/6 = 9/6 = 3/2 = 1 ½</text><rect x="44" y="480" width="712" height="60" rx="12" fill="#FCE7F3"/><text x="60" y="506" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#DB2777" text-anchor="start">Sumar y restar</text><text x="60" y="530" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#500724" text-anchor="start">Igualar denominadores con el MCM y operar los numeradores.</text><rect x="44" y="550" width="712" height="60" rx="12" fill="#FCE7F3"/><text x="60" y="576" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#DB2777" text-anchor="start">Multiplicar</text><text x="60" y="600" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#500724" text-anchor="start">Numerador por numerador y denominador por denominador: 2/3 × 3/4 = 6/12 = 1/2.</text><rect x="44" y="620" width="712" height="60" rx="12" fill="#FCE7F3"/><text x="60" y="646" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#DB2777" text-anchor="start">Dividir</text><text x="60" y="670" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#500724" text-anchor="start">Multiplicar por la fracción invertida: 2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6.</text></g><text x="44" y="778" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/calculadora-fracciones</text></svg>