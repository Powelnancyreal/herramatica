<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 919" width="800" height="919"><rect width="800" height="919" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#C2410C"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">De tu metabolismo basal a las calorías</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">para bajar de peso</text><g transform="translate(0,68)"><text x="44" y="180" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Mujer de 30 años, 65 kg, 1,65 m, ejercicio 3-5 días por semana</text><rect x="44" y="204" width="712" height="104" rx="18" fill="#FFF7ED"/><text x="66" y="242" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start">Metabolismo basal (BMR)</text><text x="66" y="276" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">Mifflin-St Jeor: 10 × 65 + 6,25 × 165 − 5 × 30 − 161</text><text x="734" y="266" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#C2410C" text-anchor="end">1.370 kcal</text><path d="M400,312 v14 M392,318 L400,326 L408,318" fill="none" stroke="#C2410C" stroke-width="3"/><rect x="44" y="332" width="712" height="104" rx="18" fill="#FFF7ED"/><text x="66" y="370" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start">Gasto diario (TDEE)</text><text x="66" y="404" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">BMR × 1,55 por actividad moderada</text><text x="734" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#C2410C" text-anchor="end">2.124 kcal</text><path d="M400,440 v14 M392,446 L400,454 L408,446" fill="none" stroke="#C2410C" stroke-width="3"/><rect x="44" y="460" width="712" height="104" rx="18" fill="#C2410C"/><text x="66" y="498" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="start">Objetivo: bajar de peso</text><text x="66" y="532" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFEDD5" text-anchor="start">TDEE − 20 %</text><text x="734" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFF" text-anchor="end">1.699 kcal</text><rect x="44" y="598" width="136" height="74" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/><text x="112" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">1,2</text><text x="112" y="656" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Sedentario</text><rect x="188" y="598" width="136" height="74" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/><text x="256" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">1,375</text><text x="256" y="656" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Ligero</text><rect x="332" y="598" width="136" height="74" rx="12" fill="#FED7AA" stroke="#FDBA74" stroke-width="1.5"/><text x="400" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">1,55</text><text x="400" y="656" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Moderado</text><rect x="476" y="598" width="136" height="74" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/><text x="544" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">1,725</text><text x="544" y="656" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Activo</text><rect x="620" y="598" width="136" height="74" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/><text x="688" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">1,9</text><text x="688" y="656" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Muy activo</text><text x="44" y="714" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Un déficit del 20 % suele dar una pérdida gradual y sostenible. No</text><text x="44" y="738.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">bajes de 1.200 kcal (mujeres) o 1.500 kcal (hombres) sin supervisión</text><text x="44" y="762.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">profesional.</text></g><text x="44" y="893" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-calorias</text></svg>