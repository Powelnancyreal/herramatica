<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 796" width="800" height="796"><rect width="800" height="796" fill="#111827"/><rect x="44" y="738" width="712" height="1.5" fill="#374151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C084FC" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Estilos de letra para Instagram y cómo</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">funcionan</text><g transform="translate(0,44)"><rect x="44" y="180" width="348" height="104" rx="16" fill="#1F2937"/><text x="64" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Negrita</text><text x="64" y="260" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">𝐇𝐨𝐥𝐚</text><rect x="408" y="180" width="348" height="104" rx="16" fill="#1F2937"/><text x="428" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Cursiva</text><text x="428" y="260" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">𝐻𝑜𝑙𝑎</text><rect x="44" y="298" width="348" height="104" rx="16" fill="#1F2937"/><text x="64" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Script</text><text x="64" y="378" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">𝓗𝓸𝓵𝓪</text><rect x="408" y="298" width="348" height="104" rx="16" fill="#1F2937"/><text x="428" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Gótico</text><text x="428" y="378" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">𝕳𝖔𝖑𝖆</text><rect x="44" y="416" width="348" height="104" rx="16" fill="#1F2937"/><text x="64" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Doble rayado</text><text x="64" y="496" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">ℍ𝕠𝕝𝕒</text><rect x="408" y="416" width="348" height="104" rx="16" fill="#1F2937"/><text x="428" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Monoespaciado</text><text x="428" y="496" font-family="Segoe UI Symbol, Cambria Math, sans-serif" font-size="40" font-weight="400" fill="#FFFFFF" text-anchor="start">𝙷𝚘𝚕𝚊</text><rect x="44" y="550" width="712" height="118" rx="16" fill="#2E1065"/><text x="66" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#C084FC" text-anchor="start">No son fuentes, son símbolos</text><text x="66" y="622" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Cada letra es un carácter Unicode distinto. Por eso se copian</text><text x="66" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">a cualquier app, pero Instagram no las encuentra al buscar.</text></g><text x="44" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/tipografia-para-instagram</text></svg>