<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 766" width="800" height="766"><rect width="800" height="766" fill="#111317"/><rect x="44" y="708" width="712" height="1.5" fill="#2D323C"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">AFP u ONP: en qué se diferencian</text><g transform="translate(0,3)"><rect x="44" y="180" width="346" height="318" rx="16" fill="#1C1F26" stroke="#60A5FA" stroke-width="2"/><text x="64" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="start">ONP</text><text x="64" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Aporte: 13 % del sueldo</text><text x="64" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Fondo común del Estado</text><text x="64" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Pensión según años aportados</text><text x="64" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Mínimo 10 años para cobrar</text><text x="64" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">No se hereda el fondo</text><text x="64" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Pensión máxima: S/ 1,000</text><rect x="410" y="180" width="346" height="318" rx="16" fill="#1C1F26" stroke="#F59E0B" stroke-width="2"/><text x="430" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="start">AFP</text><text x="430" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Aporte: 10 % + comisión + seguro</text><text x="430" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Cuenta individual a tu nombre</text><text x="430" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Pensión según lo ahorrado</text><text x="430" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Sin mínimo de años</text><text x="430" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">El saldo se hereda</text><text x="430" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9FAFB" text-anchor="start">Depende de la rentabilidad</text><text x="44" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">Pensión de la ONP según los años de aporte</text><rect x="44" y="550" width="169" height="72" rx="12" fill="#1C1F26" stroke="#2D323C" stroke-width="1.5"/><text x="128.5" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="middle">menos de 10 años</text><text x="128.5" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#60A5FA" text-anchor="middle">S/ 0</text><rect x="225" y="550" width="169" height="72" rx="12" fill="#1C1F26" stroke="#2D323C" stroke-width="1.5"/><text x="309.5" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="middle">10 a 14 años</text><text x="309.5" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#60A5FA" text-anchor="middle">S/ 300</text><rect x="406" y="550" width="169" height="72" rx="12" fill="#1C1F26" stroke="#2D323C" stroke-width="1.5"/><text x="490.5" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="middle">15 a 19 años</text><text x="490.5" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#60A5FA" text-anchor="middle">S/ 400</text><rect x="587" y="550" width="169" height="72" rx="12" fill="#1C1F26" stroke="#2D323C" stroke-width="1.5"/><text x="671.5" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="middle">20 o más años</text><text x="671.5" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#60A5FA" text-anchor="middle">S/ 600 a 1,000</text><text x="44" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Montos de la Ley 32123. La comisión y el seguro de cada AFP varían;</text><text x="44" y="678.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">compara antes de elegir.</text></g><text x="44" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/afp-vs-onp</text></svg>