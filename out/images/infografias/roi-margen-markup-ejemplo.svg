<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 775" width="800" height="775"><rect width="800" height="775" fill="#06140D"/><rect x="44" y="717" width="712" height="1.5" fill="#1F4D33"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">ROI, margen y markup explicados con un</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">ejemplo</text><g transform="translate(0,44)"><rect x="44" y="180" width="712" height="100" rx="16" fill="#0F2A1B"/><text x="66" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#4ADE80" text-anchor="start">ROI = (ganancia − inversión) ÷ inversión</text><text x="66" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">Inviertes $10,000 y recuperas $13,000:  3,000 ÷ 10,000 = 30 %</text><text x="44" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB" text-anchor="start">Margen y markup: el mismo producto, dos porcentajes</text><rect x="44" y="350" width="427.2" height="56" rx="10" fill="#334155"/><text x="60" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Costo $60</text><rect x="471.2" y="350" width="284.8" height="56" rx="10" fill="#16A34A"/><text x="487.2" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Ganancia $40</text><text x="756" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="end">Precio de venta $100</text><rect x="44" y="466" width="348" height="116" rx="16" fill="#0F2A1B"/><text x="64" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Margen</text><text x="64" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#4ADE80" text-anchor="start">40 %</text><text x="64" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">ganancia ÷ precio</text><rect x="408" y="466" width="348" height="116" rx="16" fill="#0F2A1B"/><text x="428" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Markup</text><text x="428" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#FACC15" text-anchor="start">66,7 %</text><text x="428" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">ganancia ÷ costo</text><text x="44" y="622" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Para obtener un margen del 40 % no basta con sumar un 40 % al costo:</text><text x="44" y="646.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">el precio es costo ÷ (1 − 0,40) = $100.</text></g><text x="44" y="749" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/calculadora-roi</text></svg>