<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 723" width="800" height="723"><rect width="800" height="723" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="723" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="723" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo se calcula la nota de la PAU</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start">Nota de acceso (máximo 10)</text><rect x="44" y="210" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="194" y="246" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">0,6 × Bachillerato</text><text x="194" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">media de 1.º y 2.º</text><text x="374" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="middle">+</text><rect x="404" y="210" width="352" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="580" y="246" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">0,4 × Fase general</text><text x="580" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">debe ser 4 o más</text><text x="44" y="350" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start">Nota de admisión (máximo 14)</text><rect x="44" y="370" width="220" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="154" y="406" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">Acceso</text><text x="154" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">hasta 10</text><text x="289" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="middle">+</text><rect x="314" y="370" width="442" height="84" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/><text x="535" y="406" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">2 mejores específicas × ponderación</text><text x="535" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">solo cuentan si sacas 5 o más · ponderación 0,1 o 0,2</text><rect x="44" y="500" width="712" height="150" rx="14" fill="#FEF9C3"/><text x="64" y="536" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">Ejemplo</text><text x="64" y="570" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Bachillerato 8 y fase general 7 → 0,6 × 8 + 0,4 × 7 = 7,6</text><text x="64" y="600" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Específicas 9 y 8 con ponderación 0,2 → 1,8 + 1,6 = 3,4</text><text x="64" y="632" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="start">Nota de admisión: 7,6 + 3,4 = 11,0</text></g><text x="44" y="697" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/nota-de-corte</text></svg>