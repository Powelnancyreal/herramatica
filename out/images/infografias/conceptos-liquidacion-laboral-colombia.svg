<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 883" width="800" height="883"><rect width="800" height="883" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#A16207"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Qué incluye una liquidación laboral en</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Colombia</text><g transform="translate(0,68)"><text x="44" y="180" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Salario $2.000.000 + auxilio de transporte $249.095 · un año completo</text><rect x="44" y="206" width="712" height="78" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><rect x="44" y="206" width="12" height="78" rx="4" fill="#CA8A04"/><text x="72" y="238" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Cesantías</text><text x="72" y="264" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">(salario + auxilio) × días ÷ 360</text><text x="738" y="254" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#CA8A04" text-anchor="end">$2.249.095</text><rect x="44" y="296" width="712" height="78" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><rect x="44" y="296" width="12" height="78" rx="4" fill="#EAB308"/><text x="72" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Intereses sobre cesantías</text><text x="72" y="354" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">cesantías × días × 12 % ÷ 360</text><text x="738" y="344" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#A16207" text-anchor="end">$269.891</text><rect x="44" y="386" width="712" height="78" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><rect x="44" y="386" width="12" height="78" rx="4" fill="#2563EB"/><text x="72" y="418" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Prima de servicios</text><text x="72" y="444" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">(salario + auxilio) × días ÷ 360, en dos pagos</text><text x="738" y="434" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="end">$2.249.095</text><rect x="44" y="476" width="712" height="78" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><rect x="44" y="476" width="12" height="78" rx="4" fill="#DC2626"/><text x="72" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Vacaciones (si no las tomaste)</text><text x="72" y="534" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">salario × días ÷ 720, sin auxilio</text><text x="738" y="524" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#DC2626" text-anchor="end">$1.000.000</text><rect x="44" y="572" width="712" height="66" rx="14" fill="#A16207"/><text x="64" y="614" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="400" fill="#FEF9C3" text-anchor="start">Total aproximado</text><text x="736" y="616" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="end">$5.768.081</text><text x="44" y="678" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Si te despidieron sin justa causa, además puede corresponderte una</text><text x="44" y="702.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">indemnización. El auxilio de transporte solo aplica si ganas hasta 2</text><text x="44" y="726.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">salarios mínimos (SMMLV 2026: $1.750.905).</text></g><text x="44" y="857" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-liquidacion-laboral-colombia</text></svg>