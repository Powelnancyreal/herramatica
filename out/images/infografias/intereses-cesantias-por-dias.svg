<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 755" width="800" height="755"><rect width="800" height="755" fill="#F5FFFD"/><rect x="44" y="697" width="712" height="1.5" fill="#99F6E4"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#042F2E" text-anchor="start">Cuánto son los intereses de las</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#042F2E" text-anchor="start">cesantías</text><g transform="translate(0,44)"><rect x="44" y="180" width="712" height="96" rx="16" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="400" y="222" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#042F2E" text-anchor="middle">Intereses = cesantías × días × 12 % ÷ 360</text><text x="400" y="254" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="400" fill="#7E6A8A" text-anchor="middle">se pagan directo al trabajador, a más tardar el 31 de enero</text><text x="44" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#7E6A8A" text-anchor="start">Ingreso</text><text x="294" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#7E6A8A" text-anchor="start">Días</text><text x="444" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#7E6A8A" text-anchor="start">Cesantías</text><text x="756" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#7E6A8A" text-anchor="end">Intereses</text><rect x="36" y="334" width="728" height="46" rx="10" fill="#CCFBF1"/><text x="44" y="364" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">Año completo</text><text x="294" y="364" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">360 días</text><text x="444" y="364" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">$2.000.000</text><text x="756" y="364" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="end">$240.000</text><rect x="36" y="390" width="728" height="46" rx="10" fill="#FFFFFF"/><text x="44" y="420" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">Desde el 1 de abril</text><text x="294" y="420" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">270 días</text><text x="444" y="420" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">$1.500.000</text><text x="756" y="420" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="end">$135.000</text><rect x="36" y="446" width="728" height="46" rx="10" fill="#CCFBF1"/><text x="44" y="476" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">Desde el 1 de julio</text><text x="294" y="476" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">180 días</text><text x="444" y="476" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">$1.000.000</text><text x="756" y="476" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="end">$60.000</text><rect x="36" y="502" width="728" height="46" rx="10" fill="#FFFFFF"/><text x="44" y="532" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">Desde el 1 de octubre</text><text x="294" y="532" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">90 días</text><text x="444" y="532" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#042F2E" text-anchor="start">$500.000</text><text x="756" y="532" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="end">$15.000</text><text x="44" y="578" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Base: salario mínimo de 2026 más auxilio de transporte ($2.000.000).</text><text x="44" y="602.3" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Con menos de un año, los intereses bajan dos veces: menos cesantías</text><text x="44" y="626.6" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">y menos días.</text></g><text x="44" y="729" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/intereses-cesantias</text></svg>