<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 774" width="800" height="774"><rect width="800" height="774" fill="#08130F"/><rect x="44" y="716" width="712" height="1.5" fill="#1C3A2E"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Cómo se reajusta la UF</text><g transform="translate(0,3)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">La UF sube (o baja) un poco cada día según el IPC</text><line x1="64" y1="420" x2="736" y2="420" stroke="#1C3A2E" stroke-width="2"/><line x1="64" y1="400" x2="232" y2="348" stroke="#34D399" stroke-width="4"/><line x1="232" y1="220" x2="232" y2="420" stroke="#1C3A2E" stroke-width="1" stroke-dasharray="4 4"/><text x="148" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="middle">10 jul → 9 ago</text><text x="148" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34D399" text-anchor="middle">IPC de junio: 0,4 %</text><line x1="232" y1="348" x2="400" y2="309" stroke="#34D399" stroke-width="4"/><line x1="400" y1="220" x2="400" y2="420" stroke="#1C3A2E" stroke-width="1" stroke-dasharray="4 4"/><text x="316" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="middle">10 ago → 9 sep</text><text x="316" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34D399" text-anchor="middle">IPC de julio: 0,3 %</text><line x1="400" y1="309" x2="568" y2="302.5" stroke="#34D399" stroke-width="4"/><line x1="568" y1="220" x2="568" y2="420" stroke="#1C3A2E" stroke-width="1" stroke-dasharray="4 4"/><text x="484" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="middle">10 sep → 9 oct</text><text x="484" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34D399" text-anchor="middle">IPC de agosto: 0,05 %</text><line x1="568" y1="302.5" x2="736" y2="244" stroke="#34D399" stroke-width="4"/><line x1="736" y1="220" x2="736" y2="420" stroke="#1C3A2E" stroke-width="1" stroke-dasharray="4 4"/><text x="652" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="middle">10 oct → 9 nov</text><text x="652" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#34D399" text-anchor="middle">IPC de septiembre: 0,45 %</text><rect x="44" y="500" width="348" height="64" rx="12" fill="#10221B"/><text x="60" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Dividendos hipotecarios</text><text x="60" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">el crédito se pacta en UF</text><rect x="408" y="500" width="348" height="64" rx="12" fill="#10221B"/><text x="424" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Arriendos</text><text x="424" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">muchos contratos se reajustan en UF</text><rect x="44" y="576" width="348" height="64" rx="12" fill="#10221B"/><text x="60" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Isapres y seguros</text><text x="60" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">los planes se cobran en UF</text><rect x="408" y="576" width="348" height="64" rx="12" fill="#10221B"/><text x="424" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Topes legales</text><text x="424" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">imponible AFP: 90 UF</text><text x="44" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Valores de IPC ilustrativos. El Banco Central publica el valor</text><text x="44" y="686.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">diario de la UF; la calculadora lo consulta al abrirla.</text></g><text x="44" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/uf-a-pesos</text></svg>