<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 767" width="800" height="767"><rect width="800" height="767" fill="#1F3A2E"/><rect x="44" y="709" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Cómo agregar o quitar el IGV del 18 %</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="30" font-weight="400" fill="#FDE68A" text-anchor="start">IGV 18 % = 16 % IGV + 2 % IPM</text><text x="44" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#B7C7B9" text-anchor="start">El 2 % es el Impuesto de Promoción Municipal, que se cobra junto al IGV.</text><rect x="44" y="260" width="346" height="190" rx="16" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="296" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#FDE68A" text-anchor="start">Agregar el IGV</text><text x="64" y="346" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 100 × 1,18</text><text x="64" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">= S/ 118</text><text x="64" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">valor de venta → precio de venta</text><rect x="410" y="260" width="346" height="190" rx="16" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="430" y="296" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#FDE68A" text-anchor="start">Quitar el IGV</text><text x="430" y="346" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 118 ÷ 1,18</text><text x="430" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">= S/ 100</text><text x="430" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">precio de venta → valor de venta</text><text x="44" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F1F5EE" text-anchor="start">Montos frecuentes</text><text x="44" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#B7C7B9" text-anchor="start">Valor de venta</text><text x="304" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#B7C7B9" text-anchor="middle">IGV</text><text x="756" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#B7C7B9" text-anchor="end">Precio de venta</text><text x="44" y="560" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 50</text><text x="304" y="560" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="middle">S/ 9</text><text x="756" y="560" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="end">S/ 59</text><text x="44" y="596" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 250</text><text x="304" y="596" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="middle">S/ 45</text><text x="756" y="596" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="end">S/ 295</text><text x="44" y="632" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 1.000</text><text x="304" y="632" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="middle">S/ 180</text><text x="756" y="632" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="end">S/ 1.180</text><text x="44" y="668" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="start">S/ 5.000</text><text x="304" y="668" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#FDE68A" text-anchor="middle">S/ 900</text><text x="756" y="668" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#F1F5EE" text-anchor="end">S/ 5.900</text></g><text x="44" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-de-igv</text></svg>