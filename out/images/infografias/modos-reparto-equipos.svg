<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 682" width="800" height="682"><rect width="800" height="682" fill="#FFFDF7"/><rect x="44" y="624" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cómo reparte el generador de equipos</text><g transform="translate(0,3)"><text x="44" y="188" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">14 personas, dos formas de repartirlas</text><text x="44" y="230" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">Modo «número de equipos»: pides 3</text><rect x="44" y="244" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="71" cy="268" r="9" fill="#2563EB"/><rect x="60" y="279" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="105" cy="268" r="9" fill="#2563EB"/><rect x="94" y="279" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="139" cy="268" r="9" fill="#2563EB"/><rect x="128" y="279" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="173" cy="268" r="9" fill="#2563EB"/><rect x="162" y="279" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="207" cy="268" r="9" fill="#2563EB"/><rect x="196" y="279" width="22" height="20" rx="8" fill="#2563EB"/><text x="139" y="330" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">5 personas</text><rect x="246" y="244" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><circle cx="273" cy="268" r="9" fill="#DC2626"/><rect x="262" y="279" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="307" cy="268" r="9" fill="#DC2626"/><rect x="296" y="279" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="341" cy="268" r="9" fill="#DC2626"/><rect x="330" y="279" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="375" cy="268" r="9" fill="#DC2626"/><rect x="364" y="279" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="409" cy="268" r="9" fill="#DC2626"/><rect x="398" y="279" width="22" height="20" rx="8" fill="#DC2626"/><text x="341" y="330" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">5 personas</text><rect x="448" y="244" width="156" height="64" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/><circle cx="475" cy="268" r="9" fill="#16A34A"/><rect x="464" y="279" width="22" height="20" rx="8" fill="#16A34A"/><circle cx="509" cy="268" r="9" fill="#16A34A"/><rect x="498" y="279" width="22" height="20" rx="8" fill="#16A34A"/><circle cx="543" cy="268" r="9" fill="#16A34A"/><rect x="532" y="279" width="22" height="20" rx="8" fill="#16A34A"/><circle cx="577" cy="268" r="9" fill="#16A34A"/><rect x="566" y="279" width="22" height="20" rx="8" fill="#16A34A"/><text x="526" y="330" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">4 personas</text><text x="44" y="360" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">Si no sale exacto, unos equipos quedan con una persona más.</text><text x="44" y="400" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">Modo «personas por equipo»: pides 4</text><rect x="44" y="414" width="156" height="64" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><circle cx="71" cy="438" r="9" fill="#2563EB"/><rect x="60" y="449" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="105" cy="438" r="9" fill="#2563EB"/><rect x="94" y="449" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="139" cy="438" r="9" fill="#2563EB"/><rect x="128" y="449" width="22" height="20" rx="8" fill="#2563EB"/><circle cx="173" cy="438" r="9" fill="#2563EB"/><rect x="162" y="449" width="22" height="20" rx="8" fill="#2563EB"/><text x="122" y="500" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">4 personas</text><rect x="212" y="414" width="156" height="64" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><circle cx="239" cy="438" r="9" fill="#DC2626"/><rect x="228" y="449" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="273" cy="438" r="9" fill="#DC2626"/><rect x="262" y="449" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="307" cy="438" r="9" fill="#DC2626"/><rect x="296" y="449" width="22" height="20" rx="8" fill="#DC2626"/><circle cx="341" cy="438" r="9" fill="#DC2626"/><rect x="330" y="449" width="22" height="20" rx="8" fill="#DC2626"/><text x="290" y="500" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">4 personas</text><rect x="380" y="414" width="122" height="64" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/><circle cx="407" cy="438" r="9" fill="#16A34A"/><rect x="396" y="449" width="22" height="20" rx="8" fill="#16A34A"/><circle cx="441" cy="438" r="9" fill="#16A34A"/><rect x="430" y="449" width="22" height="20" rx="8" fill="#16A34A"/><circle cx="475" cy="438" r="9" fill="#16A34A"/><rect x="464" y="449" width="22" height="20" rx="8" fill="#16A34A"/><text x="441" y="500" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">3 personas</text><rect x="514" y="414" width="122" height="64" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><circle cx="541" cy="438" r="9" fill="#D97706"/><rect x="530" y="449" width="22" height="20" rx="8" fill="#D97706"/><circle cx="575" cy="438" r="9" fill="#D97706"/><rect x="564" y="449" width="22" height="20" rx="8" fill="#D97706"/><circle cx="609" cy="438" r="9" fill="#D97706"/><rect x="598" y="449" width="22" height="20" rx="8" fill="#D97706"/><text x="575" y="500" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="middle">3 personas</text><text x="44" y="530" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">⌈14 ÷ 4⌉ = 4 equipos; las 14 personas se reparten lo más parejo posible.</text><text x="44" y="570" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Cada reparto baraja la lista de nuevo con el algoritmo de</text><text x="44" y="594.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Fisher-Yates: todas las combinaciones tienen la misma probabilidad.</text></g><text x="44" y="656" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/generador-equipos</text></svg>