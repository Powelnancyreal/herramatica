<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"><rect width="800" height="800" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#B91C1C"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cómo se calcula la renta de quinta</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">categoría</text><g transform="translate(0,68)"><text x="44" y="188" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Sueldo de S/ 5,000 con 2 gratificaciones al año</text><rect x="44" y="208" width="712" height="36" rx="8" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/><text x="58" y="232" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">12 sueldos + 2 gratificaciones</text><text x="742" y="232" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="end">S/ 70,000</text><rect x="44" y="250" width="712" height="36" rx="8" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/><text x="58" y="274" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">+ bonificación extraordinaria del 9 %</text><text x="742" y="274" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="end">S/ 900</text><rect x="44" y="292" width="712" height="36" rx="8" fill="#FEF2F2" stroke="#F3F4F6" stroke-width="1"/><text x="58" y="316" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">= renta bruta anual</text><text x="742" y="316" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="end">S/ 70,900</text><rect x="44" y="334" width="712" height="36" rx="8" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/><text x="58" y="358" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">− 7 UIT (7 × S/ 5,500)</text><text x="742" y="358" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="end">− S/ 38,500</text><rect x="44" y="376" width="712" height="36" rx="8" fill="#FEF2F2" stroke="#F3F4F6" stroke-width="1"/><text x="58" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">= renta neta</text><text x="742" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="end">S/ 32,400</text><text x="44" y="448" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Tramos sobre la renta neta</text><rect x="44" y="464" width="132.8" height="72" rx="12" fill="#B91C1C"/><text x="110.4" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">hasta 5 UIT</text><text x="110.4" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">8 %</text><rect x="188.8" y="464" width="132.8" height="72" rx="12" fill="#B91C1C"/><text x="255.20000000000002" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">5 a 20 UIT</text><text x="255.20000000000002" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">14 %</text><rect x="333.6" y="464" width="132.8" height="72" rx="12" fill="#FECACA"/><text x="400" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#7F1D1D" text-anchor="middle">20 a 35 UIT</text><text x="400" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D" text-anchor="middle">17 %</text><rect x="478.40000000000003" y="464" width="132.8" height="72" rx="12" fill="#FECACA"/><text x="544.8000000000001" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#7F1D1D" text-anchor="middle">35 a 45 UIT</text><text x="544.8000000000001" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D" text-anchor="middle">20 %</text><rect x="623.2" y="464" width="132.8" height="72" rx="12" fill="#FECACA"/><text x="689.6" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#7F1D1D" text-anchor="middle">más de 45</text><text x="689.6" y="522" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D" text-anchor="middle">30 %</text><rect x="44" y="566" width="712" height="96" rx="14" fill="#FEF2F2"/><text x="62" y="598" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">27,500 × 8 % + 4,900 × 14 % = S/ 2,886 al año</text><text x="62" y="636" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="start">Retención mensual: S/ 240.50</text></g><text x="44" y="774" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/renta-quinta-categoria</text></svg>