<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 733" width="800" height="733">
<rect width="800" height="733" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo se calcula la edad exacta en</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">años, meses y días</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ejemplo: nacimiento el 15/03/1995, cálculo el 20/10/2026</text>
<g transform="translate(0,67)"><line x1="60" y1="250" x2="740" y2="250" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/><rect x="60" y="244" width="270" height="12" fill="#7C3AED" rx="6"/><rect x="105" y="290" width="180" height="92" rx="16" fill="#EDE9FE"/><text x="195" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">31 años</text><text x="195" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">años completos</text><rect x="330" y="244" width="230" height="12" fill="#2563EB" rx="6"/><rect x="355" y="290" width="180" height="92" rx="16" fill="#DBEAFE"/><text x="445" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">7 meses</text><text x="445" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">meses completos</text><rect x="560" y="244" width="180" height="12" fill="#0D9488" rx="6"/><rect x="560" y="290" width="180" height="92" rx="16" fill="#CCFBF1"/><text x="650" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0D9488" text-anchor="middle">5 días</text><text x="650" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">días restantes</text><circle cx="60" cy="250" r="11" fill="#FFFFFF" stroke="#334155" stroke-width="4"/><text x="60" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155" text-anchor="start">15/03/1995</text><circle cx="330" cy="250" r="11" fill="#FFFFFF" stroke="#334155" stroke-width="4"/><text x="330" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155" text-anchor="middle">15/03/2026</text><circle cx="560" cy="250" r="11" fill="#FFFFFF" stroke="#334155" stroke-width="4"/><text x="560" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155" text-anchor="middle">15/10/2026</text><circle cx="740" cy="250" r="11" fill="#FFFFFF" stroke="#334155" stroke-width="4"/><text x="740" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155" text-anchor="end">20/10/2026</text><text x="60" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Nacimiento</text><text x="740" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="end">Hoy</text><rect x="40" y="430" width="720" height="84" rx="16" fill="#334155"/><text x="400" y="466" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Edad exacta: 31 años, 7 meses y 5 días</text><text x="400" y="498" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1" text-anchor="middle">En total, 11.542 días vividos</text><text x="40" y="556" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Se cuentan fechas del calendario, no bloques de 365 días, así que los</text><text x="40" y="581.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">años bisiestos y los meses de 28, 30 o 31 días quedan incluidos solos.</text></g>
<line x1="40" y1="681" x2="760" y2="681" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="711" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-edad</text>
</svg>