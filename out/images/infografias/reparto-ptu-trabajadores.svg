<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 847" width="800" height="847"><rect width="800" height="847" fill="#FBF6EC"/><rect x="44" y="789" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cómo se reparte la PTU entre los</text><text x="44" y="132.8" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">trabajadores</text><g transform="translate(0,44)"><text x="44" y="186" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">Utilidad fiscal de la empresa</text><rect x="44" y="204" width="712" height="50" rx="10" fill="#E7E5E4"/><rect x="44" y="204" width="71.2" height="50" rx="10" fill="#1D4ED8"/><text x="56" y="236" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="start">10 %</text><text x="129.2" y="236" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#3B2F2A" text-anchor="start">para repartir entre los trabajadores</text><rect x="44" y="290" width="348" height="112" rx="16" fill="#DBEAFE"/><text x="64" y="330" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1D4ED8" text-anchor="start">50 % por días</text><text x="64" y="362" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">Se reparte según los días que</text><text x="64" y="383.6" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">trabajó cada persona en el año.</text><rect x="408" y="290" width="348" height="112" rx="16" fill="#DBEAFE"/><text x="428" y="330" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1D4ED8" text-anchor="start">50 % por salario</text><text x="428" y="362" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">Se reparte en proporción al</text><text x="428" y="383.6" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">salario de cada trabajador.</text><rect x="44" y="440" width="712" height="100" rx="16" fill="#FFFDF8" stroke="#E7D8BE" stroke-width="2"/><text x="64" y="476" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">Tope desde 2021</text><text x="64" y="510" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#3B2F2A" text-anchor="start">El mayor entre 3 meses de salario o el promedio de lo recibido en los 3 últimos años.</text><text x="44" y="576" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#3B2F2A" text-anchor="start">Empresas (personas morales)</text><text x="756" y="576" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="end">a más tardar el 30 de mayo</text><text x="44" y="616" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#3B2F2A" text-anchor="start">Personas físicas con actividad empresarial</text><text x="756" y="616" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="end">a más tardar el 29 de junio</text><text x="44" y="666" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Los trabajadores eventuales necesitan al menos 60 días trabajados en</text><text x="44" y="690.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">el año. No reciben PTU los directores, administradores y gerentes</text><text x="44" y="714.6" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">generales.</text></g><text x="44" y="821" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/calcular-ptu</text></svg>