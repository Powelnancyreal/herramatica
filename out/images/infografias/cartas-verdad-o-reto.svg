<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 666" width="800" height="666"><rect width="800" height="666" fill="#140A1F"/><rect x="44" y="608" width="712" height="1.5" fill="#3B2152"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C084FC" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Las cartas de verdad o reto por nivel</text><g transform="translate(0,3)"><g transform="rotate(-6 194 340)"><rect x="84" y="190" width="220" height="300" rx="18" fill="#22122F" stroke="#60A5FA" stroke-width="3"/><text x="194" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="middle">VERDAD</text><text x="194" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">¿Qué superpoder</text><text x="194" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">te gustaría tener</text><text x="194" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">y por qué?</text></g><g transform="rotate(5 454 340)"><rect x="344" y="190" width="220" height="300" rx="18" fill="#22122F" stroke="#F472B6" stroke-width="3"/><text x="454" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F472B6" text-anchor="middle">RETO</text><text x="454" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">Imita a un animal</text><text x="454" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">durante 30 segundos</text><text x="454" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="middle">sin reírte.</text></g><text x="604" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#C084FC" text-anchor="start">84 cartas</text><rect x="604" y="236" width="152" height="58" rx="10" fill="#22122F"/><text x="618" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Familiar</text><text x="618" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">15 + 15 cartas</text><rect x="604" y="306" width="152" height="58" rx="10" fill="#22122F"/><text x="618" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Amigos</text><text x="618" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">15 + 15 cartas</text><rect x="604" y="376" width="152" height="58" rx="10" fill="#22122F"/><text x="618" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="start">Pareja</text><text x="618" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">12 + 12 cartas</text><text x="44" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">No se repite ninguna carta hasta agotar las de ese nivel y tipo.</text><text x="44" y="554.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Cualquiera puede pasar de turno: el juego es para divertirse, no</text><text x="44" y="578.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">para incomodar.</text></g><text x="44" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/verdad-o-reto</text></svg>