<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 884" width="800" height="884"><rect width="800" height="884" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="884" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="884" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#DB2777" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Tres formas de escribir al revés</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Segoe Print, Comic Sans MS, cursive" font-size="30" font-weight="400" fill="#1E3A8A" text-anchor="start">«hola mundo feliz»</text><rect x="44" y="214" width="712" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Invertir todo el texto</text><text x="62" y="280" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="400" fill="#DB2777" text-anchor="start">zilef odnum aloh</text><rect x="44" y="310" width="712" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Invertir el orden de las palabras</text><text x="62" y="376" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="400" fill="#DB2777" text-anchor="start">feliz mundo hola</text><rect x="44" y="406" width="712" height="84" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Invertir cada palabra</text><text x="62" y="472" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="400" fill="#DB2777" text-anchor="start">aloh odnum zilef</text><text x="44" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">Palíndromos: se leen igual al revés</text><circle cx="54" cy="576" r="6" fill="#DB2777"/><text x="72" y="584" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">reconocer</text><circle cx="54" cy="624" r="6" fill="#DB2777"/><text x="72" y="632" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">Anita lava la tina</text><circle cx="54" cy="672" r="6" fill="#DB2777"/><text x="72" y="680" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">oso</text><circle cx="54" cy="720" r="6" fill="#DB2777"/><text x="72" y="728" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">Dábale arroz a la zorra el abad</text><text x="44" y="776" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Para comprobar un palíndromo de varias palabras se ignoran los</text><text x="44" y="800.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">espacios, las tildes y las mayúsculas.</text></g><text x="44" y="858" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/palabras-al-reves</text></svg>