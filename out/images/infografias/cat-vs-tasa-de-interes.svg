<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 821" width="800" height="821"><rect width="800" height="821" fill="#111111"/><rect x="44" y="763" width="712" height="1.5" fill="#333333"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Por qué el CAT es más alto que la tasa</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">de interés</text><g transform="translate(0,44)"><text x="44" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Préstamo de $50,000 a 24 meses, tasa anual del 30 %</text><text x="44" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">Pago mensual: $2,795.64</text><text x="44" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">Tasa de interés</text><rect x="44" y="278" width="444" height="38" rx="10" fill="#60A5FA"/><text x="502" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="start">30,0 %</text><text x="44" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">CAT sin comisiones</text><rect x="44" y="368" width="510.6" height="38" rx="10" fill="#F59E0B"/><text x="568.6" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F59E0B" text-anchor="start">34,5 %</text><text x="44" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">CAT con comisión de apertura de $1,500</text><rect x="44" y="458" width="575.7199999999999" height="38" rx="10" fill="#EF4444"/><text x="633.7199999999999" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#EF4444" text-anchor="start">38,9 %</text><text x="44" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB" text-anchor="start">Qué suma el CAT además del interés</text><circle cx="52" cy="570" r="6" fill="#F59E0B"/><text x="68" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Comisión por apertura</text><circle cx="408" cy="570" r="6" fill="#F59E0B"/><text x="424" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Seguros obligatorios</text><circle cx="52" cy="606" r="6" fill="#F59E0B"/><text x="68" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Capitalización mensual de los intereses</text><circle cx="408" cy="606" r="6" fill="#F59E0B"/><text x="424" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Otras comisiones fijas del crédito</text><text x="44" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">El CAT se expresa sin IVA. Sirve para comparar créditos del mismo</text><text x="44" y="692.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">plazo y monto: a menor CAT, más barato el crédito.</text></g><text x="44" y="795" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/calculadora-cat</text></svg>