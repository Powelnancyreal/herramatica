<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760"><rect width="800" height="760" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="760" fill="url(#g)"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Cómo un código HEX se convierte en RGB</text><g transform="translate(0,3)"><text x="400" y="220" font-family="Consolas, monospace" font-size="54" font-weight="700" fill="#FFFFFF" text-anchor="middle">#  2 5  6 3  E B</text><rect x="44" y="256" width="226.66666666666666" height="190" rx="12" fill="#123A63" stroke="#F87171" stroke-width="2"/><text x="157.33333333333331" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F87171" text-anchor="middle">Rojo</text><text x="157.33333333333331" y="344" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="middle">25</text><text x="157.33333333333331" y="382" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#93C5FD" text-anchor="middle">2 × 16 + 5</text><text x="157.33333333333331" y="426" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#F87171" text-anchor="middle">= 37</text><rect x="286.66666666666663" y="256" width="226.66666666666666" height="190" rx="12" fill="#123A63" stroke="#4ADE80" stroke-width="2"/><text x="399.99999999999994" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#4ADE80" text-anchor="middle">Verde</text><text x="399.99999999999994" y="344" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="middle">63</text><text x="399.99999999999994" y="382" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#93C5FD" text-anchor="middle">6 × 16 + 3</text><text x="399.99999999999994" y="426" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#4ADE80" text-anchor="middle">= 99</text><rect x="529.3333333333333" y="256" width="226.66666666666666" height="190" rx="12" fill="#123A63" stroke="#60A5FA" stroke-width="2"/><text x="642.6666666666666" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#60A5FA" text-anchor="middle">Azul</text><text x="642.6666666666666" y="344" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="middle">EB</text><text x="642.6666666666666" y="382" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#93C5FD" text-anchor="middle">14 × 16 + 11</text><text x="642.6666666666666" y="426" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#60A5FA" text-anchor="middle">= 235</text><text x="400" y="494" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#FDE68A" text-anchor="middle">rgb(37, 99, 235)</text><text x="44" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Letras de la A a la F</text><rect x="44" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="99.16666666666666" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">A = 10</text><rect x="164.33333333333331" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="219.49999999999997" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">B = 11</text><rect x="284.66666666666663" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="339.8333333333333" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">C = 12</text><rect x="405" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="460.1666666666667" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">D = 13</text><rect x="525.3333333333333" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="580.4999999999999" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">E = 14</text><rect x="645.6666666666666" y="556" width="110.33333333333333" height="60" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="700.8333333333333" y="594" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">F = 15</text><text x="44" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">Cada par va de 00 (0) a FF (255): 256 × 256 × 256 = 16.777.216</text><text x="44" y="676.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">colores posibles.</text></g><text x="44" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/conversor-hex-rgb</text></svg>