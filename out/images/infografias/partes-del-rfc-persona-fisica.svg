text><rect x="481" y="190" width="46" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="504" y="234" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#2563EB" text-anchor="middle">1</text><rect x="533" y="190" width="46" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="556" y="234" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#2563EB" text-anchor="middle">4</text><rect x="599" y="190" width="46" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="622" y="234" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#D97706" text-anchor="middle">?</text><rect x="651" y="190" width="46" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="674" y="234" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#D97706" text-anchor="middle">?</text><rect x="703" y="190" width="46" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="726" y="234" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#D97706" text-anchor="middle">?</text><path d="M55,266 v8 H145 v-8" fill="none" stroke="#7C3AED" stroke-width="2.5"/><circle cx="100" cy="294" r="14" fill="#7C3AED"/><text x="100" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M159,266 v8 H197 v-8" fill="none" stroke="#7C3AED" stroke-width="2.5"/><circle cx="178" cy="294" r="14" fill="#7C3AED"/><text x="178" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M211,266 v8 H249 v-8" fill="none" stroke="#7C3AED" stroke-width="2.5"/><circle cx="230" cy="294" r="14" fill="#7C3AED"/><text x="230" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M277,266 v8 H575 v-8" fill="none" stroke="#2563EB" stroke-width="2.5"/><circle cx="426" cy="294" r="14" fill="#2563EB"/><text x="426" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M603,266 v8 H745 v-8" fill="none" stroke="#D97706" stroke-width="2.5"/><circle cx="674" cy="294" r="14" fill="#D97706"/><text x="674" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="56" cy="343" r="16" fill="#7C3AED"/><text x="56" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="350" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="start">GO</text><text x="190" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Primera letra y primera vocal interna del primer</text><text x="190" y="377.72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">apellido: GÓMEZ.</text><circle cx="56" cy="416.44" r="16" fill="#7C3AED"/><text x="56" y="423.44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="86" y="423.44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="start">M</text><text x="190" y="423.44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Inicial del segundo apellido: MARTÍNEZ.</text><circle cx="56" cy="462.44" r="16" fill="#7C3AED"/><text x="56" y="469.44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="86" y="469.44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="start">J</text><text x="190" y="469.44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Inicial del nombre: JUAN.</text><circle cx="56" cy="508.44000000000005" r="16" fill="#2563EB"/><text x="56" y="515.44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="86" y="515.44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start">900514</text><text x="190" y="515.44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Fecha de nacimiento en formato año, mes y día.</text><circle cx="56" cy="554.44" r="16" fill="#D97706"/><text x="56" y="561.44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="86" y="561.44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#D97706" text-anchor="start">???</text><text x="190" y="561.44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Homoclave: tres caracteres que asigna el SAT para</text><text x="190" y="589.1600000000001" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">que no haya dos RFC iguales.</text><text x="40" y="650.8800000000001" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Las partículas como DE, DEL o LA se omiten, y los nombres compuestos</text><text x="40" y="675.9600000000002" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">con JOSÉ o MARÍA usan el segundo nombre.</text></g>
