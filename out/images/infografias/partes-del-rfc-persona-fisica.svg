<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo se forma el RFC de una persona</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">física</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ejemplo: Juan Gómez Martínez, nacido el 14 de mayo de 1990</text>
