<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850"><rect width="800" height="850" fill="#FBF6EC"/><rect x="44" y="792" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0E7490" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cuántos litros tiene un galón</text><g transform="translate(0,3)"><path d="M84,240 h150 l-12,150 h-126 Z" fill="#BAE6FD" stroke="#3B2F2A" stroke-width="3"/><path d="M94,240 q65,-50 130,0" fill="none" stroke="#3B2F2A" stroke-width="3"/><text x="159" y="424" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">Galón de EE. UU.</text><text x="159" y="448" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="middle">3,785 litros</text><path d="M334,220 h170 l-12,170 h-146 Z" fill="#7DD3FC" stroke="#3B2F2A" stroke-width="3"/><path d="M344,220 q75,-50 150,0" fill="none" stroke="#3B2F2A" stroke-width="3"/><text x="419" y="424" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">Galón imperial</text><text x="419" y="448" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="middle">4,546 litros</text><path d="M604,200 h180 l-12,190 h-156 Z" fill="#38BDF8" stroke="#3B2F2A" stroke-width="3"/><path d="M614,200 q80,-50 160,0" fill="none" stroke="#3B2F2A" stroke-width="3"/><text x="694" y="424" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="middle">Cubeta de 19 L</text><text x="694" y="448" font-family="Georgia, serif" font-size="16" font-weight="400" fill="#7C6A58" text-anchor="middle">≈ 5 galones de EE. UU.</text><text x="44" y="520" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">Equivalencias útiles</text><line x1="44" y1="572" x2="756" y2="572" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="562" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">1 litro</text><text x="756" y="562" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#0E7490" text-anchor="end">0,264 galones (EE. UU.)</text><line x1="44" y1="616" x2="756" y2="616" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="606" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">20 litros</text><text x="756" y="606" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#0E7490" text-anchor="end">5,28 galones</text><line x1="44" y1="660" x2="756" y2="660" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="650" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">100 litros</text><text x="756" y="650" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#0E7490" text-anchor="end">26,42 galones</text><line x1="44" y1="704" x2="756" y2="704" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="694" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3B2F2A" text-anchor="start">1 cuarto de galón</text><text x="756" y="694" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#0E7490" text-anchor="end">0,946 litros</text><text x="44" y="734" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">México y casi toda América usan el galón estadounidense; el imperial</text><text x="44" y="758.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">aparece en Reino Unido y en recetas británicas antiguas.</text></g><text x="44" y="824" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/litros-a-galones</text></svg>