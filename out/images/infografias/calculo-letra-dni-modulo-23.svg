" font-weight="400" fill="#475569" text-anchor="middle">22</text><text x="652" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="middle">E</text><rect x="44" y="504" width="712" height="74" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="400" y="552" font-family="Segoe Print, Comic Sans MS, cursive" font-size="32" font-weight="700" fill="#1E3A8A" text-anchor="middle">DNI 12345678Z</text><text x="44" y="622" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">NIE: cambia la X por 0, la Y por 1 y la Z por 2 y haz la misma</text><text x="44" y="646.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">división. No hay I, Ñ, O ni U para evitar confusiones con el 1 y el</text><text x="44" y="670.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">0.</text></g><text x="44" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-letra-dni</text></svg>