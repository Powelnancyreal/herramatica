<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 851" width="800" height="851"><rect width="800" height="851" fill="#FBF6EC"/><rect x="44" y="793" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">La fórmula detrás de cada idea para una</text><text x="44" y="132.8" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">historia</text><g transform="translate(0,44)"><text x="44" y="188" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#3B2F2A" text-anchor="start">Una historia en cuatro piezas</text><rect x="44" y="212" width="712" height="78" rx="14" fill="#FDE68A"/><text x="64" y="244" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C6A58" text-anchor="start">Protagonista</text><text x="64" y="272" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">«una astronauta que despierta 300 años tarde»</text><text x="400" y="300" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#92400E" text-anchor="middle">+</text><rect x="44" y="304" width="712" height="78" rx="14" fill="#BFDBFE"/><text x="64" y="336" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C6A58" text-anchor="start">Lugar</text><text x="64" y="364" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">«una ciudad sumergida bajo el lago de Texcoco»</text><text x="400" y="392" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#92400E" text-anchor="middle">+</text><rect x="44" y="396" width="712" height="78" rx="14" fill="#FBCFE8"/><text x="64" y="428" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C6A58" text-anchor="start">Conflicto</text><text x="64" y="456" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">«alguien borra los recuerdos de todo el pueblo»</text><text x="400" y="484" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#92400E" text-anchor="middle">+</text><rect x="44" y="488" width="712" height="78" rx="14" fill="#BBF7D0"/><text x="64" y="520" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C6A58" text-anchor="start">Giro</text><text x="64" y="548" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">«el narrador ha estado mintiendo desde el principio»</text><text x="44" y="606" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#3B2F2A" text-anchor="start">Seis géneros</text><rect x="44" y="622" width="94.8" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="91.4" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Fantasía</text><rect x="146.8" y="622" width="94.8" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="194.20000000000002" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Misterio</text><rect x="249.60000000000002" y="622" width="155" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="327.1" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Ciencia ficción</text><rect x="412.6" y="622" width="77.6" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="451.40000000000003" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Terror</text><rect x="498.20000000000005" y="622" width="86.19999999999999" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="541.3000000000001" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Romance</text><rect x="592.4000000000001" y="622" width="94.8" height="38" rx="19" fill="#FFFFFF" stroke="#E7D8BE" stroke-width="1.5"/><text x="639.8000000000001" y="647" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#3B2F2A" text-anchor="middle">Aventura</text><text x="44" y="698" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Si una pieza no te convence, cámbiala por otra y conserva las demás:</text><text x="44" y="722.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">muchas buenas historias nacen de una combinación rara.</text></g><text x="44" y="825" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/ideas-para-historias</text></svg>