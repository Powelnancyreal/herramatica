<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 627" width="800" height="627"><rect width="800" height="627" fill="#100B1F"/><rect x="44" y="569" width="712" height="1.5" fill="#2E2550"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Qué tamaños de favicon necesita una web</text><g transform="translate(0,3)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Los archivos que genera (16 a 48 px a tamaño real; 180 y 192 px al 60 %)</text><rect x="44" y="310" width="16" height="16" rx="2.88" fill="#A78BFA"/><text x="52" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#100B1F" text-anchor="middle"></text><text x="64" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#F9FAFB" text-anchor="middle">16 px</text><text x="64" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">pestaña</text><rect x="118" y="294" width="32" height="32" rx="5.76" fill="#A78BFA"/><text x="134" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#100B1F" text-anchor="middle"></text><text x="138" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#F9FAFB" text-anchor="middle">32 px</text><text x="138" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">pestaña HD</text><rect x="192" y="278" width="48" height="48" rx="8.64" fill="#A78BFA"/><text x="216" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#100B1F" text-anchor="middle">H</text><text x="216" y="360