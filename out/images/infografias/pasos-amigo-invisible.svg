<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 814" width="800" height="814"><rect width="800" height="814" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#15803D"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cómo organizar un amigo invisible en</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">línea</text><g transform="translate(0,68)"><circle cx="74" cy="220" r="30" fill="#15803D"/><text x="74" y="229" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="74" y1="250" x2="74" y2="282" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4 4"/><rect x="124" y="186" width="632" height="70" rx="12" fill="#F0FDF4"/><text x="144" y="216" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="start">Escribe los participantes</text><text x="144" y="240" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Uno por línea; el organizador también puede jugar.</text><circle cx="74" cy="316" r="30" fill="#B91C1C"/><text x="74" y="325" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="74" y1="346" x2="74" y2="378" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4 4"/><rect x="124" y="282" width="632" height="70" rx="12" fill="#F0FDF4"/><text x="144" y="312" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="start">Añade exclusiones</text><text x="144" y="336" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Parejas o personas que no deben regalarse entre sí.</text><circle cx="74" cy="412" r="30" fill="#15803D"/><text x="74" y="421" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="74" y1="442" x2="74" y2="474" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4 4"/><rect x="124" y="378" width="632" height="70" rx="12" fill="#F0FDF4"/><text x="144" y="408" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="start">Sortea</text><text x="144" y="432" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Nadie se toca a sí mismo ni a alguien excluido.</text><circle cx="74" cy="508" r="30" fill="#B91C1C"/><text x="74" y="517" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="124" y="474" width="632" height="70" rx="12" fill="#F0FDF4"/><text x="144" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="start">Reparte los enlaces</text><text x="144" y="528" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">Cada persona recibe un enlace que solo muestra su resultado.</text><rect x="44" y="580" width="712" height="96" rx="14" fill="#FEF2F2"/><text x="64" y="614" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="start">Ejemplo de exclusión</text><text x="64" y="646" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">Ana - Luis   →   Ana nunca le regala a Luis ni Luis a Ana</text></g><text x="44" y="788" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/amigo-invisible</text></svg>