<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- left matrix -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">
    <path d="M100,80 h-14 v140 h14" fill="none" stroke="#2563EB" stroke-width="3"/>
    <path d="M220,80 h14 v140 h-14" fill="none" stroke="#2563EB" stroke-width="3"/>
    <rect x="105" y="90" width="50" height="50" rx="6" fill="#DBEAFE"/>
    <text x="130" y="122">a</text>
    <rect x="165" y="90" width="50" height="50" rx="6" fill="#DBEAFE"/>
    <text x="190" y="122">b</text>
    <rect x="105" y="150" width="50" height="50" rx="6" fill="#BFDBFE"/>
    <text x="130" y="182">c</text>
    <rect x="165" y="150" width="50" height="50" rx="6" fill="#BFDBFE"/>
    <text x="190" y="182">d</text>
  </g>

  <!-- right matrix -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">
    <path d="M580,80 h-14 v140 h14" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <path d="M700,80 h14 v140 h-14" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <rect x="585" y="90" width="50" height="50" rx="6" fill="#EDE9FE"/>
    <text x="610" y="122">e</text>
    <rect x="645" y="90" width="50" height="50" rx="6" fill="#EDE9FE"/>
    <text x="670" y="122">f</text>
    <rect x="585" y="150" width="50" height="50" rx="6" fill="#DDD6FE"/>
    <text x="610" y="182">g</text>
    <rect x="645" y="150" width="50" height="50" rx="6" fill="#DDD6FE"/>
    <text x="670" y="182">h</text>
  </g>

  <!-- operation badges center -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="330" cy="100" r="24" fill="#7C3AED"/>
    <text x="330" y="106">+</text>
    <circle cx="400" cy="100" r="24" fill="#2563EB"/>
    <text x="400" y="106">&#215;</text>
    <circle cx="470" cy="100" r="24" fill="#059669"/>
    <text x="470" y="106" font-size="11">det</text>
    <circle cx="330" cy="160" r="24" fill="#DC2626"/>
    <text x="330" y="166" font-size="12">&#8315;&#185;</text>
    <circle cx="400" cy="160" r="24" fill="#EA580C"/>
    <text x="400" y="166" font-size="12">ᵀ</text>
  </g>

  <!-- result matrix -->
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="20" fill="#334155" text-anchor="middle">=</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">
    <path d="M330,270 h-12 v100 h12" fill="none" stroke="#5B21B6" stroke-width="3"/>
    <path d="M470,270 h12 v100 h-12" fill="none" stroke="#5B21B6" stroke-width="3"/>
    <rect x="335" y="278" width="60" height="42" rx="6" fill="#7C3AED"/>
    <text x="365" y="304">r1</text>
    <rect x="405" y="278" width="60" height="42" rx="6" fill="#7C3AED"/>
    <text x="435" y="304">r2</text>
    <rect x="335" y="328" width="60" height="42" rx="6" fill="#5B21B6"/>
    <text x="365" y="354">r3</text>
    <rect x="405" y="328" width="60" height="42" rx="6" fill="#5B21B6"/>
    <text x="435" y="354">r4</text>
  </g>

  <text x="130" y="420" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">|A| = ad &#8722; bc</text>

  <!-- 3x3 small beside -->
  <g transform="translate(680,320)">
    <g fill="#EDE9FE" stroke="#94A3B8" stroke-width="1">
      <rect x="-30" y="-30" width="20" height="20"/>
      <rect x="-10" y="-30" width="20" height="20"/>
      <rect x="10" y="-30" width="20" height="20"/>
      <rect x="-30" y="-10" width="20" height="20"/>
      <rect x="-10" y="-10" width="20" height="20"/>
      <rect x="10" y="-10" width="20" height="20"/>
      <rect x="-30" y="10" width="20" height="20"/>
      <rect x="-10" y="10" width="20" height="20"/>
      <rect x="10" y="10" width="20" height="20"/>
    </g>
  </g>
  <text x="680" y="380" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Matriz 3&#215;3</text>
</svg>
