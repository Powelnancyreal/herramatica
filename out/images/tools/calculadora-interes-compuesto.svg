<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- chart card -->
  <g filter="url(#ds)">
    <rect x="60" y="40" width="500" height="330" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- axes -->
  <line x1="100" y1="330" x2="520" y2="330" stroke="#94A3B8" stroke-width="2"/>
  <line x1="100" y1="330" x2="100" y2="70" stroke="#94A3B8" stroke-width="2"/>
  <text x="90" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="end">$</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
    <text x="140" y="350">1</text>
    <text x="220" y="350">5</text>
    <text x="300" y="350">10</text>
    <text x="390" y="350">20</text>
    <text x="480" y="350">30</text>
  </g>

  <!-- simple interest line (dashed blue) -->
  <path d="M100,320 L480,220" stroke="#2563EB" stroke-width="4" fill="none" stroke-dasharray="8 6"/>

  <!-- compound interest curve (solid purple) -->
  <path d="M100,320 C220,300 300,240 380,140 C420,90 460,70 480,60" stroke="#7C3AED" stroke-width="5" fill="none"/>

  <!-- gap label -->
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED">Interés compuesto</text>
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="14" fill="#2563EB">Interés simple</text>

  <!-- snowball rolling -->
  <g fill="#DBEAFE" stroke="#2563EB" stroke-width="2">
    <circle cx="150" cy="305" r="10"/>
    <circle cx="230" cy="280" r="16"/>
    <circle cx="320" cy="220" r="24"/>
  </g>

  <!-- monthly contribution coins -->
  <g fill="#FBBF24" stroke="#F59E0B" stroke-width="2">
    <circle cx="590" cy="140" r="16"/>
    <circle cx="630" cy="180" r="16"/>
    <circle cx="590" cy="220" r="16"/>
    <circle cx="630" cy="260" r="16"/>
  </g>

  <!-- formula badge -->
  <g filter="url(#ds)">
    <rect x="560" y="300" width="180" height="60" rx="14" fill="#5B21B6"/>
  </g>
  <text x="650" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capital × (1+r)^n</text>
</svg>
