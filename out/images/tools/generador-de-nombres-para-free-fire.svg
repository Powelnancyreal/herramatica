<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="fireg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- stars decoration -->
  <g fill="#7C3AED">
    <path d="M80 80 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" opacity="0.7"/>
    <path d="M700 90 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" opacity="0.7"/>
  </g>

  <!-- left input plain name -->
  <g transform="translate(120,220)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle">Juan</text>
  </g>

  <!-- arrow -->
  <g stroke="#EA580C" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M210,220 h60"/>
    <path d="M258,200 l22,20 -22,20"/>
  </g>

  <!-- phone mockup -->
  <g transform="translate(430,225)">
    <rect x="-90" y="-160" width="180" height="320" rx="30" fill="#1E293B"/>
    <rect x="-74" y="-140" width="148" height="280" rx="10" fill="#111827"/>
    <path d="M0,-100 q14,-20 0,-34 q-14,14 0,34" fill="url(#fireg)"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="middle">&#42734;ʀᴇᴇ&#8226;&#42734;ɪʀᴇ&#8226;PRO</text>
    <path d="M-50,-6 l10,-6 M50,-6 l-10,-6" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="-40" cy="40" r="4" fill="#7C3AED"/>
    <circle cx="40" cy="40" r="4" fill="#EA580C"/>
  </g>

  <!-- right generated options -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#5B21B6" text-anchor="middle">
    <rect x="600" y="130" width="150" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="675" y="152">&#9642;JUAN&#9642;FF</text>
    <rect x="600" y="174" width="150" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="675" y="196">&#9670;Juan&#9670;</text>
    <rect x="600" y="218" width="150" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="675" y="240">&#12304;JUAN&#12305;</text>
  </g>

  <!-- gaming controller icon -->
  <g transform="translate(680,340)">
    <rect x="-40" y="-14" width="80" height="30" rx="15" fill="#7C3AED"/>
    <circle cx="-20" cy="1" r="5" fill="#FFFFFF"/>
    <rect x="-22" y="-3" width="4" height="10" fill="#FFFFFF"/>
    <rect x="-27" y="-1" width="10" height="4" fill="#FFFFFF"/>
    <circle cx="16" cy="-4" r="4" fill="#FBBF24"/>
    <circle cx="26" cy="6" r="4" fill="#EA580C"/>
  </g>

  <!-- copy button -->
  <g transform="translate(150,340)">
    <rect x="-30" y="-24" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="-20" y="-34" width="48" height="48" rx="8" fill="#7C3AED"/>
  </g>
</svg>
