<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- baby growth above timeline -->
  <circle cx="130" cy="140" r="4" fill="#F472B6"/>
  <path d="M330,130 q14,-14 24,0 q6,14 -10,18 q-16,4 -14,-18" fill="#C4B5FD"/>
  <g transform="translate(620,110)">
    <circle cx="0" cy="-10" r="16" fill="#93C5FD"/>
    <path d="M-14,4 Q0,26 14,4 Q10,20 -10,20 Z" fill="#93C5FD"/>
  </g>

  <!-- timeline -->
  <g transform="translate(400,220)">
    <rect x="-330" y="-16" width="220" height="32" fill="#FBCFE8"/>
    <rect x="-110" y="-16" width="260" height="32" fill="#DDD6FE"/>
    <rect x="150" y="-16" width="180" height="32" fill="#BFDBFE"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="70" y="245">Semana 1</text>
    <text x="290" y="245">13</text>
    <text x="540" y="245">26</text>
    <text x="710" y="245">40</text>
  </g>

  <!-- LMP calendar left -->
  <g transform="translate(90,320)">
    <rect x="-40" y="-30" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#F472B6" stroke-width="3"/>
    <rect x="-40" y="-30" width="80" height="20" rx="8" fill="#F472B6"/>
    <circle cx="0" cy="20" r="14" fill="none" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="90" y="400" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">Última regla</text>

  <!-- due date calendar right -->
  <g transform="translate(710,320)">
    <rect x="-40" y="-30" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="-40" y="-30" width="80" height="20" rx="8" fill="#2563EB"/>
    <circle cx="0" cy="20" r="14" fill="none" stroke="#DC2626" stroke-width="2"/>
    <path d="M22,-4 l4,10 10,1 -8,7 2,10 -8,-6 -8,6 2,-10 -8,-7 10,-1 z" fill="#FBBF24"/>
  </g>
  <text x="710" y="400" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">Fecha de parto</text>

  <!-- uterus with baby at week 20 -->
  <g transform="translate(400,320)">
    <path d="M-60,-50 Q-70,20 0,50 Q70,20 60,-50 Q0,-70 -60,-50 Z" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <path d="M0,-10 q14,-10 14,8 q0,14 -14,18 q-14,-4 -14,-18 q0,-18 14,-8" fill="#C4B5FD"/>
  </g>

  <!-- milestone markers -->
  <g transform="translate(290,180)">
    <rect x="-16" y="-12" width="32" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M-10,0 q6,-8 10,0 q4,8 10,0" stroke="#7C3AED" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(540,180)">
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="middle">?</text>
  </g>
</svg>
