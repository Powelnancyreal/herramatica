<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- wheelchair icon left -->
  <g transform="translate(60,150)">
    <circle cx="0" cy="20" r="24" fill="none" stroke="#2563EB" stroke-width="4"/>
    <circle cx="0" cy="20" r="4" fill="#2563EB"/>
    <path d="M0,-10 v20 h20 M0,-10 h-14 l-6,20" stroke="#334155" stroke-width="3" fill="none"/>
  </g>

  <!-- person center -->
  <g transform="translate(400,180)">
    <circle cx="0" cy="-50" r="22" fill="#7C3AED"/>
    <rect x="-26" y="-26" width="52" height="80" rx="16" fill="#7C3AED"/>
  </g>

  <!-- 10 activity circles arranged around -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">
    <circle cx="230" cy="80" r="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="230" y="84">Comer</text>
    <circle cx="330" cy="55" r="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="330" y="59">Baño</text>
    <circle cx="470" cy="55" r="26" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="470" y="59">Vestirse</text>
    <circle cx="570" cy="80" r="26" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="570" y="84">Aseo</text>
    <circle cx="620" cy="150" r="26" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="620" y="154">Continencia</text>
    <circle cx="600" cy="230" r="26" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="234">WC</text>
    <circle cx="520" cy="290" r="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="520" y="294">Silla-cama</text>
    <circle cx="400" cy="310" r="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="400" y="314">Deambular</text>
    <circle cx="280" cy="290" r="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="280" y="294">Escaleras</text>
    <circle cx="200" cy="230" r="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="200" y="234">Bañarse</text>
  </g>

  <!-- score bar bottom -->
  <g transform="translate(400,400)">
    <rect x="-330" y="-10" width="66" height="20" fill="#FCA5A5"/>
    <rect x="-264" y="-10" width="132" height="20" fill="#FDBA74"/>
    <rect x="-132" y="-10" width="99" height="20" fill="#FDE68A"/>
    <rect x="-33" y="-10" width="27" height="20" fill="#D9F99D"/>
    <rect x="-6" y="-10" width="336" height="20" fill="#86EFAC"/>
  </g>
  <path d="M-90,380 l6,15 -12,0 z" fill="#334155"/>
  <g font-family="Arial, sans-serif" font-size="8" fill="#334155">
    <text x="-320" y="425">0-20 Dependencia</text>
    <text x="-220" y="425">21-60 Grave</text>
    <text x="-100" y="425">61-90 Moderada</text>
    <text x="30" y="425">91-99 Leve</text>
    <text x="200" y="425">100 Independiente</text>
  </g>
</svg>
