<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- chilean flag block -->
  <g transform="translate(660,90)">
    <rect x="-40" y="-24" width="40" height="24" fill="#2563EB"/>
    <path d="M-20,-16 l3,8 8,0 -6,5 2,8 -7,-5 -7,5 2,-8 -6,-5 8,0 z" fill="#FFFFFF"/>
    <rect x="0" y="-24" width="40" height="12" fill="#FFFFFF"/>
    <rect x="0" y="-12" width="40" height="12" fill="#DC2626"/>
  </g>

  <!-- chile map outline (elongated) background -->
  <path d="M120,60 C140,50 150,80 140,120 C155,150 140,190 150,230 C138,270 148,310 132,350 C140,380 120,400 110,380 C118,340 106,300 116,260 C104,220 116,180 108,140 C118,100 100,70 120,60 Z" fill="#FEE2E2" opacity="0.6"/>

  <!-- document with stamp -->
  <g transform="translate(400,240)">
    <rect x="-140" y="-130" width="280" height="240" rx="14" fill="#F8FAFC" stroke="#2563EB" stroke-width="4"/>
    <rect x="-140" y="-130" width="280" height="42" rx="14" fill="#2563EB"/>
    <rect x="-114" y="-114" width="90" height="14" rx="4" fill="#DBEAFE"/>

    <rect x="-114" y="-60" width="140" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-114" y="-38" width="170" height="8" rx="4" fill="#CBD5E1"/>

    <!-- RUT chip strip with dash and DV -->
    <g transform="translate(-114,0)">
      <rect x="0" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="20" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="42" y="9" width="8" height="4" fill="#94A3B8"/>
      <rect x="56" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="76" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="98" y="9" width="8" height="4" fill="#94A3B8"/>
      <rect x="112" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="132" y="0" width="16" height="22" rx="4" fill="#DDD6FE"/>
      <rect x="154" y="9" width="10" height="4" fill="#94A3B8"/>
      <circle cx="192" cy="11" r="18" fill="none" stroke="#DC2626" stroke-width="4"/>
      <rect x="182" y="0" width="16" height="22" rx="4" fill="#FCA5A5"/>
    </g>

    <rect x="-114" y="50" width="100" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- SII seal -->
  <g transform="translate(660,220)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#DC2626" stroke-width="4"/>
  </g>

  <!-- modulo 11 concept -->
  <g transform="translate(660,320)">
    <path d="M-20,0 A20,20 0 1 1 12,17" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <path d="M4,10 L12,17 L20,8" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- person with card -->
  <g transform="translate(200,360)">
    <circle cx="0" cy="-16" r="16" fill="#7C3AED"/>
    <path d="M-20,26 Q0,0 20,26 Z" fill="#7C3AED"/>
  </g>

  <!-- checkmark -->
  <g transform="translate(280,120)">
    <circle cx="0" cy="0" r="26" fill="#D1FAE5" stroke="#059669" stroke-width="4"/>
    <path d="M-11,2 L-3,11 L13,-9" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
