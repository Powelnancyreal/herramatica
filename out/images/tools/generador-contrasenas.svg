<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- floating abstract symbol chips -->
  <g stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.85" fill="none">
    <line x1="130" y1="90" x2="130" y2="106"/>
    <line x1="122" y1="98" x2="138" y2="98"/>
    <line x1="150" y1="90" x2="146" y2="106"/>
    <line x1="670" y1="100" x2="670" y2="116"/>
    <circle cx="670" cy="128" r="2.5" fill="#2563EB"/>
    <path d="M120,340 a14,14 0 1 0 14,-14" />
    <line x1="670" y1="340" x2="686" y2="356"/>
    <line x1="686" y1="340" x2="670" y2="356"/>
  </g>

  <!-- shield with checkmark -->
  <g transform="translate(620,280)">
    <path d="M0,-46 L40,-30 V6 C40,36 20,54 0,62 C-20,54 -40,36 -40,6 V-30 Z" fill="#059669"/>
    <path d="M-16,4 L-4,18 L20,-10" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- key icon -->
  <g transform="translate(180,300) rotate(-20)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1E3A8A" stroke-width="8"/>
    <rect x="18" y="-6" width="60" height="12" rx="4" fill="#1E3A8A"/>
    <rect x="60" y="6" width="10" height="14" fill="#1E3A8A"/>
    <rect x="76" y="6" width="10" height="18" fill="#1E3A8A"/>
  </g>

  <!-- padlock -->
  <g transform="translate(400,220)">
    <path d="M-50,-30 v-20 a50,50 0 0 1 100,0 v20" fill="none" stroke="#1E3A8A" stroke-width="16" stroke-linecap="round"/>
    <rect x="-80" y="-30" width="160" height="140" rx="18" fill="#1E3A8A"/>
    <circle cx="0" cy="24" r="16" fill="#FFFFFF"/>
    <rect x="-6" y="24" width="12" height="30" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- password dots below lock -->
  <g transform="translate(400,340)" fill="#7C3AED">
    <circle cx="-72" cy="0" r="9"/>
    <circle cx="-48" cy="0" r="9"/>
    <circle cx="-24" cy="0" r="9"/>
    <circle cx="0" cy="0" r="9"/>
    <circle cx="24" cy="0" r="9"/>
    <circle cx="48" cy="0" r="9"/>
    <circle cx="72" cy="0" r="9"/>
  </g>

  <!-- strength meter -->
  <g transform="translate(400,390)">
    <rect x="-100" y="-8" width="200" height="16" rx="8" fill="#E5E7EB"/>
    <rect x="-100" y="-8" width="170" height="16" rx="8" fill="#059669"/>
  </g>
</svg>
