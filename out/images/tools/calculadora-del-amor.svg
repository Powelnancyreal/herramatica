<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- sparkles/confetti -->
  <g fill="#F472B6">
    <path d="M660 80 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" opacity="0.85"/>
    <path d="M140 90 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" opacity="0.7"/>
  </g>
  <g fill="#7C3AED" opacity="0.7">
    <circle cx="120" cy="330" r="6"/>
    <circle cx="690" cy="310" r="5"/>
    <rect x="700" y="150" width="10" height="10" rx="2"/>
  </g>

  <!-- two persons -->
  <g transform="translate(220,260)">
    <circle cx="0" cy="-30" r="24" fill="#2563EB"/>
    <path d="M-32,30 Q0,-4 32,30 L28,70 Q0,84 -28,70 Z" fill="#2563EB"/>
  </g>
  <g transform="translate(580,260)">
    <circle cx="0" cy="-30" r="24" fill="#7C3AED"/>
    <path d="M-32,30 Q0,-4 32,30 L28,70 Q0,84 -28,70 Z" fill="#7C3AED"/>
  </g>

  <!-- cupid arrow -->
  <path d="M270,200 Q400,140 530,200" stroke="#F472B6" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
  <path d="M518,190 l16,10 -6,18" stroke="#F472B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- big heart center -->
  <g transform="translate(400,180)">
    <path d="M0,30 C-50,-10 -70,-60 -30,-70 C-10,-74 0,-56 0,-46 C0,-56 10,-74 30,-70 C70,-60 50,-10 0,30 Z" fill="#DC2626"/>
  </g>

  <!-- compatibility meter -->
  <g transform="translate(400,340)">
    <path d="M-110,0 A110,110 0 0 1 110,0" fill="none" stroke="#FBCFE8" stroke-width="18" stroke-linecap="round"/>
    <path d="M-110,0 A110,110 0 0 1 70,-84" fill="none" stroke="#DC2626" stroke-width="18" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="60" y2="-92" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#7C3AED"/>
  </g>

  <!-- name input boxes -->
  <g transform="translate(220,380)">
    <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
  </g>
  <g transform="translate(580,380)">
    <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>

  <!-- small hearts floating -->
  <g fill="#F472B6" opacity="0.8">
    <path d="M120,120 c-8,-8 -20,-2 -20,8 c0,8 12,16 20,22 c8,-6 20,-14 20,-22 c0,-10 -12,-16 -20,-8 Z"/>
    <path d="M680,220 c-6,-6 -15,-1 -15,6 c0,6 9,12 15,16 c6,-4 15,-10 15,-16 c0,-7 -9,-12 -15,-6 Z"/>
  </g>
</svg>
