<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- heart with ecg -->
  <g transform="translate(150,180)">
    <path d="M0,60 C-70,10 -90,-50 -40,-65 C-10,-74 0,-50 0,-40 C0,-50 10,-74 40,-65 C90,-50 70,10 0,60 Z" fill="none" stroke="#DC2626" stroke-width="6"/>
    <path d="M-70,-10 h30 l10,-24 14,40 10,-16 h60" stroke="#DC2626" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(70,300)" stroke="#334155" stroke-width="4" fill="none">
    <path d="M0,0 q6,-20 16,-30 q6,-6 12,0"/>
    <circle cx="30" cy="-28" r="6" fill="#334155" stroke="none"/>
  </g>

  <!-- cholesterol bars right -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="380" y="80">Colesterol Total</text>
    <rect x="380" y="88" width="320" height="18" rx="9" fill="#94A3B8"/>

    <text x="380" y="128">HDL (bueno)</text>
    <rect x="380" y="136" width="100" height="18" rx="9" fill="#059669"/>

    <text x="380" y="176">Triglicéridos</text>
    <rect x="380" y="184" width="200" height="18" rx="9" fill="#FBBF24"/>

    <text x="380" y="224">LDL (calculado)</text>
    <rect x="380" y="232" width="180" height="18" rx="9" fill="#DC2626"/>
  </g>

  <!-- formula -->
  <g transform="translate(540,290)">
    <rect x="-160" y="-20" width="320" height="40" rx="10" fill="#EDE9FE"/>
  </g>
  <text x="540" y="296" font-family="Arial, sans-serif" font-size="13" fill="#5B21B6" text-anchor="middle">LDL = Total &#8722; HDL &#8722; (TG &#247; 5)</text>
  <text x="540" y="330" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Fórmula de Friedewald</text>

  <!-- risk zones scale -->
  <g transform="translate(400,395)">
    <rect x="-320" y="-10" width="80" height="20" fill="#86EFAC"/>
    <rect x="-240" y="-10" width="80" height="20" fill="#FDE68A"/>
    <rect x="-160" y="-10" width="80" height="20" fill="#FDBA74"/>
    <rect x="-80" y="-10" width="80" height="20" fill="#FCA5A5"/>
  </g>
  <path d="M280,375 l6,15 -12,0 z" fill="#334155"/>
  <g font-family="Arial, sans-serif" font-size="9" fill="#334155">
    <text x="240" y="420">Óptimo &lt;100</text>
    <text x="330" y="420">Límite</text>
    <text x="410" y="420">Alto</text>
    <text x="480" y="420">Muy alto &gt;160</text>
  </g>

  <!-- medical cross -->
  <g transform="translate(700,90)">
    <circle cx="0" cy="0" r="26" fill="#FEE2E2"/>
    <rect x="-4" y="-14" width="8" height="28" rx="3" fill="#DC2626"/>
    <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#DC2626"/>
  </g>
</svg>
