<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- direct proportion top -->
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">Directa</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#334155">
    <text x="200" y="55">3 manzanas</text>
    <text x="420" y="55">=</text>
    <text x="470" y="55">$15</text>
    <text x="200" y="95">5 manzanas</text>
    <text x="420" y="95">=</text>
    <text x="470" y="95" fill="#DC2626">X</text>
  </g>
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <path d="M280,48 Q400,20 500,88"/>
    <path d="M280,88 Q400,120 500,48"/>
  </g>
  <g transform="translate(600,70)">
    <rect x="-90" y="-20" width="180" height="40" rx="10" fill="#2563EB"/>
  </g>
  <text x="600" y="76" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">X = B &#215; C &#247; A</text>

  <line x1="40" y1="150" x2="760" y2="150" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- inverse proportion bottom -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7C3AED">Inversa</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#334155">
    <text x="200" y="195">4 obreros</text>
    <text x="420" y="195">=</text>
    <text x="470" y="195">6 días</text>
    <text x="200" y="235">6 obreros</text>
    <text x="420" y="235">=</text>
    <text x="470" y="235" fill="#DC2626">X días</text>
  </g>
  <g stroke="#7C3AED" stroke-width="2" fill="none">
    <path d="M280,188 Q400,160 500,188"/>
    <path d="M280,228 Q400,256 500,228"/>
  </g>
  <g transform="translate(600,210)">
    <rect x="-90" y="-20" width="180" height="40" rx="10" fill="#7C3AED"/>
  </g>
  <text x="600" y="216" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">X = A &#215; B &#247; C</text>

  <!-- cross multiplication visual -->
  <g transform="translate(400,340)">
    <circle cx="0" cy="0" r="50" fill="#EDE9FE"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#5B21B6" text-anchor="middle">&#215;</text>
  </g>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">Multiplicación cruzada</text>
</svg>
