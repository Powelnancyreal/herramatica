<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- patient bed background -->
  <g transform="translate(150,320)" opacity="0.7">
    <rect x="-80" y="-10" width="160" height="30" rx="6" fill="#DBEAFE"/>
    <rect x="-90" y="20" width="14" height="30" fill="#93C5FD"/>
    <rect x="76" y="20" width="14" height="30" fill="#93C5FD"/>
    <ellipse cx="-40" cy="-18" rx="26" ry="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>

  <!-- left inputs -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <rect x="30" y="70" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="105" y="95" text-anchor="middle">PaO&#8322; = 95</text>
    <rect x="30" y="120" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="105" y="145" text-anchor="middle">FiO&#8322; = 0.38</text>
  </g>
  <g transform="translate(210,95)">
    <rect x="-14" y="-30" width="28" height="60" rx="6" fill="#059669"/>
    <circle cx="0" cy="-34" r="6" fill="#065F46"/>
  </g>

  <!-- center division -->
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#7C3AED" text-anchor="middle">&#247;</text>
  <g transform="translate(400,220)">
    <circle cx="0" cy="0" r="48" fill="#7C3AED"/>
  </g>
  <text x="400" y="228" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">250</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">PaFi</text>

  <!-- right classification scale -->
  <g transform="translate(650,220)">
    <rect x="-16" y="-140" width="32" height="280" rx="10" fill="#F1F5F9"/>
    <rect x="-16" y="-140" width="32" height="60" fill="#86EFAC"/>
    <rect x="-16" y="-80" width="32" height="60" fill="#FDE68A"/>
    <rect x="-16" y="-20" width="32" height="60" fill="#FDBA74"/>
    <rect x="-16" y="40" width="32" height="100" fill="#FCA5A5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
    <text x="600" y="-105">Normal &gt;300</text>
    <text x="600" y="-45">Leve 200-300</text>
    <text x="600" y="15">Moderado 100-200</text>
    <text x="600" y="90">Severo &lt;100</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M540,-45 h60"/>
    <path d="M588,-53 l12,8 -12,8"/>
  </g>

  <!-- lung outline -->
  <g transform="translate(300,340)" fill="none" stroke="#2563EB" stroke-width="3">
    <path d="M0,-40 v20 C-10,-10 -30,0 -30,30 C-30,55 -10,60 0,45"/>
    <path d="M0,-40 v20 C10,-10 30,0 30,30 C30,55 10,60 0,45"/>
  </g>
</svg>
