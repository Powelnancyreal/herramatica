<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- clock above book -->
  <g transform="translate(400,90)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#7C3AED" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="10" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- book -->
  <g filter="url(#ds)">
    <rect x="140" y="160" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="380" y="160" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  </g>
  <rect x="368" y="160" width="14" height="230" fill="#EDE9FE"/>

  <!-- left page text lines -->
  <g fill="#CBD5E1">
    <rect x="160" y="190" width="180" height="8" rx="4"/>
    <rect x="160" y="212" width="160" height="8" rx="4"/>
    <rect x="160" y="234" width="190" height="8" rx="4"/>
    <rect x="160" y="256" width="140" height="8" rx="4"/>
    <rect x="160" y="278" width="180" height="8" rx="4"/>
    <rect x="160" y="300" width="150" height="8" rx="4"/>
  </g>

  <!-- right page word count badge -->
  <g filter="url(#ds)">
    <rect x="410" y="220" width="180" height="70" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="500" y="252" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">1,234</text>
  <text x="500" y="276" font-family="Arial, sans-serif" font-size="15" fill="#7C3AED" text-anchor="middle">palabras</text>

  <!-- three speed bars -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <text x="140" y="420">Lenta</text>
    <rect x="210" y="406" width="60" height="16" rx="8" fill="#C4B5FD"/>

    <text x="330" y="420">Normal</text>
    <rect x="410" y="406" width="120" height="16" rx="8" fill="#8B5CF6"/>

    <text x="560" y="420">Rápida</text>
    <rect x="630" y="406" width="150" height="16" rx="8" fill="#5B21B6"/>
  </g>

  <!-- reading time output -->
  <g filter="url(#ds)">
    <rect x="300" y="20" width="200" height="42" rx="21" fill="#059669"/>
  </g>
  <text x="400" y="47" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5 min de lectura</text>
</svg>
