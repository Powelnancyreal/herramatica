<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- sun icon (hot) -->
  <g transform="translate(660,110)">
    <circle cx="0" cy="0" r="26" fill="#FBBF24"/>
    <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-52"/>
      <line x1="28" y1="-28" x2="36" y2="-36"/>
      <line x1="40" y1="0" x2="52" y2="0"/>
      <line x1="28" y1="28" x2="36" y2="36"/>
    </g>
  </g>

  <!-- snowflake icon (cold) -->
  <g transform="translate(140,110)" stroke="#60A5FA" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-24" y1="-14" x2="24" y2="14"/>
    <line x1="-24" y1="14" x2="24" y2="-14"/>
  </g>

  <!-- large thermometer center -->
  <g transform="translate(400,240)">
    <rect x="-18" y="-160" width="36" height="200" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="5"/>
    <circle cx="0" cy="60" r="38" fill="#DC2626"/>
    <rect x="-10" y="-130" width="20" height="180" rx="10" fill="#FCA5A5"/>
    <rect x="-10" y="-20" width="20" height="70" rx="10" fill="#DC2626"/>

    <!-- temperature zones -->
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="18" y1="-130" x2="30" y2="-130"/>
      <line x1="18" y1="-70" x2="30" y2="-70"/>
      <line x1="18" y1="-10" x2="30" y2="-10"/>
    </g>
    <rect x="30" y="-150" width="14" height="50" fill="#60A5FA" opacity="0.6" rx="4"/>
    <rect x="30" y="-100" width="14" height="60" fill="#FBBF24" opacity="0.6" rx="4"/>
    <rect x="30" y="-40" width="14" height="60" fill="#EF4444" opacity="0.6" rx="4"/>
  </g>

  <!-- C scale left -->
  <g transform="translate(260,240)">
    <rect x="-30" y="-40" width="60" height="80" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  </g>
  <!-- F scale right -->
  <g transform="translate(540,240)">
    <rect x="-30" y="-40" width="60" height="80" rx="14" fill="#FED7AA" stroke="#EA580C" stroke-width="3"/>
  </g>

  <!-- conversion arrows -->
  <g stroke="#7C3AED" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300,220 h60"/>
    <path d="M348,204 l16,16 -16,16"/>
    <path d="M500,260 h-60"/>
    <path d="M452,276 l-16,-16 16,-16"/>
  </g>

  <!-- Kelvin badge -->
  <g transform="translate(660,340)">
    <circle cx="0" cy="0" r="26" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <rect x="-8" y="-12" width="6" height="24" rx="2" fill="#7C3AED"/>
    <line x1="-2" y1="0" x2="10" y2="-12" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    <line x1="-2" y1="0" x2="10" y2="12" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
