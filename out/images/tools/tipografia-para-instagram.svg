<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- sparkle decorations -->
  <g fill="#F472B6">
    <path d="M120 90 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" opacity="0.85"/>
    <path d="M660 340 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" opacity="0.7"/>
  </g>

  <!-- phone mockup center -->
  <g transform="translate(300,225)">
    <rect x="-110" y="-190" width="220" height="380" rx="34" fill="#1E293B"/>
    <rect x="-92" y="-168" width="184" height="336" rx="16" fill="#FFFFFF"/>

    <!-- profile pic with instagram gradient ring -->
    <circle cx="0" cy="-120" r="34" fill="none" stroke="url(#ig)" stroke-width="6"/>
    <circle cx="0" cy="-120" r="26" fill="#EDE9FE"/>

    <!-- bio wavy font style lines -->
    <path d="M-60,-60 q15,-10 30,0 q15,10 30,0 q15,-10 30,0" stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-60,-36 q20,14 40,0 q20,-14 40,0" stroke="#2563EB" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-60,-12 q10,-16 20,0 q10,16 20,0 q10,-16 20,0 q10,16 20,0" stroke="#F472B6" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- copy button -->
    <rect x="-40" y="20" width="80" height="30" rx="15" fill="url(#ig)"/>
  </g>

  <!-- multiple font style examples right -->
  <g transform="translate(560,120)">
    <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#EDE9FE"/>
    <path d="M-50,0 h100" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(560,180)">
    <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#DBEAFE"/>
    <path d="M-50,0 q50,-16 100,0" stroke="#2563EB" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(560,240)">
    <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#FCE7F3"/>
    <path d="M-50,-8 l100,16 M-50,8 l100,-16" stroke="#F472B6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(560,300)">
    <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#D1FAE5"/>
    <path d="M-50,0 q10,-14 20,0 q10,14 20,0 q10,-14 20,0 q10,14 20,0 q10,-14 20,0" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- keyboard with special chars -->
  <g transform="translate(560,390)">
    <rect x="-90" y="-24" width="180" height="48" rx="10" fill="#1E293B"/>
    <g fill="#475569">
      <rect x="-74" y="-12" width="20" height="20" rx="4"/>
      <rect x="-48" y="-12" width="20" height="20" rx="4"/>
      <rect x="-22" y="-12" width="20" height="20" rx="4"/>
      <rect x="4" y="-12" width="20" height="20" rx="4"/>
      <rect x="30" y="-12" width="20" height="20" rx="4"/>
      <rect x="56" y="-12" width="20" height="20" rx="4"/>
    </g>
  </g>
</svg>
