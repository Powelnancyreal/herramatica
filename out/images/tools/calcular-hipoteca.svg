<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- bank building left -->
  <g transform="translate(140,150)" opacity="0.9">
    <rect x="-80" y="0" width="160" height="80" fill="#EDE9FE"/>
    <path d="M-90,0 L0,-46 L90,0 Z" fill="#059669"/>
    <rect x="-66" y="16" width="12" height="60" fill="#C4B5FD"/>
    <rect x="-38" y="16" width="12" height="60" fill="#C4B5FD"/>
    <rect x="-10" y="16" width="12" height="60" fill="#C4B5FD"/>
    <rect x="18" y="16" width="12" height="60" fill="#C4B5FD"/>
    <rect x="46" y="16" width="12" height="60" fill="#C4B5FD"/>
    <rect x="-86" y="80" width="172" height="12" fill="#065F46"/>
  </g>

  <!-- house center -->
  <g transform="translate(400,210)">
    <path d="M-110,0 L0,-90 L110,0 Z" fill="#7C3AED"/>
    <rect x="-90" y="0" width="180" height="120" fill="#EDE9FE"/>
    <rect x="-24" y="40" width="48" height="80" rx="4" fill="#7C3AED"/>
    <rect x="-70" y="30" width="34" height="34" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <rect x="36" y="30" width="34" height="34" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>

    <!-- percent on document -->
    <g transform="translate(90,-20)">
      <rect x="-26" y="-30" width="52" height="60" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
      <circle cx="-8" cy="-10" r="6" fill="none" stroke="#059669" stroke-width="3"/>
      <circle cx="8" cy="10" r="6" fill="none" stroke="#059669" stroke-width="3"/>
      <line x1="-12" y1="16" x2="12" y2="-16" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- key below house -->
  <g transform="translate(400,340) rotate(20)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F59E0B" stroke-width="7"/>
    <rect x="14" y="-5" width="46" height="10" rx="3" fill="#F59E0B"/>
    <rect x="46" y="5" width="8" height="12" fill="#F59E0B"/>
    <rect x="58" y="5" width="8" height="16" fill="#F59E0B"/>
  </g>

  <!-- coin stack right -->
  <g transform="translate(660,300)">
    <circle cx="0" cy="26" r="26" fill="#FDE68A" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="0" cy="-26" r="26" fill="#FCD34D" stroke="#F59E0B" stroke-width="4"/>
    <rect x="-3" y="-40" width="6" height="28" rx="3" fill="#F59E0B"/>
    <rect x="-14" y="-29" width="28" height="6" rx="3" fill="#F59E0B"/>
  </g>

  <!-- euro/peso badges floating -->
  <g transform="translate(680,120)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#059669" stroke-width="4"/>
    <path d="M10,-10 C0,-16 -10,-6 -10,0 C-10,6 0,16 10,10" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(120,320)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#7C3AED"/>
    <rect x="-9" y="-3" width="18" height="4" rx="2" fill="#7C3AED"/>
  </g>

  <!-- amortization curve -->
  <path d="M540,140 C580,150 610,180 630,220 C650,260 660,300 660,340" stroke="#059669" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- 30-year timeline bar -->
  <g transform="translate(400,410)">
    <rect x="-300" y="-8" width="600" height="16" rx="8" fill="#E5E7EB"/>
    <rect x="-300" y="-8" width="170" height="16" rx="8" fill="#7C3AED"/>
    <circle cx="-300" cy="0" r="10" fill="#059669"/>
    <circle cx="300" cy="0" r="10" fill="#059669"/>
  </g>
</svg>
