<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- linear equation top -->
  <g transform="translate(150,60)">
    <rect x="-90" y="-24" width="180" height="48" rx="12" fill="#2563EB"/>
  </g>
  <text x="150" y="66" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">ax + b = 0</text>

  <g transform="translate(150,140)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#94A3B8" stroke-width="3"/>
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="-60" y1="-6" x2="-60" y2="6"/>
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="60" y1="-6" x2="60" y2="6"/>
    </g>
    <circle cx="-20" cy="0" r="8" fill="#DC2626"/>
    <text x="-20" y="-16" font-family="Arial, sans-serif" font-size="12" fill="#DC2626" text-anchor="middle">x = &#8722;b/a</text>
  </g>

  <!-- quadratic equation bottom -->
  <g transform="translate(150,240)">
    <rect x="-100" y="-24" width="200" height="48" rx="12" fill="#7C3AED"/>
  </g>
  <text x="150" y="246" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">ax&#178; + bx + c = 0</text>

  <!-- parabola with grid -->
  <g stroke="#EDE9FE" stroke-width="1">
    <line x1="330" y1="80" x2="330" y2="380"/>
    <line x1="450" y1="80" x2="450" y2="380"/>
    <line x1="570" y1="80" x2="570" y2="380"/>
  </g>
  <line x1="300" y1="300" x2="700" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <path d="M330,340 Q500,120 670,340" stroke="#7C3AED" stroke-width="4" fill="none"/>
  <circle cx="380" cy="300" r="7" fill="#059669"/>
  <text x="380" y="322" font-family="Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle">x&#8321;</text>
  <circle cx="620" cy="300" r="7" fill="#059669"/>
  <text x="620" y="322" font-family="Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle">x&#8322;</text>

  <g transform="translate(660,110)">
    <rect x="-70" y="-18" width="140" height="36" rx="10" fill="#FBBF24"/>
  </g>
  <text x="660" y="116" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C2D12" text-anchor="middle">b&#178; &#8722; 4ac</text>

  <!-- quadratic formula -->
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5B21B6" text-anchor="middle">x = [&#8722;b &#177; &#8730;(b&#178;&#8722;4ac)] / 2a</text>

  <!-- three case badges -->
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="40" y="330" width="120" height="30" rx="15" fill="#059669"/>
    <text x="100" y="349">2 soluciones</text>
    <rect x="40" y="368" width="120" height="30" rx="15" fill="#FBBF24"/>
    <text x="100" y="387" fill="#7C2D12">1 solución</text>
    <rect x="40" y="406" width="150" height="30" rx="15" fill="#DC2626"/>
    <text x="115" y="425">Sin solución real</text>
  </g>
</svg>
