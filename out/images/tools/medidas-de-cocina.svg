<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- recipe book background -->
  <g transform="translate(140,180)" opacity="0.8">
    <rect x="-80" y="-90" width="160" height="180" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#EA580C" stroke-width="3"/>
    <rect x="-60" y="-60" width="40" height="8" rx="4" fill="#FDBA74"/>
    <rect x="-60" y="-40" width="50" height="8" rx="4" fill="#FDBA74"/>
    <rect x="10" y="-60" width="40" height="8" rx="4" fill="#FDBA74"/>
    <rect x="10" y="-40" width="50" height="8" rx="4" fill="#FDBA74"/>
  </g>

  <!-- measuring cups lined up -->
  <g transform="translate(340,280)">
    <path d="M-20,-30 h40 l-6,50 a4,4 0 0 1 -4,4 h-20 a4,4 0 0 1 -4,-4 Z" fill="#7C3AED"/>
    <rect x="16" y="-26" width="16" height="10" rx="3" fill="#7C3AED"/>
  </g>
  <g transform="translate(400,290)">
    <path d="M-26,-40 h52 l-8,66 a4,4 0 0 1 -4,4 h-28 a4,4 0 0 1 -4,-4 Z" fill="#2563EB"/>
    <rect x="20" y="-34" width="20" height="12" rx="3" fill="#2563EB"/>
  </g>
  <g transform="translate(470,280)">
    <path d="M-16,-24 h32 l-4,40 a4,4 0 0 1 -4,4 h-16 a4,4 0 0 1 -4,-4 Z" fill="#059669"/>
    <rect x="12" y="-20" width="12" height="8" rx="3" fill="#059669"/>
  </g>

  <!-- spoons -->
  <g transform="translate(260,350) rotate(-20)">
    <ellipse cx="0" cy="0" rx="16" ry="10" fill="#FBBF24"/>
    <rect x="-3" y="8" width="6" height="40" rx="3" fill="#FBBF24"/>
  </g>
  <g transform="translate(300,360) rotate(-10)">
    <ellipse cx="0" cy="0" rx="10" ry="6" fill="#F59E0B"/>
    <rect x="-2" y="4" width="4" height="26" rx="2" fill="#F59E0B"/>
  </g>

  <!-- beaker liquid -->
  <g transform="translate(560,300)">
    <path d="M-16,-40 h32 v10 l20,60 a8,8 0 0 1 -8,10 h-56 a8,8 0 0 1 -8,-10 l20,-60 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <path d="M-24,10 h48 v14 a8,8 0 0 1 -8,8 h-32 a8,8 0 0 1 -8,-8 Z" fill="#93C5FD"/>
    <line x1="-16" y1="-40" x2="16" y2="-40" stroke="#2563EB" stroke-width="3"/>
  </g>

  <!-- kitchen scale -->
  <g transform="translate(680,240)">
    <rect x="-46" y="0" width="92" height="20" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <rect x="-30" y="-40" width="60" height="40" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  </g>

  <!-- measurement equivalents bars -->
  <g transform="translate(400,400)">
    <rect x="-220" y="-8" width="80" height="16" rx="8" fill="#FED7AA"/>
    <rect x="-120" y="-8" width="130" height="16" rx="8" fill="#7C3AED"/>
    <rect x="30" y="-8" width="190" height="16" rx="8" fill="#059669"/>
  </g>
</svg>
