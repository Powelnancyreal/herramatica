<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- circuit board pattern background -->
  <g stroke="#D1FAE5" stroke-width="3" opacity="0.7" fill="none">
    <path d="M40,60 h120 v60 h100"/>
    <path d="M760,80 h-100 v80 h-80"/>
    <path d="M40,390 h140 v-60 h90"/>
    <path d="M760,400 h-160 v-50 h-70"/>
  </g>
  <g fill="#A7F3D0">
    <circle cx="160" cy="60" r="5"/>
    <circle cx="260" cy="120" r="5"/>
    <circle cx="660" cy="80" r="5"/>
    <circle cx="580" cy="160" r="5"/>
    <circle cx="180" cy="390" r="5"/>
    <circle cx="270" cy="330" r="5"/>
  </g>

  <!-- binary digits as blocks floating -->
  <g fill="#059669" opacity="0.65">
    <rect x="90" y="150" width="10" height="18" rx="2"/>
    <circle cx="115" cy="159" r="5"/>
    <rect x="130" y="150" width="10" height="18" rx="2"/>
    <rect x="150" y="150" width="10" height="18" rx="2"/>
    <circle cx="175" cy="159" r="5"/>
    <rect x="620" y="260" width="10" height="18" rx="2"/>
    <circle cx="645" cy="269" r="5"/>
    <rect x="660" y="260" width="10" height="18" rx="2"/>
  </g>

  <!-- computer chip center -->
  <g transform="translate(400,220)">
    <rect x="-70" y="-70" width="140" height="140" rx="10" fill="#1E293B"/>
    <rect x="-46" y="-46" width="92" height="92" rx="6" fill="#334155"/>
    <g stroke="#059669" stroke-width="4">
      <line x1="-70" y1="-40" x2="-90" y2="-40"/>
      <line x1="-70" y1="0" x2="-90" y2="0"/>
      <line x1="-70" y1="40" x2="-90" y2="40"/>
      <line x1="70" y1="-40" x2="90" y2="-40"/>
      <line x1="70" y1="0" x2="90" y2="0"/>
      <line x1="70" y1="40" x2="90" y2="40"/>
      <line x1="-40" y1="-70" x2="-40" y2="-90"/>
      <line x1="0" y1="-70" x2="0" y2="-90"/>
      <line x1="40" y1="-70" x2="40" y2="-90"/>
      <line x1="-40" y1="70" x2="-40" y2="90"/>
      <line x1="0" y1="70" x2="0" y2="90"/>
      <line x1="40" y1="70" x2="40" y2="90"/>
    </g>
  </g>

  <!-- four number system boxes -->
  <g transform="translate(140,300)">
    <rect x="-46" y="-24" width="92" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  </g>
  <g transform="translate(260,340)">
    <rect x="-46" y="-24" width="92" height="48" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  </g>
  <g transform="translate(540,340)">
    <rect x="-46" y="-24" width="92" height="48" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
  </g>
  <g transform="translate(660,300)">
    <rect x="-46" y="-24" width="92" height="48" rx="10" fill="#111827" stroke="#059669" stroke-width="3"/>
  </g>

  <!-- conversion arrows -->
  <g stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M186,300 h40"/>
    <path d="M214,290 l12,10 -12,10"/>
    <path d="M494,340 h20"/>
    <path d="M504,330 l10,10 -10,10"/>
  </g>
</svg>
