<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- percentage markers at compass positions -->
  <g fill="#EDE9FE" stroke="#7C3AED" stroke-width="2">
    <circle cx="400" cy="60" r="16"/>
    <circle cx="700" cy="225" r="16"/>
    <circle cx="400" cy="390" r="16"/>
    <circle cx="100" cy="225" r="16"/>
  </g>
  <g stroke="#7C3AED" stroke-width="3" stroke-linecap="round">
    <line x1="392" y1="60" x2="408" y2="60"/>
    <line x1="692" y1="225" x2="708" y2="225"/>
    <line x1="392" y1="390" x2="408" y2="390"/>
    <line x1="92" y1="225" x2="108" y2="225"/>
  </g>

  <!-- pie chart -->
  <g transform="translate(260,225)">
    <circle cx="0" cy="0" r="110" fill="#DBEAFE"/>
    <path d="M0,0 L0,-110 A110,110 0 0 1 95,55 Z" fill="#7C3AED"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#2563EB" stroke-width="4"/>
  </g>

  <!-- large percent symbol -->
  <g transform="translate(520,180)">
    <circle cx="-40" cy="-40" r="24" fill="none" stroke="#2563EB" stroke-width="12"/>
    <circle cx="40" cy="40" r="24" fill="none" stroke="#2563EB" stroke-width="12"/>
    <line x1="-54" y1="54" x2="54" y2="-54" stroke="#7C3AED" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- up arrow (increase) -->
  <g transform="translate(600,320)" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M-30,20 L0,-20 L30,10"/>
    <path d="M0,-20 L0,-2"/>
    <path d="M-22,-20 L0,-20"/>
  </g>

  <!-- down arrow (decrease/discount) -->
  <g transform="translate(660,120)" stroke="#DC2626" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M-30,-16 L0,20 L30,-10"/>
  </g>

  <!-- calculator -->
  <g transform="translate(150,340)">
    <rect x="-56" y="-60" width="112" height="120" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-42" y="-46" width="84" height="26" rx="6" fill="#EDE9FE"/>
    <g fill="#DDD6FE">
      <rect x="-42" y="-10" width="20" height="20" rx="5"/>
      <rect x="-12" y="-10" width="20" height="20" rx="5"/>
      <rect x="18" y="-10" width="20" height="20" rx="5"/>
      <rect x="-42" y="18" width="20" height="20" rx="5"/>
      <rect x="-12" y="18" width="20" height="20" rx="5"/>
      <rect x="18" y="18" width="20" height="20" rx="5" fill="#2563EB"/>
    </g>
  </g>
</svg>
