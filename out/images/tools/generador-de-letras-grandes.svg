<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- background printed sheets -->
  <g filter="url(#ds)" opacity="0.6">
    <rect x="90" y="60" width="140" height="180" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" transform="rotate(-4 160 150)"/>
    <rect x="580" y="60" width="140" height="180" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" transform="rotate(4 650 150)"/>
  </g>

  <!-- graffiti A -->
  <g transform="translate(190,220)">
    <path d="M0,-90 L-60,90 L-30,90 L-15,45 L15,45 L30,90 L60,90 Z" fill="#7C3AED" stroke="#5B21B6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-6,10 L6,10 L0,-30 Z" fill="#F8F7FF"/>
  </g>
  <text x="190" y="360" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5B21B6" text-anchor="middle">Grafiti</text>
  <g transform="translate(120,390)">
    <rect x="-14" y="-30" width="28" height="60" rx="12" fill="#DC2626"/>
    <circle cx="0" cy="-34" r="6" fill="#334155"/>
  </g>

  <!-- script A -->
  <g transform="translate(400,220)">
    <path d="M-40,80 C-30,20 -10,-70 0,-90 C10,-70 30,20 40,80" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
    <path d="M-18,20 Q0,0 18,20" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <path d="M40,80 q30,10 40,-10" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">Script</text>

  <!-- block/stencil A -->
  <g transform="translate(610,220)">
    <polygon points="0,-90 -55,90 -25,90 -14,55 14,55 25,90 55,90 20,-30 -20,-30" fill="#059669" stroke="#047857" stroke-width="4"/>
    <polygon points="-8,10 8,10 0,-25" fill="#F8F7FF"/>
  </g>
  <text x="610" y="360" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle">Molde</text>

  <!-- color palette -->
  <g transform="translate(400,410)">
    <circle cx="-60" cy="0" r="12" fill="#7C3AED"/>
    <circle cx="-30" cy="0" r="12" fill="#2563EB"/>
    <circle cx="0" cy="0" r="12" fill="#059669"/>
    <circle cx="30" cy="0" r="12" fill="#DC2626"/>
    <circle cx="60" cy="0" r="12" fill="#F59E0B"/>
  </g>

  <!-- download icon -->
  <g transform="translate(700,400)" stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="0" y1="-16" x2="0" y2="10"/>
    <path d="M-10,0 L0,10 L10,0"/>
    <line x1="-14" y1="18" x2="14" y2="18"/>
  </g>
</svg>
