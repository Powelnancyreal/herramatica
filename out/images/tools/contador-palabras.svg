<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- floating letter chips -->
  <g fill="#EDE9FE" stroke="#0D9488" stroke-width="2">
    <rect x="90" y="80" width="30" height="30" rx="7"/>
    <rect x="660" y="90" width="30" height="30" rx="7"/>
    <rect x="100" y="340" width="30" height="30" rx="7"/>
    <rect x="670" y="330" width="30" height="30" rx="7"/>
    <rect x="140" y="200" width="26" height="26" rx="6"/>
  </g>

  <!-- document -->
  <g transform="translate(330,220)">
    <rect x="-170" y="-160" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="4"/>
    <rect x="-140" y="-130" width="220" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="-106" width="260" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="-82" width="180" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="-40" width="240" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="-16" width="200" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="8" width="220" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="50" width="160" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="74" width="230" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-140" y="98" width="140" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- word count badge -->
  <g transform="translate(560,150)">
    <rect x="-80" y="-40" width="160" height="80" rx="18" fill="#0D9488"/>
    <rect x="-50" y="-8" width="100" height="16" rx="8" fill="#FFFFFF"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(230,260)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#7C3AED" stroke-width="8"/>
    <line x1="24" y1="24" x2="52" y2="52" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- reading time clock -->
  <g transform="translate(600,320)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#0D9488" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="10" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
