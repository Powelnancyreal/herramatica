<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- track / road -->
  <path d="M0,360 Q400,320 800,360" stroke="#E2E8F0" stroke-width="60" fill="none"/>
  <path d="M0,360 Q400,320 800,360" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="18 14" fill="none"/>
  <g fill="#94A3B8">
    <circle cx="200" cy="345" r="6"/>
    <circle cx="400" cy="322" r="6"/>
    <circle cx="600" cy="340" r="6"/>
  </g>

  <!-- finish line tape background -->
  <g transform="translate(680,300)" opacity="0.5">
    <g fill="#111827">
      <rect x="-6" y="-100" width="12" height="12"/>
      <rect x="6" y="-88" width="12" height="12"/>
      <rect x="-6" y="-76" width="12" height="12"/>
      <rect x="6" y="-64" width="12" height="12"/>
    </g>
  </g>

  <!-- running person -->
  <g transform="translate(220,290)">
    <circle cx="0" cy="-70" r="18" fill="#EA580C"/>
    <path d="M0,-52 L-10,-10 L-30,20" stroke="#7C3AED" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M0,-52 L18,-16 L36,-30" stroke="#7C3AED" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-10,-10 L-40,10" stroke="#EA580C" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-10,-10 L16,26" stroke="#EA580C" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- running shoe -->
  <g transform="translate(180,340)">
    <path d="M-20,10 q-10,-4 -10,-14 q0,-10 12,-8 l30,4 q10,2 10,14 q0,6 -8,6 Z" fill="#7C3AED"/>
  </g>

  <!-- stopwatch right -->
  <g transform="translate(650,150)">
    <rect x="-8" y="-56" width="16" height="10" rx="3" fill="#EA580C"/>
    <circle cx="0" cy="0" r="52" fill="#FFFFFF" stroke="#EA580C" stroke-width="7"/>
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="12" stroke="#EA580C" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- pace chart bars left -->
  <g transform="translate(120,150)">
    <rect x="0" y="0" width="18" height="30" fill="#DDD6FE"/>
    <rect x="24" y="-14" width="18" height="44" fill="#7C3AED"/>
    <rect x="48" y="-6" width="18" height="36" fill="#A78BFA"/>
  </g>

  <!-- heart rate wave -->
  <path d="M420,140 h30 l10,-24 14,48 10,-24 h30" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- race distance dots -->
  <g fill="#7C3AED">
    <circle cx="480" cy="220" r="8"/>
    <circle cx="520" cy="220" r="12"/>
    <circle cx="565" cy="220" r="16"/>
    <circle cx="620" cy="220" r="20"/>
  </g>
</svg>
