<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- grid background -->
  <g stroke="#EDE9FE" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- cube -->
  <g stroke="#7C3AED" stroke-width="2.5">
    <polygon points="75,140 145,140 145,210 75,210" fill="#EDE9FE"/>
    <polygon points="75,140 95,120 165,120 145,140" fill="#DDD6FE"/>
    <polygon points="145,140 165,120 165,190 145,210" fill="#C4B5FD"/>
  </g>
  <line x1="75" y1="230" x2="145" y2="230" stroke="#059669" stroke-width="2"/>
  <text x="110" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Cubo</text>
  <rect x="70" y="300" width="80" height="30" rx="10" fill="#7C3AED"/>
  <text x="110" y="320" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">V = a³</text>

  <!-- sphere -->
  <g stroke="#7C3AED" stroke-width="2.5">
    <circle cx="300" cy="175" r="55" fill="#EDE9FE"/>
    <ellipse cx="300" cy="175" rx="55" ry="18" fill="none"/>
    <ellipse cx="300" cy="175" rx="18" ry="55" fill="none"/>
  </g>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Esfera</text>
  <rect x="250" y="300" width="100" height="30" rx="10" fill="#7C3AED"/>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">V = 4/3&#960;r³</text>

  <!-- cone -->
  <g stroke="#7C3AED" stroke-width="2.5">
    <polygon points="500,110 455,222 545,222" fill="#EDE9FE"/>
    <ellipse cx="500" cy="222" rx="45" ry="14" fill="#DDD6FE"/>
  </g>
  <line x1="565" y1="110" x2="565" y2="222" stroke="#059669" stroke-width="2"/>
  <text x="500" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Cono</text>
  <rect x="450" y="300" width="100" height="30" rx="10" fill="#7C3AED"/>
  <text x="500" y="320" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">V = &#8531;&#960;r²h</text>

  <!-- rectangular prism -->
  <g stroke="#7C3AED" stroke-width="2.5">
    <polygon points="660,130 715,130 715,220 660,220" fill="#EDE9FE"/>
    <polygon points="660,130 680,112 735,112 715,130" fill="#DDD6FE"/>
    <polygon points="715,130 735,112 735,202 715,220" fill="#C4B5FD"/>
  </g>
  <text x="695" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Prisma</text>
  <rect x="640" y="300" width="110" height="30" rx="10" fill="#7C3AED"/>
  <text x="695" y="320" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">V = l&#215;w&#215;h</text>

  <!-- measuring tool icons -->
  <g transform="translate(60,410)">
    <rect x="-30" y="-8" width="60" height="16" rx="4" fill="#2563EB"/>
    <g stroke="#FFFFFF" stroke-width="1.5">
      <line x1="-15" y1="-8" x2="-15" y2="2"/>
      <line x1="0" y1="-8" x2="0" y2="4"/>
      <line x1="15" y1="-8" x2="15" y2="2"/>
    </g>
  </g>
  <g transform="translate(740,410)">
    <path d="M-14,10 L0,-14 L14,10" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="4" fill="#059669"/>
  </g>
</svg>
