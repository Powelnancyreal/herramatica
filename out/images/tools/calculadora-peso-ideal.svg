<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- height ruler left -->
  <g transform="translate(90,220)">
    <rect x="-16" y="-140" width="32" height="280" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <g stroke="#7C3AED" stroke-width="2">
      <line x1="-16" y1="-100" x2="0" y2="-100"/>
      <line x1="-16" y1="-40" x2="0" y2="-40"/>
      <line x1="-16" y1="20" x2="0" y2="20"/>
      <line x1="-16" y1="80" x2="0" y2="80"/>
    </g>
  </g>
  <text x="90" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">160 cm</text>

  <!-- person in green zone -->
  <g transform="translate(230,220)">
    <circle cx="0" cy="-70" r="20" fill="#059669"/>
    <rect x="-24" y="-46" width="48" height="80" rx="14" fill="#059669"/>
    <rect x="-18" y="36" width="16" height="60" rx="6" fill="#047857"/>
    <rect x="2" y="36" width="16" height="60" rx="6" fill="#047857"/>
  </g>

  <!-- horizontal scale bar -->
  <g transform="translate(500,190)">
    <rect x="-180" y="-18" width="80" height="36" fill="#FCA5A5"/>
    <rect x="-100" y="-18" width="100" height="36" fill="#86EFAC"/>
    <rect x="0" y="-18" width="90" height="36" fill="#FDE68A"/>
    <rect x="90" y="-18" width="80" height="36" fill="#FCA5A5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
    <text x="320" y="235">Bajo peso &lt;18.5</text>
    <text x="380" y="152">Normal 18.5-24.9</text>
    <text x="500" y="235">Sobrepeso 25-29.9</text>
    <text x="620" y="152">Obesidad &gt;30</text>
  </g>
  <path d="M450,150 l6,20 -12,0 z" fill="#334155"/>

  <!-- WHO badge -->
  <g transform="translate(670,300)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">OMS</text>
  </g>

  <!-- formula and result -->
  <text x="500" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">IMC = kg/m²</text>
  <g filter="none">
    <rect x="350" y="330" width="260" height="60" rx="14" fill="#059669"/>
  </g>
  <text x="480" y="356" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Tu peso ideal:</text>
  <text x="480" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">60-75 kg</text>
</svg>
