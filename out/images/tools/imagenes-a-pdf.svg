<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- stacked image thumbnails -->
  <g transform="translate(200,220)">
    <g transform="rotate(-10)">
      <rect x="-70" y="-56" width="140" height="100" rx="10" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="-38" cy="-26" r="10" fill="#FFFFFF"/>
      <path d="M-60,26 L-10,-10 L20,16 L44,-4 L60,26 Z" fill="#FFFFFF" opacity="0.7"/>
    </g>
    <g transform="rotate(2)">
      <rect x="-70" y="-46" width="140" height="100" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="3"/>
      <circle cx="-38" cy="-16" r="10" fill="#FFFFFF"/>
      <path d="M-60,36 L-10,0 L20,26 L44,6 L60,36 Z" fill="#FFFFFF" opacity="0.7"/>
    </g>
    <g transform="rotate(-3)">
      <rect x="-70" y="-30" width="140" height="100" rx="10" fill="#DDD6FE" stroke="#7C3AED" stroke-width="3"/>
      <circle cx="-38" cy="0" r="10" fill="#FFFFFF"/>
      <path d="M-60,52 L-10,16 L20,42 L44,22 L60,52 Z" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- clip holding pages -->
    <path d="M-50,-70 v40 a10,10 0 0 0 20,0 v-30 a5,5 0 0 1 10,0 v30 a20,20 0 0 1 -40,0 v-40 Z" fill="none" stroke="#475569" stroke-width="5"/>
  </g>

  <!-- arrow -->
  <g stroke="#DC2626" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M360,220 h90"/>
    <path d="M430,196 l24,24 -24,24"/>
  </g>

  <!-- PDF document -->
  <g transform="translate(600,220)">
    <path d="M-80,-140 h110 l40,40 v240 h-150 Z" fill="#FEE2E2" stroke="#DC2626" stroke-width="4"/>
    <path d="M30,-140 v40 h40 Z" fill="#FCA5A5"/>
    <rect x="-60" y="-50" width="130" height="46" rx="8" fill="#DC2626"/>
    <rect x="-60" y="20" width="90" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-60" y="42" width="110" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-60" y="64" width="70" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- download arrow below pdf -->
  <g transform="translate(600,390)" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="0" y1="-28" x2="0" y2="10"/>
    <path d="M-14,-4 L0,10 L14,-4"/>
  </g>
</svg>
