<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>
  <rect x="0" y="0" width="800" height="8" fill="#FDE047"/>
  <rect x="0" y="8" width="800" height="8" fill="#2563EB"/>
  <rect x="0" y="16" width="800" height="8" fill="#DC2626"/>

  <!-- worker left -->
  <g transform="translate(90,200)">
    <circle cx="0" cy="-30" r="20" fill="#7C3AED"/>
    <path d="M-24,20 Q0,-6 24,20 L20,60 Q0,72 -20,60 Z" fill="#7C3AED"/>
    <rect x="14" y="30" width="26" height="18" rx="3" fill="#5B21B6"/>
  </g>

  <!-- contract with stamp -->
  <g transform="translate(400,190)">
    <rect x="-140" y="-100" width="280" height="200" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <rect x="-110" y="-72" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-110" y="-50" width="180" height="10" rx="5" fill="#CBD5E1"/>
    <g transform="rotate(-18)">
      <rect x="-70" y="20" width="180" height="40" rx="6" fill="none" stroke="#DC2626" stroke-width="3"/>
      <text x="20" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#DC2626" text-anchor="middle">TERMINADO</text>
    </g>
  </g>

  <!-- building right -->
  <g transform="translate(700,200)">
    <rect x="-50" y="-70" width="100" height="140" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <rect x="-34" y="-54" width="18" height="18" fill="#C4B5FD"/>
    <rect x="-4" y="-54" width="18" height="18" fill="#C4B5FD"/>
    <rect x="16" y="-54" width="18" height="18" fill="#C4B5FD"/>
    <rect x="-34" y="-26" width="18" height="18" fill="#C4B5FD"/>
    <rect x="-4" y="-26" width="18" height="18" fill="#C4B5FD"/>
    <rect x="16" y="-26" width="18" height="18" fill="#C4B5FD"/>
  </g>

  <!-- four payout bars -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">
    <rect x="40" y="330" width="170" height="30" rx="8" fill="#FBBF24"/>
    <text x="125" y="350" fill="#7C2D12">Cesantías</text>
    <rect x="220" y="330" width="150" height="30" rx="8" fill="#2563EB"/>
    <text x="295" y="350">Int. Cesantías 12%</text>
    <rect x="380" y="330" width="170" height="30" rx="8" fill="#7C3AED"/>
    <text x="465" y="350">Prima de Servicios</text>
    <rect x="560" y="330" width="150" height="30" rx="8" fill="#059669"/>
    <text x="635" y="350">Vacaciones</text>
  </g>

  <text x="400" y="400" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Código Sustantivo del Trabajo &#8226; COP</text>
</svg>
