<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650"><rect width="800" height="650" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="650" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="650" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cuánto necesitas para pasar la materia</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start">Escala de 0 a 5 · se aprueba con 3,0</text><rect x="44" y="214" width="229.33333333333334" height="150" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="158.66666666666669" y="248" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">Primer corte</text><text x="158.66666666666669" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">30 %</text><text x="158.66666666666669" y="322" font-family="Segoe Print, Comic Sans MS, cursive" font-size="38" font-weight="700" fill="#1D4ED8" text-anchor="middle">3,2</text><text x="158.66666666666669" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">aporta 0,96</text><rect x="285.33333333333337" y="214" width="229.33333333333334" height="150" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="400.00000000000006" y="248" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">Segundo corte</text><text x="400.00000000000006" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">30 %</text><text x="400.00000000000006" y="322" font-family="Segoe Print, Comic Sans MS, cursive" font-size="38" font-weight="700" fill="#1D4ED8" text-anchor="middle">2,8</text><text x="400.00000000000006" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">aporta 0,84</text><rect x="526.6666666666667" y="214" width="229.33333333333334" height="150" rx="14" fill="#FFFFFF" stroke="#F87171" stroke-width="2"/><text x="641.3333333333334" y="248" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">Tercer corte</text><text x="641.3333333333334" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">40 %</text><text x="641.3333333333334" y="322" font-family="Segoe Print, Comic Sans MS, cursive" font-size="38" font-weight="700" fill="#DC2626" text-anchor="middle">¿?</text><text x="44" y="396" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">¿Cuánto necesito en el tercer corte?</text><text x="44" y="432" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">1. Para que el 2,95 redondee a 3,0: 2,95 − 0,96 − 0,84 = 1,15</text><text x="44" y="464" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">2. 1,15 ÷ 0,40 = 2,875 → necesitas al menos 2,9</text><text x="44" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">3. Con 2,9: 0,96 + 0,84 + 1,16 = 2,96 → nota final 3,0 ✓</text><text x="44" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">La nota final se redondea a un decimal: 2,95 sube a 3,0. Algunas</text><text x="44" y="562.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">universidades no redondean: revisa tu reglamento.</text></g><text x="44" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calculadora-de-notas</text></svg>