" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">fuente se descuenta al vencer y luego se tiene en cuenta en tu</text><text x="44" y="710.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">declaración de renta.</text></g><text x="44" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-cdt</text></svg>