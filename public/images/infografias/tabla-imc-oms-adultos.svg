<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 723" width="800" height="723">
<rect width="800" height="723" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Clasificación del IMC en adultos según</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">la OMS</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Dónde cae tu resultado y cómo se calcula</text>
<g transform="translate(0,67)"><rect x="40" y="170" width="720" height="64" rx="14" fill="#EDE9FE"/><text x="400" y="212" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#5B21B6" text-anchor="middle">IMC = peso (kg) ÷ altura (m)²</text><clipPath id="barra"><rect x="40" y="300" width="720" height="46" rx="23"/></clipPath><g clip-path="url(#barra)"><rect x="40" y="300" width="84" height="46" fill="#60A5FA"/><rect x="124" y="300" width="156" height="46" fill="#10B981"/><rect x="280" y="300" width="120" height="46" fill="#FBBF24"/><rect x="400" y="300" width="120" height="46" fill="#F97316"/><rect x="520" y="300" width="120" height="46" fill="#EF4444"/><rect x="640" y="300" width="120" height="46" fill="#B91C1C"/></g><text x="82" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Bajo peso</text><text x="82" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">menos de 18,5</text><text x="202" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Normal</text><text x="202" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">18,5 a 24,9</text><text x="340" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Sobrepeso</text><text x="340" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">25 a 29,9</text><text x="460" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Obesidad I</text><text x="460" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">30 a 34,9</text><text x="580" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Obesidad II</text><text x="580" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">35 a 39,9</text><text x="700" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Obesidad III</text><text x="700" y="404" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">40 o más</text><path d="M217.6,274 L241.6,274 L229.6,294 Z" fill="#334155"/><rect x="171.6" y="228" width="116" height="40" rx="20" fill="#334155"/><text x="229.6" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">IMC 22,9</text><text x="40" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">Ejemplo: 70 kg y 1,75 m → 70 ÷ (1,75 × 1,75) = 70 ÷ 3,06 =</text><text x="40" y="499.04" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">22,9, peso normal.</text><text x="40" y="542.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Para adultos de 18 años o más. En niños y adolescentes se usan</text><text x="40" y="567.1600000000001" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">percentiles por edad y sexo.</text></g>
<line x1="40" y1="671" x2="760" y2="671" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="701" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calcular-imc</text>
</svg>