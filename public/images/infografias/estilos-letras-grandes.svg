<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 789" width="800" height="789"><rect width="800" height="789" fill="#18181B"/><rect x="44" y="731" width="712" height="1.5" fill="#3F3F46"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F97316" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Tres estilos de letras grandes y para</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">qué usar cada uno</text><g transform="translate(0,44)"><rect x="44" y="176" width="712" height="136" rx="18" fill="#27272A"/><text x="68" y="262" font-family="Impact, Arial Black, sans-serif" font-size="64" font-weight="700" fill="#F97316" text-anchor="start">Sofía</text><text x="732" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="end">Grafiti</text><text x="732" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">Rótulos, carteles de fiesta y portadas</text><rect x="44" y="326" width="712" height="136" rx="18" fill="#27272A"/><text x="68" y="412" font-family="Segoe Script, Brush Script MT, cursive" font-size="58" font-weight="700" fill="#F472B6" text-anchor="start">Sofía</text><text x="732" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="end">Tatuaje</text><text x="732" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">Referencia para un tatuador o una invitación</text><rect x="44" y="476" width="712" height="136" rx="18" fill="#27272A"/><text x="68" y="562" font-family="Arial Black, Arial, sans-serif" font-size="60" font-weight="700" fill="#38BDF8" text-anchor="start">Sofía</text><text x="732" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="end">Molde</text><text x="732" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="end">Letras para recortar, murales y clase</text><text x="44" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Muestra aproximada de cada estilo. La herramienta genera una imagen</text><text x="44" y="660.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">con tu texto que puedes descargar o imprimir en varias hojas.</text></g><text x="44" y="763" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/generador-de-letras-grandes</text></svg>