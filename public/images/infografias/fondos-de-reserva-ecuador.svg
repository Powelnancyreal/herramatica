<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 685" width="800" height="685"><rect width="800" height="685" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="685" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="685" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo funcionan los fondos de reserva en</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Ecuador</text><g transform="translate(0,44)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="start">Desde el segundo año con el mismo empleador</text><text x="44" y="230" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="700" fill="#047857" text-anchor="start">8,33 % de la remuneración cada mes</text><text x="44" y="262" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Con un sueldo de $800 → $66,64 al mes · $799,68 al año</text><rect x="44" y="296" width="346" height="210" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="start">Cobrarlo cada mes</text><text x="62" y="372" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• Llega en tu rol de pagos.</text><text x="62" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• Lo usas cuando quieras.</text><text x="62" y="460" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• No genera intereses.</text><rect x="410" y="296" width="346" height="210" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="428" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="start">Acumularlo en el IESS</text><text x="428" y="372" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• Se deposita en tu cuenta del IESS.</text><text x="428" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• Genera intereses.</text><text x="428" y="460" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">• Sirve de garantía para préstamos</text><text x="428" y="482" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">  quirografarios e hipotecarios.</text><text x="44" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">No paga aportes al IESS ni impuesto a la renta. Si cambias de</text><text x="44" y="560.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">empleador, vuelves a cumplir un año antes de recibirlo de nuevo.</text></g><text x="44" y="659" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/fondos-de-reserva</text></svg>