<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 818" width="800" height="818"><rect width="800" height="818" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#15803D"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cuánto rinde un plazo fijo a 30 días</text><g transform="translate(0,27)"><rect x="44" y="180" width="712" height="96" rx="16" fill="#F0FDF4"/><text x="400" y="222" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="700" fill="#15803D" text-anchor="middle">interés = capital × TNA × días ÷ 365</text><text x="400" y="256" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2937" text-anchor="middle">$1.000.000 × 35 % × 30 ÷ 365 = $28.767</text><rect x="44" y="300" width="229.33333333333334" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="158.66666666666669" y="334" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle">Capital</text><text x="158.66666666666669" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle">$1.000.000</text><rect x="285.33333333333337" y="300" width="229.33333333333334" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="400.00000000000006" y="334" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle">Interés a 30 días</text><text x="400.00000000000006" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle">$28.767</text><rect x="526.6666666666667" y="300" width="229.33333333333334" height="96" rx="14" fill="#15803D" stroke="#E5E7EB" stroke-width="2"/><text x="641.3333333333334" y="334" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#DCFCE7" text-anchor="middle">Cobras al vencer</text><text x="641.3333333333334" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">$1.028.767</text><text x="44" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start">TNA o TEA: la misma tasa, dos formas de expresarla</text><rect x="44" y="462" width="712" height="74" rx="12" fill="#F0FDF4"/><text x="62" y="494" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">TNA</text><text x="62" y="520" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Lo que anuncia el banco. No incluye reinvertir los intereses.</text><text x="738" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#15803D" text-anchor="end">35 %</text><rect x="44" y="548" width="712" height="74" rx="12" fill="#F0FDF4"/><text x="62" y="580" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">TEA renovando cada 30 días</text><text x="62" y="606" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Si reinviertes capital e intereses todo el año.</text><text x="738" y="594" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#15803D" text-anchor="end">41,2 %</text><text x="44" y="654" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Tasa de ejemplo. Compara siempre la TNA del día con la inflación</text><text x="44" y="678.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">esperada: si la inflación es mayor, el plazo fijo pierde poder de</text><text x="44" y="702.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">compra.</text></g><text x="44" y="792" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-plazo-fijo</text></svg>