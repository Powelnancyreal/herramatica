<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 766" width="800" height="766"><rect width="800" height="766" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#0F766E"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">El triángulo de la velocidad, la</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">distancia y el tiempo</text><g transform="translate(0,68)"><path d="M230,190 L400,450 L60,450 Z" fill="#F0FDFA" stroke="#0F766E" stroke-width="4" stroke-linejoin="round"/><line x1="118" y1="362" x2="342" y2="362" stroke="#0F766E" stroke-width="3"/><line x1="230" y1="362" x2="230" y2="450" stroke="#0F766E" stroke-width="3"/><text x="230" y="310" font-family="Trebuchet MS, Arial, sans-serif" font-size="64" font-weight="700" fill="#0F766E" text-anchor="middle">d</text><text x="170" y="424" font-family="Trebuchet MS, Arial, sans-serif" font-size="54" font-weight="700" fill="#0F766E" text-anchor="middle">v</text><text x="290" y="424" font-family="Trebuchet MS, Arial, sans-serif" font-size="54" font-weight="700" fill="#0F766E" text-anchor="middle">t</text><text x="230" y="490" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle">Tapa lo que buscas y lee el resto</text><rect x="450" y="190" width="306" height="92" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="218" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Distancia</text><text x="468" y="248" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2937" text-anchor="start">d = v × t</text><text x="468" y="272" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#0F766E" text-anchor="start">100 km/h × 2,5 h = 250 km</text><rect x="450" y="294" width="306" height="92" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="322" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Velocidad</text><text x="468" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2937" text-anchor="start">v = d ÷ t</text><text x="468" y="376" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#0F766E" text-anchor="start">300 km ÷ 4 h = 75 km/h</text><rect x="450" y="398" width="306" height="92" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="426" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Tiempo</text><text x="468" y="456" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2937" text-anchor="start">t = d ÷ v</text><text x="468" y="480" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#0F766E" text-anchor="start">180 km ÷ 120 km/h = 1,5 h</text><rect x="44" y="530" width="712" height="84" rx="16" fill="#FEF3C7"/><text x="64" y="564" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#92400E" text-anchor="start">1,5 h no son 1 h 50 min</text><text x="64" y="594" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#92400E" text-anchor="start">Son 1 h 30 min: multiplica la parte decimal por 60.</text></g><text x="44" y="740" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-velocidad-distancia-tiempo</text></svg>