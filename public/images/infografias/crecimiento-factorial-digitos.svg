<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 838" width="800" height="838"><rect width="800" height="838" fill="#160B1A"/><rect x="44" y="780" width="712" height="1.5" fill="#3E2346"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F472B6" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Lo rápido que crece un factorial</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB" text-anchor="start">Cuántos dígitos tiene cada factorial</text><text x="44" y="240" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="start">5!</text><rect x="134" y="214" width="100.25666166333535" height="36" rx="8" fill="#26142C" stroke="#F472B6" stroke-width="1.5"/><text x="148" y="239" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">120</text><text x="756" y="239" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="end">3 dígitos</text><text x="44" y="302" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="start">10!</text><rect x="134" y="276" width="177.57898528297434" height="36" rx="8" fill="#26142C" stroke="#F472B6" stroke-width="1.5"/><text x="148" y="301" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">3.628.800</text><text x="756" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="end">7 dígitos</text><text x="44" y="364" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="start">20!</text><rect x="134" y="338" width="268.70227610552973" height="36" rx="8" fill="#26142C" stroke="#F472B6" stroke-width="1.5"/><text x="148" y="363" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">2,43 × 10¹⁸</text><text x="756" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="end">19 dígitos</text><text x="44" y="426" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="start">52!</text><rect x="134" y="400" width="385.0619192477246" height="36" rx="8" fill="#26142C" stroke="#F472B6" stroke-width="1.5"/><text x="148" y="425" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">8,07 × 10⁶⁷</text><text x="756" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="end">68 dígitos</text><text x="44" y="488" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#F472B6" text-anchor="start">100!</text><rect x="134" y="462" width="462" height="36" rx="8" fill="#26142C" stroke="#F472B6" stroke-width="1.5"/><text x="148" y="487" font-family="Consolas, monospace" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">9,33 × 10¹⁵⁷</text><text x="756" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="end">158 dígitos</text><rect x="44" y="546" width="712" height="150" rx="14" fill="#26142C"/><text x="64" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Ceros al final de 100!</text><text x="64" y="622" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#F472B6" text-anchor="start">⌊100 ÷ 5⌋ + ⌊100 ÷ 25⌋ = 20 + 4 = 24 ceros</text><text x="64" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">Cada cero sale de un par 2 × 5, y siempre sobran doses: basta contar los cincos.</text><text x="44" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">52! son las formas de barajar una baraja inglesa: ninguna mezcla</text><text x="44" y="750.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">bien hecha se ha repetido en la historia.</text></g><text x="44" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/calculadora-factorial</text></svg>