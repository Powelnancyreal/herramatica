<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 809" width="800" height="809"><rect width="800" height="809" fill="#FBF6EC"/><rect x="44" y="751" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">De dónde viene el Lorem Ipsum y cuánto</text><text x="44" y="132.8" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">usar</text><g transform="translate(0,44)"><text x="44" y="188" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#7C2D12" text-anchor="start">«Lorem ipsum dolor sit amet, consectetur adipiscing elit…»</text><text x="44" y="224" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Viene de un texto real, desordenado a propósito:</text><rect x="44" y="244" width="712" height="110" rx="14" fill="#F3E3C7"/><text x="64" y="282" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3B2F2A" text-anchor="start">«De finibus bonorum et malorum»</text><text x="64" y="314" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#3B2F2A" text-anchor="start">Cicerón, año 45 a. C. «Dolorem ipsum» significa «el dolor mismo».</text><text x="64" y="338" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">Un impresor lo usó como relleno en el siglo XVI y se popularizó en el XX.</text><text x="44" y="400" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3B2F2A" text-anchor="start">¿Cuánto texto de relleno necesito?</text><line x1="44" y1="464" x2="756" y2="464" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="452" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#3B2F2A" text-anchor="start">Titular</text><text x="756" y="452" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="end">3 a 8 palabras</text><line x1="44" y1="516" x2="756" y2="516" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="504" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#3B2F2A" text-anchor="start">Tarjeta de producto</text><text x="756" y="504" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="end">20 a 40 palabras</text><line x1="44" y1="568" x2="756" y2="568" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="556" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#3B2F2A" text-anchor="start">Párrafo de blog</text><text x="756" y="556" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="end">50 a 100 palabras</text><line x1="44" y1="620" x2="756" y2="620" stroke="#E7D8BE" stroke-width="1.5"/><text x="44" y="608" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#3B2F2A" text-anchor="start">Página de servicios</text><text x="756" y="608" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7C2D12" text-anchor="end">300 a 600 palabras</text><text x="44" y="652" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Sustituye todo el texto de relleno antes de publicar: una página con</text><text x="44" y="676.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Lorem Ipsum parece inacabada a los usuarios y a los buscadores.</text></g><text x="44" y="783" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/generador-lorem-ipsum</text></svg>