<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 749" width="800" height="749"><rect width="800" height="749" fill="#F5FEFF"/><rect x="44" y="691" width="712" height="1.5" fill="#CFF5FA"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E7490" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#164E63" text-anchor="start">Fórmulas de volumen de cubo,</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#164E63" text-anchor="start">esfera, cono y prisma</text><g transform="translate(0,44)"><rect x="44" y="176" width="348" height="186" rx="18" fill="#FFFFFF" stroke="#CFF5FA" stroke-width="2"/><rect x="74" y="236" width="70" height="70" fill="#A5F3FC" stroke="#0E7490" stroke-width="3"/><path d="M74,236 l20,-20 h70 l-20,20 M144,236 l20,-20 v70 l-20,20" fill="#CFFAFE" stroke="#0E7490" stroke-width="3"/><text x="224" y="226" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#164E63" text-anchor="start">Cubo</text><text x="224" y="266" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0E7490" text-anchor="start">V = l³</text><text x="224" y="300" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="start">l = 5 → 125</text><rect x="408" y="176" width="348" height="186" rx="18" fill="#FFFFFF" stroke="#CFF5FA" stroke-width="2"/><circle cx="483" cy="266" r="48" fill="#A5F3FC" stroke="#0E7490" stroke-width="3"/><ellipse cx="483" cy="266" rx="48" ry="14" fill="none" stroke="#0E7490" stroke-width="2" stroke-dasharray="5 5"/><text x="588" y="226" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#164E63" text-anchor="start">Esfera</text><text x="588" y="266" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0E7490" text-anchor="start">V = 4/3 × π × r³</text><text x="588" y="300" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="start">r = 3 → 113,10</text><rect x="44" y="376" width="348" height="186" rx="18" fill="#FFFFFF" stroke="#CFF5FA" stroke-width="2"/><path d="M119,412 L169,512 L69,512 Z" fill="#A5F3FC" stroke="#0E7490" stroke-width="3"/><ellipse cx="119" cy="512" rx="50" ry="12" fill="#CFFAFE" stroke="#0E7490" stroke-width="3"/><text x="224" y="426" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#164E63" text-anchor="start">Cono</text><text x="224" y="466" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0E7490" text-anchor="start">V = π × r² × h ÷ 3</text><text x="224" y="500" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="start">r = 3, h = 8 → 75,40</text><rect x="408" y="376" width="348" height="186" rx="18" fill="#FFFFFF" stroke="#CFF5FA" stroke-width="2"/><rect x="428" y="452" width="100" height="56" fill="#A5F3FC" stroke="#0E7490" stroke-width="3"/><path d="M428,452 l26,-22 h100 l-26,22 M528,452 l26,-22 v56 l-26,22" fill="#CFFAFE" stroke="#0E7490" stroke-width="3"/><text x="588" y="426" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#164E63" text-anchor="start">Prisma (caja)</text><text x="588" y="466" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#0E7490" text-anchor="start">V = l × a × h</text><text x="588" y="500" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#7E6A8A" text-anchor="start">4 × 3 × 2 → 24</text><text x="44" y="596" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">Las medidas en cm dan el volumen en cm³; divide entre 1.000 para</text><text x="44" y="620.3" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#7E6A8A" text-anchor="start">tenerlo en litros. Para cilindros hay una calculadora propia.</text></g><text x="44" y="723" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/calculadora-volumen</text></svg>