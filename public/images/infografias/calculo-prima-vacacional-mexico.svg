<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 791" width="800" height="791"><rect width="800" height="791" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="791" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="791" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo se calcula la prima vacacional en</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">México</text><g transform="translate(0,44)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">salario diario × días de vacaciones × 25 %</text><rect x="44" y="220" width="712" height="52" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Salario diario</text><text x="738" y="255" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="end">$500.00</text><rect x="44" y="282" width="712" height="52" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Días de vacaciones (1.er año)</text><text x="738" y="317" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="end">12</text><rect x="44" y="344" width="712" height="52" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Salario de las vacaciones</text><text x="738" y="379" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="end">$500 × 12 = $6,000.00</text><rect x="44" y="406" width="712" height="52" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="62" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Prima vacacional (25 %)</text><text x="738" y="441" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="end">$6,000 × 25 % = $1,500.00</text><rect x="44" y="492" width="712" height="110" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="64" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="start">¿Paga ISR?</text><text x="64" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Exenta hasta 15 UMA al año: 15 × $117.31 = $1,759.65</text><text x="64" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">En este ejemplo, los $1,500 están exentos.</text><text x="44" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">El 25 % es el mínimo de la Ley Federal del Trabajo (art. 80). Muchas</text><text x="44" y="666.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">empresas pagan más; revisa tu contrato.</text></g><text x="44" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-prima-vacacional</text></svg>