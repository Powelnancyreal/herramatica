<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 778" width="800" height="778"><rect width="800" height="778" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="778" fill="url(#g)"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5EEAD4" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Así se convierte una fila de CSV en un</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">objeto JSON</text><g transform="translate(0,44)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">CSV</text><text x="430" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">JSON</text><rect x="44" y="200" width="326" height="250" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="58" y="236" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#5EEAD4" text-anchor="start">nombre,edad,ciudad</text><text x="58" y="276" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#E0F2FE" text-anchor="start">Ana Pérez,31,Guadalajara</text><text x="58" y="316" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#FCD34D" text-anchor="start">"López, Luis",27,Monterrey</text><text x="58" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#93C5FD" text-anchor="start">↑ fila 1 = nombres de las claves</text><text x="58" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#93C5FD" text-anchor="start">↑ comillas: la coma es parte</text><text x="58" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#93C5FD" text-anchor="start">   del texto, no un separador</text><text x="400" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#5EEAD4" text-anchor="middle">→</text><rect x="430" y="200" width="326" height="250" rx="10" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="444" y="228" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">[</text><text x="459.4" y="256" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">{ "nombre": "Ana Pérez",</text><text x="474.8" y="284" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">"edad": 31,</text><text x="474.8" y="312" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">"ciudad": "Guadalajara" },</text><text x="459.4" y="340" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#FCD34D" text-anchor="start">{ "nombre": "López, Luis",</text><text x="474.8" y="368" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">"edad": 27,</text><text x="474.8" y="396" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">"ciudad": "Monterrey" }</text><text x="444" y="424" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#E0F2FE" text-anchor="start">]</text><text x="44" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Problemas habituales al convertir</text><rect x="44" y="504" width="712" height="50" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5EEAD4" text-anchor="start">Excel en español guarda con «;»</text><text x="742" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="end">porque la coma ya es el separador decimal</text><rect x="44" y="562" width="712" height="50" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5EEAD4" text-anchor="start">Códigos postales y teléfonos</text><text x="742" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="end">un 01020 convertido a número pierde el cero inicial</text><rect x="44" y="620" width="712" height="50" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5EEAD4" text-anchor="start">Acentos rotos (PÃ©rez)</text><text x="742" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="end">el archivo no estaba en UTF-8</text></g><text x="44" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/conversor-csv-json</text></svg>