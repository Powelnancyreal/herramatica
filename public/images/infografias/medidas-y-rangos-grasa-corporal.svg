<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 851" width="800" height="851"><rect width="800" height="851" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#6D28D9"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Dónde medir y qué porcentaje de grasa es</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">saludable</text><g transform="translate(0,68)"><circle cx="150" cy="220" r="30" fill="#DDD6FE"/><rect x="134" y="248" width="32" height="18" rx="4" fill="#DDD6FE"/><path d="M90,270 h120 l-10,150 h-100 Z" fill="#DDD6FE"/><rect x="105" y="420" width="36" height="120" rx="12" fill="#DDD6FE"/><rect x="159" y="420" width="36" height="120" rx="12" fill="#DDD6FE"/><line x1="130" y1="258" x2="170" y2="258" stroke="#6D28D9" stroke-width="4"/><text x="180" y="262" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start">cuello</text><line x1="94" y1="350" x2="206" y2="350" stroke="#6D28D9" stroke-width="4"/><text x="216" y="354" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start">cintura (ombligo)</text><line x1="96" y1="408" x2="204" y2="408" stroke="#DB2777" stroke-width="4" stroke-dasharray="6 4"/><text x="214" y="412" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#DB2777" text-anchor="start">cadera (mujeres)</text><text x="400" y="196" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Rangos de grasa corporal</text><text x="610" y="226" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Hombres</text><text x="710" y="226" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Mujeres</text><rect x="400" y="240" width="356" height="42" rx="10" fill="#F5F3FF"/><text x="412" y="268" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Esencial</text><text x="610" y="268" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">2–5 %</text><text x="710" y="268" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">10–13 %</text><rect x="400" y="290" width="356" height="42" rx="10" fill="#FFFFFF"/><text x="412" y="318" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Atleta</text><text x="610" y="318" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">6–13 %</text><text x="710" y="318" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">14–20 %</text><rect x="400" y="340" width="356" height="42" rx="10" fill="#EDE9FE"/><text x="412" y="368" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Forma física</text><text x="610" y="368" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">14–17 %</text><text x="710" y="368" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">21–24 %</text><rect x="400" y="390" width="356" height="42" rx="10" fill="#FFFFFF"/><text x="412" y="418" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Promedio</text><text x="610" y="418" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">18–24 %</text><text x="710" y="418" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">25–31 %</text><rect x="400" y="440" width="356" height="42" rx="10" fill="#F5F3FF"/><text x="412" y="468" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Obesidad</text><text x="610" y="468" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">25 % +</text><text x="710" y="468" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle">32 % +</text><rect x="44" y="560" width="712" height="70" rx="14" fill="#6D28D9"/><text x="64" y="604" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Hombre de 1,78 m, cuello 38 cm, cintura 86 cm → 17,2 %: forma física</text><text x="44" y="670" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Método de la Marina de Estados Unidos con cinta métrica. Mide por la</text><text x="44" y="694.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">mañana, en ayunas y siempre en el mismo sitio para comparar.</text></g><text x="44" y="825" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-grasa-corporal</text></svg>