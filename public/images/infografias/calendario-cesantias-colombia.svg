<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 857" width="800" height="857"><rect width="800" height="857" fill="#0B1020"/><rect x="44" y="799" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#5EEAD4" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">El calendario de las cesantías en</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Colombia</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#34D399" text-anchor="start">$ cesantias --anio 2026 --base 2000000</text><circle cx="58" cy="242" r="10" fill="#5EEAD4"/><line x1="58" y1="252" x2="58" y2="334" stroke="#1E2A4A" stroke-width="3"/><text x="84" y="248" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#5EEAD4" text-anchor="start">31 dic 2026</text><text x="84" y="276" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">Se liquidan las cesantías del año</text><text x="84" y="302" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># $2.000.000 × 360 ÷ 360 = $2.000.000</text><circle cx="58" cy="354" r="10" fill="#5EEAD4"/><line x1="58" y1="364" x2="58" y2="446" stroke="#1E2A4A" stroke-width="3"/><text x="84" y="360" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#5EEAD4" text-anchor="start">31 ene 2027</text><text x="84" y="388" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">Intereses del 12 % directo al trabajador</text><text x="84" y="414" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># $2.000.000 × 12 % = $240.000</text><circle cx="58" cy="466" r="10" fill="#5EEAD4"/><text x="84" y="472" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#5EEAD4" text-anchor="start">14 feb 2027</text><text x="84" y="500" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">El empleador consigna al fondo</text><text x="84" y="526" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># el dinero queda a tu nombre en el fondo de cesantías</text><rect x="44" y="568" width="712" height="104" rx="10" fill="#111A33"/><text x="60" y="598" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#34D399" text-anchor="start">para qué puedes retirarlas</text><text x="60" y="624" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E5E7EB" text-anchor="start">• comprar, construir o mejorar vivienda</text><text x="60" y="644" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E5E7EB" text-anchor="start">• pagar estudios propios, del cónyuge o de los hijos</text><text x="60" y="664" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E5E7EB" text-anchor="start">• al terminar el contrato de trabajo</text><text x="44" y="704" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// si el empleador consigna tarde, debe un día de salario por cada</text><text x="44" y="728.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">día de retraso (art. 99, Ley 50 de 1990).</text></g><text x="44" y="831" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/calcular-cesantias</text></svg>