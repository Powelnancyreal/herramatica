<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840"><rect width="800" height="840" fill="#FFFFFF"/><rect x="44" y="782" width="712" height="1.5" fill="#E5E7EB"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Un mismo azul escrito en cinco formatos</text><g transform="translate(0,3)"><rect x="44" y="180" width="230" height="300" rx="18" fill="#2563EB"/><text x="159" y="340" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">#2563EB</text><rect x="300" y="180" width="456" height="52" rx="10" fill="#EFF6FF"/><text x="314" y="202" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">HEX</text><text x="376" y="202" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#3B2F2A" text-anchor="start">#2563EB</text><text x="376" y="222" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="start">web y CSS</text><rect x="300" y="242" width="456" height="52" rx="10" fill="#EFF6FF"/><text x="314" y="264" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">RGB</text><text x="376" y="264" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#3B2F2A" text-anchor="start">rgb(37, 99, 235)</text><text x="376" y="284" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="start">pantallas: rojo, verde, azul de 0 a 255</text><rect x="300" y="304" width="456" height="52" rx="10" fill="#EFF6FF"/><text x="314" y="326" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">HSL</text><text x="376" y="326" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#3B2F2A" text-anchor="start">hsl(221, 83%, 53%)</text><text x="376" y="346" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="start">tono, saturación y luminosidad</text><rect x="300" y="366" width="456" height="52" rx="10" fill="#EFF6FF"/><text x="314" y="388" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">HSV</text><text x="376" y="388" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#3B2F2A" text-anchor="start">hsv(221, 84%, 92%)</text><text x="376" y="408" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="start">el modelo de Photoshop y Figma</text><rect x="300" y="428" width="456" height="52" rx="10" fill="#EFF6FF"/><text x="314" y="450" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">CMYK</text><text x="376" y="450" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#3B2F2A" text-anchor="start">cmyk(84%, 58%, 0%, 8%)</text><text x="376" y="470" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#7C6A58" text-anchor="start">aproximado para imprenta</text><text x="44" y="520" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#3B2F2A" text-anchor="start">Escala de tonos del mismo color</text><rect x="44" y="536" width="75.11111111111111" height="60" rx="8" fill="#E8EEFD"/><rect x="123.11111111111111" y="536" width="75.11111111111111" height="60" rx="8" fill="#B9CDF9"/><rect x="202.22222222222223" y="536" width="75.11111111111111" height="60" rx="8" fill="#8AABF4"/><rect x="281.33333333333337" y="536" width="75.11111111111111" height="60" rx="8" fill="#5C8AF0"/><rect x="360.44444444444446" y="536" width="75.11111111111111" height="60" rx="8" fill="#2D69EC"/><rect x="439.55555555555554" y="536" width="75.11111111111111" height="60" rx="8" fill="#134FD2"/><rect x="518.6666666666667" y="536" width="75.11111111111111" height="60" rx="8" fill="#0F3DA3"/><rect x="597.7777777777778" y="536" width="75.11111111111111" height="60" rx="8" fill="#0B2C75"/><rect x="676.8888888888889" y="536" width="75.11111111111111" height="60" rx="8" fill="#061A46"/><rect x="44" y="632" width="348" height="64" rx="12" fill="#2563EB"/><text x="62" y="672" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Blanco encima: 5,17:1 ✓</text><rect x="408" y="632" width="348" height="64" rx="12" fill="#2563EB"/><text x="426" y="672" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#000000" text-anchor="start">Negro encima: 4,06:1 ✗</text><text x="44" y="728" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Los dos textos se leen, pero solo el blanco supera el 4,5:1 que pide</text><text x="44" y="752.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">WCAG para texto normal.</text></g><text x="44" y="814" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/selector-de-color</text></svg>