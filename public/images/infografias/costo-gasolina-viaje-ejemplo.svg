<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 847" width="800" height="847"><rect width="800" height="847" fill="#FBF6EC"/><rect x="44" y="789" width="712" height="1.5" fill="#E3DCCB"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cuánto cuesta la gasolina de un viaje</text><text x="44" y="140.8" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#7C6A58" text-anchor="start">Ejemplo: 450 km con un coche que gasta 7 L/100 km y gasolina a</text><text x="44" y="167.8" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#7C6A58" text-anchor="start">$24.50</text><g transform="translate(0,57)"><rect x="44" y="196" width="712" height="40" rx="20" fill="#57534E"/><rect x="74" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="134" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="194" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="254" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="314" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="374" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="434" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="494" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="554" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="614" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><rect x="674" y="213" width="30" height="6" rx="3" fill="#FDE68A"/><circle cx="64" cy="216" r="14" fill="#15803D"/><circle cx="736" cy="216" r="14" fill="#B45309"/><text x="44" y="270" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#7C6A58" text-anchor="start">Origen</text><text x="756" y="270" font-family="Georgia, serif" font-size="17" font-weight="400" fill="#7C6A58" text-anchor="end">D