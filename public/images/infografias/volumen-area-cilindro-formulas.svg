<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690"><rect width="800" height="690" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#6D28D9"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Volumen y área de un cilindro</text><g transform="translate(0,27)"><path d="M90,220 V460 A110,34 0 0 0 310,460 V220" fill="#DDD6FE" stroke="#6D28D9" stroke-width="3"/><ellipse cx="200" cy="220" rx="110" ry="34" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/><path d="M90,460 A110,34 0 0 1 310,460" fill="none" stroke="#6D28D9" stroke-width="2" stroke-dasharray="6 6"/><line x1="200" y1="220" x2="310" y2="220" stroke="#DC2626" stroke-width="3"/><text x="255" y="174" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">r = 3 cm</text><line x1="336" y1="220" x2="336" y2="460" stroke="#6B7280" stroke-width="2"/><text x="346" y="340" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">h = 10 cm</text><rect x="450" y="196" width="306" height="98" rx="14" fill="#F5F3FF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="224" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Volumen</text><text x="468" y="252" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">V = π × r² × h</text><text x="468" y="280" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="start">282,74 cm³ = 0,28 L</text><rect x="450" y="306" width="306" height="98" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="334" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Área lateral</text><text x="468" y="362" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">AL = 2 × π × r × h</text><text x="468" y="390" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="start">188,50 cm²</text><rect x="450" y="416" width="306" height="98" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/><text x="468" y="444" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Área total</text><text x="468" y="472" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">AT = AL + 2 × π × r²</text><text x="468" y="500" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="start">245,04 cm²</text><text x="44" y="550" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Para pasar de cm³ a litros divide entre 1.000. Un vaso de 3 cm de</text><text x="44" y="574.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">radio y 10 cm de alto contiene unos 280 ml.</text></g><text x="44" y="664" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-volumen-cilindro</text></svg>