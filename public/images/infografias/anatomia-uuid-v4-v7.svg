<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 763" width="800" height="763"><rect width="800" height="763" fill="#111827"/><rect x="44" y="705" width="712" height="1.5" fill="#374151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Cómo leer un UUID v4 y un UUID v7</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">UUID v4 (aleatorio)</text><text x="44" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#E5E7EB" text-anchor="start">3f2b8c1e</text><text x="159.2" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="173.6" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#E5E7EB" text-anchor="start">9d4a</text><text x="231.2" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="245.6" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#F472B6" text-anchor="start">4e7c</text><text x="303.2" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="317.59999999999997" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#34D399" text-anchor="start">b1a2</text><text x="375.2" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="389.59999999999997" y="234" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#E5E7EB" text-anchor="start">5d6e7f8a9b0c</text><text x="44" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">122 bits al azar: la probabilidad de repetir uno es prácticamente nula.</text><text x="44" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">UUID v7 (ordenado por tiempo)</text><text x="44" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#FDE68A" text-anchor="start">019a1b2c</text><text x="159.2" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="173.6" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#FDE68A" text-anchor="start">3d4e</text><text x="231.2" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="245.6" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#F472B6" text-anchor="start">7f01</text><text x="303.2" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="317.59999999999997" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#34D399" text-anchor="start">8a2b</text><text x="375.2" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#9CA3AF" text-anchor="start">-</text><text x="389.59999999999997" y="364" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#E5E7EB" text-anchor="start">3c4d5e6f7a8b</text><text x="44" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Los primeros 48 bits son la fecha en milisegundos: se ordenan solos.</text><rect x="44" y="450" width="22" height="22" rx="5" fill="#F472B6"/><text x="78" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">La primera cifra del tercer bloque es la versión: 4 o 7</text><rect x="44" y="488" width="22" height="22" rx="5" fill="#34D399"/><text x="78" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">El cuarto bloque empieza por 8, 9, a o b (variante)</text><rect x="44" y="526" width="22" height="22" rx="5" fill="#FDE68A"/><text x="78" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">En v7, la marca de tiempo</text><rect x="44" y="584" width="348" height="96" rx="14" fill="#1F2937"/><text x="62" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Usa v4 para</text><text x="62" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">tokens, nombres de archivo</text><rect x="408" y="584" width="348" height="96" rx="14" fill="#1F2937"/><text x="426" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start">Usa v7 para</text><text x="426" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">claves de bases de datos</text></g><text x="44" y="737" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/generador-uuid</text></svg>