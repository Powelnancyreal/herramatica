ión</text><text x="428" y="276" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">3 por mil × S/ 300,000</text><text x="428" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">S/ 900.00</text><text x="428" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#93C5FD" text-anchor="start">según el valor del acto</text><text x="44" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Total referencial</text><text x="756" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#FCA5A5" text-anchor="end">S/ 944.55</text><text x="44" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Tasa de inscripción por tipo de acto</text><rect x="44" y="488" width="712" height="42" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Compraventa de inmueble</text><text x="742" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FCA5A5" text-anchor="end">3 por mil del precio</text><rect x="44" y="538" width="712" height="42" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Hipoteca</text><text x="742" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FCA5A5" text-anchor="end">1.5 por mil del monto</text><rect x="44" y="588" width="712" height="42" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="1.5"/><text x="58" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-an