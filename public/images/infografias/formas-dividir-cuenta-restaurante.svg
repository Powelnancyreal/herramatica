egoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">$330</text><text x="64" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Pablo</text><text x="372" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">$330</text><text x="64" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Rápido y sin discusión</text><rect x="408" y="214" width="348" height="280" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="428" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#B45309" text-anchor="start">Cada quien lo suyo</text><text x="428" y="296" font-family="Segoe Print, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Ana ($400)</text><text x="736" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">$440</text><text x="428" y="336" font-family="Segoe Print, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Luis ($250)</text><text x="736" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">$275</text><text x="428" y="376" font-family="Segoe Print, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Sara ($350)</text><text x="736" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">$385</text><text x="428" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#1E3A8A" text-anchor="start">Pablo ($200)</text><text x="736" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="e