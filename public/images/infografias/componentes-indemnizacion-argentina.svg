<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 911" width="800" height="911"><rect width="800" height="911" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#0369A1"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">De qué se compone la indemnización por</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">despido en Argentina</text><g transform="translate(0,68)"><text x="44" y="180" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Mejor sueldo $1.000.000 · ingreso 1/3/2019 · despido sin causa 10/10/2026</text><rect x="44" y="206" width="533.4831881614685" height="50" rx="10" fill="#0369A1"/><rect x="577.4831881614685" y="206" width="133.37079704036714" height="50" rx="0" fill="#38BDF8"/><rect x="710.8539852018357" y="206" width="45.14601479816429" height="50" rx="0" fill="#BAE6FD"/><rect x="44" y="290" width="14" height="64" rx="4" fill="#0369A1"/><text x="74" y="314" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Indemnización por antigüedad</text><text x="74" y="342" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">7 años y 7 meses → 8 años (la fracción supera 3 meses)</text><text x="756" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#0369A1" text-anchor="end">$8.000.000</text><rect x="44" y="382" width="14" height="64" rx="4" fill="#38BDF8"/><text x="74" y="406" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Preaviso omitido</text><text x="74" y="434" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">2 sueldos por tener 5 años o más</text><text x="756" y="420" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#0369A1" text-anchor="end">$2.000.000</text><rect x="44" y="474" width="14" height="64" rx="4" fill="#BAE6FD"/><text x="74" y="498" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Integración del mes</text><text x="74" y="526" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">21 días que faltaban para fin de octubre</text><text x="756" y="512" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#0369A1" text-anchor="end">$677.419</text><rect x="44" y="572" width="712" height="70" rx="14" fill="#0369A1"/><text x="66" y="616" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="400" fill="#E0F2FE" text-anchor="start">Total estimado</text><text x="734" y="618" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="end">$10.677.419</text><text x="44" y="682" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Art. 245, 231 y 233 de la Ley de Contrato de Trabajo. A esto se suma</text><text x="44" y="706.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">la liquidación final: días trabajados, vacaciones y SAC</text><text x="44" y="730.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">proporcionales. El tope por convenio puede reducir la indemnización</text><text x="44" y="754.9" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">en sueldos altos.</text></g><text x="44" y="885" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-indemnizacion-despido</text></svg>