<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 845" width="800" height="845"><rect width="800" height="845" fill="#0F0F14"/><rect x="44" y="787" width="712" height="1.5" fill="#2C2C3A"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F87171" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Qué es un hash y por qué cambia con una</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">sola letra</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB" text-anchor="start">SHA-256: cambia una sola letra y cambia todo</text><rect x="44" y="204" width="712" height="96" rx="14" fill="#1C1C26"/><text x="62" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#60A5FA" text-anchor="start">"hola"</text><text x="62" y="268" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">b221d9dbb083a7f33428d7c2a3c3198a</text><text x="62" y="290" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">e925614d70210e28716ccaa7cd4ddb79</text><rect x="44" y="314" width="712" height="96" rx="14" fill="#1C1C26"/><text x="62" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F87171" text-anchor="start">"Hola"</text><text x="62" y="378" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">e633f4fc79badea1dc5db970cf397c82</text><text x="62" y="400" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#F9FAFB" text-anchor="start">48bac47cc3acf9915ba60b5d76b0e88f</text><text x="44" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">Longitud de cada algoritmo (en hexadecimal)</text><text x="44" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">MD5</text><rect x="144" y="468" width="120.5" height="26" rx="6" fill="#9CA3AF"/><text x="274.5" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">32 · obsoleto</text><text x="44" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">SHA-1</text><rect x="144" y="516" width="150.625" height="26" rx="6" fill="#9CA3AF"/><text x="304.625" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">40 · obsoleto</text><text x="44" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">SHA-256</text><rect x="144" y="564" width="241" height="26" rx="6" fill="#34D399"/><text x="395" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#34D399" text-anchor="start">64 · recomendado</text><text x="44" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">SHA-512</text><rect x="144" y="612" width="482" height="26" rx="6" fill="#60A5FA"/><text x="636" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#60A5FA" text-anchor="start">128 · más largo</text><text x="44" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Un hash no se puede «descifrar»: es una huella de un solo sentido.</text><text x="44" y="692.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Para guardar contraseñas se usan algoritmos lentos como bcrypt o</text><text x="44" y="716.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Argon2, no MD5.</text></g><text x="44" y="819" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/generador-hash</text></svg>