<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 638" width="800" height="638"><rect width="800" height="638" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="638" fill="url(#g)"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE047" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Cuándo la gratificación llega a su tope</text><g transform="translate(0,3)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Gratificación mensual (art. 50): 25 % del sueldo con tope</text><text x="44" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">Tope anual: 4,75 IMM = $2.629.377 → $219.115 al mes (IMM de $553.553)</text><line x1="470.5774133333333" y1="236" x2="470.5774133333333" y2="484" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/><text x="470.5774133333333" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#F87171" text-anchor="middle">tope mensual</text><text x="44" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Sueldo $600.000</text><text x="44" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">25 % del sueldo</text><rect x="224" y="276" width="168.8" height="26" rx="5" fill="#7DD3FC"/><text x="402.8" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">$150.000</text><text x="44" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">Se paga</text><rect x="224" y="316" width="168.8" height="26" rx="5" fill="#FDE047"/><text x="402.8" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FDE047" text-anchor="start">$150.000</text><text x="44" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Sueldo $1.500.000</text><text x="44" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">25 % del sueldo</text><rect x="224" y="398" width="422" height="26" rx="5" fill="#7DD3FC"/><text x="656" y="417" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">$375.000</text><text x="44" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="start">Se paga</text><rect x="224" y="438" width="246.5774133333333" height="26" rx="5" fill="#FDE047"/><text x="480.5774133333333" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FDE047" text-anchor="start">$219.115 (tope)</text><text x="44" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">Por eso, desde unos $876.459 de sueldo, la gratificación ya no crece</text><text x="44" y="554.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#93C5FD" text-anchor="start">aunque ganes más.</text></g><text x="44" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/gratificacion-chile</text></svg>