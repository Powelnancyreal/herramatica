<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 885" width="800" height="885"><rect width="800" height="885" fill="#FBF6EC"/><rect x="44" y="827" width="712" height="1.5" fill="#E7D8BE"/><text x="44" y="50" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">Cuánto es la gratificación de julio y</text><text x="44" y="132.8" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#3B2F2A" text-anchor="start">diciembre en Perú</text><g transform="translate(0,44)"><text x="44" y="184" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#3B2F2A" text-anchor="start">Sueldo de S/ 2.500, semestre completo</text><rect x="44" y="206" width="653.2110091743119" height="64" rx="10" fill="#B91C1C"/><rect x="697.2110091743119" y="206" width="58.788990825688074" height="64" rx="0" fill="#F59E0B"/><text x="64" y="246" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="start">Gratificación S/ 2.500</text><text x="748" y="296" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="end">+ 9 %: S/ 225</text><text x="44" y="350" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#7C6A58" text-anchor="start">Total que recibes</text><text x="756" y="352" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#B91C1C" text-anchor="end">S/ 2.725</text><line x1="44" y1="400" x2="756" y2="400" stroke="#E7D8BE" stroke-width="2"/><text x="44" y="440" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Si trabajaste 4 meses</text><text x="756" y="440" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#3B2F2A" text-anchor="end">S/ 2.500 ÷ 6 × 4 = S/ 1.666,67</text><text x="44" y="492" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Bonificación con EsSalud</text><text x="756" y="492" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#3B2F2A" text-anchor="end">9 % de la gratificación</text><text x="44" y="544" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#3B2F2A" text-anchor="start">Bonificación con EPS</text><text x="756" y="544" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#3B2F2A" text-anchor="end">6,75 % de la gratificación</text><rect x="44" y="606" width="348" height="82" rx="14" fill="#FEE2E2"/><text x="64" y="640" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="start">Fiestas Patrias</text><text x="64" y="668" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">hasta el 15 de julio · enero a junio</text><rect x="408" y="606" width="348" height="82" rx="14" fill="#FEE2E2"/><text x="428" y="640" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="start">Navidad</text><text x="428" y="668" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#7C6A58" text-anchor="start">hasta el 15 de diciembre · julio a diciembre</text><text x="44" y="728" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">Solo cuentan los meses calendario completos trabajados en el</text><text x="44" y="752.3" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#7C6A58" text-anchor="start">semestre. La gratificación no tiene descuento de AFP ni ONP.</text></g><text x="44" y="859" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#7C6A58" text-anchor="start">herramatica.com/calcular-gratificacion-peru</text></svg>