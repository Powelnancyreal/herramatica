<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 751" width="800" height="751"><rect width="800" height="751" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#B91C1C"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cómo se calcula el depósito de CTS en</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Perú</text><g transform="translate(0,68)"><rect x="44" y="180" width="712" height="92" rx="16" fill="#FEF2F2"/><text x="400" y="220" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">Remuneración computable = sueldo + 1/6 de la gratificación</text><text x="400" y="252" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle">S/ 2.000 + S/ 2.000 ÷ 6 = S/ 2.333,33</text><text x="44" y="318" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">CTS por un semestre completo (6 meses)</text><text x="44" y="350" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2937" text-anchor="start">S/ 2.333,33 ÷ 12 × 6 =</text><text x="756" y="350" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#B91C1C" text-anchor="end">S/ 1.166,67</text><text x="44" y="410" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Calendario de depósitos</text><rect x="44" y="430" width="348" height="100" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/><text x="64" y="470" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="start">Noviembre a abril</text><text x="64" y="502" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">se deposita hasta el 15 de mayo</text><rect x="408" y="430" width="348" height="100" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/><text x="428" y="470" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="start">Mayo a octubre</text><text x="428" y="502" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">se deposita hasta el 15 de noviembre</text><text x="44" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Si trabajaste menos del semestre completo, se calcula por meses y</text><text x="44" y="594.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">días: remuneración computable ÷ 12 por mes y ÷ 360 por día.</text></g><text x="44" y="725" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-cts-peru</text></svg>