<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 893" width="800" height="893"><rect width="800" height="893" fill="#1F3A2E"/><rect x="44" y="835" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Cómo se actualiza un alquiler con un</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">índice</text><g transform="translate(0,44)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#FDE68A" text-anchor="start">alquiler actual × coeficiente = alquiler nuevo</text><text x="44" y="250" font-family="Segoe Print, Comic Sans MS, cursive" font-size="32" font-weight="400" fill="#F1F5EE" text-anchor="start">$500.000 × 1,2853 = $642.650</text><path d="M44,266 q300,16 600,0" fill="none" stroke="#FDE68A" stroke-width="3"/><text x="44" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C7B9" text-anchor="start">Un coeficiente de 1,2853 es una suba del 28,53 %.</text><rect x="44" y="350" width="712" height="76" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="396" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#FDE68A" text-anchor="start">ICL</text><text x="204" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="start">Índice para Contratos de Locación, del BCRA</text><text x="204" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">Combina inflación y salarios</text><rect x="44" y="438" width="712" height="76" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="484" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#FDE68A" text-anchor="start">IPC</text><text x="204" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="start">Índice de Precios al Consumidor, del INDEC</text><text x="204" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">Sigue la inflación mensual</text><rect x="44" y="526" width="712" height="76" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="572" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#FDE68A" text-anchor="start">CVS</text><text x="204" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="start">Coeficiente de Variación Salarial, del INDEC</text><text x="204" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">Sigue los salarios</text><rect x="44" y="614" width="712" height="76" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="64" y="660" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="700" fill="#FDE68A" text-anchor="start">Pactado</text><text x="204" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="start">Porcentaje fijo o índice que acuerden las partes</text><text x="204" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">Libre desde diciembre de 2023</text><text x="44" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Revisá tu contrato: dice qué índice se usa y cada cuánto se</text><text x="44" y="740.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">actualiza. El coeficiente entre dos fechas lo publican el BCRA y el</text><text x="44" y="764.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">INDEC.</text></g><text x="44" y="867" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-alquiler-argentina</text></svg>