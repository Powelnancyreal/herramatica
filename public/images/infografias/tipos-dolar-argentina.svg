<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 805" width="800" height="805"><rect width="800" height="805" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#0369A1"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Los tipos de dólar en Argentina</text><g transform="translate(0,27)"><rect x="44" y="184" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="214" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Oficial</text><text x="254" y="214" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">el que fija el BCRA y venden los bancos</text><rect x="44" y="242" width="712" height="48" rx="10" fill="#DBEAFE" stroke="#0369A1" stroke-width="2"/><text x="60" y="272" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Blue</text><text x="254" y="272" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">mercado informal, en cuevas y arbolitos</text><rect x="44" y="300" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="330" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">MEP (bolsa)</text><text x="254" y="330" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">comprando y vendiendo bonos en pesos y dólares</text><rect x="44" y="358" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="388" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Contado con liqui</text><text x="254" y="388" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">como el MEP, pero con los dólares en el exterior</text><rect x="44" y="416" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="446" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Mayorista</text><text x="254" y="446" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">entre bancos y grandes empresas</text><rect x="44" y="474" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Tarjeta</text><text x="254" y="504" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">el oficial más los impuestos a gastos en el exterior</text><rect x="44" y="532" width="712" height="48" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="2"/><text x="60" y="562" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="start">Cripto</text><text x="254" y="562" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">stablecoins como USDT compradas con pesos</text><rect x="44" y="610" width="712" height="104" rx="14" fill="#0C4A6E"/><text x="64" y="644" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Brecha cambiaria</text><text x="64" y="680" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#7DD3FC" text-anchor="start">(precio del blue ÷ precio oficial − 1) × 100</text><text x="64" y="702" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="400" fill="#BAE6FD" text-anchor="start">Si el blue cuesta 1.500 y el oficial 1.250, la brecha es del 20 %.</text></g><text x="44" y="779" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/dolar-blue</text></svg>