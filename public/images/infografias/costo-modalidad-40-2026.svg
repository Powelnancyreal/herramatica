<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 776" width="800" height="776"><rect width="800" height="776" fill="#0A1F17"/><rect x="44" y="718" width="712" height="1.5" fill="#1D4A38"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F9FAFB" text-anchor="start">Cuánto cuesta la Modalidad 40 en 2026</text><g transform="translate(0,3)"><rect x="44" y="180" width="712" height="96" rx="16" fill="#123326"/><text x="400" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">cuota mensual = salario diario × 30.4 × 14.438 %</text><text x="400" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="middle">tasa de 2026 para la continuación voluntaria</text><rect x="44" y="300" width="348" height="130" rx="16" fill="#123326" stroke="#1D4A38" stroke-width="2"/><text x="64" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">Tope: 25 UMA</text><text x="64" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">$2,932.75 diarios</text><text x="64" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#34D399" text-anchor="start">$12,872/mes</text><rect x="408" y="300" width="348" height="130" rx="16" fill="#123326" stroke="#1D4A38" stroke-width="2"/><text x="428" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#F9FAFB" text-anchor="start">Salario de $1,000</text><text x="428" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">$1,000 diarios</text><text x="428" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#34D399" text-anchor="start">$4,389/mes</text><text x="44" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F9FAFB" text-anchor="start">Por qué sube la pensión de la Ley 73</text><circle cx="56" cy="500" r="10" fill="#34D399"/><text x="78" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">La pensión se calcula con el promedio de las últimas 250 semanas.</text><circle cx="56" cy="540" r="10" fill="#34D399"/><text x="78" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Cotizar 5 años (260 semanas) con un salario alto reemplaza ese promedio.</text><circle cx="56" cy="580" r="10" fill="#34D399"/><text x="78" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#F9FAFB" text-anchor="start">Un promedio más alto aumenta la cuantía básica y los incrementos por semanas.</text><text x="44" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Solo para quienes empezaron a cotizar antes del 1 de julio de 1997 y</text><text x="44" y="664.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">tienen al menos 52 semanas en los últimos 5 años. Pide una asesoría</text><text x="44" y="688.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">al IMSS antes de invertir.</text></g><text x="44" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/pension-imss-modalidad-40</text></svg>