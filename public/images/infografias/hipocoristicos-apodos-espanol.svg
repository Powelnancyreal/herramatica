<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 809" width="800" height="809"><rect width="800" height="809" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="809" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="809" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9D174D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">De dónde salen los apodos en español</text><g transform="translate(0,3)"><text x="44" y="188" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="start">Hipocorísticos: los apodos de toda la vida</text><rect x="44" y="212" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="60" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">José</text><text x="60" y="264" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Pepe</text><text x="380" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="end">de «P. P.», Pater Putativus</text><rect x="408" y="212" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="424" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Francisco</text><text x="424" y="264" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Paco, Pancho</text><rect x="44" y="288" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="60" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Guadalupe</text><text x="60" y="340" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Lupe, Lupita</text><rect x="408" y="288" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="424" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Ignacio</text><text x="424" y="340" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Nacho</text><rect x="44" y="364" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="60" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Dolores</text><text x="60" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Lola</text><rect x="408" y="364" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="424" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Rosario</text><text x="424" y="416" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Charo</text><rect x="44" y="440" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="60" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Enrique</text><text x="60" y="492" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Quique</text><rect x="408" y="440" width="348" height="64" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="424" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Concepción</text><text x="424" y="492" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="700" fill="#9D174D" text-anchor="start">→ Conchita</text><text x="44" y="556" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">Cuatro formas de crear un apodo nuevo</text><text x="44" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">• Acortar:</text><text x="234" y="598" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Valentina → Vale</text><text x="44" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">• Diminutivo:</text><text x="234" y="638" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Sofía → Sofi, Sofita</text><text x="44" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">• Repetir sílaba:</text><text x="234" y="678" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Natalia → Nana</text><text x="44" y="718" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">• Rasgo físico:</text><text x="234" y="718" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">pelo rizado → el Chino</text></g><text x="44" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/generador-apodos</text></svg>