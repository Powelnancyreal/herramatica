<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo quitar el IVA de un precio sin</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">equivocarte</text>
<g transform="translate(0,38)"><text x="40" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Precio con IVA: $1,160. ¿Cuánto es sin IVA?</text><rect x="40" y="180" width="352" height="230" rx="18" fill="#FEE2E2"/><circle cx="74" cy="218" r="18" fill="#DC2626"/><text x="74" y="225" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text><text x="102" y="225" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#DC2626" text-anchor="start">Restar el 16 %</text><text x="216" y="292" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="middle">1,160 − 16 %</text><text x="216" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#DC2626" text-anchor="middle">$974.40</text><text x="216" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle">Le quitas IVA de más</text><rect x="408" y="180" width="352" height="230" rx="18" fill="#D1FAE5"/><circle cx="442" cy="218" r="18" fill="#059669"/><text x="442" y="225" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="470" y="225" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#059669" text-anchor="start">Dividir entre 1.16</text><text x="584" y="292" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="middle">1,160 ÷ 1.16</text><text x="584" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#059669" text-anchor="middle">$1,000.00</text><text x="584" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle">IVA real: $160.00</text><text x="40" y="460" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Tasas de IVA</text><rect x="40" y="478" width="171" height="112" rx="14" fill="#EDE9FE"/><text x="125.5" y="526" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#5B21B6" text-anchor="middle">16 %</text><text x="125.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">México, tasa</text><text x="125.5" y="575.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">general</text><rect x="223" y="478" width="171" height="112" rx="14" fill="#EDE9FE"/><text x="308.5" y="526" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#5B21B6" text-anchor="middle">8 %</text><text x="308.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">México, región</text><text x="308.5" y="575.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">fronteriza</text><rect x="406" y="478" width="171" height="112" rx="14" fill="#EDE9FE"/><text x="491.5" y="526" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#5B21B6" text-anchor="middle">0 %</text><text x="491.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">México, alimentos</text><text x="491.5" y="575.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">y medicinas</text><rect x="589" y="478" width="171" height="112" rx="14" fill="#FEF3C7"/><text x="674.5" y="526" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#D97706" text-anchor="middle">19 %</text><text x="674.5" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">Chile, tasa única</text><text x="40" y="636" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Para quitar cualquier IVA divide entre (1 + tasa): 1.16, 1.08 o 1.19.</text><text x="40" y="661.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Restar el porcentaje siempre da de menos.</text></g>
