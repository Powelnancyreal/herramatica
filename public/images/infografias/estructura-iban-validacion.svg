<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 787" width="800" height="787"><rect width="800" height="787" fill="#0B1020"/><rect x="44" y="729" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Las partes de un IBAN español y cómo se</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">valida</text><g transform="translate(0,44)"><rect x="44" y="184" width="70" height="64" rx="10" fill="#111A33" stroke="#F472B6" stroke-width="2"/><text x="79" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#F472B6" text-anchor="middle">ES</text><text x="79" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">país</text><rect x="122" y="184" width="70" height="64" rx="10" fill="#111A33" stroke="#FBBF24" stroke-width="2"/><text x="157" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#FBBF24" text-anchor="middle">91</text><text x="157" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">control</text><rect x="200" y="184" width="114" height="64" rx="10" fill="#111A33" stroke="#60A5FA" stroke-width="2"/><text x="257" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="middle">2100</text><text x="257" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">banco</text><rect x="322" y="184" width="114" height="64" rx="10" fill="#111A33" stroke="#34D399" stroke-width="2"/><text x="379" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">0418</text><text x="379" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">oficina</text><rect x="444" y="184" width="70" height="64" rx="10" fill="#111A33" stroke="#FBBF24" stroke-width="2"/><text x="479" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#FBBF24" text-anchor="middle">45</text><text x="479" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">DC</text><rect x="522" y="184" width="246" height="64" rx="10" fill="#111A33" stroke="#E5E7EB" stroke-width="2"/><text x="645" y="226" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#E5E7EB" text-anchor="middle">0200051332</text><text x="645" y="272" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">número de cuenta</text><text x="44" y="320" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start"># validación mod 97 (ISO 13616)</text><text x="44" y="358" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="start">1. Mueve los 4 primeros caracteres al final</text><text x="44" y="392" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="start">2. Cambia cada letra por un número: A=10, E=14, S=28…</text><text x="44" y="426" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="start">3. Divide el número enorme entre 97</text><text x="44" y="460" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#34D399" text-anchor="start">4. Si el resto es 1, el IBAN es válido</text><text x="44" y="514" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start"># longitudes</text><rect x="44" y="530" width="169" height="70" rx="10" fill="#111A33"/><text x="128.5" y="562" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="middle">24</text><text x="128.5" y="588" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">España</text><rect x="225" y="530" width="169" height="70" rx="10" fill="#111A33"/><text x="309.5" y="562" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="middle">22</text><text x="309.5" y="588" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Alemania</text><rect x="406" y="530" width="169" height="70" rx="10" fill="#111A33"/><text x="490.5" y="562" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="middle">27</text><text x="490.5" y="588" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Francia</text><rect x="587" y="530" width="169" height="70" rx="10" fill="#111A33"/><text x="671.5" y="562" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="middle">22</text><text x="671.5" y="588" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Reino Unido</text><text x="44" y="634" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// válido no significa que la cuenta exista: solo que los dígitos de</text><text x="44" y="658.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">control cuadran.</text></g><text x="44" y="761" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/validador-iban</text></svg>