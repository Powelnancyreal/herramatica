<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 866" width="800" height="866">
<rect width="800" height="866" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Las equivalencias de unidades que más</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">se buscan</text>
<g transform="translate(0,38)"><rect x="40" y="176" width="232" height="108" rx="16" fill="#EDE9FE"/><text x="156" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 pulgada</text><text x="156" y="258" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">= 2,54 cm</text><rect x="284" y="176" width="232" height="108" rx="16" fill="#EDE9FE"/><text x="400" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 pie</text><text x="400" y="258" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">= 30,48 cm</text><rect x="528" y="176" width="232" height="108" rx="16" fill="#EDE9FE"/><text x="644" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 milla</text><text x="644" y="258" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">= 1,609 km</text><rect x="40" y="298" width="232" height="108" rx="16" fill="#DBEAFE"/><text x="156" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 libra</text><text x="156" y="380" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">= 453,6 g</text><rect x="284" y="298" width="232" height="108" rx="16" fill="#DBEAFE"/><text x="400" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 onza</text><text x="400" y="380" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">= 28,35 g</text><rect x="528" y="298" width="232" height="108" rx="16" fill="#CCFBF1"/><text x="644" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 galón (EE. UU.)</text><text x="644" y="380" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0D9488" text-anchor="middle">= 3,785 L</text><rect x="40" y="420" width="232" height="108" rx="16" fill="#FEF3C7"/><text x="156" y="462" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 bar</text><text x="156" y="502" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#D97706" text-anchor="middle">= 14,50 PSI</text><rect x="284" y="420" width="232" height="108" rx="16" fill="#FCE7F3"/><text x="400" y="462" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 HP</text><text x="400" y="502" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#EC4899" text-anchor="middle">= 745,7 W</text><rect x="528" y="420" width="232" height="108" rx="16" fill="#FCE7F3"/><text x="644" y="462" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">1 CV</text><text x="644" y="502" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#EC4899" text-anchor="middle">= 735,5 W</text><rect x="40" y="562" width="720" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="62" y="602" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Temperatura: no basta con multiplicar</text><text x="62" y="642" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#DC2626" text-anchor="start">°F = °C × 1,8 + 32</text><text x="738" y="642" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB" text-anchor="end">°C = (°F − 32) ÷ 1,8</text><text x="40" y="718" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">El HP (horsepower) y el CV (caballo de vapor) no son iguales: el HP es</text><text x="40" y="743.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">un 1,4 % mayor.</text></g>
<line x1="40" y1="814" x2="760" y2="814" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="844" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/convertidor-unidades</text>
</svg>