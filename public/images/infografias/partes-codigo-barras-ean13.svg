<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 905" width="800" height="905"><rect width="800" height="905" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#111827"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Qué significa cada número de un código</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">EAN-13</text><g transform="translate(0,68)"><rect x="93" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="114" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">7</text><rect x="139" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="160" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">5</text><rect x="185" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="206" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">0</text><rect x="241" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="262" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">1</text><rect x="287" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="308" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">2</text><rect x="333" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="354" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">3</text><rect x="379" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="400" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">4</text><rect x="425" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="446" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">5</text><rect x="471" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="492" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">6</text><rect x="517" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="538" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">7</text><rect x="563" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="584" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">8</text><rect x="609" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="630" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED" text-anchor="middle">9</text><rect x="665" y="186" width="42" height="62" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="686" y="228" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#DC2626" text-anchor="middle">3</text><rect x="44" y="290" width="16" height="48" rx="4" fill="#2563EB"/><text x="74" y="310" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Prefijo GS1</text><text x="74" y="334" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">País donde se registró la empresa: 750 es México</text><rect x="44" y="356" width="16" height="48" rx="4" fill="#7C3AED"/><text x="74" y="376" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Empresa y producto</text><text x="74" y="400" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Lo asigna GS1 a cada empresa</text><rect x="44" y="422" width="16" height="48" rx="4" fill="#DC2626"/><text x="74" y="442" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="start">Control</text><text x="74" y="466" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Detecta errores de lectura</text><text x="44" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start">Cálculo del dígito de control</text><rect x="44" y="530" width="712" height="48" rx="10" fill="#F3F4F6"/><text x="60" y="561" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Cifras en posición impar, × 1</text><text x="740" y="561" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="end">7 + 0 + 2 + 4 + 6 + 8 = 27</text><rect x="44" y="588" width="712" height="48" rx="10" fill="#F3F4F6"/><text x="60" y="619" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Cifras en posición par, × 3</text><text x="740" y="619" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937" text-anchor="end">(5 + 1 + 3 + 5 + 7 + 9) × 3 = 90</text><rect x="44" y="646" width="712" height="48" rx="10" fill="#FEE2E2"/><text x="60" y="677" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Suma y completa hasta la decena</text><text x="740" y="677" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#DC2626" text-anchor="end">27 + 90 = 117 → 120 − 117 = 3</text><text x="44" y="724" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Para vender en tiendas necesitas un código registrado en GS1 de tu</text><text x="44" y="748.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">país. Un número inventado puede coincidir con el de otro producto.</text></g><text x="44" y="879" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/generador-codigo-de-barras</text></svg>