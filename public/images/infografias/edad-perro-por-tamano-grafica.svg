chor="start">64 años humanos</text><rect x="604" y="344" width="18" height="18" rx="4" fill="#D97706"/><text x="632" y="359" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#1E3A8A" text-anchor="start">Grande (23–40 kg)</text><text x="632" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="start">72 años humanos</text><rect x="604" y="398" width="18" height="18" rx="4" fill="#DC2626"/><text x="632" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#1E3A8A" text-anchor="start">Gigante (&gt; 40 kg)</text><text x="632" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#DC2626" text-anchor="start">80 años humanos</text><line x1="604" y1="461" x2="622" y2="461" stroke="#1E3A8A" stroke-width="3" stroke-dasharray="5 3"/><text x="632" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#1E3A8A" text-anchor="start">16·ln(edad) + 31</text><text x="632" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start">≈ 68 años humanos</text><text x="44" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">El primer año equivale a unos 15 humanos en todas las razas; la</text><text x="44" y="614.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">diferencia por tamaño se abre a partir del segundo.</text></g><text x="44" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/edad-de-mi-perro</text></svg>