<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 677" width="800" height="677">
<rect width="800" height="677" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">La suma en columna con llevadas, paso</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">a paso</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ejemplo: 478 + 356</text>
<g transform="translate(0,67)"><rect x="224" y="176" width="52" height="270" rx="12" fill="#0D9488" opacity="0.08"/><rect x="164" y="176" width="52" height="270" rx="12" fill="#2563EB" opacity="0.08"/><rect x="104" y="176" width="52" height="270" rx="12" fill="#7C3AED" opacity="0.08"/><text x="190" y="210" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#DC2626" text-anchor="middle">1</text><text x="130" y="210" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#DC2626" text-anchor="middle">1</text><text x="130" y="268" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">4</text><text x="190" y="268" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">7</text><text x="250" y="268" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">8</text><text x="130" y="330" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">3</text><text x="190" y="330" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">5</text><text x="250" y="330" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#334155" text-anchor="middle">6</text><text x="70" y="330" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#64748B" text-anchor="middle">+</text><line x1="60" y1="356" x2="285" y2="356" stroke="#334155" stroke-width="4" stroke-linecap="round"/><text x="130" y="420" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#7C3AED" text-anchor="middle">8</text><text x="190" y="420" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#2563EB" text-anchor="middle">3</text><text x="250" y="420" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0D9488" text-anchor="middle">4</text><rect x="330" y="176" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/><text x="350" y="208" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">1. Unidades</text><text x="740" y="208" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">8 + 6 = 14</text><text x="350" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Escribo 4 y llevo 1 a las decenas.</text><rect x="330" y="268" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="350" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="start">2. Decenas</text><text x="740" y="300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">7 + 5 + 1 = 13</text><text x="350" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Escribo 3 y llevo 1 a las centenas.</text><rect x="330" y="360" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="350" y="392" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="start">3. Centenas</text><text x="740" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="end">4 + 3 + 1 = 8</text><text x="350" y="422" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Escribo 8. Resultado: 834.</text><text x="190" y="180" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#DC2626" text-anchor="middle">llevadas</text><text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Se empieza siempre por la derecha. Cuando una columna suma 10 o más,</text><text x="40" y="525.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">la cifra de las decenas pasa como «llevada» a la columna siguiente.</text></g>
<line x1="40" y1="625" x2="760" y2="625" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="655" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-alicia</text>
