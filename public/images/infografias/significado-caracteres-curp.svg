roke="#334155" stroke-width="2"/><text x="720" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">0</text><rect x="742" y="190" width="36" height="56" rx="8" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="760" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">1</text><circle cx="100" cy="274" r="14" fill="#7C3AED"/><text x="100" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="308" cy="274" r="14" fill="#2563EB"/><text x="308" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="456" cy="274" r="14" fill="#EC4899"/><text x="456" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="524" cy="274" r="14" fill="#0D9488"/><text x="524" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="632" cy="274" r="14" fill="#D97706"/><text x="632" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="740" cy="274" r="14" fill="#334155"/><text x="740" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="56" cy="333" r="15" fill="#7C3AED"/><text x="56" y="340" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#7C3AED" text-anchor="start">GOMJ</text><text x="190" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Letras de apellidos y nombre, igual que en el RFC.</text><circle cx="56" cy="377" r="15" fill="#2563EB"/><text x="56" y="384" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="84" y="384" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2563EB" text-anchor="start">900514</text><text x="190" y="384" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Fecha de nacimiento: año, mes y día.</text><circle cx="56" cy="421" r="15" fill="#EC4899"/><text x="56" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="84" y="428" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EC4899" text-anchor="start">H</text><text x="190" y="428" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Sexo: H para hombre y M para mujer.</text><circle cx="56" cy="465" r="15" fill="#0D9488"/><text x="56" y="472" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="84" y="472" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0D9488" text-anchor="start">JC</text><text x="190" y="472" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Entidad de nacimiento: JC es Jalisco; NE, nacido en</text><text x="190" y="498.4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">el extranjero.</text><circle cx="56" cy="533.8" r="15" fill="#D97706"/><text x="56" y="540.8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="84" y="540.8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#D97706" text-anchor="start">MRN</text><text x="190" y="540.8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Primeras consonantes internas de GóMez, MaRtínez y</text><text x="190" y="567.1999999999999" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">JuaN.</text><circle cx="56" cy="602.5999999999999" r="15" fill="#334155"/><text x="56" y="609.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="84" y="609.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">01</text><text x="190" y="609.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Diferenciador (0 antes de 2000, letra desde 2000) y</text><text x="190" y="635.9999999999999" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">dígito verificador.</text><text x="40" y="688.3999999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">El dígito verificador se calcula con los 17 caracteres anteriores; si</text><text x="40" y="713.4799999999999" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">uno está mal, deja de cuadrar.</text></g>
