<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 851" width="800" height="851"><rect width="800" height="851" fill="#1F3A2E"/><rect x="44" y="793" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Cómo se calcula el puntaje ponderado</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">PAES</text><g transform="translate(0,44)"><text x="44" y="192" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="start">Ejemplo con ponderaciones de una carrera ficticia</text><rect x="44" y="320" width="132.8" height="150" rx="8" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="110.4" y="310" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#F1F5EE" text-anchor="middle">750</text><text x="110.4" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="middle">NEM</text><text x="110.4" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FDE68A" text-anchor="middle">× 20 %</text><text x="110.4" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">= 150</text><rect x="188.8" y="310" width="132.8" height="160" rx="8" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="255.20000000000002" y="300" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#F1F5EE" text-anchor="middle">800</text><text x="255.20000000000002" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="middle">Ranking</text><text x="255.20000000000002" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FDE68A" text-anchor="middle">× 20 %</text><text x="255.20000000000002" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">= 160</text><rect x="333.6" y="330" width="132.8" height="140" rx="8" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="400" y="320" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#F1F5EE" text-anchor="middle">700</text><text x="400" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="middle">Lectora</text><text x="400" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FDE68A" text-anchor="middle">× 10 %</text><text x="400" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">= 70</text><rect x="478.40000000000003" y="340" width="132.8" height="130" rx="8" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="544.8000000000001" y="330" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#F1F5EE" text-anchor="middle">650</text><text x="544.8000000000001" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="middle">Matemática 1</text><text x="544.8000000000001" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FDE68A" text-anchor="middle">× 35 %</text><text x="544.8000000000001" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">= 227,5</text><rect x="623.2" y="350" width="132.8" height="120" rx="8" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="689.6" y="340" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#F1F5EE" text-anchor="middle">600</text><text x="689.6" y="496" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="400" fill="#F1F5EE" text-anchor="middle">Ciencias</text><text x="689.6" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#FDE68A" text-anchor="middle">× 15 %</text><text x="689.6" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5EE" text-anchor="middle">= 90</text><rect x="44" y="586" width="712" height="80" rx="14" fill="#2A4A3B" stroke="#FDE68A" stroke-width="2"/><text x="64" y="620" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">150 + 160 + 70 + 227,5 + 90</text><text x="736" y="638" font-family="Segoe Print, Comic Sans MS, cursive" font-size="32" font-weight="700" fill="#FDE68A" text-anchor="end">697,5 puntos</text><text x="44" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">Cada carrera publica sus propias ponderaciones en DEMRE. Escala de</text><text x="44" y="722.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">cada prueba: 100 a 1.000 puntos.</text></g><text x="44" y="825" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/puntaje-paes</text></svg>