<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 757" width="800" height="757"><rect width="800" height="757" fill="#FFF8FB"/><rect x="44" y="699" width="712" height="1.5" fill="#F0D5F5"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#BE185D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#4A044E" text-anchor="start">Cómo se calcula el engagement de</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#4A044E" text-anchor="start">Instagram</text><g transform="translate(0,44)"><rect x="44" y="180" width="712" height="100" rx="18" fill="#FCE7F3"/><text x="400" y="222" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700" fill="#BE185D" text-anchor="middle">interacciones ÷ seguidores × 100</text><text x="400" y="258" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#7E6A8A" text-anchor="middle">likes + comentarios + guardados + compartidos</text><rect x="44" y="306" width="169" height="86" rx="14" fill="#FFFFFF" stroke="#F0D5F5" stroke-width="2"/><text x="128.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#BE185D" text-anchor="middle">420</text><text x="128.5" y="372" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">likes</text><rect x="225" y="306" width="169" height="86" rx="14" fill="#FFFFFF" stroke="#F0D5F5" stroke-width="2"/><text x="309.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#BE185D" text-anchor="middle">35</text><text x="309.5" y="372" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">comentarios</text><rect x="406" y="306" width="169" height="86" rx="14" fill="#FFFFFF" stroke="#F0D5F5" stroke-width="2"/><text x="490.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#BE185D" text-anchor="middle">20</text><text x="490.5" y="372" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">guardados</text><rect x="587" y="306" width="169" height="86" rx="14" fill="#FFFFFF" stroke="#F0D5F5" stroke-width="2"/><text x="671.5" y="344" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#BE185D" text-anchor="middle">15</text><text x="671.5" y="372" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">compartidos</text><text x="44" y="432" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#4A044E" text-anchor="start">490 interacciones ÷ 10.000 seguidores = 4,9 %</text><rect x="44" y="460" width="178" height="56" rx="0" fill="#FBCFE8"/><text x="133" y="494" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#4A044E" text-anchor="middle">Bajo</text><text x="133" y="540" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">Menos de 1 %</text><rect x="222" y="460" width="178" height="56" rx="0" fill="#F9A8D4"/><text x="311" y="494" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#4A044E" text-anchor="middle">Normal</text><text x="311" y="540" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">1 a 3 %</text><rect x="400" y="460" width="178" height="56" rx="0" fill="#F472B6"/><text x="489" y="494" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bueno</text><text x="489" y="540" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">3 a 6 %</text><rect x="578" y="460" width="1