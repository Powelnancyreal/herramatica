<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 788" width="800" height="788"><rect width="800" height="788" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="788" fill="url(#g)"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FCD34D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Cómo calcular el MCD y el MCM paso a</text><text x="44" y="132.8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">paso</text><g transform="translate(0,44)"><text x="44" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Algoritmo de Euclides: MCD(252, 198)</text><rect x="44" y="206" width="420" height="46" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="60" y="237" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#E0F2FE" text-anchor="start">252 = 198 × 1 + 54</text><rect x="44" y="260" width="420" height="46" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="60" y="291" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#E0F2FE" text-anchor="start">198 = 54 × 3 + 36</text><rect x="44" y="314" width="420" height="46" rx="8" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="60" y="345" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#E0F2FE" text-anchor="start">54 = 36 × 1 + 18</text><rect x="44" y="368" width="420" height="46" rx="8" fill="#123A63" stroke="#FCD34D" stroke-width="2"/><text x="60" y="399" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#FCD34D" text-anchor="start">36 = 18 × 2 + 0</text><rect x="494" y="206" width="262" height="208" rx="14" fill="#123A63" stroke="#FCD34D" stroke-width="2"/><text x="625" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#93C5FD" text-anchor="middle">MCD</text><text x="625" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="700" fill="#FCD34D" text-anchor="middle">18</text><text x="625" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#93C5FD" text-anchor="middle">el último resto distinto de 0</text><text x="44" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Por factores primos: 12 y 18</text><text x="44" y="508" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#E0F2FE" text-anchor="start">12 = 2² × 3</text><text x="44" y="558" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#E0F2FE" text-anchor="start">18 = 2 × 3²</text><text x="44" y="608" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#FCD34D" text-anchor="start">MCD = 2 × 3 = 6</text><text x="756" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#93C5FD" text-anchor="end">factores comunes con el menor exponente</text><text x="44" y="658" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#FCD34D" text-anchor="start">MCM = 2² × 3² = 36</text><text x="756" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#93C5FD" text-anchor="end">todos los factores con el mayor exponente</text></g><text x="44" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/calculadora-mcd-mcm</text></svg>