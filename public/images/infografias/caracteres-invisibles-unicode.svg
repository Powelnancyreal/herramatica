<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 927" width="800" height="927">
<rect width="800" height="927" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Los caracteres invisibles de Unicode y</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">para qué sirve cada uno</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Todos se pueden copiar con el generador de texto invisible</text>
<g transform="translate(0,67)"><text x="44" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Código</text><text x="180" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Nombre y uso habitual</text><text x="760" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="end">¿Se ve el hueco?</text><rect x="30" y="202" width="740" height="70" rx="12" fill="#F8FAFC"/><rect x="40" y="220" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+3164</text><text x="180" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Relleno hangul</text><text x="180" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Nombres y mensajes «en blanco» en juegos y apps</text><rect x="696" y="222" width="64" height="32" rx="16" fill="#D1FAE5"/><text x="728" y="244" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">Sí</text><rect x="40" y="294" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="319" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+2800</text><text x="180" y="308" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Braille en blanco</text><text x="180" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Mensajes, bios y apodos vacíos</text><rect x="696" y="296" width="64" height="32" rx="16" fill="#D1FAE5"/><text x="728" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">Sí</text><rect x="30" y="350" width="740" height="70" rx="12" fill="#F8FAFC"/><rect x="40" y="368" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="393" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+200B</text><text x="180" y="382" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Espacio de ancho cero</text><text x="180" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Separar palabras o enlaces sin espacio visible</text><rect x="696" y="370" width="64" height="32" rx="16" fill="#E2E8F0"/><text x="728" y="392" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">No</text><rect x="40" y="442" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="467" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+200C</text><text x="180" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">No unificador de ancho cero</text><text x="180" y="482" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Evitar que dos letras se unan</text><rect x="696" y="444" width="64" height="32" rx="16" fill="#E2E8F0"/><text x="728" y="466" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">No</text><rect x="30" y="498" width="740" height="70" rx="12" fill="#F8FAFC"/><rect x="40" y="516" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="541" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+200D</text><text x="180" y="530" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Unificador de ancho cero</text><text x="180" y="556" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Unir emojis compuestos, como familias</text><rect x="696" y="518" width="64" height="32" rx="16" fill="#E2E8F0"/><text x="728" y="540" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">No</text><rect x="40" y="590" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="615" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+00A0</text><text x="180" y="604" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Espacio de no separación</text><text x="180" y="630" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Que dos palabras no se separen de línea</text><rect x="696" y="592" width="64" height="32" rx="16" fill="#D1FAE5"/><text x="728" y="614" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">Sí</text><rect x="30" y="646" width="740" height="70" rx="12" fill="#F8FAFC"/><rect x="40" y="664" width="120" height="36" rx="18" fill="#EDE9FE"/><text x="100" y="689" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">U+3000</text><text x="180" y="678" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">Espacio ideográfico</text><text x="180" y="704" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Un espacio ancho, como un carácter chino</text><rect x="696" y="666" width="64" height="32" rx="16" fill="#D1FAE5"/><text x="728" y="688" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">Sí</text><text x="40" y="750" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Los de ancho cero no dejan hueco y muchas apps los eliminan; para un</text><text x="40" y="775.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">nombre o un mensaje en blanco funcionan mejor U+3164 y U+2800.</text></g>
<line x1="40" y1="875" x2="760" y2="875" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="905" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/texto-invisible</text>
</svg>