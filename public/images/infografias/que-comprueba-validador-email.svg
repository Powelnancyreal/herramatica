<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 807" width="800" height="807"><rect width="800" height="807" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#4338CA"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Qué comprueba un validador de correo</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">electrónico</text><g transform="translate(0,68)"><rect x="64" y="190" width="229" height="70" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="3"/><text x="178.5" y="236" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#4338CA" text-anchor="middle">maria.lopez</text><text x="178.5" y="286" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">usuario</text><text x="318.5" y="236" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#6B7280" text-anchor="middle">@</text><rect x="344" y="190" width="153" height="70" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/><text x="420.5" y="236" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#0D9488" text-anchor="middle">empresa</text><text x="420.5" y="286" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">dominio</text><rect x="503" y="190" width="153" height="70" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/><text x="579.5" y="236" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="700" fill="#B45309" text-anchor="middle">.com.mx</text><text x="579.5" y="286" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">extensión</text><circle cx="62" cy="342" r="16" fill="#16A34A"/><text x="62" y="349" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">✓</text><text x="92" y="344" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Formato</text><text x="92" y="370" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Una sola @, sin espacios ni caracteres prohibidos, con extensión.</text><circle cx="62" cy="416" r="16" fill="#16A34A"/><text x="62" y="423" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">✓</text><text x="92" y="418" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Errores típicos</text><text x="92" y="444" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">gmial.com, hotmial.com, .con en lugar de .com.</text><circle cx="62" cy="490" r="16" fill="#16A34A"/><text x="62" y="497" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">✓</text><text x="92" y="492" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">Dominio con correo</text><text x="92" y="518" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Consulta los registros MX: ¿ese dominio puede recibir correo?</text><circle cx="62" cy="564" r="16" fill="#9CA3AF"/><text x="62" y="571" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">?</text><text x="92" y="566" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start">El buzón existe</text><text x="92" y="592" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Ningún validador web puede confirmarlo sin enviar un correo.</text><text x="44" y="626" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Para las búsquedas de MX se envía solo el dominio a un servicio DNS</text><text x="44" y="650.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">público; la dirección completa no sale de tu navegador.</text></g><text x="44" y="781" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/validador-email</text></svg>