="124.6" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Burger</text><path d="M230,380 L82.77568135664544,295 A170,170 0 0 1 229.99999999999997,210 Z" fill="#EC4899" stroke="#0F172A" stroke-width="3"/><text x="177.30000000000004" y="294.72092244112014" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ensalada</text><circle cx="230" cy="380" r="26" fill="#F8FAFC"/><path d="M216,188 L244,188 L230,216 Z" fill="#FACC15"/><text x="450" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F9FAFB" text-anchor="start">6 opciones</text><text x="450" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#F9FAFB" text-anchor="start">1 ÷ 6 =</text><text x="450" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#FACC15" text-anchor="start">16,7 %</text><text x="450" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="start">de probabilidad cada una</text><text x="450" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#F9FAFB" text-anchor="start">Con 10 opciones:  10 %</text><text x="450" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#F9FAFB" text-anchor="start">Con 20 opciones:  5 %</text><text x="44" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">El ganador se decide al azar antes de que la ruleta empiece a girar;</text><text x="44" y="614.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">la animación solo lo muestra. Repetir una opción en la lista le da</text><text x="44" y="638.6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">más probabilidad.</text></g><text x="44" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9CA3AF" text-anchor="start">herramatica.com/ruleta-aleatoria-online</text></svg>