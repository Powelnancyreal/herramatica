<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 813" width="800" height="813"><rect width="800" height="813" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="813" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="813" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo saber qué presentación sale más</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">barata</text><g transform="translate(0,44)"><text x="44" y="188" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#1E3A8A" text-anchor="start">Arroz: ¿cuál sale más barato por kilo?</text><rect x="44" y="214" width="712" height="94" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="64" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="start">Paquete chico</text><text x="64" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">500 g · $42.00</text><text x="736" y="260" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="end">$84.00/kg</text><rect x="44" y="322" width="712" height="94" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="64" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="start">Paquete grande</text><text x="64" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">1.2 kg · $89.00</text><text x="736" y="368" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="end">$74.17/kg</text><rect x="44" y="430" width="712" height="94" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="64" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="start">Promoción 3×2</text><text x="64" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">3 × 500 g, pagas 2 · $84.00</text><text x="736" y="476" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="700" fill="#15803D" text-anchor="end">$56.00/kg</text><text x="736" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="end">el más barato</text><rect x="44" y="554" width="712" height="70" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="598" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="start">precio por kilo = precio ÷ peso en kilos</text><text x="44" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">El tamaño grande no siempre es el más barato, y la promoción solo</text><text x="44" y="688.3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">conviene si vas a usar todo antes de que caduque.</text></g><text x="44" y="787" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/comparador-precios</text></svg>