<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 885" width="800" height="885"><rect width="800" height="885" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="885" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="885" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#16A34A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">El orden de las operaciones, paso a paso</text><g transform="translate(0,3)"><rect x="44" y="176" width="712" height="52" rx="12" fill="#DCFCE7" stroke="#93C5FD" stroke-width="1.5"/><text x="62" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">1. Paréntesis</text><text x="738" y="212" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#16A34A" text-anchor="end">( )</text><rect x="74" y="238" width="652" height="52" rx="12" fill="#E0F2FE" stroke="#93C5FD" stroke-width="1.5"/><text x="92" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">2. Potencias y raíces</text><text x="708" y="274" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#16A34A" text-anchor="end">x²  √</text><rect x="104" y="300" width="592" height="52" rx="12" fill="#FEF9C3" stroke="#93C5FD" stroke-width="1.5"/><text x="122" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">3. Multiplicaciones y divisiones</text><text x="678" y="336" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#16A34A" text-anchor="end">×  ÷</text><rect x="134" y="362" width="532" height="52" rx="12" fill="#FCE7F3" stroke="#93C5FD" stroke-width="1.5"/><text x="152" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">4. Sumas y restas</text><text x="648" y="398" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#16A34A" text-anchor="end">+  −</text><text x="44" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">De izquierda a derecha dentro de cada nivel.</text><text x="54" y="524" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 + 4 × (6 − 2)² ÷ 8</text><text x="54" y="572" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 + 4 × 4² ÷ 8</text><text x="756" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">paréntesis</text><text x="54" y="620" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 + 4 × 16 ÷ 8</text><text x="756" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">potencia</text><text x="54" y="668" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 + 64 ÷ 8</text><text x="756" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">multiplicación</text><text x="54" y="716" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#1E3A8A" text-anchor="start">3 + 8</text><text x="756" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">división</text><text x="54" y="764" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#16A34A" text-anchor="start">11</text><text x="756" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">suma</text><text x="44" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Error clásico: sumar antes de multiplicar. 3 + 4 × 2 es 11, no 14.</text></g><text x="44" y="859" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calculadora-calculos-combinados</text></svg>