<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 835" width="800" height="835"><rect width="800" height="835" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#1E3A8A"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cómo funciona una detracción de SUNAT</text><g transform="translate(0,27)"><text x="44" y="180" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start">Factura por un servicio de S/ 5.900 (IGV incluido), detracción del 12 %</text><rect x="274" y="204" width="260" height="96" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/><text x="404" y="242" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle">El cliente paga en total</text><text x="404" y="280" font-family="Trebuchet MS, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle">S/ 5.900</text><path d="M344,304 L184,380 M464,304 L596,380" stroke="#94A3B8" stroke-width="3"/><rect x="44" y="384" width="300" height="96" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/><text x="194" y="422" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle">Al proveedor directamente</text><text x="194" y="460" font-family="Trebuchet MS, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">S/ 5.192</text><rect x="456" y="384" width="300" height="96" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/><text x="606" y="422" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle">A la cuenta de detracciones</text><text x="606" y="460" font-family="Trebuchet MS, Arial, sans-serif" font-size="26" font-weight="700" fill="#B45309" text-anchor="middle">S/ 708</text><text x="606" y="506" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">Banco de la Nación</text><text x="44" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Para qué sirve</text><text x="224" y="570" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">El proveedor solo puede usar ese saldo para pagar sus</text><text x="224" y="591.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">impuestos a SUNAT.</text><text x="44" y="636" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Quién deposita</text><text x="224" y="636" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">Normalmente el cliente, antes de pagar o dentro del plazo que</text><text x="224" y="657.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">fija SUNAT.</text><text x="44" y="702" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Porcentajes</text><text x="224" y="702" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">Dependen del bien o servicio: por ejemplo, 12 % en muchos</text><text x="224" y="723.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start">servicios y 4 % en contratos de construcción.</text></g><text x="44" y="809" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-detraccion</text></svg>