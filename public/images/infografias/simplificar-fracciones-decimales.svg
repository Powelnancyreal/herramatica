<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Cómo simplificar y convertir</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">fracciones</text>
<g transform="translate(0,38)"><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Simplificar: divide arriba y abajo entre el MCD</text><text x="100" y="240" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#334155" text-anchor="middle">8</text><line x1="76.2" y1="252" x2="123.8" y2="252" stroke="#334155" stroke-width="3" stroke-linecap="round"/><text x="100" y="286" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#334155" text-anchor="middle">12</text><text x="245" y="236" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#7C3AED" text-anchor="middle">÷ 4</text><path d="M160,250 H330" stroke="#CBD5E1" stroke-width="3"/><path d="M320,242 L332,250 L320,258" fill="none" stroke="#CBD5E1" stroke-width="3"/><text x="380" y="240" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#7C3AED" text-anchor="middle">2</text><line x1="356.2" y1="252" x2="403.8" y2="252" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/><text x="380" y="286" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#7C3AED" text-anchor="middle">3</text><text x="460" y="262" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">MCD(8, 12) = 4</text><text x="40" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Impropia a mixta: divide el numerador</text><text x="100" y="420" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#334155" text-anchor="middle">11</text><line x1="76.2" y1="432" x2="123.8" y2="432" stroke="#334155" stroke-width="3" stroke-linecap="round"/><text x="100" y="466" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#334155" text-anchor="middle">4</text><text x="240" y="442" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle">11 ÷ 4 = 2 y sobran 3</text><text x="380" y="448" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0D9488" text-anchor="middle">2</text><text x="430" y="420" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0D9488" text-anchor="middle">3</text><line x1="406.2" y1="432" x2="453.8" y2="432" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/><text x="430" y="466" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0D9488" text-anchor="middle">4</text><text x="40" y="540" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">Fracciones y decimales que conviene saber</text><rect x="40" y="560" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="125.5" y="592" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/2</text><text x="125.5" y="620" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,5</text><rect x="223" y="560" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="308.5" y="592" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/4</text><text x="308.5" y="620" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,25</text><rect x="406" y="560" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="491.5" y="592" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">3/4</text><text x="491.5" y="620" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,75</text><rect x="589" y="560" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="674.5" y="592" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/5</text><text x="674.5" y="620" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,2</text><rect x="40" y="646" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="125.5" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/8</text><text x="125.5" y="706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,125</text><rect x="223" y="646" width="171" height="74" rx="12" fill="#FEF3C7"/><text x="308.5" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/3</text><text x="308.5" y="706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,333…</text><rect x="406" y="646" width="171" height="74" rx="12" fill="#FEF3C7"/><text x="491.5" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">2/3</text><text x="491.5" y="706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,666…</text><rect x="589" y="646" width="171" height="74" rx="12" fill="#EDE9FE"/><text x="674.5" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">1/10</text><text x="674.5" y="706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5B21B6" text-anchor="middle">0,1</text><text x="40" y="762" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Los tercios dan decimales periódicos: sus cifras se repiten sin fin,</text><text x="40" y="78