<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 689" width="800" height="689"><rect width="800" height="689" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="689" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="689" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo reduce tu ISR el subsidio al empleo</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#15803D" text-anchor="start">Subsidio 2026: $535.65 al mes (febrero a diciembre)</text><text x="44" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Solo si tu ingreso mensual no pasa de $11,492.66</text><text x="44" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">Ejemplo: sueldo de $10,000 al mes</text><rect x="44" y="282" width="712" height="48" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="60" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">ISR según la tarifa</text><text x="740" y="314" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="end">$729.02</text><rect x="44" y="340" width="712" height="48" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="60" y="371" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">Menos subsidio al empleo</text><text x="740" y="372" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="end">− $535.65</text><rect x="44" y="398" width="712" height="48" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="60" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#1E3A8A" text-anchor="start">ISR que te retienen</text><text x="740" y="430" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#15803D" text-anchor="end">$193.37</text><rect x="44" y="486" width="348" height="120" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="62" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="start">Si ganas $11,492.66 o menos</text><text x="62" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">El subsidio reduce tu ISR.</text><text x="62" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Nunca se paga en efectivo.</text><rect x="408" y="486" width="348" height="120" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="426" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="start">Si ganas más</text><text x="426" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">No hay subsidio: pagas la</text><text x="426" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#1E3A8A" text-anchor="start">tarifa del ISR completa.</text></g><text x="44" y="663" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/calcular-subsidio-empleo</text></svg>