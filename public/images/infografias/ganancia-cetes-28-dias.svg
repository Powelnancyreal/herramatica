1,005</text><rect x="44" y="336" width="712" height="58" rx="10" fill="#F0FDF4"/><text x="60" y="362" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ganancia bruta</text><text x="60" y="384" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">1,005 × ($10 − $9.9459)</text><text x="740" y="374" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="end">$54.42</text><rect x="44" y="402" width="712" height="58" rx="10" fill="#FFFFFF"/><text x="60" y="428" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Retención de ISR</text><text x="60" y="450" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">0.50 % anual sobre lo invertido</text><text x="740" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="end">− $3.83</text><rect x="44" y="468" width="712" height="58" rx="10" fill="#DCFCE7"/><text x="60" y="494" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ganancia neta</text><text x="60" y="516" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">el remanente se queda en tu cuenta</text><text x="740" y="506" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#166534" text-anchor="end">$50.59</text><rect x="44" y="554" width="712" height="80" rx="14" fill="#166534"/><text x="64" y="588" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#DCFCE7" text-anchor="start">Reinvirtiendo 13 veces (un año)</text><text x="64" y="618" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">$677.91 de ganancia neta · 6.70 % anual neto</text><text x="44" y="674" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Tasa y retención de ejemplo: escribe las de la subasta y la Ley de</text><text x="44" y="698.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Ingresos vigentes. Mínimo $100 en Cetesdirecto, sin comisiones.</text></g><text x="44" y="829" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-cetes</text></svg>