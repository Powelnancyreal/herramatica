<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 792" width="800" height="792"><rect width="800" height="792" fill="#0B1020"/><rect x="44" y="734" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#C084FC" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Las tres partes de un JSON Web Token</text><g transform="translate(0,3)"><text x="44" y="182" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#34D399" text-anchor="start">$ token</text><text x="44" y="214" font-family="Consolas, monospace" font-size="19" font-weight="400" fill="#F87171" text-anchor="start">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.</text><text x="44" y="242" font-family="Consolas, monospace" font-size="19" font-weight="400" fill="#C084FC" text-anchor="start">eyJzdWIiOiIxMDI0IiwibmFtZSI6IkFuYSIsImV4cCI6MTc5ODc2</text><text x="44" y="270" font-family="Consolas, monospace" font-size="19" font-weight="400" fill="#C084FC" text-anchor="start">MTYwMH0.</text><text x="44" y="298" font-family="Consolas, monospace" font-size="19" font-weight="400" fill="#38BDF8" text-anchor="start">SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</text><rect x="44" y="346" width="712" height="84" rx="10" fill="#111A33" stroke="#F87171" stroke-width="2"/><text x="60" y="376" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F87171" text-anchor="start">HEADER</text><text x="174" y="376" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># algoritmo y tipo</text><text x="60" y="410" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#E5E7EB" text-anchor="start">{ "alg": "HS256", "typ": "JWT" }</text><rect x="44" y="442" width="712" height="84" rx="10" fill="#111A33" stroke="#C084FC" stroke-width="2"/><text x="60" y="472" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#C084FC" text-anchor="start">PAYLOAD</text><text x="174" y="472" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># los datos (claims)</text><text x="60" y="506" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#E5E7EB" text-anchor="start">{ "sub": "1024", "name": "Ana", "exp": 1798761600 }</text><rect x="44" y="538" width="712" height="84" rx="10" fill="#111A33" stroke="#38BDF8" stroke-width="2"/><text x="60" y="568" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#38BDF8" text-anchor="start">FIRMA</text><text x="174" y="568" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># HMAC de header.payload con la clave secreta</text><text x="60" y="602" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#E5E7EB" text-anchor="start">solo se puede comprobar con esa clave</text><text x="44" y="648" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" fill="#34D399" text-anchor="start"># exp 1798761600 → 1 ene 2027, 00:00 UTC</text><text x="44" y="680" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// Base64url no es cifrado: cualquiera puede leer el payload. Nunca</text><text x="44" y="704.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">pongas contraseñas dentro de un JWT.</text></g><text x="44" y="766" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/decodificador-jwt</text></svg>