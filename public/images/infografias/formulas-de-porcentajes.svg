<g transform="translate(0,38)"><rect x="40" y="176" width="720" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">¿Cuánto es el 15 % de 240?</text><text x="60" y="242" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">240 × 15 ÷ 100</text><text x="738" y="232" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#7C3AED" text-anchor="end">36</text><rect x="40" y="272" width="720" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="306" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">¿Qué % es 45 de 180?</text><text x="60" y="338" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">45 ÷ 180 × 100</text><text x="738" y="328" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#7C3AED" text-anchor="end">25 %</text><rect x="40" y="368" width="720" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="60" y="402" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">¿Cuánto subió de 80 a 100?</text><text x="60" y="434" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="start">(100 − 80) ÷ 80 × 100</text><text x="738" y="424" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#7C3AED" text-anchor="end">+25 %</text><text x="40" y="504" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Dos descuentos del 10 % no son un 20 %</text><circle cx="100" cy="590" r="48" fill="#E2E8F0"/><text x="100" y="600" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#334155" text-anchor="middle">$100</text><path d="M158,590 H338" stroke="#CBD5E1" stroke-width="3"/><path d="M328,582 L338,590 L328,598" fill="none" stroke="#CBD5E1" stroke-width="3"/><text x="250" y="578" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">− 10 %</text><circle cx="400" cy="590" r="48" fill="#DBEAFE"/><text x="400" y="600" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">$90</text><path d="M458,590 H638" stroke="#CBD5E1" stroke-width="3"/><path d="M628,582 L638,590 L628,598" fill="none" stroke="#CBD5E1" stroke-width="3"/><text x="550" y="578" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">− 10 %</text><circle cx="700" cy="590" r="48" fill="#EDE9FE"/><text x="700" y="600" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">$81</text><rect x="40" y="660" width="720" height="60" rx="14" fill="#FEF3C7"/><text x="400" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Descuento real: 19 %, porque el segundo se aplica sobre $90</text></g>
