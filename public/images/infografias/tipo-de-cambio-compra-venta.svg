nt-weight="700" fill="#059669" text-anchor="end">$17.90</text><rect x="40" y="509.99999999999955" width="720" height="72" rx="14" fill="#334155"/><text x="400" y="554.9999999999995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">La diferencia (spread) es el margen de la casa de cambio</text><text x="40" y="625.9999999999995" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Valores de ejemplo en pesos mexicanos por dólar. Las tasas reales</text><text x="40" y="651.0799999999996" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">cambian cada día; usa la calculadora para el valor actual.</text></g>
