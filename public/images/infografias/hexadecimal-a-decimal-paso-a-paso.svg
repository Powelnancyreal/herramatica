<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 876" width="800" height="876"><rect width="800" height="876" fill="#0B1020"/><rect x="44" y="818" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#34D399" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Hexadecimal a decimal, posición por</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">posición</text><g transform="translate(0,44)"><text x="44" y="180" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="400" fill="#34D399" text-anchor="start">$ hex2dec 1A3</text><rect x="44" y="206" width="229.33333333333334" height="196" rx="12" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="158.66666666666669" y="270" font-family="Consolas, Courier New, monospace" font-size="58" font-weight="700" fill="#FDE68A" text-anchor="middle">1</text><text x="158.66666666666669" y="310" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle">posición 16² = 256</text><text x="158.66666666666669" y="370" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="middle">1 × 256 = 256</text><rect x="285.33333333333337" y="206" width="229.33333333333334" height="196" rx="12" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="400.00000000000006" y="270" font-family="Consolas, Courier New, monospace" font-size="58" font-weight="700" fill="#FDE68A" text-anchor="middle">A</text><text x="400.00000000000006" y="310" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle">posición 16¹ = 16</text><text x="400.00000000000006" y="370" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="middle">10 × 16 = 160</text><rect x="526.6666666666667" y="206" width="229.33333333333334" height="196" rx="12" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="641.3333333333334" y="270" font-family="Consolas, Courier New, monospace" font-size="58" font-weight="700" fill="#FDE68A" text-anchor="middle">3</text><text x="641.3333333333334" y="310" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle">posición 16⁰ = 1</text><text x="641.3333333333334" y="370" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="middle">3 × 1 = 3</text><text x="44" y="452" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E5E7EB" text-anchor="start">256 + 160 + 3 =</text><text x="756" y="452" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#34D399" text-anchor="end">419</text><text x="44" y="510" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start"># letras</text><rect x="44" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="99.16666666666666" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">A</text><text x="99.16666666666666" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">10</text><rect x="164.33333333333331" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="219.49999999999997" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">B</text><text x="219.49999999999997" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">11</text><rect x="284.66666666666663" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="339.8333333333333" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">C</text><text x="339.8333333333333" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">12</text><rect x="405" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="460.1666666666667" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">D</text><text x="460.1666666666667" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">13</text><rect x="525.3333333333333" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="580.4999999999999" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">E</text><text x="580.4999999999999" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">14</text><rect x="645.6666666666666" y="526" width="110.33333333333333" height="70" rx="10" fill="#111A33" stroke="#1E2A4A" stroke-width="2"/><text x="700.8333333333333" y="556" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle">F</text><text x="700.8333333333333" y="584" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#E5E7EB" text-anchor="middle">15</text><text x="44" y="640" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="start">0xFF</text><text x="184" y="640" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#E5E7EB" text-anchor="start">= 255</text><text x="304" y="640" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// el máximo de un byte</text><text x="44" y="684" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="start">0x7F</text><text x="184" y="684" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#E5E7EB" text-anchor="start">= 127</text><text x="304" y="684" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// mitad de FF, redondeado abajo</text><text x="44" y="728" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="start">0x100</text><text x="184" y="728" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#E5E7EB" text-anchor="start">= 256</text><text x="304" y="728" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// uno más que FF</text></g><text x="44" y="850" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/calcular-hexadecimal-a-decimal</text></svg>