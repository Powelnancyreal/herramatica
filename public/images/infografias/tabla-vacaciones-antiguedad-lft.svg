xt-anchor="start">28 días</text><text x="44" y="582" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">26 a 30</text><rect x="154" y="564" width="517.5" height="28" rx="8" fill="#86EFAC"/><text x="681.5" y="585" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">30 días</text><text x="44" y="624" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start">31 a 35</text><rect x="154" y="606" width="552" height="28" rx="8" fill="#86EFAC"/><text x="716" y="627" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">32 días</text><text x="44" y="662" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Tabla del artículo 76 de la Ley Federal del Trabajo, vigente desde</text><text x="44" y="686.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">2023. Se aplica a todos los trabajadores, aunque hayan entrado antes</text><text x="44" y="710.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">de la reforma. Al menos 12 días deben ser seguidos si el trabajador</text><text x="44" y="734.9" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">lo pide.</text></g><text x="44" y="865" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calcular-vacaciones</text></svg>