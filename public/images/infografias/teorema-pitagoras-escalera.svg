<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720"><rect width="800" height="720" fill="#FFFFFF"/><rect width="800" height="166.8" fill="#7C3AED"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">El teorema de Pitágoras con una escalera</text><g transform="translate(0,27)"><line x1="114" y1="470" x2="374" y2="470" stroke="#6B7280" stroke-width="5"/><line x1="114" y1="470" x2="114" y2="180" stroke="#6B7280" stroke-width="8"/><line x1="324" y1="470" x2="114" y2="190" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/><line x1="282" y1="421" x2="306" y2="439" stroke="#7C3AED" stroke-width="4"/><line x1="252" y1="381" x2="276" y2="399" stroke="#7C3AED" stroke-width="4"/><line x1="222" y1="341" x2="246" y2="359" stroke="#7C3AED" stroke-width="4"/><line x1="192" y1="301" x2="216" y2="319" stroke="#7C3AED" stroke-width="4"/><line x1="162" y1="261" x2="186" y2="279" stroke="#7C3AED" stroke-width="4"/><line x1="132" y1="221" x2="156" y2="239" stroke="#7C3AED" stroke-width="4"/><path d="M114,450 h20 v20" fill="none" stroke="#111827" stroke-width="2"/><text x="219" y="502" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">a = 3 m (pie de la escalera)</text><text x="100" y="330" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="end">b = 4 m</text><text x="254" y="310" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">c = 5 m</text><text x="420" y="200" font-family="Trebuchet MS, Arial, sans-serif" font-size="36" font-weight="700" fill="#7C3AED" text-anchor="start">a² + b² = c²</text><text x="420" y="244" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start">3² + 4² = 9 + 16 = 25 → c = 5</text><text x="420" y="300" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">Ternas pitagóricas</text><rect x="420" y="316" width="336" height="36" rx="8" fill="#F5F3FF"/><text x="434" y="341" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">3 · 4 · 5</text><rect x="420" y="360" width="336" height="36" rx="8" fill="#F5F3FF"/><text x="434" y="385" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">5 · 12 · 13</text><rect x="420" y="404" width="336" height="36" rx="8" fill="#F5F3FF"/><text x="434" y="429" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">8 · 15 · 17</text><rect x="420" y="448" width="336" height="36" rx="8" fill="#F5F3FF"/><text x="434" y="473" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">7 · 24 · 25</text><rect x="420" y="492" width="336" height="36" rx="8" fill="#F5F3FF"/><text x="434" y="517" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start">6 · 8 · 10</text><text x="44" y="580" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Solo vale para triángulos rectángulos. Una escalera de 5 m con el</text><text x="44" y="604.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">pie a 3 m de la pared llega a 4 m de altura.</text></g><text x="44" y="694" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-pitagoras</text></svg>