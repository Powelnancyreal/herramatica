<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 794" width="800" height="794">
<rect width="800" height="794" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">6 trucos de cálculo mental para operar</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">más rápido</text>
<g transform="translate(0,38)"><rect x="40" y="176" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="58" y="196" width="74" height="46" rx="12" fill="#7C3AED"/><text x="95" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">× 5</text><text x="148" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Multiplica por 10 y</text><text x="148" y="235.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">divide entre 2</text><text x="58" y="288" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="start">48 × 5 = 480 ÷ 2 = 240</text><rect x="408" y="176" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="426" y="196" width="74" height="46" rx="12" fill="#7C3AED"/><text x="463" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">× 9</text><text x="516" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Multiplica por 10 y</text><text x="516" y="235.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">resta el número</text><text x="426" y="288" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="start">37 × 9 = 370 − 37 = 333</text><rect x="40" y="326" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="58" y="346" width="74" height="46" rx="12" fill="#2563EB"/><text x="95" y="378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">× 11</text><text x="148" y="364" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Separa las cifras y</text><text x="148" y="385.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">pon su suma en medio</text><text x="58" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="start">43 × 11 = 4 (4+3) 3 = 473</text><rect x="408" y="326" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="426" y="346" width="74" height="46" rx="12" fill="#2563EB"/><text x="463" y="378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ 99</text><text x="516" y="364" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Suma 100 y quita 1</text><text x="426" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="start">256 + 99 = 356 − 1 = 355</text><rect x="40" y="476" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="58" y="496" width="74" height="46" rx="12" fill="#0D9488"/><text x="95" y="528" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">…5²</text><text x="148" y="514" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Cifra × la siguiente,</text><text x="148" y="535.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">y añade 25</text><text x="58" y="588" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">35² = 3 × 4 = 12 → 1225</text><rect x="408" y="476" width="352" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="426" y="496" width="74" height="46" rx="12" fill="#0D9488"/><text x="463" y="528" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">× 4</text><text x="516" y="514" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">Duplica dos veces</text><text x="426" y="588" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">27 × 4 = 54 × 2 = 108</text><text x="40" y="646" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Practica cada truco por separado hasta que sea automático y luego</text><text x="40" y="671.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">mézclalos en el modo contrarreloj.</text></g>
<line x1="40" y1="742" x2="760" y2="742" stroke="#E2E8F0" stroke-width="2"/>
