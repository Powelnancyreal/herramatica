<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 683" width="800" height="683"><rect width="800" height="683" fill="#FFF7F8"/><rect x="44" y="625" width="712" height="1.5" fill="#FECDD3"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#E11D48" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#4C0519" text-anchor="start">Cuánto te ahorras con descuentos</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#4C0519" text-anchor="start">dobles</text><g transform="translate(0,44)"><path d="M44,190 h170 l30,40 l-30,40 h-170 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="3"/><circle cx="226" cy="230" r="6" fill="#E11D48"/><text x="62" y="242" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#7E6A8A" text-anchor="start">$1,299</text><line x1="58" y1="233" x2="194" y2="233" stroke="#7E6A8A" stroke-width="3"/><text x="144" y="298" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">precio original</text><text x="289" y="238" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#E11D48" text-anchor="start">− 30 %</text><path d="M294,190 h170 l30,40 l-30,40 h-170 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="3"/><circle cx="476" cy="230" r="6" fill="#E11D48"/><text x="312" y="242" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#7E6A8A" text-anchor="start">$909.30</text><line x1="308" y1="233" x2="444" y2="233" stroke="#7E6A8A" stroke-width="3"/><text x="394" y="298" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">con el 30 %</text><text x="539" y="238" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#E11D48" text-anchor="start">− 10 %</text><path d="M546,190 h170 l30,40 l-30,40 h-170 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="3"/><circle cx="728" cy="230" r="6" fill="#E11D48"/><text x="564" y="242" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#E11D48" text-anchor="start">$818.37</text><text x="646" y="298" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="middle">+ 10 % extra en caja</text><rect x="44" y="340" width="712" height="96" rx="16" fill="#FFE4E6"/><text x="66" y="380" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700" fill="#E11D48" text-anchor="start">Descuento real: 37 %, no 40 %</text><text x="66" y="412" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C0519" text-anchor="start">El 10 % se aplica sobre el precio ya rebajado: 1 − 0,7 × 0,9 = 0,37</text><text x="44" y="476" font-family="Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#4C0519" text-anchor="start">¿2×1 o 50 %?</text><text x="44" y="510" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#4C0519" text-anchor="start">Por unidad cuestan lo mismo, pero con el 2×1 te llevas dos y pagas el doble que</text><text x="44" y="531.6" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="400" fill="#4C0519" text-anchor="start">con el 50 % en una sola.</text><text x="44" y="559.2" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#E11D48" text-anchor="start">Si solo necesitas una, el 50 % es mejor.</text></g><text x="44" y="657" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/calcular-descuento</text></svg>