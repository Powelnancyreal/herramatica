<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 716" width="800" height="716"><rect width="800" height="716" fill="#1F3A2E"/><rect x="44" y="658" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Fórmulas de área del cuadrado, el</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">rectángulo y el triángulo</text><g transform="translate(0,44)"><rect x="64" y="200" width="140" height="140" fill="none" stroke="#F1F5EE" stroke-width="4"/><text x="134" y="276" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#F1F5EE" text-anchor="middle">l = 4</text><text x="134" y="380" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#FDE68A" text-anchor="middle">A = l²</text><text x="134" y="412" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#F1F5EE" text-anchor="middle">= 16</text><rect x="274" y="230" width="210" height="110" fill="none" stroke="#F1F5EE" stroke-width="4"/><text x="379" y="292" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#F1F5EE" text-anchor="middle">6 × 3</text><text x="379" y="380" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#FDE68A" text-anchor="middle">A = b × h</text><text x="379" y="412" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#F1F5EE" text-anchor="middle">= 18</text><path d="M556,340 L736,340 L556,200 Z" fill="none" stroke="#F1F5EE" stroke-width="4"/><path d="M556,320 h20 v20" fill="none" stroke="#F1F5EE" stroke-width="2"/><text x="646" y="364" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="middle">b = 4</text><text x="542" y="276" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="400" fill="#F1F5EE" text-anchor="end">h = 3</text><text x="646" y="400" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="middle">A = b × h ÷ 2</text><text x="646" y="430" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#F1F5EE" text-anchor="middle">= 6</text><line x1="44" y1="470" x2="756" y2="470" stroke="#3E6151" stroke-width="2" stroke-dasharray="8 8"/><text x="44" y="510" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="400" fill="#FDE68A" text-anchor="start">Pitágoras: a² + b² = c²</text><text x="44" y="554" font-family="Segoe Print, Comic Sans MS, cursive" font-size="26" font-weight="400" fill="#F1F5EE" text-anchor="start">3² + 4² = 9 + 16 = 25  →  c = 5</text><text x="44" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#B7C7B9" text-anchor="start">El triángulo 3-4-5 sirve para comprobar si una esquina está a escuadra.</text></g><text x="44" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#B7C7B9" text-anchor="start">herramatica.com/calculadora-area</text></svg>