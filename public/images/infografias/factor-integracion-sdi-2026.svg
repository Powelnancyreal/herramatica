<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 857" width="800" height="857"><rect width="800" height="857" fill="#0B1020"/><rect x="44" y="799" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Cómo se calcula el salario diario</text><text x="44" y="132.8" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">integrado (SDI)</text><g transform="translate(0,44)"><text x="44" y="182" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start"># factor de integración mínimo 2026</text><text x="44" y="222" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#34D399" text-anchor="start">factor = (365 + aguinaldo + vacaciones × prima) ÷ 365</text><text x="44" y="262" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#E5E7EB" text-anchor="start">       = (365 + 15 + 12 × 0.25) ÷ 365</text><text x="44" y="302" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FBBF24" text-anchor="start">       = 383 ÷ 365 = 1.0493</text><text x="44" y="350" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start"># ejemplo: salario diario de $500</text><rect x="44" y="372" width="712" height="46" rx="8" fill="#111A33"/><text x="60" y="402" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#93C5FD" text-anchor="start">salario_diario</text><text x="740" y="403" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#E5E7EB" text-anchor="end">500.00</text><rect x="44" y="426" width="712" height="46" rx="8" fill="#111A33"/><text x="60" y="456" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#93C5FD" text-anchor="start">factor</text><text x="740" y="457" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#E5E7EB" text-anchor="end">× 1.0493</text><rect x="44" y="480" width="712" height="46" rx="8" fill="#111A33"/><text x="60" y="510" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#93C5FD" text-anchor="start">SDI</text><text x="740" y="511" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FBBF24" text-anchor="end">= 524.66</text><text x="44" y="564" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start"># se usa para</text><text x="44" y="598" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="start">- cuotas del IMSS e Infonavit</text><text x="44" y="630" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="start">- indemnizaciones por despido</text><text x="44" y="662" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#E5E7EB" text-anchor="start">- pensión de Ley 73 y Ley 97</text><text x="44" y="704" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// tope de cotización ante el IMSS: 25 UMA diarias. Prestaciones</text><text x="44" y="728.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">superiores a la ley suben el factor.</text></g><text x="44" y="831" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/calcular-salario-diario-integrado</text></svg>