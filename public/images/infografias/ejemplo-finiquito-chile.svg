<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 747" width="800" height="747"><rect width="800" height="747" fill="#FFFFFF"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DBEAFE" stroke-width="1"/></pattern></defs><rect width="800" height="747" fill="url(#g)"/><line x1="28" y1="0" x2="28" y2="747" stroke="#FCA5A5" stroke-width="2"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#1E3A8A" text-anchor="start">Cómo se calcula un finiquito en Chile</text><g transform="translate(0,3)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="start">Despido por necesidades de la empresa, sin aviso</text><text x="44" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Sueldo $1.000.000 · 5 años y 3 meses de antigüedad</text><rect x="44" y="250" width="712" height="74" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="62" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Indemnización por años de servicio</text><text x="62" y="306" font-family="Segoe Print, Comic Sans MS, cursive" font-size="15" font-weight="400" fill="#475569" text-anchor="start">1 sueldo por año: 5 × $1.000.000</text><text x="738" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="end">$5.000.000</text><rect x="44" y="336" width="712" height="74" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="62" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Indemnización sustitutiva del aviso</text><text x="62" y="392" font-family="Segoe Print, Comic Sans MS, cursive" font-size="15" font-weight="400" fill="#475569" text-anchor="start">1 sueldo más, porque no hubo aviso de 30 días</text><text x="738" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="end">$1.000.000</text><rect x="44" y="422" width="712" height="74" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/><text x="62" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="start">Feriado proporcional</text><text x="62" y="478" font-family="Segoe Print, Comic Sans MS, cursive" font-size="15" font-weight="400" fill="#475569" text-anchor="start">3 meses × 1,25 = 3,75 días hábiles ≈ 5,25 corridos</text><text x="738" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="end">$175.000</text><line x1="44" y1="518" x2="756" y2="518" stroke="#1E3A8A" stroke-width="2"/><text x="44" y="558" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">Total del finiquito</text><text x="738" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="end">$6.175.000</text><text x="44" y="598" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">• Si los meses sobrantes pasan de 6, cuentan como un año más.</text><text x="44" y="630" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">• Máximo 11 años y tope de 90 UF por sueldo.</text><text x="44" y="662" font-family="Segoe Print, Comic Sans MS, cursive" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="start">• Si renuncias, solo cobras el feriado pendiente y lo adeudado.</text></g><text x="44" y="721" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="start">herramatica.com/finiquito-chile</text></svg>