<g transform="translate(0,38)"><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Así se forma un nombre de fantasía</text><rect x="40" y="200" width="94" height="52" rx="12" fill="#7C3AED"/><text x="87" y="235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kael</text><text x="146" y="234" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle">+</text><rect x="166" y="200" width="79" height="52" rx="12" fill="#EDE9FE"/><text x="205.5" y="235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">wyn</text><text x="271" y="235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">→</text><text x="305" y="235" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="start">Kaelwyn</text><rect x="40" y="272" width="94" height="52" rx="12" fill="#7C3AED"/><text x="87" y="307" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Thal</text><text x="146" y="306" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle">+</text><rect x="166" y="272" width="79" height="52" rx="12" fill="#EDE9FE"/><text x="205.5" y="307" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">ora</text><text x="271" y="307" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">→</text><text x="305" y="307" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="start">Thalora</text><rect x="40" y="344" width="94" height="52" rx="12" fill="#7C3AED"/><text x="87" y="379" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Drak</text><text x="146" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle">+</text><rect x="166" y="344" width="94" height="52" rx="12" fill="#EDE9FE"/><text x="213" y="379" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">thor</text><text x="286" y="379" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">→</text><text x="320" y="379" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="start">Drakthor</text><rect x="40" y="416" width="79" height="52" rx="12" fill="#7C3AED"/><text x="79.5" y="451" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sil</text><text x="131" y="450" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle">+</text><rect x="151" y="416" width="79" height="52" rx="12" fill="#EDE9FE"/><text x="190.5" y="451" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">ven</text><text x="242" y="450" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="middle">+</text><rect x="262" y="416" width="79" height="52" rx="12" fill="#EDE9FE"/><text x="301.5" y="451" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">ora</text><text x="367" y="451" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">→</text><text x="401" y="451" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="start">Silvenora</text><text x="40" y="520" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">Prefijo (20 opciones) + 1 o 2 terminaciones (20 opciones)</text><text x="40" y="580" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Cómo elegir el nombre de una mascota</text><rect x="40" y="600" width="354" height="84" rx="14" fill="#CCFBF1"/><text x="58" y="634" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">Una o dos sílabas</text><text x="58" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Luna, Toby o Kira se dicen rápido.</text><rect x="406" y="600" width="354" height="84" rx="14" fill="#CCFBF1"/><text x="424" y="634" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">Que no suene a una orden</text><text x="424" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Mo se confunde con «no».</text><rect x="40" y="696" width="354" height="84" rx="14" fill="#CCFBF1"/><text x="58" y="730" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">Fácil de llamar en voz alta</text><text x="58" y="760" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Pruébalo como si estuvieras en el parque.</text><rect x="406" y="696" width="354" height="84" rx="14" fill="#CCFBF1"/><text x="424" y="730" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D9488" text-anchor="start">Que te siga gustando</text><text x="424" y="760" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Lo vas a repetir durante años.</text></g>
