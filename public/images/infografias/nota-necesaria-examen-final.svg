<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780"><rect width="800" height="780" fill="#1F3A2E"/><rect x="44" y="722" width="712" height="1.5" fill="#3E6151"/><text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">Qué nota necesitas en el examen final</text><text x="44" y="132.8" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="700" fill="#F1F5EE" text-anchor="start">para aprobar</text><g transform="translate(0,44)"><text x="44" y="190" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="400" fill="#FDE68A" text-anchor="start">nota necesaria = (meta − lo que ya tienes) ÷ peso del final</text><text x="44" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="start">Evaluación</text><text x="324" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="middle">Nota</text><text x="464" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="middle">Peso</text><text x="756" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#B7C7B9" text-anchor="end">Aporta</text><text x="44" y="270" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="start">Prueba 1</text><text x="324" y="270" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="middle">4,5</text><text x="464" y="270" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="middle">30 %</text><text x="756" y="270" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="end">1,35</text><text x="44" y="318" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="start">Prueba 2</text><text x="324" y="318" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="middle">5,2</text><text x="464" y="318" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="middle">30 %</text><text x="756" y="318" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="end">1,56</text><text x="44" y="366" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="start">Examen final</text><text x="324" y="366" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#FDE68A" text-anchor="middle">?</text><text x="464" y="366" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="middle">40 %</text><text x="756" y="366" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" font-weight="400" fill="#F1F5EE" text-anchor="end"></text><line x1="44" y1="386" x2="756" y2="386" stroke="#3E6151" stroke-width="2"/><text x="44" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="start">Para aprobar con 4,0 (escala de 1 a 7):</text><text x="44" y="478" font-family="Segoe Print, Comic Sans MS, cursive" font-size="30" font-weight="400" fill="#FDE68A" text-anchor="start">(4,0 − 2,91) ÷ 0,40 = 2,73</text><text x="44" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#F1F5EE" text-anchor="start">Necesitas un 2,7 en el examen final.</text><rect x="44" y="564" width="169" height="92" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="128.5" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDE68A" text-anchor="middle">Chile</text><text x="128.5" y="622" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="middle">1 a 7</text><text x="128.5" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#B7C7B9" text-anchor="middle">aprueba con 4,0</text><rect x="225" y="564" width="169" height="92" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="309.5" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDE68A" text-anchor="middle">Perú</text><text x="309.5" y="622" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="middle">0 a 20</text><text x="309.5" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#B7C7B9" text-anchor="middle">aprueba con 11</text><rect x="406" y="564" width="169" height="92" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="490.5" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDE68A" text-anchor="middle">España</text><text x="490.5" y="622" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="middle">0 a 10</text><text x="490.5" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#B7C7B9" text-anchor="middle">aprueba con 5</text><rect x="587" y="564" width="169" height="92" rx="12" fill="#2A4A3B" stroke="#3E6151" stroke-width="2"/><text x="671.5" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDE68A" text-anchor="middle">México</text><text x="671.5" y="622" font-family="Segoe Print, Comic Sans MS, cursive" font-size="20" font-weight="400" fill="#F1F5EE" text-anchor="middle