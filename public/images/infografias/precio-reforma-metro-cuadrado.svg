<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 784" width="800" height="784"><rect width="800" height="784" fill="#FFFAF5"/><rect x="44" y="726" width="712" height="1.5" fill="#FED7AA"/><text x="44" y="50" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#C2410C" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#431407" text-anchor="start">Cuánto cuesta reformar por metro</text><text x="44" y="132.8" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#431407" text-anchor="start">cuadrado</text><g transform="translate(0,44)"><text x="44" y="186" font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#431407" text-anchor="start">Precio orientativo por m², sin IVA</text><line x1="274" y1="206" x2="274" y2="502" stroke="#FED7AA" stroke-width="1.5"/><text x="274" y="522" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="middle">0 €</text><line x1="415.7647058823529" y1="206" x2="415.7647058823529" y2="502" stroke="#FED7AA" stroke-width="1.5"/><text x="415.7647058823529" y="522" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="middle">500 €</text><line x1="557.5294117647059" y1="206" x2="557.5294117647059" y2="502" stroke="#FED7AA" stroke-width="1.5"/><text x="557.5294117647059" y="522" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="middle">1000 €</text><line x1="699.2941176470588" y1="206" x2="699.2941176470588" y2="502" stroke="#FED7AA" stroke-width="1.5"/><text x="699.2941176470588" y="522" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="middle">1500 €</text><text x="44" y="238" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#431407" text-anchor="start">Lavado de cara</text><text x="44" y="258" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="start">pintura, suelos, detalles</text><rect x="316.52941176470586" y="222" width="42.52941176470591" height="36" rx="18" fill="#FDBA74"/><text x="337.7941176470588" y="246" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#431407" text-anchor="middle">150–300</text><text x="44" y="312" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#431407" text-anchor="start">Reforma parcial</text><text x="44" y="332" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="start">suelos, carpintería, electricidad</text><rect x="373.2352941176471" y="296" width="70.88235294117646" height="36" rx="18" fill="#FDBA74"/><text x="408.6764705882353" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#431407" text-anchor="middle">350–600</text><text x="44" y="386" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#431407" text-anchor="start">Reforma integral</text><text x="44" y="406" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="start">con cocina y baños</text><rect x="444.11764705882354" y="370" width="113.41176470588232" height="36" rx="18" fill="#C2410C"/><text x="500.8235294117647" y="394" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">600–1000</text><text x="44" y="460" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#431407" text-anchor="start">Integral de calidad alta</text><text x="44" y="480" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="400" fill="#7E6A8A" text-anchor="start">materiales y acabados premium</text><rect x="557.5294117647059" y="444" width="170.11764705882354" height="36" rx="18" fill="#FDBA74"/><text x="642.5882352941176" y="468" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#431407" text-anchor="middle">1000–1600</text><rect x="44" y="558" width="712" height="112" rx="14" fill="#FFEDD5"/><text x="62" y="592" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#431407" text-anchor="start">Piso de 60 m², reforma parcial, calidad media</text><text x="62" y="622" font-family="Consolas, monospace" font-size="18" font-weight="400" fill="#431407" text-anchor="start">60 × 350 a 600 € = 21.000 a 36.000 €</text><text x="62" y="650" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="400" fill="#7E6A8A" text-anchor="start">+ 10 % de IVA en vivienda habitual (con requisitos) y licencia de obra municipal</text></g><text x="44" y="758" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/cuanto-cuesta-reformar</text></svg>