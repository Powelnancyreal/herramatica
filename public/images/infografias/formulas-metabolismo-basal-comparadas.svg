"44" y="440" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#431407" text-anchor="start">Katch-McArdle</text><text x="44" y="464" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="start">Necesita tu % de grasa (aquí, 18 %)</text><rect x="44" y="476" width="462.89142857142855" height="30" rx="8" fill="#9A3412"/><text x="518.8914285714286" y="499" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#9A3412" text-anchor="start">1.787 kcal</text><rect x="44" y="538" width="712" height="110" rx="16" fill="#FFEDD5"/><text x="64" y="574" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#C2410C" text-anchor="start">TMB × actividad = gasto diario total</text><text x="64" y="608" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="400" fill="#431407" text-anchor="start">1.768 × 1,55 (ejercicio 3–5 días) = 2.740 kcal al día</text><text x="64" y="634" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="400" fill="#7E6A8A" text-anchor="start">Comer menos que tu TMB de forma sostenida no es recomendable.</text></g><text x="44" y="746" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#7E6A8A" text-anchor="start">herramatica.com/calculadora-tmb</text></svg>