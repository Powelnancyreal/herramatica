<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 779" width="800" height="779"><rect width="800" height="779" fill="#FFFFFF"/><rect width="800" height="207.6" fill="#0F766E"/><text x="44" y="50" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="start">herramatica.com</text><text x="44" y="96" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Cómo se calcula el colesterol LDL y qué</text><text x="44" y="136.8" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">valor es normal</text><g transform="translate(0,68)"><rect x="44" y="180" width="712" height="96" rx="16" fill="#F0FDFA"/><text x="400" y="220" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">LDL = colesterol total − HDL − triglicéridos ÷ 5</text><text x="400" y="256" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle">200 − 50 − 150 ÷ 5 = 200 − 50 − 30 = 120 mg/dL</text><rect x="44" y="320" width="142.4" height="52" rx="0" fill="#10B981"/><text x="115.2" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Óptimo</text><text x="115.2" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">Menos de 100</text><rect x="186.4" y="320" width="142.4" height="52" rx="0" fill="#84CC16"/><text x="257.6" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Casi óptimo</text><text x="257.6" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">100 a 129</text><rect x="328.8" y="320" width="142.4" height="52" rx="0" fill="#FACC15"/><text x="400" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#422006" text-anchor="middle">Límite alto</text><text x="400" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">130 a 159</text><rect x="471.20000000000005" y="320" width="142.4" height="52" rx="0" fill="#F97316"/><text x="542.4000000000001" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alto</text><text x="542.4000000000001" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">160 a 189</text><rect x="613.6" y="320" width="142.4" height="52" rx="0" fill="#DC2626"/><text x="684.8000000000001" y="352" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Muy alto</text><text x="684.8000000000001" y="394" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">190 o más</text><path d="M271.33333333333337,306 L291.33333333333337,306 L281.33333333333337,318 Z" fill="#1F2937"/><text x="281.33333333333337" y="298" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">120</text><text x="44" y="414" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">mg/dL, clasificación del NCEP ATP III para adultos</text><rect x="44" y="450" width="712" height="84" rx="14" fill="#FEF3C7"/><text x="64" y="484" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="700" fill="#92400E" text-anchor="start">Triglicéridos por encima de 400 mg/dL</text><text x="64" y="514" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="400" fill="#92400E" text-anchor="start">La fórmula deja de ser fiable: hace falta medir el LDL directamente.</text><text x="44" y="574" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Tu objetivo de LDL depende de tu riesgo cardiovascular: en personas</text><text x="44" y="598.3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">con diabetes o con un infarto previo suele ser mucho más bajo. Lo</text><text x="44" y="622.6" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">fija tu médico.</text></g><text x="44" y="753" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">herramatica.com/calculadora-ldl</text></svg>