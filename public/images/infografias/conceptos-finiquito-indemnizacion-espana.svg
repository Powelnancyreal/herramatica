<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1064" width="800" height="1064">
<rect width="800" height="1064" fill="#FFFFFF"/>
<rect width="800" height="8" fill="#7C3AED"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="start">HERRAMATICA · INFOGRAFÍA</text>
<text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">Qué incluye tu finiquito y cuánto es</text><text x="40" y="135.2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#334155" text-anchor="start">la indemnización</text><text x="40" y="188.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Los cuatro conceptos y los días por año según el tipo de</text><text x="40" y="217.43999999999997" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">cese</text>
<g transform="translate(0,96)"><rect x="40" y="190" width="354" height="90" rx="14" fill="#DBEAFE"/><text x="58" y="226" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start">1. Salario pendiente</text><text x="58" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Los días trabajados del último mes.</text><rect x="406" y="190" width="354" height="90" rx="14" fill="#DBEAFE"/><text x="424" y="226" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start">2. Vacaciones</text><text x="424" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Los días generados y no disfrutados.</text><rect x="40" y="292" width="354" height="90" rx="14" fill="#DBEAFE"/><text x="58" y="328" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start">3. Pagas extra</text><text x="58" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Parte proporcional no cobrada.</text><rect x="406" y="292" width="354" height="90" rx="14" fill="#EDE9FE"/><text x="424" y="328" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7C3AED" text-anchor="start">4. Indemnización</text><text x="424" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Solo si el motivo del cese la da.</text><text x="40" y="440" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">Indemnización: días de salario por año trabajado</text><text x="40" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Baja voluntaria o despido disciplinario procedente</text><rect x="40" y="496" width="720" height="26" rx="13" fill="#F8FAFC"/><text x="52" y="515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">Sin indemnización</text><text x="40" y="560" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Fin de contrato temporal</text><rect x="40" y="570" width="720" height="26" rx="13" fill="#F8FAFC"/><rect x="40" y="570" width="192" height="26" rx="13" fill="#7C3AED"/><text x="244" y="589" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">12 días</text><text x="40" y="634" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Despido objetivo</text><rect x="40" y="644" width="720" height="26" rx="13" fill="#F8FAFC"/><rect x="40" y="644" width="320" height="26" rx="13" fill="#7C3AED"/><text x="372" y="663" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start">20 días · máx. 12 mensualidades</text><text x="40" y="708" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Despido improcedente</text><rect x="40" y="718" width="720" height="26" rx="13" fill="#F8FAFC"/><rect x="40" y="718" width="528" height="26" rx="13" fill="#7C3AED"/><text x="554" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">33 días · máx. 24 mensualidades</text><text x="40" y="782" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Improcedente, por el tiempo trabajado antes del 12/02/2012</text><rect x="40" y="792" width="720" height="26" rx="13" fill="#F8FAFC"/><rect x="40" y="792" width="720" height="26" rx="13" fill="#64748B"/><text x="746" y="811" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">45 días por ese periodo</text><text x="40" y="858" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Según el Estatuto de los Trabajadores (arts. 49, 53 y 56). Tu convenio</text><text x="40" y="883.08" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">puede mejorar estas cantidades.</text></g>
<line x1="40" y1="1012" x2="760" y2="1012" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">herramatica.com/calculadora-finiquito</text>
</svg>