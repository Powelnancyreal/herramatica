<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" width="800" height="768"><rect width="800" height="768" fill="#0B1020"/><rect x="44" y="710" width="712" height="1.5" fill="#1E2A4A"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#E5E7EB" text-anchor="start">Retención en la fuente paso a paso</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Consolas, Courier New, monospace" font-size="19" font-weight="400" fill="#34D399" text-anchor="start">$ retencion --salario 10000000</text><text x="44" y="222" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">ingreso laboral</text><text x="756" y="222" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">10.000.000</text><text x="44" y="262" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">− pensión 4 % y salud 4 %</text><text x="756" y="262" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F87171" text-anchor="end">− 800.000</text><text x="44" y="302" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">− fondo de solidaridad 1 % (más de 4 SMMLV)</text><text x="756" y="302" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F87171" text-anchor="end">− 100.000</text><text x="44" y="342" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">= ingreso neto</text><text x="756" y="342" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="end">9.100.000</text><text x="44" y="382" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">− renta exenta del 25 %</text><text x="756" y="382" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#F87171" text-anchor="end">− 2.275.000</text><text x="44" y="422" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">= base gravable</text><text x="756" y="422" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="end">6.825.000</text><text x="44" y="462" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">en UVT ($52.374)</text><text x="756" y="462" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="end">130,31 UVT</text><rect x="44" y="512" width="712" height="112" rx="10" fill="#111A33" stroke="#FBBF24" stroke-width="2"/><text x="60" y="544" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start"># tabla del art. 383: de 95 a 150 UVT, 19 % marginal</text><text x="60" y="574" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#E5E7EB" text-anchor="start">(130,31 − 95) × 19 % = 6,71 UVT × 52.374</text><text x="60" y="606" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FBBF24" text-anchor="start">retención mensual ≈ $351.000</text><text x="44" y="656" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">// por debajo de 95 UVT de base gravable no hay retención.</text><text x="44" y="680.3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="start">Dependientes, medicina prepagada e intereses de vivienda la bajan.</text></g><text x="44" y="742" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start">herramatica.com/retencion-en-la-fuente</text></svg>