<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 685" width="800" height="685"><rect width="800" height="685" fill="#0B2A4A"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E4D7B" stroke-width="1"/></pattern></defs><rect width="800" height="685" fill="url(#g)"/><text x="44" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FCD34D" text-anchor="start">herramatica.com</text><text x="44" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#E0F2FE" text-anchor="start">Determinante e inversa de una matriz 2×2</text><g transform="translate(0,3)"><text x="44" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="start">A =</text><path d="M114,160 h-10 v108 h10 M234,160 h10 v108 h-10" fill="none" stroke="#93C5FD" stroke-width="3"/><text x="139" y="196" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">3</text><text x="209" y="196" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">1</text><text x="139" y="250" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">2</text><text x="209" y="250" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">4</text><text x="284" y="184" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#FCD34D" text-anchor="start">det(A) = 3·4 − 1·2 = 10</text><path d="M124,178 L234,232" stroke="#34D399" stroke-width="2" stroke-dasharray="5 4"/><path d="M234,178 L124,232" stroke="#F87171" stroke-width="2" stroke-dasharray="5 4"/><text x="44" y="320" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="400" fill="#93C5FD" text-anchor="start">Inversa:  A⁻¹ = 1/det × (cambia la diagonal y el signo de la otra)</text><text x="44" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#E0F2FE" text-anchor="start">A⁻¹ = 1/10 ×</text><path d="M224,354 h-10 v108 h10 M344,354 h10 v108 h-10" fill="none" stroke="#93C5FD" stroke-width="3"/><text x="249" y="390" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#FCD34D" text-anchor="middle">4</text><text x="319" y="390" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#FCD34D" text-anchor="middle">-1</text><text x="249" y="444" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#FCD34D" text-anchor="middle">-2</text><text x="319" y="444" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#FCD34D" text-anchor="middle">3</text><text x="384" y="384" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="start">=</text><path d="M434,354 h-10 v108 h10 M594,354 h10 v108 h-10" fill="none" stroke="#93C5FD" stroke-width="3"/><text x="469" y="390" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">0,4</text><text x="559" y="390" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">−0,1</text><text x="469" y="444" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">−0,2</text><text x="559" y="444" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#E0F2FE" text-anchor="middle">0,3</text><rect x="44" y="510" width="229.33333333333334" height="92" rx="12" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="60" y="546" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FCD34D" text-anchor="start">det = 0</text><text x="60" y="574" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E0F2FE" text-anchor="start">La matriz no tiene inversa</text><rect x="285.33333333333337" y="510" width="229.33333333333334" height="92" rx="12" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="301.33333333333337" y="546" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FCD34D" text-anchor="start">A × B</text><text x="301.33333333333337" y="574" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E0F2FE" text-anchor="start">Columnas de A = filas de B</text><rect x="526.6666666666667" y="510" width="229.33333333333334" height="92" rx="12" fill="#123A63" stroke="#1E4D7B" stroke-width="2"/><text x="542.6666666666667" y="546" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FCD34D" text-anchor="start">Transpuesta</text><text x="542.6666666666667" y="574" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E0F2FE" text-anchor="start">Las filas pasan a ser</text><text x="542.6666666666667" y="594.25" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" fill="#E0F2FE" text-anchor="start">columnas</text></g><text x="44" y="659" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="start">herramatica.com/calculadora-de-matrices</text></svg>