<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- TDEE gauge left -->
  <g transform="translate(150,180)">
    <path d="M-90,0 A90,90 0 0 1 90,0" fill="none" stroke="#DBEAFE" stroke-width="18" stroke-linecap="round"/>
    <path d="M-90,0 A90,90 0 0 1 30,-85" fill="none" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="35" y2="-82" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#334155"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="55" y="200">1500</text>
    <text x="85" y="115">2000</text>
    <text x="175" y="90">2500</text>
    <text x="250" y="185">3000 kcal</text>
  </g>

  <!-- human silhouette center -->
  <g transform="translate(400,190)">
    <ellipse cx="0" cy="-70" rx="24" ry="28" fill="#7C3AED"/>
    <rect x="-30" y="-40" width="60" height="90" rx="16" fill="#7C3AED"/>
    <rect x="-24" y="50" width="20" height="70" rx="8" fill="#5B21B6"/>
    <rect x="4" y="50" width="20" height="70" rx="8" fill="#5B21B6"/>
  </g>

  <!-- macronutrient pie right -->
  <g transform="translate(650,170)">
    <circle cx="0" cy="0" r="70" fill="#DBEAFE"/>
    <path d="M0,0 L0,-70 A70,70 0 0 1 66,-22 Z" fill="#7C3AED"/>
    <path d="M0,0 L66,-22 A70,70 0 0 1 0,70 Z" fill="#2563EB"/>
    <path d="M0,0 L0,70 A70,70 0 0 1 0,-70 Z" fill="#059669"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <rect x="600" y="270" width="14" height="14" fill="#7C3AED"/><text x="620" y="282">Proteínas 30%</text>
    <rect x="600" y="292" width="14" height="14" fill="#2563EB"/><text x="620" y="304">Carbohidratos 40%</text>
    <rect x="600" y="314" width="14" height="14" fill="#059669"/><text x="620" y="326">Grasas 30%</text>
  </g>

  <!-- activity stick figures -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">
    <g transform="translate(120,370)">
      <circle cx="0" cy="-30" r="8" fill="#94A3B8"/>
      <line x1="0" y1="-22" x2="0" y2="0" stroke="#94A3B8" stroke-width="3"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#94A3B8" stroke-width="3"/>
    </g>
    <text x="120" y="410">Sedentario</text>

    <g transform="translate(280,370)">
      <circle cx="0" cy="-30" r="8" fill="#2563EB"/>
      <line x1="0" y1="-22" x2="0" y2="0" stroke="#2563EB" stroke-width="3"/>
      <line x1="-10" y1="-10" x2="10" y2="6" stroke="#2563EB" stroke-width="3"/>
      <line x1="-8" y1="20" x2="0" y2="0" stroke="#2563EB" stroke-width="3"/>
      <line x1="10" y1="20" x2="0" y2="0" stroke="#2563EB" stroke-width="3"/>
    </g>
    <text x="280" y="410">Caminar</text>

    <g transform="translate(440,370)">
      <circle cx="0" cy="-30" r="8" fill="#7C3AED"/>
      <line x1="0" y1="-22" x2="4" y2="-2" stroke="#7C3AED" stroke-width="3"/>
      <line x1="-14" y1="-16" x2="4" y2="-2" stroke="#7C3AED" stroke-width="3"/>
      <line x1="-12" y1="24" x2="4" y2="-2" stroke="#7C3AED" stroke-width="3"/>
      <line x1="18" y1="14" x2="4" y2="-2" stroke="#7C3AED" stroke-width="3"/>
    </g>
    <text x="440" y="410">Correr</text>

    <g transform="translate(600,370)">
      <circle cx="0" cy="-30" r="8" fill="#DC2626"/>
      <line x1="0" y1="-22" x2="8" y2="0" stroke="#DC2626" stroke-width="3"/>
      <line x1="-16" y1="-20" x2="8" y2="0" stroke="#DC2626" stroke-width="3"/>
      <line x1="-10" y1="26" x2="8" y2="0" stroke="#DC2626" stroke-width="3"/>
      <line x1="24" y1="10" x2="8" y2="0" stroke="#DC2626" stroke-width="3"/>
    </g>
    <text x="600" y="410">Atleta</text>
  </g>
</svg>
