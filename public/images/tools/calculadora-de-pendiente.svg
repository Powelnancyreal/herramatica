<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- grid -->
  <g stroke="#EDE9FE" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="380"/>
    <line x1="220" y1="60" x2="220" y2="380"/>
    <line x1="320" y1="60" x2="320" y2="380"/>
    <line x1="420" y1="60" x2="420" y2="380"/>
    <line x1="520" y1="60" x2="520" y2="380"/>
    <line x1="60" y1="120" x2="580" y2="120"/>
    <line x1="60" y1="200" x2="580" y2="200"/>
    <line x1="60" y1="280" x2="580" y2="280"/>
    <line x1="60" y1="360" x2="580" y2="360"/>
  </g>

  <!-- axes -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="60" y1="380" x2="580" y2="380"/>
    <path d="M570,374 l10,6 -10,6"/>
    <line x1="60" y1="380" x2="60" y2="40"/>
    <path d="M54,50 l6,-10 6,10"/>
  </g>
  <text x="590" y="384" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text>
  <text x="60" y="34" font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">y</text>

  <!-- line through points -->
  <line x1="140" y1="340" x2="380" y2="120" stroke="#7C3AED" stroke-width="4"/>

  <!-- points -->
  <circle cx="140" cy="340" r="7" fill="#2563EB"/>
  <text x="140" y="365" font-family="Arial, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">A(x&#8321;,y&#8321;)</text>
  <circle cx="380" cy="120" r="7" fill="#059669"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="12" fill="#065F46">B(x&#8322;,y&#8322;)</text>

  <!-- slope triangle -->
  <g stroke="#EA580C" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <line x1="140" y1="340" x2="380" y2="340"/>
    <line x1="380" y1="340" x2="380" y2="120"/>
  </g>
  <text x="260" y="358" font-family="Arial, sans-serif" font-size="12" fill="#EA580C" text-anchor="middle">&#916;x = 3</text>
  <text x="395" y="240" font-family="Arial, sans-serif" font-size="12" fill="#EA580C">&#916;y = 6</text>
  <rect x="368" y="328" width="12" height="12" fill="none" stroke="#EA580C" stroke-width="1.5"/>

  <!-- result box -->
  <g transform="translate(660,150)">
    <rect x="-90" y="-40" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  </g>
  <text x="660" y="140" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">m = &#916;y/&#916;x</text>
  <text x="660" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">6/3 = 2</text>

  <g transform="translate(660,260)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#059669"/>
  </g>
  <text x="660" y="266" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">y = 2x + 0</text>

  <!-- mini slope comparison -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="620" y1="380" x2="700" y2="330" stroke="#DC2626"/>
    <line x1="620" y1="380" x2="700" y2="360" stroke="#F59E0B"/>
    <line x1="620" y1="380" x2="700" y2="376" stroke="#94A3B8"/>
  </g>
</svg>
