<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- large uppercase A shape (drawn, not text) -->
  <g transform="translate(180,190)">
    <path d="M-40,60 L0,-60 L40,60 M-22,20 h44" stroke="#2563EB" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- arrow converting down -->
  <g stroke="#7C3AED" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M180,260 v70"/>
    <path d="M156,300 l24,30 24,-30"/>
  </g>

  <!-- small lowercase a shape -->
  <g transform="translate(180,400)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#7C3AED" stroke-width="10"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- keyboard with shift key highlighted -->
  <g transform="translate(560,180)">
    <rect x="-140" y="-70" width="280" height="140" rx="16" fill="#1E293B"/>
    <g fill="#334155">
      <rect x="-124" y="-54" width="26" height="26" rx="5"/>
      <rect x="-92" y="-54" width="26" height="26" rx="5"/>
      <rect x="-60" y="-54" width="26" height="26" rx="5"/>
      <rect x="-28" y="-54" width="26" height="26" rx="5"/>
      <rect x="4" y="-54" width="26" height="26" rx="5"/>
      <rect x="36" y="-54" width="26" height="26" rx="5"/>
      <rect x="68" y="-54" width="26" height="26" rx="5"/>
      <rect x="100" y="-54" width="26" height="26" rx="5"/>
    </g>
    <rect x="-124" y="-18" width="60" height="26" rx="5" fill="#7C3AED"/>
    <path d="M-104,-2 l10,-10 10,10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#334155">
      <rect x="-56" y="-18" width="26" height="26" rx="5"/>
      <rect x="-24" y="-18" width="26" height="26" rx="5"/>
      <rect x="8" y="-18" width="26" height="26" rx="5"/>
      <rect x="40" y="-18" width="26" height="26" rx="5"/>
      <rect x="72" y="-18" width="54" height="26" rx="5"/>
    </g>
    <rect x="-124" y="18" width="248" height="26" rx="5" fill="#334155"/>
  </g>

  <!-- five format option blocks -->
  <g transform="translate(400,360)">
    <rect x="-190" y="-20" width="60" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="-115" y="-20" width="60" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="-40" y="-20" width="60" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="35" y="-20" width="60" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <rect x="110" y="-20" width="60" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  </g>
</svg>
