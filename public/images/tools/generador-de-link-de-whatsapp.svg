<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- phone number input left -->
  <g transform="translate(130,110)">
    <rect x="-90" y="-24" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="-90" y="-24" width="44" height="48" rx="10" fill="#EDE9FE"/>
    <text x="-68" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">+52</text>
    <text x="20" y="6" font-family="Consolas, monospace" font-size="14" fill="#334155" text-anchor="middle">123 456 7890</text>
  </g>

  <!-- message text box -->
  <g transform="translate(130,220)">
    <rect x="-95" y="-40" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="-75" y="-20" width="150" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-75" y="-2" width="130" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-75" y="16" width="100" height="8" rx="4" fill="#CBD5E1"/>
  </g>
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Hola! Te contacto por...</text>

  <!-- chat bubble center -->
  <g transform="translate(420,190)">
    <path d="M-140,-60 h280 a20,20 0 0 1 20,20 v70 a20,20 0 0 1 -20,20 h-220 l-40,30 8,-30 h-28 a20,20 0 0 1 -20,-20 v-70 a20,20 0 0 1 20,-20 Z" fill="#25D366"/>
    <text x="0" y="0" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">wa.me/521234567890</text>
    <path d="M-16,20 q10,-8 20,0 q10,8 20,0" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- generated link output -->
  <g transform="translate(420,330)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#EDE9FE" stroke="#2563EB" stroke-width="2"/>
    <text x="-10" y="6" font-family="Consolas, monospace" font-size="14" fill="#2563EB" text-anchor="middle">wa.me/52123...</text>
    <rect x="110" y="-14" width="24" height="24" rx="4" fill="#2563EB"/>
  </g>

  <!-- QR preview right -->
  <g transform="translate(700,220)">
    <rect x="-50" y="-50" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <g fill="#111827">
      <rect x="-38" y="-38" width="24" height="24"/>
      <rect x="14" y="-38" width="24" height="24"/>
      <rect x="-38" y="14" width="24" height="24"/>
      <rect x="-8" y="-8" width="16" height="16"/>
      <rect x="14" y="14" width="10" height="10"/>
    </g>
  </g>

  <!-- badge -->
  <g transform="translate(420,400)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#059669"/>
  </g>
  <text x="420" y="406" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sin guardar número</text>

  <!-- share icon corner -->
  <g transform="translate(700,80)" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="0" r="6" fill="#7C3AED" stroke="none"/>
    <circle cx="-16" cy="10" r="6" fill="#7C3AED" stroke="none"/>
    <circle cx="16" cy="20" r="6" fill="#7C3AED" stroke="none"/>
    <line x1="-16" y1="10" x2="16" y2="0"/>
    <line x1="-16" y1="10" x2="16" y2="20"/>
  </g>
</svg>
