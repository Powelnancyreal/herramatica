<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- subtle country blob background -->
  <path d="M560,80 C630,70 690,110 680,170 C700,210 660,260 610,250 C620,300 570,330 530,300 C480,320 440,280 460,230 C420,210 430,150 480,140 C480,100 520,80 560,80 Z" fill="#DCFCE7" opacity="0.6"/>

  <!-- ID card -->
  <g transform="translate(340,220)">
    <rect x="-200" y="-120" width="400" height="240" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-200" y="-120" width="400" height="50" rx="20" fill="#7C3AED"/>
    <rect x="-8" y="-120" width="6" height="50" fill="#059669"/>
    <rect x="2" y="-120" width="6" height="50" fill="#FFFFFF"/>
    <rect x="12" y="-120" width="6" height="50" fill="#DC2626"/>

    <!-- photo placeholder -->
    <g transform="translate(-150,-20)">
      <rect x="-40" y="-50" width="80" height="100" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
      <circle cx="0" cy="-16" r="20" fill="#C4B5FD"/>
      <path d="M-24,34 Q0,4 24,34 Z" fill="#C4B5FD"/>
    </g>

    <!-- text lines -->
    <rect x="-40" y="-88" width="140" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-40" y="-66" width="180" height="10" rx="5" fill="#CBD5E1"/>

    <!-- CURP code strip -->
    <g transform="translate(-40,-30)">
      <rect x="0" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
      <rect x="22" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
      <rect x="44" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
      <rect x="66" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
      <rect x="92" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="112" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="132" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="152" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="172" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="192" y="3" width="16" height="18" rx="3" fill="#BFDBFE"/>
      <rect x="216" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
      <rect x="238" y="0" width="18" height="24" rx="4" fill="#DDD6FE"/>
    </g>

    <rect x="-40" y="10" width="160" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-40" y="32" width="120" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-40" y="60" width="100" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- RENAPO seal -->
  <g transform="translate(650,300)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#059669" stroke-width="5" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#DC2626" stroke-width="4"/>
    <path d="M-10,2 L-2,10 L12,-8" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- person silhouette -->
  <g transform="translate(650,140)">
    <circle cx="0" cy="-20" r="22" fill="#7C3AED"/>
    <path d="M-30,50 Q0,10 30,50 Z" fill="#7C3AED"/>
  </g>
</svg>
