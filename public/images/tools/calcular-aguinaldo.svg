<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- payslip/nomina document in background -->
  <g transform="translate(600,150)" opacity="0.5">
    <rect x="-70" y="-90" width="140" height="180" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="3"/>
    <rect x="-70" y="-90" width="140" height="34" rx="12" fill="#DDD6FE"/>
    <rect x="-50" y="-30" width="100" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="-10" width="80" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="10" width="90" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="40" width="60" height="8" rx="4" fill="#FBBF24"/>
  </g>

  <!-- SAT badge -->
  <g transform="translate(640,320)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
    <path d="M0,-12 L6,0 L2,0 L2,10 L-2,10 L-2,0 L-6,0 Z" fill="#059669"/>
  </g>

  <!-- calendar showing december -->
  <g transform="translate(160,140)">
    <rect x="-60" y="-60" width="120" height="110" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-60" y="-60" width="120" height="28" rx="12" fill="#7C3AED"/>
    <g fill="#EDE9FE">
      <rect x="-46" y="-18" width="16" height="16" rx="3"/>
      <rect x="-22" y="-18" width="16" height="16" rx="3"/>
      <rect x="2" y="-18" width="16" height="16" rx="3"/>
      <rect x="26" y="-18" width="16" height="16" rx="3"/>
      <rect x="-46" y="6" width="16" height="16" rx="3"/>
    </g>
    <rect x="-22" y="6" width="16" height="16" rx="3" fill="#DC2626"/>
    <rect x="2" y="6" width="16" height="16" rx="3" fill="#EDE9FE"/>
  </g>

  <!-- calculator -->
  <g transform="translate(150,330)">
    <rect x="-50" y="-56" width="100" height="112" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-38" y="-42" width="76" height="26" rx="6" fill="#EDE9FE"/>
    <g fill="#DDD6FE">
      <rect x="-38" y="-8" width="18" height="18" rx="4"/>
      <rect x="-12" y="-8" width="18" height="18" rx="4"/>
      <rect x="14" y="-8" width="18" height="18" rx="4"/>
      <rect x="-38" y="18" width="18" height="18" rx="4"/>
      <rect x="-12" y="18" width="18" height="18" rx="4"/>
      <rect x="14" y="18" width="18" height="18" rx="4" fill="#FBBF24"/>
    </g>
  </g>

  <!-- gift box -->
  <g transform="translate(400,250)">
    <rect x="-100" y="-20" width="200" height="130" rx="10" fill="#7C3AED"/>
    <rect x="-100" y="-60" width="200" height="50" rx="10" fill="#5B21B6"/>
    <rect x="-18" y="-60" width="36" height="170" fill="#FBBF24"/>
    <path d="M-30,-60 Q-60,-100 -10,-90 Q-30,-75 -30,-60 Z" fill="#FBBF24"/>
    <path d="M30,-60 Q60,-100 10,-90 Q30,-75 30,-60 Z" fill="#FBBF24"/>

    <!-- bills peeking from box -->
    <rect x="-70" y="-90" width="56" height="34" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="2" transform="rotate(-8 -42 -73)"/>
    <rect x="20" y="-96" width="56" height="34" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" transform="rotate(6 48 -79)"/>
  </g>

  <!-- floating coins and bills -->
  <g transform="translate(260,60)">
    <circle cx="0" cy="0" r="24" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
    <rect x="-2" y="-11" width="4" height="22" rx="2" fill="#F59E0B"/>
    <rect x="-9" y="-2" width="18" height="4" rx="2" fill="#F59E0B"/>
  </g>
  <g transform="translate(560,60)">
    <circle cx="0" cy="0" r="20" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="-2" y="-9" width="4" height="18" rx="2" fill="#F59E0B"/>
    <rect x="-7" y="-2" width="14" height="4" rx="2" fill="#F59E0B"/>
  </g>
  <g transform="translate(690,230)">
    <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#059669" stroke-width="2"/>
  </g>
</svg>
