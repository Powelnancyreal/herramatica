<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- child silhouette left -->
  <g transform="translate(160,260)">
    <circle cx="0" cy="-40" r="26" fill="#7C3AED"/>
    <path d="M-30,20 Q0,-8 30,20 L26,60 Q0,72 -26,60 Z" fill="#7C3AED"/>
  </g>

  <!-- weight scale right -->
  <g transform="translate(640,300)">
    <rect x="-60" y="10" width="120" height="30" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="0" cy="-24" r="34" fill="#FFFFFF" stroke="#7C3AED" stroke-width="6"/>
    <line x1="0" y1="-24" x2="12" y2="-40" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- medicine bottle/dropper center -->
  <g transform="translate(400,220)">
    <rect x="-40" y="-30" width="80" height="130" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="5"/>
    <rect x="-16" y="-30" width="32" height="60" fill="#FEE2E2"/>
    <rect x="-14" y="-70" width="28" height="42" rx="6" fill="#DC2626"/>
    <rect x="-8" y="-90" width="16" height="24" rx="4" fill="#7C3AED"/>

    <!-- cross symbol -->
    <g transform="translate(0,40)">
      <rect x="-5" y="-18" width="10" height="36" rx="3" fill="#DC2626"/>
      <rect x="-18" y="-5" width="36" height="10" rx="3" fill="#DC2626"/>
    </g>

    <!-- drops falling -->
    <path d="M60,-10 q6,-10 0,-18 q-6,8 0,18" fill="#93C5FD"/>
    <path d="M60,20 q6,-10 0,-18 q-6,8 0,18" fill="#93C5FD"/>
  </g>

  <!-- safety warning shield -->
  <g transform="translate(560,140)">
    <path d="M0,-30 L28,-18 V6 C28,24 14,36 0,42 C-14,36 -28,24 -28,6 V-18 Z" fill="#7C3AED"/>
    <rect x="-4" y="-14" width="8" height="20" rx="3" fill="#FFFFFF"/>
    <circle cx="0" cy="16" r="4" fill="#FFFFFF"/>
  </g>

  <!-- doctor icon -->
  <g transform="translate(220,140)">
    <circle cx="0" cy="-16" r="18" fill="#F5F3FF"/>
    <path d="M-24,30 Q0,4 24,30 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <path d="M-8,10 q0,14 8,14 q8,0 8,-14" stroke="#7C3AED" stroke-width="3" fill="none"/>
    <circle cx="8" cy="24" r="4" fill="#7C3AED"/>
  </g>

  <!-- AEMPS seal -->
  <g transform="translate(680,240)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#DC2626" stroke-width="4" stroke-dasharray="5 4"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#7C3AED" stroke-width="3"/>
  </g>
</svg>
