<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- road on left with route markers -->
  <path d="M20,380 Q150,360 200,300 Q250,240 340,230" stroke="#94A3B8" stroke-width="10" fill="none" stroke-dasharray="3 14" stroke-linecap="round"/>
  <circle cx="20" cy="380" r="10" fill="#059669"/>
  <circle cx="340" cy="230" r="10" fill="#DC2626"/>

  <!-- car silhouette center -->
  <g transform="translate(340,220)">
    <rect x="-70" y="-20" width="140" height="34" rx="14" fill="#059669"/>
    <path d="M-46,-20 L-24,-46 L24,-46 L46,-20 Z" fill="#059669"/>
    <rect x="-14" y="-40" width="28" height="18" rx="4" fill="#D1FAE5"/>
    <circle cx="-40" cy="18" r="16" fill="#1E293B"/>
    <circle cx="40" cy="18" r="16" fill="#1E293B"/>
  </g>

  <!-- fuel gauge -->
  <g transform="translate(340,340)">
    <path d="M-60,0 A60,60 0 0 1 60,0" fill="none" stroke="#FEE2E2" stroke-width="16" stroke-linecap="round"/>
    <path d="M-60,0 A60,60 0 0 1 20,-58" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="-50" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#7C3AED"/>
  </g>

  <!-- gas station pump right -->
  <g transform="translate(620,220)">
    <rect x="-50" y="-100" width="100" height="160" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="5"/>
    <rect x="-34" y="-80" width="68" height="50" rx="6" fill="#FED7AA"/>
    <path d="M40,-70 q30,0 30,30 v60 a10,10 0 0 1 -20,0 v-40 a10,10 0 0 0 -10,-10" stroke="#EA580C" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-30" y="10" width="60" height="16" rx="4" fill="#EA580C"/>
  </g>

  <!-- fuel drops -->
  <g fill="#FDBA74">
    <path d="M560,340 q8,-14 0,-24 q-8,10 0,24" />
    <path d="M600,370 q6,-10 0,-18 q-6,8 0,18" />
  </g>

  <!-- peso/dollar coins floating -->
  <g transform="translate(140,120)">
    <circle cx="0" cy="0" r="24" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
    <rect x="-2" y="-11" width="4" height="22" rx="2" fill="#F59E0B"/>
    <rect x="-9" y="-2" width="18" height="4" rx="2" fill="#F59E0B"/>
  </g>
  <g transform="translate(700,340)">
    <circle cx="0" cy="0" r="20" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <path d="M8,-8 C0,-12 -8,-4 -8,0 C-8,4 0,12 8,8" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- calculator -->
  <g transform="translate(120,320)">
    <rect x="-50" y="-56" width="100" height="112" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-38" y="-42" width="76" height="26" rx="6" fill="#D1FAE5"/>
    <g fill="#DDD6FE">
      <rect x="-38" y="-8" width="18" height="18" rx="4"/>
      <rect x="-12" y="-8" width="18" height="18" rx="4"/>
      <rect x="14" y="-8" width="18" height="18" rx="4" fill="#059669"/>
      <rect x="-38" y="18" width="18" height="18" rx="4"/>
      <rect x="-12" y="18" width="18" height="18" rx="4"/>
      <rect x="14" y="18" width="18" height="18" rx="4"/>
    </g>
  </g>
</svg>
