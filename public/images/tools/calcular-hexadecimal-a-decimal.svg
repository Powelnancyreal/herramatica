<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- circuit board pattern background -->
  <g stroke="#D1FAE5" stroke-width="3" opacity="0.7" fill="none">
    <path d="M40,60 h120 v60 h100"/>
    <path d="M760,80 h-100 v80 h-80"/>
    <path d="M40,390 h140 v-60 h90"/>
  </g>
  <g fill="#A7F3D0">
    <circle cx="160" cy="60" r="5"/>
    <circle cx="660" cy="80" r="5"/>
    <circle cx="180" cy="390" r="5"/>
  </g>

  <!-- binary code subtle background -->
  <g fill="#059669" opacity="0.35">
    <rect x="80" y="150" width="8" height="16" rx="2"/>
    <circle cx="100" cy="158" r="4"/>
    <rect x="112" y="150" width="8" height="16" rx="2"/>
    <rect x="640" y="260" width="8" height="16" rx="2"/>
    <circle cx="660" cy="268" r="4"/>
  </g>

  <!-- computer screen -->
  <g transform="translate(400,190)">
    <rect x="-120" y="-80" width="240" height="150" rx="10" fill="#0F172A"/>
    <rect x="-104" y="-64" width="208" height="118" rx="4" fill="#111827"/>
    <g fill="#22D3EE">
      <rect x="-84" y="-44" width="18" height="18" rx="3"/>
      <rect x="-58" y="-44" width="18" height="18" rx="3"/>
      <rect x="-84" y="-18" width="18" height="18" rx="3"/>
      <rect x="-58" y="-18" width="18" height="18" rx="3"/>
    </g>
    <g fill="#A78BFA">
      <rect x="10" y="-44" width="18" height="18" rx="3"/>
      <rect x="36" y="-44" width="18" height="18" rx="3"/>
      <rect x="10" y="-18" width="18" height="18" rx="3"/>
      <rect x="36" y="-18" width="18" height="18" rx="3"/>
    </g>
    <rect x="-30" y="60" width="60" height="14" fill="#1E293B"/>
    <rect x="-50" y="74" width="100" height="10" rx="4" fill="#1E293B"/>
  </g>

  <!-- arrow converting -->
  <g stroke="#0D9488" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M320,320 h70"/>
    <path d="M372,298 l22,22 -22,22"/>
  </g>

  <!-- decimal chip strip right -->
  <g transform="translate(560,320)">
    <rect x="-40" y="-16" width="26" height="32" rx="6" fill="#DBEAFE"/>
    <rect x="-8" y="-16" width="26" height="32" rx="6" fill="#DBEAFE"/>
    <rect x="24" y="-16" width="26" height="32" rx="6" fill="#DBEAFE"/>
  </g>

  <!-- color picker hex-to-color -->
  <g transform="translate(140,300)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <path d="M0,-34 A34,34 0 0 1 29,17 L0,0 Z" fill="#DC2626"/>
    <path d="M29,17 A34,34 0 0 1 -29,17 L0,0 Z" fill="#22D3EE"/>
    <path d="M-29,17 A34,34 0 0 1 0,-34 L0,0 Z" fill="#7C3AED"/>
    <path d="M0,-50 L14,-70 L-14,-70 Z" fill="#334155"/>
  </g>

  <!-- four number system boxes -->
  <g transform="translate(660,150)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  </g>
  <g transform="translate(680,220)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#111827" stroke="#22D3EE" stroke-width="3"/>
  </g>
  <g transform="translate(240,140)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  </g>
  <g transform="translate(220,220)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
  </g>
</svg>
