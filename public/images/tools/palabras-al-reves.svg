<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- word block top with arrow -->
  <g transform="translate(400,140)">
    <rect x="-180" y="-30" width="360" height="60" rx="16" fill="#EDE9FE" stroke="#0D9488" stroke-width="3"/>
    <g fill="#0D9488">
      <rect x="-150" y="-10" width="30" height="20" rx="5"/>
      <rect x="-110" y="-10" width="30" height="20" rx="5"/>
      <rect x="-70" y="-10" width="30" height="20" rx="5"/>
      <rect x="-30" y="-10" width="30" height="20" rx="5"/>
      <rect x="10" y="-10" width="30" height="20" rx="5"/>
      <rect x="50" y="-10" width="30" height="20" rx="5"/>
      <rect x="90" y="-10" width="30" height="20" rx="5"/>
      <rect x="130" y="-10" width="30" height="20" rx="5"/>
    </g>
  </g>
  <g stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M600,140 h60"/>
    <path d="M648,124 l16,16 -16,16"/>
  </g>

  <!-- mirror reflection line -->
  <line x1="60" y1="225" x2="740" y2="225" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- reversed word block below, mirrored order/colors -->
  <g transform="translate(400,310) scale(-1,1)">
    <rect x="-180" y="-30" width="360" height="60" rx="16" fill="#F0FDFA" stroke="#7C3AED" stroke-width="3"/>
    <g fill="#7C3AED">
      <rect x="-150" y="-10" width="30" height="20" rx="5"/>
      <rect x="-110" y="-10" width="30" height="20" rx="5"/>
      <rect x="-70" y="-10" width="30" height="20" rx="5"/>
      <rect x="-30" y="-10" width="30" height="20" rx="5"/>
      <rect x="10" y="-10" width="30" height="20" rx="5"/>
      <rect x="50" y="-10" width="30" height="20" rx="5"/>
      <rect x="90" y="-10" width="30" height="20" rx="5"/>
      <rect x="130" y="-10" width="30" height="20" rx="5"/>
    </g>
  </g>

  <!-- circular reverse arrow -->
  <g transform="translate(120,225)">
    <path d="M-24,0 A24,24 0 1 1 10,22" fill="none" stroke="#0D9488" stroke-width="6" stroke-linecap="round"/>
    <path d="M2,14 L10,22 L18,12" stroke="#0D9488" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating flipping letters -->
  <g fill="#7C3AED" opacity="0.7">
    <rect x="660" y="80" width="24" height="24" rx="5" transform="rotate(20 672 92)"/>
    <rect x="120" y="90" width="20" height="20" rx="5" transform="rotate(-15 130 100)"/>
  </g>
  <g fill="#0D9488" opacity="0.7">
    <rect x="660" y="350" width="24" height="24" rx="5" transform="rotate(-25 672 362)"/>
    <rect x="120" y="360" width="20" height="20" rx="5" transform="rotate(15 130 370)"/>
  </g>
</svg>
