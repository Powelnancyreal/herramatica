<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="igg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- left input metrics -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <rect x="30" y="90" width="190" height="40" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="55" cy="110" r="10" fill="#7C3AED"/>
    <path d="M48,116 q7,-8 14,0" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="75" y="115">Seguidores: 10.000</text>

    <rect x="30" y="140" width="190" height="40" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <path d="M45,150 c-5,-5 -13,-1 -13,5 c0,5 8,10 13,14 c5,-4 13,-9 13,-14 c0,-6 -8,-10 -13,-5 Z" fill="#DC2626"/>
    <text x="75" y="165">Likes: 320</text>

    <rect x="30" y="190" width="190" height="40" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M45,200 h20 a8,8 0 0 1 8,8 a8,8 0 0 1 -8,8 h-14 l-6,6 v-6 a8,8 0 0 1 -8,-8 a8,8 0 0 1 8,-8 Z" fill="#2563EB"/>
    <text x="90" y="215">Comentarios: 30</text>
  </g>

  <!-- phone mockup center -->
  <g transform="translate(400,200)">
    <rect x="-80" y="-150" width="160" height="300" rx="26" fill="#1E293B"/>
    <rect x="-66" y="-132" width="132" height="264" rx="10" fill="#FFFFFF"/>
    <circle cx="0" cy="-100" r="18" fill="url(#igg2)"/>
    <rect x="-58" y="-70" width="116" height="90" fill="#F1F5F9"/>
    <g transform="translate(0,60)">
      <path d="M-16,0 c-4,-4 -11,-1 -11,4 c0,4 7,8 11,11 c4,-3 11,-7 11,-11 c0,-5 -7,-8 -11,-4 Z" fill="#DC2626"/>
      <path d="M10,-4 h16 a6,6 0 0 1 6,6 a6,6 0 0 1 -6,6 h-11 l-5,5 v-5 a6,6 0 0 1 -6,-6 a6,6 0 0 1 6,-6 Z" fill="#334155"/>
    </g>
  </g>
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">10K seguidores</text>

  <!-- engagement gauge right -->
  <g transform="translate(650,190)">
    <path d="M-80,0 A80,80 0 0 1 -46,-66" fill="none" stroke="#FCA5A5" stroke-width="16" stroke-linecap="round"/>
    <path d="M-46,-66 A80,80 0 0 1 20,-78" fill="none" stroke="#FDE68A" stroke-width="16" stroke-linecap="round"/>
    <path d="M20,-78 A80,80 0 0 1 80,0" fill="none" stroke="#86EFAC" stroke-width="16" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="-74" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#334155"/>
  </g>
  <text x="650" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">3.5%</text>

  <!-- formula -->
  <g transform="translate(400,400)">
    <rect x="-260" y="-20" width="520" height="40" rx="12" fill="#EDE9FE"/>
  </g>
  <text x="400" y="406" font-family="Arial, sans-serif" font-size="14" fill="#5B21B6" text-anchor="middle">(Likes + Comentarios) &#247; Seguidores &#215; 100</text>
</svg>
