<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- left hex panel -->
  <text x="180" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Hexadecimal</text>
  <rect x="60" y="105" width="240" height="120" rx="12" fill="#0F172A"/>
  <text x="180" y="170" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">48 65 6C 6C 6F</text>

  <!-- arrow -->
  <g stroke="#7C3AED" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M320,165 h100"/>
    <path d="M392,140 l28,25 -28,25"/>
  </g>
  <text x="370" y="205" font-family="Arial, sans-serif" font-size="13" fill="#7C3AED" text-anchor="middle">Convierte</text>

  <!-- right text panel -->
  <text x="620" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Texto</text>
  <rect x="500" y="105" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <text x="620" y="175" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#5B21B6" text-anchor="middle">Hola</text>

  <!-- bidirectional arrow below -->
  <g stroke="#2563EB" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300,280 h200"/>
    <path d="M320,268 l-20,12 20,12"/>
    <path d="M480,268 l20,12 -20,12"/>
  </g>

  <!-- UTF-8 support -->
  <g transform="translate(400,350)">
    <rect x="-160" y="-30" width="320" height="60" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="400" y="358" font-family="Arial, sans-serif" font-size="13" fill="#5B21B6" text-anchor="middle">Soporte UTF-8 español</text>
  <text x="400" y="382" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">&#225; &#233; &#237; &#243; &#250; &#241;</text>
</svg>
