<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- DNI card center -->
  <g transform="translate(320,220)">
    <rect x="-180" y="-110" width="360" height="220" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-180" y="-110" width="360" height="46" rx="18" fill="#DC2626"/>
    <rect x="-160" y="-96" width="90" height="16" rx="5" fill="#FEF3C7"/>

    <g transform="translate(-130,10)">
      <rect x="-40" y="-50" width="80" height="100" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
      <circle cx="0" cy="-16" r="20" fill="#C4B5FD"/>
      <path d="M-24,34 Q0,4 24,34 Z" fill="#C4B5FD"/>
    </g>

    <rect x="-20" y="-40" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-20" y="-16" width="120" height="10" rx="5" fill="#CBD5E1"/>

    <!-- number chip strip -->
    <g transform="translate(-20,10)">
      <rect x="0" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="24" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="48" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="72" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="96" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="120" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <rect x="144" y="0" width="20" height="26" rx="5" fill="#DDD6FE"/>
      <!-- highlighted letter chip -->
      <circle cx="182" cy="13" r="20" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <rect x="172" y="1" width="20" height="24" rx="5" fill="#FBBF24"/>
    </g>
  </g>

  <!-- modulo 23 circular concept -->
  <g transform="translate(680,150)">
    <path d="M-30,0 A30,30 0 1 1 20,26" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
    <path d="M12,18 L20,26 L28,16" stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-30" cy="0" r="7" fill="#DC2626"/>
  </g>

  <!-- checkmark -->
  <g transform="translate(650,300)">
    <circle cx="0" cy="0" r="32" fill="#D1FAE5" stroke="#059669" stroke-width="4"/>
    <path d="M-14,2 L-4,14 L16,-12" stroke="#059669" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- NIE small card beside -->
  <g transform="translate(560,340)">
    <rect x="-60" y="-36" width="120" height="72" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
    <rect x="-60" y="-36" width="120" height="22" rx="12" fill="#F59E0B"/>
    <rect x="-44" y="-6" width="60" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-44" y="10" width="40" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- person silhouette with card -->
  <g transform="translate(700,380)">
    <circle cx="0" cy="-14" r="14" fill="#7C3AED"/>
    <path d="M-18,30 Q0,6 18,30 Z" fill="#7C3AED"/>
  </g>
</svg>
