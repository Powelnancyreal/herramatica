<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- table -->
  <rect x="0" y="360" width="800" height="90" fill="#FDE9D0"/>

  <!-- restaurant bill -->
  <g transform="translate(220,240)">
    <path d="M-70,-140 h140 v250 l-12,-12 -12,12 -12,-12 -12,12 -12,-12 -12,12 -12,-12 -12,12 -12,-12 -12,12 Z" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/>
    <rect x="-50" y="-114" width="100" height="10" rx="4" fill="#EA580C"/>
    <rect x="-50" y="-84" width="80" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="-64" width="90" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="-44" width="70" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="-50" y="-14" width="100" height="2" fill="#CBD5E1"/>
    <rect x="-50" y="4" width="50" height="10" rx="4" fill="#111827"/>
    <rect x="10" y="4" width="40" height="10" rx="4" fill="#111827"/>
  </g>

  <!-- fork and knife -->
  <g transform="translate(380,300)">
    <rect x="-4" y="-50" width="8" height="90" rx="4" fill="#94A3B8"/>
    <rect x="-14" y="-50" width="4" height="26" rx="2" fill="#94A3B8"/>
    <rect x="-4" y="-50" width="4" height="26" rx="2" fill="#94A3B8"/>
    <rect x="6" y="-50" width="4" height="26" rx="2" fill="#94A3B8"/>
    <path d="M40,-50 q20,10 6,40 q-6,10 -10,50 h-8 v-90 q0,-2 12,0 Z" fill="#94A3B8"/>
  </g>

  <!-- tip percentage badges -->
  <g transform="translate(500,150)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#7C3AED" stroke-width="6"/>
    <circle cx="-10" cy="-10" r="7" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <circle cx="10" cy="10" r="7" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(580,210)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#EA580C" stroke-width="5"/>
    <circle cx="-8" cy="-8" r="5" fill="none" stroke="#EA580C" stroke-width="3"/>
    <circle cx="8" cy="8" r="5" fill="none" stroke="#EA580C" stroke-width="3"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- waiter hand receiving tip -->
  <g transform="translate(630,300)">
    <path d="M-40,20 Q-40,-10 -20,-14 L-16,-40 Q-14,-48 -6,-46 L-6,-16 L0,-40 Q2,-48 10,-46 L8,-14 L14,-38 Q18,-46 26,-42 L18,-10 L24,-30 Q28,-38 36,-32 L26,0 Q24,26 0,32 Q-30,34 -40,20 Z" fill="#F59E0B"/>
  </g>
  <g transform="translate(640,240)">
    <circle cx="0" cy="0" r="20" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
    <rect x="-2" y="-9" width="4" height="18" rx="2" fill="#F59E0B"/>
    <rect x="-7" y="-2" width="14" height="4" rx="2" fill="#F59E0B"/>
  </g>

  <!-- group of people splitting bill -->
  <g transform="translate(150,340)" fill="#7C3AED">
    <circle cx="0" cy="-10" r="12"/>
    <path d="M-16,24 Q0,4 16,24 Z"/>
  </g>
  <g transform="translate(180,350)" fill="#EA580C">
    <circle cx="0" cy="-10" r="12"/>
    <path d="M-16,24 Q0,4 16,24 Z"/>
  </g>
  <g transform="translate(120,350)" fill="#2563EB">
    <circle cx="0" cy="-10" r="12"/>
    <path d="M-16,24 Q0,4 16,24 Z"/>
  </g>

  <!-- coins divided -->
  <g transform="translate(60,220)">
    <circle cx="0" cy="0" r="16" fill="#FBBF24" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="34" cy="10" r="16" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="10" cy="40" r="16" fill="#FCD34D" stroke="#F59E0B" stroke-width="3"/>
  </g>
</svg>
