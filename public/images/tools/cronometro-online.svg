<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- racing flag checkered pattern -->
  <g transform="translate(660,110)" opacity="0.8">
    <g fill="#1E293B">
      <rect x="-40" y="-30" width="14" height="14"/>
      <rect x="-12" y="-30" width="14" height="14"/>
      <rect x="16" y="-30" width="14" height="14"/>
      <rect x="-26" y="-16" width="14" height="14"/>
      <rect x="2" y="-16" width="14" height="14"/>
      <rect x="-40" y="-2" width="14" height="14"/>
      <rect x="-12" y="-2" width="14" height="14"/>
      <rect x="16" y="-2" width="14" height="14"/>
    </g>
  </g>

  <!-- large analog stopwatch center -->
  <g transform="translate(320,220)">
    <rect x="-10" y="-160" width="20" height="20" rx="5" fill="#2563EB"/>
    <rect x="-40" y="-172" width="80" height="14" rx="7" fill="#94A3B8"/>
    <circle cx="0" cy="0" r="130" fill="#FFFFFF" stroke="#2563EB" stroke-width="10"/>
    <g stroke="#BFDBFE" stroke-width="4">
      <line x1="0" y1="-116" x2="0" y2="-100"/>
      <line x1="0" y1="116" x2="0" y2="100"/>
      <line x1="-116" y1="0" x2="-100" y2="0"/>
      <line x1="116" y1="0" x2="100" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="60" y2="40" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="0" x2="50" y2="30" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#7C3AED"/>
  </g>

  <!-- digital display -->
  <g transform="translate(600,220)">
    <rect x="-110" y="-40" width="220" height="80" rx="14" fill="#1E293B"/>
    <g fill="#60A5FA">
      <rect x="-90" y="-14" width="10" height="28" rx="2"/>
      <rect x="-74" y="-14" width="10" height="28" rx="2"/>
      <circle cx="-54" cy="-8" r="3"/>
      <circle cx="-54" cy="8" r="3"/>
      <rect x="-38" y="-14" width="10" height="28" rx="2"/>
      <rect x="-22" y="-14" width="10" height="28" rx="2"/>
    </g>
    <g fill="#93C5FD">
      <circle cx="-2" cy="-8" r="3"/>
      <circle cx="-2" cy="8" r="3"/>
      <rect x="14" y="-14" width="10" height="28" rx="2"/>
      <rect x="30" y="-14" width="10" height="28" rx="2"/>
    </g>
    <g fill="#A78BFA">
      <rect x="52" y="4" width="8" height="12" rx="2"/>
      <rect x="64" y="4" width="8" height="12" rx="2"/>
    </g>
  </g>

  <!-- play/pause/stop buttons -->
  <g transform="translate(600,330)">
    <circle cx="-60" cy="0" r="24" fill="#059669"/>
    <path d="M-68,-10 l16,10 -16,10 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="24" fill="#FBBF24"/>
    <rect x="-8" y="-10" width="6" height="20" fill="#FFFFFF"/>
    <rect x="4" y="-10" width="6" height="20" fill="#FFFFFF"/>
    <circle cx="60" cy="0" r="24" fill="#DC2626"/>
    <rect x="48" y="-12" width="24" height="24" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- lap markers list -->
  <g transform="translate(720,300)">
    <rect x="-30" y="-40" width="60" height="14" rx="4" fill="#DBEAFE"/>
    <rect x="-30" y="-20" width="60" height="14" rx="4" fill="#EDE9FE"/>
    <rect x="-30" y="0" width="60" height="14" rx="4" fill="#DBEAFE"/>
    <rect x="-30" y="20" width="60" height="14" rx="4" fill="#EDE9FE"/>
  </g>
</svg>
