<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>
  <rect x="0" y="0" width="800" height="8" fill="#FDE047"/>
  <rect x="0" y="8" width="800" height="8" fill="#2563EB"/>
  <rect x="0" y="16" width="800" height="8" fill="#DC2626"/>

  <!-- left panel: empleado -->
  <g filter="none">
    <rect x="40" y="50" width="340" height="340" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  </g>
  <text x="210" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">Empleado Dependiente</text>
  <g transform="translate(210,140)">
    <circle cx="0" cy="-20" r="20" fill="#2563EB"/>
    <path d="M-24,30 Q0,4 24,30 Z" fill="#2563EB"/>
    <path d="M-4,-4 l4,14 4,-14" fill="#FBBF24"/>
  </g>
  <rect x="90" y="200" width="240" height="24" rx="6" fill="#E5E7EB"/>
  <rect x="90" y="200" width="24" height="24" fill="#059669"/>
  <rect x="114" y="200" width="24" height="24" fill="#2563EB"/>
  <text x="210" y="245" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Salud 4% &#8226; Pensión 4%</text>
  <text x="210" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Total descuento 8%</text>
  <g transform="translate(210,320)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#EDE9FE"/>
  </g>
  <text x="210" y="326" font-family="Arial, sans-serif" font-size="12" fill="#5B21B6" text-anchor="middle">Empleador paga 12%+</text>

  <!-- right panel: independiente -->
  <g>
    <rect x="420" y="50" width="340" height="340" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  </g>
  <text x="590" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5B21B6" text-anchor="middle">Independiente</text>
  <g transform="translate(590,140)">
    <circle cx="0" cy="-20" r="20" fill="#7C3AED"/>
    <path d="M-24,30 Q0,4 24,30 Z" fill="#7C3AED"/>
    <rect x="-16" y="30" width="32" height="6" fill="#5B21B6"/>
  </g>
  <text x="590" y="215" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">IBC = Ingresos Base Cotización</text>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="500" y="240" width="180" height="32" rx="16" fill="#059669"/>
    <text x="590" y="261">Salud 12.5%</text>
    <rect x="500" y="280" width="180" height="32" rx="16" fill="#2563EB"/>
    <text x="590" y="301">Pensión 16%</text>
  </g>

  <!-- badges bottom -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">
    <circle cx="180" cy="420" r="18" fill="#D1FAE5"/>
    <text x="180" y="424">EPS</text>
    <circle cx="400" cy="420" r="18" fill="#DBEAFE"/>
    <text x="400" y="424">AFP</text>
    <circle cx="620" cy="420" r="18" fill="#FEE2E2"/>
    <text x="620" y="424">ARL</text>
  </g>
</svg>
