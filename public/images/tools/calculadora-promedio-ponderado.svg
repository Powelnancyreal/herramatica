<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- graduation cap -->
  <g transform="translate(400,60)">
    <polygon points="0,-14 60,4 0,22 -60,4" fill="#2563EB"/>
    <rect x="-6" y="4" width="12" height="26" fill="#1E3A8A"/>
    <circle cx="0" cy="32" r="5" fill="#FBBF24"/>
  </g>

  <!-- table -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <rect x="120" y="100" width="560" height="46" fill="#7C3AED"/>
    <text x="280" y="128" fill="#FFFFFF" text-anchor="middle" font-weight="700">Materia</text>
    <text x="480" y="128" fill="#FFFFFF" text-anchor="middle" font-weight="700">Nota</text>
    <text x="620" y="128" fill="#FFFFFF" text-anchor="middle" font-weight="700">Créditos</text>

    <rect x="120" y="146" width="560" height="40" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="280" y="171" text-anchor="middle">Matemáticas</text>
    <text x="480" y="171" text-anchor="middle">8.5</text>
    <text x="620" y="171" text-anchor="middle">4</text>

    <rect x="120" y="186" width="560" height="40" fill="#F8F7FF" stroke="#E5E7EB"/>
    <text x="280" y="211" text-anchor="middle">Historia</text>
    <text x="480" y="211" text-anchor="middle">7.0</text>
    <text x="620" y="211" text-anchor="middle">3</text>

    <rect x="120" y="226" width="560" height="40" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="280" y="251" text-anchor="middle">Física</text>
    <text x="480" y="251" text-anchor="middle">9.0</text>
    <text x="620" y="251" text-anchor="middle">5</text>

    <rect x="120" y="266" width="560" height="40" fill="#F8F7FF" stroke="#E5E7EB"/>
    <text x="280" y="291" text-anchor="middle">Inglés</text>
    <text x="480" y="291" text-anchor="middle">8.0</text>
    <text x="620" y="291" text-anchor="middle">3</text>

    <rect x="120" y="306" width="560" height="40" fill="#DDD6FE"/>
    <text x="280" y="331" text-anchor="middle" font-weight="700">Total</text>
    <text x="480" y="331" text-anchor="middle" font-weight="700">-</text>
    <text x="620" y="331" text-anchor="middle" font-weight="700">15</text>
  </g>

  <!-- result box -->
  <g transform="translate(400,400)">
    <rect x="-110" y="-24" width="220" height="48" rx="14" fill="#059669"/>
  </g>
  <text x="400" y="392" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">Promedio Ponderado</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">8.27</text>
</svg>
