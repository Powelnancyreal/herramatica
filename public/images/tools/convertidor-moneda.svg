<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- globe background -->
  <g transform="translate(400,225)" opacity="0.35">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#2563EB" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="70" ry="160" fill="none" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#2563EB" stroke-width="2"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#2563EB" stroke-width="2"/>
  </g>

  <!-- floating coins of different currencies -->
  <g>
    <circle cx="140" cy="90" r="16" fill="#FBBF24" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="660" cy="100" r="14" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="130" cy="360" r="14" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="670" cy="350" r="16" fill="#FED7AA" stroke="#EA580C" stroke-width="3"/>
  </g>

  <!-- dollar badge left -->
  <g transform="translate(180,225)">
    <circle cx="0" cy="0" r="74" fill="#FFFFFF" stroke="#059669" stroke-width="6"/>
    <rect x="-4" y="-40" width="8" height="80" rx="4" fill="#059669"/>
    <path d="M-24,-16 C-24,-30 24,-30 24,-16 C24,-4 -24,4 -24,16 C-24,30 24,30 24,16" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- peso badge center -->
  <g transform="translate(400,225)">
    <circle cx="0" cy="0" r="80" fill="#7C3AED"/>
    <rect x="-4" y="-42" width="8" height="84" rx="4" fill="#FFFFFF"/>
    <rect x="-20" y="-14" width="40" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="-20" y="6" width="40" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- euro badge right -->
  <g transform="translate(620,225)">
    <circle cx="0" cy="0" r="74" fill="#FFFFFF" stroke="#2563EB" stroke-width="6"/>
    <path d="M20,-30 C-10,-42 -34,-14 -34,0 C-34,14 -10,42 20,30" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="-38" y1="-8" x2="6" y2="-8" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="-38" y1="10" x2="6" y2="10" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- exchange arrows -->
  <g stroke="#7C3AED" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M262,200 h44"/>
    <path d="M292,188 l18,12 -18,12"/>
    <path d="M482,250 h44"/>
    <path d="M512,238 l18,12 -18,12"/>
  </g>
</svg>
