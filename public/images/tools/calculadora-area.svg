<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F8F7FF"/>

  <!-- grid background -->
  <g stroke="#EDE9FE" stroke-width="1">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="140" y1="0" x2="140" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="660" y1="0" x2="660" y2="450"/>
  </g>

  <!-- square -->
  <g filter="url(#ds)">
    <rect x="80" y="110" width="120" height="120" rx="12" fill="#93C5FD" stroke="#2563EB" stroke-width="3"/>
  </g>
  <g stroke="#2563EB" stroke-width="3" fill="none">
    <line x1="80" y1="90" x2="200" y2="90"/>
    <path d="M86,84 l-8,6 8,6 M194,84 l8,6 -8,6"/>
  </g>
  <g filter="url(#ds)">
    <rect x="98" y="250" width="86" height="34" rx="10" fill="#2563EB"/>
  </g>
  <text x="141" y="272" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">A = l²</text>

  <!-- rectangle -->
  <g filter="url(#ds)">
    <rect x="300" y="130" width="200" height="100" rx="12" fill="#C4B5FD" stroke="#7C3AED" stroke-width="3"/>
  </g>
  <g stroke="#7C3AED" stroke-width="3" fill="none">
    <line x1="300" y1="110" x2="500" y2="110"/>
    <path d="M306,104 l-8,6 8,6 M494,104 l8,6 -8,6"/>
    <line x1="280" y1="130" x2="280" y2="230"/>
    <path d="M274,136 l6,-8 6,8 M274,224 l6,8 6,-8"/>
  </g>
  <g filter="url(#ds)">
    <rect x="358" y="250" width="86" height="34" rx="10" fill="#7C3AED"/>
  </g>
  <text x="401" y="272" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">A = b × h</text>

  <!-- right triangle -->
  <g filter="url(#ds)">
    <path d="M580,230 L580,110 L700,230 Z" fill="#99F6E4" stroke="#0D9488" stroke-width="3"/>
  </g>
  <g stroke="#0D9488" stroke-width="3" fill="none">
    <line x1="580" y1="250" x2="700" y2="250"/>
    <line x1="560" y1="110" x2="560" y2="230"/>
  </g>
  <g filter="url(#ds)">
    <rect x="598" y="270" width="86" height="34" rx="10" fill="#0D9488"/>
  </g>
  <text x="641" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">A = ½bh</text>

  <!-- pythagorean visual -->
  <g transform="translate(400,400)">
    <path d="M-40,0 L40,0 L40,-60 Z" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="-40" y="-40" width="40" height="40" fill="#93C5FD" opacity="0.7"/>
    <rect x="40" y="-60" width="30" height="30" fill="#C4B5FD" opacity="0.7" transform="rotate(90 40 -60)"/>
    <text x="-60" y="-15" font-family="Arial, sans-serif" font-size="13" fill="#334155">a²</text>
    <text x="60" y="-35" font-family="Arial, sans-serif" font-size="13" fill="#334155">b²</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">a² + b² = c²</text>
  </g>
</svg>
