<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- simplified spain map outline background -->
  <path d="M540,80 C620,70 700,100 690,140 C720,170 690,210 650,200 C660,240 610,260 580,240 C540,260 500,230 520,190 C480,180 490,120 540,80 Z" fill="#FEE2E2" opacity="0.6"/>

  <!-- Agencia Tributaria seal -->
  <g transform="translate(640,160)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#DC2626" stroke-width="5" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#7C3AED" stroke-width="4"/>
    <path d="M-6,2 L-1,8 L8,-6" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- nomina document -->
  <g transform="translate(220,220)">
    <rect x="-140" y="-150" width="280" height="300" rx="16" fill="#F8FAFC" stroke="#7C3AED" stroke-width="4"/>
    <rect x="-140" y="-150" width="280" height="46" rx="16" fill="#7C3AED"/>
    <rect x="-110" y="-136" width="90" height="18" rx="6" fill="#EDE9FE"/>

    <rect x="-110" y="-80" width="160" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="-110" y="-58" width="200" height="10" rx="5" fill="#CBD5E1"/>

    <!-- tax bracket bars -->
    <g transform="translate(-110,-10)">
      <rect x="0" y="0" width="40" height="14" rx="4" fill="#FDE68A"/>
      <rect x="0" y="20" width="90" height="14" rx="4" fill="#FCD34D"/>
      <rect x="0" y="40" width="140" height="14" rx="4" fill="#F59E0B"/>
      <rect x="0" y="60" width="180" height="14" rx="4" fill="#DC2626"/>
    </g>

    <rect x="-110" y="100" width="120" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- deduction arrow going down -->
  <g transform="translate(420,220)" stroke="#DC2626" stroke-width="9" fill="none" stroke-linecap="round">
    <line x1="0" y1="-60" x2="0" y2="40"/>
    <path d="M-18,16 L0,40 L18,16"/>
  </g>

  <!-- euro coins and bills -->
  <g transform="translate(560,120)">
    <circle cx="0" cy="0" r="30" fill="#FDE68A" stroke="#F59E0B" stroke-width="4"/>
    <path d="M14,-14 C0,-20 -12,-8 -12,0 C-12,8 0,20 14,14" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(590,300)">
    <rect x="-56" y="-34" width="112" height="68" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
    <path d="M14,-16 C0,-22 -14,-8 -14,0 C-14,8 0,22 14,16" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- calendar annual tax period -->
  <g transform="translate(680,340)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <rect x="-40" y="-40" width="80" height="26" rx="10" fill="#DC2626"/>
    <g fill="#FEE2E2">
      <rect x="-28" y="-6" width="14" height="14" rx="3"/>
      <rect x="-8" y="-6" width="14" height="14" rx="3"/>
      <rect x="12" y="-6" width="14" height="14" rx="3"/>
      <rect x="-28" y="16" width="14" height="14" rx="3"/>
    </g>
  </g>
</svg>
